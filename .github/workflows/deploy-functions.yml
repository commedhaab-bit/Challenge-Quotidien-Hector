name: Deploy Cloud Functions

# Workflow separe et independant du CI client (.github/workflows/ci.yml) : ne se
# declenche QUE sur des changements touchant les Cloud Functions, jamais sur des
# changements du front (index.html/locale-*.js/etc, deja publies via GitHub Pages
# par un simple push, sans lien avec Firebase).
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.github/workflows/deploy-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests (smoke - Phase 0 ; emulateur Firestore a integrer en Phase 1+)
        run: npm test

      - name: Authentification Google Cloud (compte de service, sans terminal local)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy (functions + firestore:rules,indexes)
        # Depuis la Phase 1 : deploie aussi firestore:rules/indexes (plus seulement
        # functions) - necessaire des que le classement precalcule (leaderboardCache)
        # a besoin d'une regle de lecture qui n'existait pas encore en prod. Decision
        # explicite (voir CLAUDE.md) : firestore.rules est verifie contre la prod
        # reelle, et cette regle est strictement additive (lecture seule, ne modifie
        # rien d'existant). Chemins resolus par firebase-tools relativement a
        # firebase.json (racine du repo), meme lance depuis functions/ (working-
        # directory par defaut de ce job) - deja confirme pour --only functions au
        # premier deploiement reussi. L'action google-github-actions/auth ci-dessus
        # place les identifiants du compte de service dans
        # GOOGLE_APPLICATION_CREDENTIALS, que firebase-tools sait utiliser
        # automatiquement (pas besoin de --token). --force : configure
        # automatiquement une politique de nettoyage Artifact Registry (evite
        # l'accumulation silencieuse d'images de conteneurs/cout de stockage) au lieu
        # de demander une confirmation interactive, impossible en CI.
        run: npx firebase-tools deploy --only functions,firestore:rules,firestore:indexes --project challenge-quotidien-hector --non-interactive --force
