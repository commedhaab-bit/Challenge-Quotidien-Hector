// Sérialise tout ce qui est déjà en mémoire (aucune lecture Firestore
// supplémentaire) en un fichier JSON téléchargeable — sauvegarde manuelle avant un
// changement d'appareil/de compte.
function exportUserData() {
  const data = {
    exportedAt: new Date().toISOString(),
    profile: userProfile,
    customChallenges,
    manualTargetOverrides,
    weights,
    lastCompleted,
    stats,
    badges,
    dailyActivity,
    streakData: { streakCount, lastCompletedDate, hasShield, lastShieldResetWeek },
    xpTotal,
    voiceCoachEnabled,
    activeToday: [...activeToday],
    todayKey,
    todayState: state,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `defi-du-jour-export-${dateKey(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// Réécrit chaque clé reconnue via les save*() existants (jamais un accès Firestore
// direct), pour rester cohérent avec le reste du code et bénéficier des mêmes
// garanties. Passe par confirmModal() avant d'écraser quoi que ce soit : c'est une
// action destructrice et irréversible pour les données actuelles.
async function importUserData(event) {
  const file = event.target.files[0];
  if (!file) return;
  let data;
  try {
    data = JSON.parse(await file.text());
  } catch (e) {
    event.target.value = '';
    showToast(t('popups.importData.invalidFile'));
    return;
  }

  const accepted = await confirmModal({
    icon: '📥',
    title: t('popups.importData.confirmTitle'),
    subtitle: t('popups.importData.confirmSubtitle'),
    confirmLabel: t('popups.importData.confirmLabel'),
    danger: true,
  });
  if (!accepted) {
    event.target.value = '';
    return;
  }

  if (data.profile) { userProfile = data.profile; await saveProfile(); }
  if (Array.isArray(data.customChallenges)) {
    customChallenges = data.customChallenges;
    await saveCustomChallenges();
    rebuildChallenges();
  }
  if (data.manualTargetOverrides) { manualTargetOverrides = data.manualTargetOverrides; await saveManualTargetOverrides(); }
  if (data.weights) { weights = data.weights; await saveWeights(); }
  if (data.lastCompleted) { lastCompleted = data.lastCompleted; await saveLastCompleted(); }
  if (data.stats) { stats = data.stats; await saveStats(); }
  if (data.badges) { badges = data.badges; await saveBadges(); }
  if (data.dailyActivity) { dailyActivity = data.dailyActivity; await saveDailyActivity(); }
  if (data.streakData) {
    streakCount = data.streakData.streakCount ?? 0;
    lastCompletedDate = data.streakData.lastCompletedDate ?? null;
    hasShield = data.streakData.hasShield ?? true;
    lastShieldResetWeek = data.streakData.lastShieldResetWeek ?? null;
    await saveStreakData();
  }
  if (typeof data.xpTotal === 'number') { xpTotal = data.xpTotal; await saveXp(); }
  if (typeof data.voiceCoachEnabled === 'boolean') { voiceCoachEnabled = data.voiceCoachEnabled; await saveVoiceCoachEnabled(); }
  if (Array.isArray(data.activeToday)) { activeToday = new Set(data.activeToday); await saveActiveToday(); }
  if (data.todayState && data.todayKey === todayKey) { state = data.todayState; await saveState(); }

  event.target.value = '';
  showToast(t('popups.importData.done'));
  render(true);
}

// Une ligne de classement (top N ou ma propre ligne si hors Top N) : avatar/initiale,
// nom, valeur formatée selon la vue (jours de série vs XP), rang. `highlight` marque
// la ligne de l'utilisateur courant. `rank` est TOUJOURS un nombre désormais (gratuit
// dans le Top N mis en cache — simple index du tableau ; calculé à la demande via
// getMyRank() sinon, voir fetchMyRank()) — depuis le passage au classement précalculé
// côté serveur, plus besoin du compromis "badge Hors Top 50" (voir CLAUDE.md).
function renderLeaderboardRow(entry, rank, view, highlight) {
  const value = entry.value || 0;
  const valueLabel = view === 'streaks' ? t('community.streakValue', { n: value }) : t('community.xpValue', { n: value });
  // formatDisplayName() est déjà appliqué à l'écriture (syncLeaderboardEntry()) : ré-
  // appliqué ici en filet de sécurité, idempotent, pour tout document déjà écrit avant
  // ce correctif (nom complet encore stocké, se corrigera de lui-même à la prochaine
  // synchronisation de son auteur).
  const name = formatDisplayName(entry.displayName);
  const avatar = entry.photoURL
    ? `<img src="${escapeHtml(entry.photoURL)}" class="leaderboard-avatar" referrerpolicy="no-referrer">`
    : `<div class="leaderboard-avatar-fallback">${escapeHtml(name.charAt(0).toUpperCase())}</div>`;
  // Jamais sur sa propre ligne. Contrairement aux kudos événementiels (fil d'activité/
  // Boss Battle), pas de retrait ici : 1 kudos par JOUR et par personne (voir
  // giveKudosToPerson()), plus simple, pas besoin de la symétrie d'un like sur un
  // événement ponctuel.
  const kudosHtml = highlight ? '' : `<button class="kudos-btn${myKudosGivenToday.has(entry.uid) ? ' given' : ''}" onclick="event.stopPropagation(); giveKudosToPerson('${escapeJsAttr(entry.uid)}')">👏 ${entry.kudosTotal || 0}</button>`;
  return `
    <div class="leaderboard-row${highlight ? ' me' : ''}">
      <span class="leaderboard-rank">#${rank}</span>
      ${avatar}
      <span class="leaderboard-name">${escapeHtml(name)}</span>
      <span class="leaderboard-value">${valueLabel}</span>
      ${kudosHtml}
    </div>
  `;
}

// Invite à partager le lien de l'app depuis l'écran Communauté (empty state du
// classement) : navigator.share si disponible (mobile), sinon copie presse-papiers +
// toast de confirmation — jamais d'échec silencieux si aucun des deux n'est supporté.
async function shareCommunityInvite() {
  const text = t('community.shareInviteText');
  const url = location.href;
  if (navigator.share) {
    try {
      await navigator.share({ title: 'Défi du Jour', text, url });
      return;
    } catch (e) { return; } // annulé par l'utilisateur : pas d'erreur à afficher
  }
  try {
    await navigator.clipboard.writeText(`${text} ${url}`);
    showToast(t('popups.communityInvite.linkCopied'));
  } catch (e) {
    reportSaveError('share community invite failed', e);
  }
}

// Jauge collective ("Boss Battle") : objectif hebdomadaire déterministe (même exercice/
// cible pour toute la communauté), progression en temps réel (communityBossBattleProgress,
// tenue par startBossBattleListener()), badge "Contributeur du jour" si quelqu'un a déjà
// contribué aujourd'hui.
function renderBossBattleSection() {
  const weekStart = mondayOfWeek(new Date());
  const target = getWeeklyBossBattleTarget(weekStart);
  if (!target) return '';
  const challenge = CHALLENGE_LIBRARY.find(c => c.id === target.targetChallengeId);
  if (!challenge) return '';
  const pct = Math.min(100, Math.round((communityBossBattleProgress / target.targetAmount) * 100));
  const unitLabel = challenge.unit === 'sec' ? t('exercise.unitSecLabelLower') : t('exercise.unitRepsLabel');
  const contributorHtml = communityTopContributorToday
    ? `<div class="boss-battle-contributor">${t('community.bossBattle.contributor', { name: escapeHtml(formatDisplayName(communityTopContributorToday.displayName)), amount: communityTopContributorToday.amount, unit: unitLabel })}</div>`
    : '';
  // Fil des contributions individuelles (temps réel, ~20 dernières) : FOMO en direct,
  // distinct du badge Contributeur du jour ci-dessus (agrégat, pas un flux d'évènements).
  const feedHtml = communityRecentContributions.length > 0
    ? `<div class="boss-battle-feed">${communityRecentContributions.map(c => `
        <div class="boss-battle-feed-row">
          <span>${t('community.bossBattle.feedRow', { name: escapeHtml(formatDisplayName(c.displayName)), amount: c.amount, unit: unitLabel })}</span>
          ${renderKudosButton(`bossBattleDocRef().collection('contributions').doc('${escapeJsAttr(c.id)}')`, c.id, c.kudosCount, currentUser && c.uid === currentUser.uid)}
        </div>
      `).join('')}</div>`
    : '';
  return `
    <div class="boss-battle-card">
      <div class="boss-battle-header">
        <span class="boss-battle-badge">${t('community.bossBattle.badge')}</span>
      </div>
      <div class="boss-battle-goal">${t('community.bossBattle.goal', { name: escapeHtml(challengeDisplayName(challenge)), progress: communityBossBattleProgress.toLocaleString(LOCALE_TO_INTL[currentLocale]), target: target.targetAmount.toLocaleString(LOCALE_TO_INTL[currentLocale]), unit: unitLabel })}</div>
      <div class="boss-battle-track"><div class="boss-battle-fill" style="width:${pct}%"></div></div>
      <div class="boss-battle-pct">${pct}%</div>
      ${contributorHtml}
      ${feedHtml}
    </div>
  `;
}

// Temple de la renommée : mémoire des victoires collectives passées (Boss Battle
// atteint), la plus récente en premier. Rien à afficher tant qu'aucune semaine n'a
// encore été remportée — pas un état "vide" traité comme une erreur, juste un module
// qui n'apparaît pas encore.
function renderHallOfFameSection() {
  if (communityBossBattleArchive.length === 0) return '';
  const rows = communityBossBattleArchive.map(entry => {
    const challenge = CHALLENGE_LIBRARY.find(c => c.id === entry.targetChallengeId);
    const unitLabel = challenge && challenge.unit === 'sec' ? t('exercise.unitSecLabelLower') : t('exercise.unitRepsLabel');
    const [y, m, d] = entry.weekStart.split('-').map(Number);
    const weekLabel = formatDateLabel(new Date(y, m - 1, d));
    return `
      <div class="hall-of-fame-row">
        <span class="hall-of-fame-icon">🏆</span>
        <div class="hall-of-fame-info">
          <span class="hall-of-fame-name">${escapeHtml(challenge ? challengeDisplayName(challenge) : t('history.deletedChallenge'))}</span>
          <span class="hall-of-fame-week">${t('community.hallOfFame.weekOf', { date: weekLabel })}</span>
        </div>
        <span class="hall-of-fame-value">${entry.finalProgress.toLocaleString(LOCALE_TO_INTL[currentLocale])} ${unitLabel}</span>
      </div>
    `;
  }).join('');
  return `
    <div class="section-label">${t('community.hallOfFame.sectionLabel')}</div>
    <div class="hall-of-fame-list">${rows}</div>
  `;
}

function renderActivityFeedRow(entry) {
  const amountLabel = entry.unit === 'sec' ? formatSecToReadable(entry.amount) : entry.amount + ' ' + t('exercise.unitRepsLabel');
  const rel = formatRelative(entry.at);
  const isMine = currentUser && entry.uid === currentUser.uid;
  const kudosHtml = renderKudosButton(`db.collection('activityFeed').doc('${escapeJsAttr(entry.id)}')`, entry.id, entry.kudosCount, isMine);
  // Repli gracieux : exerciseSlug n'existe que sur les documents écrits après ce champ
  // (voir registerActivityFeedEntryIfNeeded()) ET tant que CHALLENGE_LIBRARY n'a pas
  // encore de slugs réels (batch 7 du chantier i18n) — jusque-là exerciseSlug est
  // toujours null, donc challengeName (déjà stocké, français en dur) reste utilisé sans
  // aucun changement de comportement. Idem pour les défis personnalisés, qui n'ont
  // jamais de slug par nature (nom tapé par l'utilisateur, non traduisible).
  const challengeLabel = entry.exerciseSlug ? t('exercises.' + entry.exerciseSlug + '.name') : escapeHtml(entry.challengeName);
  return `
    <div class="activity-feed-row">
      <div class="activity-feed-body">
        <span class="activity-feed-text">${t('community.activityFeed.row', { name: escapeHtml(entry.displayName), challenge: challengeLabel, amount: amountLabel })}</span>
        ${rel ? `<span class="activity-feed-time">${escapeHtml(rel)}</span>` : ''}
      </div>
      ${kudosHtml}
    </div>
  `;
}

function renderCommunityScreen() {
  const views = [
    { id: 'streaks', label: t('community.views.streaks') },
    { id: 'weekly', label: t('community.views.weekly') },
    { id: 'alltime', label: t('community.views.alltime') },
  ];
  // Retour utilisateur "effet waouh" : ecran squelette (shimmer, memes classes
  // que renderFriendProfileSheet()) a la place d un simple texte "Chargement..."
  // pendant le premier chargement du classement.
  const topHtml = communityLeaderboardLoading
    ? Array.from({ length: 6 }).map(() => '<div class="skeleton-block skeleton-row"></div>').join('')
    : (communityLeaderboardTop.length === 0
      ? `<div class="history-empty">${t('community.noOneYet')}</div>`
      : communityLeaderboardTop.map((e, i) => renderLeaderboardRow(e, i + 1, communityLeaderboardView, e.uid === currentUser.uid)).join(''));

  // communityLeaderboardMyRank = { rank, value } (voir fetchMyRank(), rang EXACT
  // désormais — calculé via la Cloud Function getMyRank(), plus le compromis "badge
  // Hors Top 50"/voisins d'avant le passage au classement précalculé côté serveur,
  // voir CLAUDE.md). La barre ne s'affiche QUE si je ne suis pas déjà visible dans la
  // liste affichée à l'écran (sinon on verrait 2 fois la même ligne "moi" superposées :
  // la liste principale montre déjà tout le monde quand la communauté est petite).
  const meAlreadyVisible = communityLeaderboardTop.some(e => e.uid === currentUser.uid);
  let rankBarHtml = '';
  if (!communityLeaderboardLoading && !meAlreadyVisible && communityLeaderboardMyRank && communityLeaderboardMyRank.rank != null) {
    const meEntry = {
      uid: currentUser.uid,
      displayName: currentUser.displayName,
      photoURL: currentUser.photoURL,
      value: communityLeaderboardMyRank.value,
    };
    const row = renderLeaderboardRow(meEntry, communityLeaderboardMyRank.rank, communityLeaderboardView, true);
    // "sur X participants" : donnée déjà disponible sans coût supplémentaire (incluse
    // dans le même document leaderboardCache déjà lu pour le Top N).
    const totalHtml = communityLeaderboardTotalCount > 0
      ? `<div class="rank-bar-hint">${t('community.rankOutOfTotal', { total: communityLeaderboardTotalCount })}</div>`
      : '';
    rankBarHtml = `
      <div class="rank-bar">
        ${row.replace('leaderboard-row', 'leaderboard-row rank-bar-row')}
        ${totalHtml}
      </div>
    `;
  }

  // Encourage à inviter des proches dès que le classement est encore trop petit pour
  // être motivant (moins de 3 personnes) — sous la liste, pas à la place (on veut
  // quand même montrer les 1-2 personnes déjà présentes).
  const inviteHtml = (!communityLeaderboardLoading && communityLeaderboardTop.length < 3)
    ? `
      <div class="community-invite-card">
        <span class="community-invite-text">${t('community.inviteText')}</span>
        <button class="community-invite-btn" onclick="shareCommunityInvite()">${t('community.inviteBtn')}</button>
      </div>
    `
    : '';

  return `
    <div class="library-header-row">
      <div>
        <h1 class="title">${t('community.title')}</h1>
        <div class="subtitle">${t('community.subtitle')}</div>
      </div>
      <button class="friends-btn" onclick="openFriendsScreen()">${t('community.friendsBtn')}${incomingFriendRequests.length > 0 ? `<span class="friends-badge">${incomingFriendRequests.length}</span>` : ''}</button>
    </div>
    ${leaderboardOptOut ? `<div class="community-optout-notice">${t('community.optOutNotice')}</div>` : ''}
    ${renderBossBattleSection()}
    ${renderActivityFeedSection()}
    ${renderHallOfFameSection()}
    <div class="section-label">${t('community.leaderboardSectionLabel')}</div>
    <div class="leaderboard-tabs">
      ${views.map(v => `<button class="leaderboard-tab-btn${communityLeaderboardView === v.id ? ' active' : ''}" onclick="switchCommunityLeaderboardView('${v.id}')">${v.label}</button>`).join('')}
    </div>
    <div class="leaderboard-list">${topHtml}</div>
    ${inviteHtml}
    ${rankBarHtml}
  `;
}

function renderFriendActionRow(uid, displayName, photoURL, actionHtml, clickable = false) {
  const avatar = photoURL
    ? `<img src="${escapeHtml(photoURL)}" class="leaderboard-avatar" referrerpolicy="no-referrer">`
    : `<div class="leaderboard-avatar-fallback">${escapeHtml(displayName.charAt(0).toUpperCase())}</div>`;
  // clickable n'est vrai que pour la liste "Mes amis" (pas recherche/demandes) : ouvre la
  // fiche profil (openFriendProfile()). Les boutons d'action de actionHtml doivent alors
  // stopper la propagation pour ne pas déclencher l'ouverture en même temps (voir
  // renderFriendsScreen()).
  const clickAttr = clickable ? ` onclick="openFriendProfile('${escapeJsAttr(uid)}', '${escapeJsAttr(displayName)}', '${escapeJsAttr(photoURL)}')"` : '';
  // Retour utilisateur "effet waouh" : sur la liste "Mes amis" (clickable=true),
  // l'action (retirer) est révélée par un glissement vers la gauche (swipe) -
  // ligne épurée par défaut, plutôt qu'un bouton toujours visible - même geste
  // que Gmail/WhatsApp (voir initSwipeableRows()). Repli desktop/non-tactile :
  // révélée au survol (:hover, voir styles.css). Les autres usages de cette
  // fonction (recherche, invitation à un groupe - clickable=false) gardent le
  // bouton toujours visible tel quel : action rare, pas besoin de la cacher.
  const contentClass = `leaderboard-row${clickable ? ' clickable swipeable-row-content' : ''}`;
  const rowHtml = `
    <div class="${contentClass}"${clickAttr}>
      ${avatar}
      <span class="leaderboard-name">${escapeHtml(displayName)}</span>
      ${clickable ? '' : actionHtml}
    </div>
  `;
  if (!clickable) return rowHtml;
  return `
    <div class="swipeable-row">
      <div class="swipeable-row-actions">${actionHtml}</div>
      ${rowHtml}
    </div>
  `;
}

function renderFriendsScreen() {
  let resultHtml = '';
  if (friendSearchResult === 'searching') {
    resultHtml = `<div class="history-empty">${t('friends.searching')}</div>`;
  } else if (friendSearchResult === 'not-found') {
    resultHtml = `<div class="history-empty">${t('friends.notFound', { query: escapeHtml(friendSearchQuery) })}</div>`;
  } else if (friendSearchResult === 'self') {
    resultHtml = `<div class="history-empty">${t('friends.self')}</div>`;
  } else if (friendSearchResult && typeof friendSearchResult === 'object') {
    const r = friendSearchResult;
    let actionHtml;
    if (r.relation === 'friend') actionHtml = `<span class="friend-status">${t('friends.alreadyFriend')}</span>`;
    else if (r.relation === 'request-sent') actionHtml = `<span class="friend-status">${t('friends.requestSent')}</span>`;
    else if (r.relation === 'request-received') actionHtml = `<button class="friend-action-btn" onclick="acceptFriendRequest('${escapeJsAttr(r.uid)}')">${t('friends.acceptRequestBtn')}</button>`;
    else actionHtml = `<button class="friend-action-btn" onclick="sendFriendRequest('${escapeJsAttr(r.uid)}')">${t('friends.addBtn')}</button>`;
    resultHtml = renderFriendActionRow(r.uid, r.displayName, r.photoURL, actionHtml);
  }

  // Retour utilisateur : chaque ligne doit afficher le PSEUDO de l'expediteur (pas
  // son nom Google formate) - r.fromUsername est desormais denormalise sur le
  // document friendRequests des l'envoi (voir sendFriendRequest()) ; repli sur
  // r.displayName pour les demandes envoyees avant ce champ (anciens documents).
  const incomingHtml = incomingFriendRequests.length > 0 ? `
    <div class="section-label">${t('friends.incomingLabel')}</div>
    <div class="leaderboard-list">
      ${incomingFriendRequests.map(r => renderFriendActionRow(r.fromUid, r.fromUsername ? '@' + r.fromUsername : r.displayName, r.photoURL, `
        <button class="friend-action-btn" onclick="acceptFriendRequest('${escapeJsAttr(r.fromUid)}')">${t('friends.acceptBtn')}</button>
        <button class="friend-action-btn ghost" onclick="declineFriendRequest('${escapeJsAttr(r.fromUid)}')">${t('friends.declineBtn')}</button>
      `)).join('')}
    </div>
  ` : '';

  // Retour utilisateur (Priorite 2, centralisation des invitations de groupe) :
  // meme composant/repli que les demandes d'amis - masquee si aucune invitation en
  // attente. Chaque ligne affiche EXPLICITEMENT le nom du groupe (groupInviteRow,
  // {{group}} en tete) - reutilise renderFriendActionRow() tel quel (clickable=false,
  // le "uid" n'y sert qu'a l'ouverture de fiche profil, jamais utilisee ici) : la
  // lettre de repli de l'avatar devient alors naturellement l'initiale du GROUPE
  // (aucune photo de groupe a afficher).
  const groupInvitesHtml = incomingGroupInvites.length > 0 ? `
    <div class="section-label">${t('friends.groupInvitesLabel')}</div>
    <div class="leaderboard-list">
      ${incomingGroupInvites.map(inv => renderFriendActionRow(inv.id, t('friends.groupInviteRow', { group: inv.groupName || '', name: inv.fromName || '' }), '', `
        <button class="friend-action-btn" onclick="acceptGroupInviteFromList('${escapeJsAttr(inv.id)}', '${escapeJsAttr(inv.groupId)}')">${t('groups.joinBtn')}</button>
        <button class="friend-action-btn ghost" onclick="declineGroupInviteFromList('${escapeJsAttr(inv.id)}')">${t('friends.declineBtn')}</button>
      `)).join('')}
    </div>
  ` : '';

  const friendsHtml = myFriends.length > 0 ? `
    <div class="section-label">${t('friends.myFriendsLabel')}</div>
    <div class="leaderboard-list">
      ${myFriends.map(f => renderFriendActionRow(f.uid, f.displayName, f.photoURL, `
        <button class="icon-btn danger" onclick="event.stopPropagation(); removeFriend('${escapeJsAttr(f.uid)}')" aria-label="${t('friends.removeFriendAria')}">🗑️</button>
      `, true)).join('')}
    </div>
  ` : `<div class="history-empty">${t('friends.noFriends')}</div>`;

  return `
    <button class="nav-back-btn" onclick="history.back()" aria-label="${t('friends.backAria')}">‹</button>
    <h1 class="title">${t('friends.title')}</h1>
    <div class="subtitle">${t('friends.subtitle')}</div>
    <input class="library-search-input" id="friendSearchInput" type="text"
           placeholder="${t('friends.searchPlaceholder')}" aria-label="${t('friends.searchAria')}"
           value="${escapeHtml(friendSearchQuery)}" oninput="updateFriendSearchQuery(this.value)">
    <button class="friend-search-submit-btn" onclick="submitFriendSearch()">${t('friends.searchBtn')}</button>
    ${resultHtml}
    ${groupInvitesHtml}
    ${incomingHtml}
    ${friendsHtml}
  `;
}

function updateGroupCreateNameInput(value) { groupCreateNameInput = value; render(); }

function renderKilo(state, options) {
  const cfg = KILO_STATE_SVG[state] || KILO_STATE_SVG.idle;
  const opts = options || {};
  const size = opts.size || 200;
  const needsGrad = cfg.markup.indexOf('{{GRAD}}') !== -1;
  let defsHtml = '';
  let innerMarkup = cfg.markup;
  if (needsGrad) {
    kiloGradCounter++;
    const gradId = 'kiloGoldGrad' + kiloGradCounter;
    defsHtml = `<defs><linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#eab308"/><stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient></defs>`;
    innerMarkup = cfg.markup.split('{{GRAD}}').join(`url(#${gradId})`);
  }

  // opts.accessories (chantier gamification Phase 3) : ids KILO_ACCESSORY_SVG a
  // superposer, chacun dans son propre <g> (jamais fusionne au corps) - separes
  // en 2 groupes de peinture selon behindBody (voir plus haut).
  const accessoryIds = opts.accessories || [];
  const accessoryMarkup = (behind) => accessoryIds
    .filter((id) => KILO_ACCESSORY_SVG[id] && KILO_ACCESSORY_SVG[id].behindBody === behind)
    .map((id) => `<g class="kilo-accessory kilo-accessory-${id}">${KILO_ACCESSORY_SVG[id].markup}</g>`)
    .join('');

  // Hierarchie reelle (visage/bras vivent DANS kilo-body, pas comme des
  // elements freres) : un seul groupe porte l'animation d'ensemble
  // (kilo-idle, kilo-warning... poses sur la racine SVG) -> aucun risque de
  // desynchronisation entre le corps, le visage et les bras pendant le
  // mouvement. Les accessoires sont freres de .kilo-body (pas dedans) : ils
  // suivent donc naturellement l'animation d'ENSEMBLE (rebond idle,
  // tremblement hype, balancement teasing... posee sur la racine <svg>, qui
  // les englobe aussi), sans jamais etre perturbes par les animations
  // internes propres a un membre precis (bras qui trinque, eclairs qui
  // crepitent...) qui restent scopees a leurs propres sous-groupes DANS
  // .kilo-body.
  // opts.extraClass (retour utilisateur, transition de retour douce apres un
  // flash) : classe supplementaire optionnelle ajoutee a la racine SVG, en
  // plus de kilo-${state} - voir .kilo-idle.kilo-unflash dans styles.css.
  const extraClass = opts.extraClass ? ' ' + opts.extraClass : '';
  return `
    <svg class="kilo-svg kilo-${state}${extraClass}" width="${size}" height="${size}" viewBox="-100 -100 200 200" preserveAspectRatio="xMidYMid meet"
         ${opts.clickable ? 'onclick="kiloTap(this)"' : ''} role="img" aria-label="Kilito, humeur ${state}">
      ${defsHtml}
      ${accessoryMarkup(true)}
      <g${cfg.opacity ? ` opacity="${cfg.opacity}"` : ''}><g class="kilo-body">${innerMarkup}</g></g>
      ${accessoryMarkup(false)}
    </svg>
  `;
}

// Micro-interaction au tap (retour utilisateur) : petit rebond, jouable a
// repetition (retire puis reajoute la classe pour pouvoir la rejouer meme si
// l'animation precedente vient tout juste de se terminer - void el.offsetWidth
// force un reflow entre les deux, sinon le navigateur fusionne les 2 changements
// de classe et l'animation ne rejoue pas).
function kiloTap(el) {
  if (navigator.vibrate) navigator.vibrate(8);
  el.classList.remove('kilo-tapped');
  void el.offsetWidth;
  el.classList.add('kilo-tapped');
}

// Interactivite tactile de Kilo sur l'accueil (chantier gamification Phase 2,
// "effet Tamagotchi") : contrairement a kiloTap() (simple manipulation DOM
// directe, suffisante pour un SVG isole dans une popup), l'accueil re-rend
// TOUT #app a chaque render() - un classList.add() imperatif serait donc
// immediatement efface par le prochain rendu avant meme d'avoir eu le temps
// de s'afficher. Pilote donc le rebond via un horodatage consulte par
// render() lui-meme (kiloHomeTapBounceUntil, classe CSS '.tapped' sur
// .kilo-home-slot, memes keyframes que .kilo-tapped), meme principe que
// exerciseKiloFlashUntil (Phase 1). Met AUSSI a jour la bulle avec un
// encouragement aleatoire, par-dessus le rebond - exactement comme demande.
function kiloHomeTap() {
  kiloHomeTapBounceUntil = Date.now() + 400;
  // Idee bonus #8 (retour utilisateur) : easter egg si on tapote Kilo en
  // rafale - meme fenetre glissante que maybeInterceptSpammyTaps() (filtre
  // puis pousse l'horodatage courant), reinitialisee des le seuil atteint
  // pour ne pas redeclencher a CHAQUE tap suivant.
  const nowTap = Date.now();
  recentKiloHomeTaps = recentKiloHomeTaps.filter((at) => nowTap - at <= KILO_EASTER_EGG_WINDOW_MS);
  recentKiloHomeTaps.push(nowTap);
  if (recentKiloHomeTaps.length >= KILO_EASTER_EGG_TAP_THRESHOLD) {
    recentKiloHomeTaps = [];
    if (navigator.vibrate) navigator.vibrate([30, 40, 30, 40, 30]); // motif distinct du simple tap (voir garde-fou anti-spam)
    kiloHomeBubbleText = pickKiloLine('kilo.home.tapEasterEgg', {});
  } else {
    if (navigator.vibrate) navigator.vibrate(8);
    kiloHomeBubbleText = pickKiloLine('kilo.home.tapEncouragement', {});
  }
  render();
  setTimeout(() => render(), 450);
}

// Micro-fidget d'inactivite sur l'accueil (idee bonus #2, retour utilisateur)
// : "effet vivant"/Tamagotchi meme sans interaction. Tick global toutes les
// 15s (setInterval unique, voir son enregistrement plus bas), avec 1 chance
// sur 3 de declencher un fidget a chaque tick - moyenne d'environ 45s entre 2
// fidgets, dans la fourchette 30-60s demandee, sans jamais etre parfaitement
// regulier (une vraie cadence fixe romprait l'effet "vivant" recherche).
// Jamais quand une popup est deja affichee (ne doit jamais distraire en
// pleine lecture) ni hors de l'accueil (currentChallengeId/autre onglet) -
// ni si prefers-reduced-motion (purement decoratif, CSS neutraliserait de
// toute facon l'animation, mais autant ne pas forcer un render() pour rien).
// Fonctionne meme si kiloMuted (coupe seulement les BULLES de dialogue, pas
// les animations - voir toggleKiloMuted()) : Kilo reste vivant visuellement.
function maybeTriggerKiloIdleFidget() {
  if (activeTab !== 'today' || currentChallengeId || popupOpen) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (Math.random() > 1 / 3) return;
  kiloHomeFidgetUntil = Date.now() + 500;
  render();
  setTimeout(() => render(), 550);
}
// Tick global, enregistre une seule fois au chargement du script (jamais
// demarre/arrete par ecran, contrairement a timerIntervalId) - la fonction
// elle-meme se charge de ne rien faire hors de l'accueil idle. Wrapper (pas
// une reference directe a la fonction) : le harnais de test neutralise cette
// fonction APRES le chargement du script (meme convention que
// maybeInterceptSpammyTaps) - une reference directe capturerait la version
// d'origine pour toujours, avant meme que le test ait pu la neutraliser.
setInterval(() => maybeTriggerKiloIdleFidget(), 15000);

// Moteur d'humeur de Kilo sur l'accueil (chantier gamification Phase 2) -
// remplace l'ancien computeKiloHomeState() (idle en journee / warning des 19h
// si un defi actif n'etait pas valide), desormais un cas particulier de cette
// fonction plus riche. Reste PURE : toutes les donnees temporelles/derivees
// sont des parametres explicites, JAMAIS new Date()/Date.now() lu en interne
// (meme convention que la fonction qu'elle remplace) - testable de facon
// deterministe.
//
// ORDRE DE PRIORITE (documente explicitement, une seule humeur affichee a la
// fois) :
//   1. 'teasing' - inactif depuis >= 2 jours. Le signal le plus fort : on ne
//      l'a pas vu depuis un moment, tout le reste (serie, retard...) passe au
//      second plan tant que ce n'est pas rattrape.
//   2. 'hype'    - vient de logger une enorme serie d'un coup (justLoggedHugeSet,
//      ephemere/evenementiel, comme le flash de la fiche d'exercice en Phase 1),
//      OU la serie vient de franchir un palier de 7 jours.
//   3. 'warning' - tard (>= 18h, cf. cahier des charges - distinct du seuil 19h
//      de l'ancienne fonction) ET loin du but : cote PERSONNEL (moins de la
//      moitie des defis actifs du jour sont valides - pas juste "un seul non
//      fait", contrairement a l'ancien comportement, pour ne pas stresser
//      inutilement quelqu'un qui a deja fait l'essentiel) OU cote GROUPE (au
//      moins un defi de groupe actif a moins de 24h de son echeance ET moins
//      de 70% de la cible collective atteinte).
//   4. Repli : 'idle' (aucune de ces conditions - comportement par defaut
//      conserve de l'ancienne fonction, qui ne renvoyait jamais 'success').
function computeKiloMood(opts) {
  const {
    activeIds, stateChallenges, hour,
    streakCount = 0, daysSinceLastActivity = 0, justLoggedHugeSet = false,
    groupChallenges = [], nowMs = Date.now(),
  } = opts;

  if (daysSinceLastActivity >= 2) return 'teasing';

  const streakMilestone = streakCount > 0 && streakCount % 7 === 0;
  if (justLoggedHugeSet || streakMilestone) return 'hype';

  if (hour >= 18) {
    if (activeIds.length > 0) {
      const doneCount = activeIds.filter((id) => stateChallenges[id] && stateChallenges[id].done).length;
      if (doneCount / activeIds.length < 0.5) return 'warning';
    }
    const groupBehind = groupChallenges.some((g) => {
      if (!g.endDate || !(g.targetTotal > 0)) return false;
      const hoursLeft = (g.endDate - nowMs) / 3600000;
      return hoursLeft > 0 && hoursLeft <= 24 && (g.currentTotal || 0) < g.targetTotal * 0.7;
    });
    if (groupBehind) return 'warning';
  }

  return 'idle';
}

// ==== Kilo, coach temps reel sur la fiche d'exercice (retour utilisateur) ====
// Palier de progression - fonction PURE (aucun Math.random() ici), testable
// independamment du choix aleatoire de la replique exacte (voir
// pickKiloLine() plus bas). 4 paliers : rien encore fait, en cours
// (moins de la moitie), presque termine (moitie ou plus), objectif atteint.
function computeKiloExerciseProgressBucket(total, target, done) {
  if (done || (target > 0 && total >= target)) return 'done';
  if (target <= 0 || total <= 0) return 'notStarted';
  return (total / target) < 0.5 ? 'started' : 'almostThere';
}

// Etat visuel "stable" de Kilo sur cette fiche : 'success' des que l'objectif
// du jour est atteint (ou deja marque done), sinon 'idle'. Le flash motive au
// tap (exerciseKiloFlashUntil, voir addSetInner()) prend temporairement le
// relais par-dessus cette valeur, independamment de cette fonction.
function computeKiloExerciseMood(total, target, done) {
  return computeKiloExerciseProgressBucket(total, target, done) === 'done' ? 'success' : 'idle';
}

// Idee bonus #4 (retour utilisateur) : famille d'exploit d'un exercice, pour
// piocher une punchline differenciee (pompes/gainage/squats) plutot qu'une
// seule reserve generique - fonction PURE, reutilise directement les 3
// constantes deja etablies pour les trophees cumulatifs (source de verite
// unique, aucun seuil/liste duplique). Renvoie null pour tout exercice hors
// de ces 3 familles (repos sur le pool generique 'kilo.exercise.tapPunchline').
function computeKiloExerciseFamily(id) {
  if (PUSHUP_FAMILY_IDS.includes(id)) return 'pushups';
  if (CORE_TIME_FAMILY_IDS.includes(id)) return 'core';
  if (SQUAT_FAMILY_IDS.includes(id)) return 'squats';
  return null;
}

// Resout une cle i18n vers une replique DEJA interpolee, en piochant au hasard
// si la cle resout vers un tableau de variantes (voir locale-fr.js/-en.js/-es.js,
// namespaces kilo.exercise.*/kilo.home.*) - t() lui-meme ne fait l'interpolation
// {{}} que lorsque la valeur resolue est DIRECTEMENT une chaine (voir sa doc),
// donc l'interpolation est refaite ici a la main une fois la variante choisie.
// Purement cosmetique : aucun besoin de determinisme testable au-dela de "une
// variante valide de la cle est retournee". Partagee entre la fiche d'exercice
// (Phase 1) et l'accueil (Phase 2) - nom volontairement generique.
function pickKiloLine(key, params) {
  const resolved = t(key);
  const list = Array.isArray(resolved) ? resolved : [resolved];
  const chosen = list[Math.floor(Math.random() * list.length)];
  return interpolate(chosen, params || {});
}

// Retour utilisateur (bug reel signale) : la ligne d'un participant affichait le
// totalAmount BRUT (ex: 10 repetitions faites) sans jamais refleter visuellement
// le handicap du Boulet deja inflige (-20) - laissant croire a tort que la
// victime "gagne" alors qu'elle est en realite tres loin derriere une fois le
// reglement applique. Le vrai totalAmount (Hall of Fame, cible partagee du defi,
// voir la ligne juste en dessous de la carte hero) n'est JAMAIS modifie - seul ce
// qui est AFFICHE/CLASSE en direct doit refleter le handicap, meme formule que
// rankForSettlement() cote Cloud Function (volontairement dupliquee cote client :
// aucun import possible entre index.html et functions/index.js).
function computeGroupParticipantDisplayAmount(p) {
  return (p.totalAmount || 0) - (p.handicap || 0);
}

// Retour utilisateur : un malus Boulet en tout debut de defi (net negatif)
// affichait un total de GROUPE negatif (ex: -20, soit -40% de la cible), ce qui
// n'a pas de sens pour un objectif collectif. Chaque contribution individuelle
// NETTE est desormais plafonnee a 0 avant d'etre sommee : un handicap de depart
// neutralise juste la contribution de cette personne (jamais un total de
// groupe negatif), qui ne recommence a grimper qu'une fois son propre handicap
// compense par ses propres repetitions. Distincte de
// computeGroupParticipantDisplayAmount() ci-dessus (classement individuel, qui
// LUI reste negatif a dessein - on veut voir que Bob est "en dette"). Meme
// formule que computeGroupTotalProgress() cote Cloud Function (volontairement
// dupliquee : aucun import possible entre index.html et functions/index.js).
function computeGroupTotalProgress(participants) {
  return participants.reduce((sum, p) => sum + Math.max(0, computeGroupParticipantDisplayAmount(p)), 0);
}

// Ligne d'un participant a un defi de groupe (classement OU bilan) : PAS de bouton
// kudos (contrairement a renderLeaderboardRow(), sans rapport avec cette fonctionnalite).

  const jokerBadges = `${p.immune ? `<span class="friend-status" title="${escapeHtml(t('groups.jokers.immuneBadge'))}">🛡️</span>` : ''}${p.handicap ? `<span class="friend-status" title="${escapeHtml(t('groups.jokers.handicapBadge', { amount: p.handicap }))}">-${p.handicap}</span>` : ''}`;

// Section Jokers (Phase 4) sur un defi ACTIF uniquement : soit les 3 boutons (si
// je n'ai pas encore utilise mon joker pour ce defi), soit le picker de cible du
// Boulet (pickingBouletTarget), soit un statut informatif (joker deja utilise).
// Aucune ecriture directe ici - tout passe par applyGroupJoker() (Callable).
function renderGroupJokerSection(groupId, challengeId, participants) {
  const myParticipant = participants.find((p) => p.uid === currentUser.uid);
  if (!myParticipant) return '';

  if (pickingBouletTarget) {
    // Cible = n'importe quel AUTRE MEMBRE DU GROUPE (groupDetailMembers), PAS
    // seulement les participants ayant deja ouvert ce defi (`participants` du
    // parametre) - sans ca, impossible de viser quelqu'un qui n'a pas encore
    // interagi avec CE defi precis, alors que c'est le cas le plus frequent juste
    // apres la creation (voir applyGroupJoker() cote Cloud Function : cree le doc
    // participant de la cible a la volee si besoin).
    const others = groupDetailMembers.filter((m) => m.uid !== currentUser.uid);
    const targetListHtml = others.length > 0
      ? `<div class="leaderboard-list">
          ${others.map((m) => renderFriendActionRow(m.uid, m.displayName || '?', m.photoURL,
            `<button class="friend-action-btn" onclick="applyBouletOnTarget('${escapeJsAttr(groupId)}', '${escapeJsAttr(challengeId)}', '${escapeJsAttr(m.uid)}', '${escapeJsAttr(m.displayName || '')}')">${t('groups.jokers.pickTargetBtn')}</button>`
          )).join('')}
        </div>`
      : renderGroupsEmptyState('🎯', t('groups.jokers.pickTargetEmpty'));
    return `
      <div class="section-label">${t('groups.jokers.title')}</div>
      <div class="history-empty">${t('groups.jokers.pickTargetLabel')}</div>
      ${targetListHtml}
      <button class="friend-action-btn" onclick="pickingBouletTarget = false; render(true);">${t('common.cancel')}</button>
    `;
  }

  if (myParticipant.jokerUsed) {
    // Meme identite visuelle (couleur/icone) que le bouton d'origine, voir plus
    // bas - juste un statut au lieu d'une action.
    let statusText, jokerIcon;
    if (myParticipant.jokerUsed === 'doublon') {
      const remainingMs = (myParticipant.doublonActiveUntil || 0) - Date.now();
      statusText = remainingMs > 0
        ? t('groups.jokers.doublonActiveStatus', { minutes: Math.ceil(remainingMs / 60000) })
        : t('groups.jokers.doublonUsedStatus');
      jokerIcon = '⏫';
    } else if (myParticipant.jokerUsed === 'immunite') {
      statusText = t('groups.jokers.immuniteActiveStatus');

// Pure (aucun acces Firestore) : regroupe les entrees ledger IDENTIQUES (meme
// debiteur/creancier, meme type de gage, meme statut honore ou non) en une seule
// ligne avec un compteur - evite la fragmentation demandee ("3 bieres" au lieu de
// 3 lignes distinctes). stakeType='beer' regroupe TOUJOURS (texte structure, pas
// de variation possible) ; stakeType='custom' (ou absent - anciens defis d'avant
// ce champ) ne regroupe que les textes EXACTEMENT identiques, jamais des libelles
// differents. Ne regroupe jamais un gage honore avec un gage encore en attente
// (statuts distincts), pour ne pas donner l'impression qu'honorer 1 des 3 en
// honore 3.
function groupLedgerEntriesForDisplay(entries) {
  const groups = new Map();
  const order = [];
  for (const entry of entries) {
    const stakeType = entry.stakeType || 'custom';
    const key = [entry.fromUid, entry.toUid, stakeType, stakeType === 'custom' ? (entry.stakeDescription || '') : '', entry.honoredAt ? 'h' : 'p'].join('|');
    if (!groups.has(key)) {
      groups.set(key, {
        fromUid: entry.fromUid, toUid: entry.toUid, stakeType,
        stakeDescription: entry.stakeDescription || '', honored: !!entry.honoredAt,
        count: 0, entryIds: [],
      });
      order.push(key);
    }
    const g = groups.get(key);
    g.count++;
    g.entryIds.push(entry.entryId);
  }
  return order.map((key) => groups.get(key));
}

// Rendu partage d'une ligne de gage groupe - utilise par la liste detaillee
// (avec bouton "honorer") ET par le resume des soldes nets ci-dessous (sans
// action, purement informatif). Retour utilisateur : le nom du gage est
// desormais integre directement dans la phrase ("Hector doit une bière à
// Bob") plutot qu'affiche a part en dessous - et cumule intelligemment
// ("Hector doit 2 bières à Bob" si 2 gages identiques en attente, deja
// regroupes par groupLedgerEntriesForDisplay()/computeGroupNetBalances()
// avant meme d'arriver ici, voir g.count).
function renderLedgerRow(nameById, g, actionHtml) {
  const fromName = escapeHtml(nameById[g.fromUid] || '?');
  const toName = escapeHtml(nameById[g.toUid] || '?');
  // Gage structure (beer) : label toujours pluralise correctement (tn()). Gage
  // libre (custom) : texte saisi tel quel, suffixe "x{{n}}" uniquement si regroupe.
  const stakeLabel = g.stakeType === 'beer'
    ? tn('groups.stakeTypes.beerLabel', g.count)
    : (g.count > 1 ? t('groups.stakeCustomCount', { desc: g.stakeDescription, n: g.count }) : g.stakeDescription);
  // Repli tres rare (gage custom historique, cree avant que le champ vide soit
  // refuse a la validation - voir "gage custom vide refuse" plus haut dans le
  // code) : garde une phrase grammaticalement correcte plutot qu un trou vide.
  const sentence = t('groups.ledgerLineWithStake', {
    from: fromName, to: toName, stake: escapeHtml(stakeLabel || t('groups.stakeFallback')),
  });
  return `
    <div class="leaderboard-row">
      <span class="leaderboard-name">${sentence}</span>
      ${actionHtml || ''}
    </div>
  `;
}

// Solde net par personne (retour utilisateur, inspire du resume "qui doit quoi"
// de Splitwise) : au lieu de forcer a parcourir toute la liste chronologique pour
// comprendre la situation, nette les gages EN ATTENTE (honores exclus - deja
// regles) entre les 2 sens d'UNE MEME paire ET d'UN MEME type de gage exact.
// Un gage "biere" ne s'annule JAMAIS avec un gage "vaisselle" de l'autre sens
// (pas fongible, contrairement a de l'argent chez Splitwise) - seule une
// correspondance EXACTE de type/description est nettee.
function computeGroupNetBalances(entries) {
  const buckets = new Map();
  for (const entry of entries) {
    if (entry.honoredAt) continue;
    const stakeType = entry.stakeType || 'custom';
    const stakeDescription = stakeType === 'custom' ? (entry.stakeDescription || '') : '';
    const [uidLo, uidHi] = [entry.fromUid, entry.toUid].sort();
    const key = [uidLo, uidHi, stakeType, stakeDescription].join('|');
    if (!buckets.has(key)) buckets.set(key, { uidLo, uidHi, stakeType, stakeDescription, loOwesHi: 0, hiOwesLo: 0 });
    const b = buckets.get(key);
    if (entry.fromUid === uidLo) b.loOwesHi++; else b.hiOwesLo++;
  }
  const balances = [];
  for (const b of buckets.values()) {
    const net = b.loOwesHi - b.hiOwesLo;
    if (net === 0) continue; // quittes sur ce type de gage precis
    balances.push({
      fromUid: net > 0 ? b.uidLo : b.uidHi,
      toUid: net > 0 ? b.uidHi : b.uidLo,
      stakeType: b.stakeType,
      stakeDescription: b.stakeDescription,
      count: Math.abs(net),
    });
  }
  return balances;
}

function renderGroupBalancesSummary(entries) {
  const balances = computeGroupNetBalances(entries);
  if (balances.length === 0) return renderGroupsEmptyState('🎉', t('groups.allSettled'));
  const nameById = {};
  groupDetailMembers.forEach((m) => { nameById[m.uid] = m.displayName; });
  return balances.map((g) => renderLedgerRow(nameById, g, '')).join('');
}

// ==== PULL TO REFRESH ====
let ptrStartY = null;
let ptrCurrentY = 0;
let ptrActive = false;
let ptrRefreshing = false;
const PTR_THRESHOLD = 70;

function initPullToRefresh() {
  const indicator = document.createElement('div');
  indicator.id = 'ptrIndicator';
  indicator.className = 'ptr-indicator';
  indicator.innerHTML = '<div class="ptr-spinner">↻</div>';
  document.body.appendChild(indicator);

  document.addEventListener('touchstart', (e) => {
    // showProfileOnboarding : l'écran d'onboarding ne scrolle pas au niveau de la page
    // (window.scrollY reste à 0), donc un simple défilement de roulette (âge/taille/poids)
    // pouvait être mal interprété comme un pull-to-refresh — déclenchant refreshApp() /
    // render(true) en pleine saisie, ce qui réinitialisait les roulettes à leurs valeurs
    // par défaut (voir onWheelPickerScroll). refreshApp() ne concerne de toute façon que
    // les données déjà chargées, pas l'onboarding : aucune raison de l'autoriser ici.
    // Bug reel signale : glisser vers le bas pour fermer une bottom sheet (info
    // groupe, profil ami, palier de niveau - voir attachSheetBehavior()) declenchait
    // EN MEME TEMPS le pull-to-refresh de la page en arriere-plan, puisque ce
    // listener est pose au niveau du document et ne verifiait pas si une feuille
    // etait ouverte par-dessus. Les 3 feuilles partagent la meme classe
    // '.level-roadmap-overlay' (voir attachSheetBehavior()) - un seul selecteur
    // suffit a couvrir les 3, et toute future feuille qui reutiliserait la meme
    // fonction partagee.
    if (ptrRefreshing || showProfileOnboarding || document.querySelector('.level-roadmap-overlay')) return;
    if (window.scrollY <= 0 && !timerRunning) {
      ptrStartY = e.touches[0].clientY;
      ptrCurrentY = e.touches[0].clientY; // reset : un tap sans touchmove ne doit jamais hériter d'une ancienne valeur
      ptrActive = true;
    }
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!ptrActive || ptrStartY === null || ptrRefreshing) return;
    ptrCurrentY = e.touches[0].clientY;
    const delta = ptrCurrentY - ptrStartY;
    if (delta > 0 && window.scrollY <= 0) {
      const pulled = Math.min(delta * 0.5, 100);
      indicator.style.transform = `translateX(-50%) translateY(${pulled}px)`;
      indicator.style.opacity = Math.min(pulled / PTR_THRESHOLD, 1);
      if (pulled >= PTR_THRESHOLD) {
        indicator.classList.add('ready');
      } else {
        indicator.classList.remove('ready');
      }
    }
  }, { passive: true });

  document.addEventListener('touchend', async () => {
    if (!ptrActive || ptrStartY === null) return;
    const delta = ptrCurrentY - ptrStartY;
    ptrActive = false;
    ptrStartY = null;

    if (delta * 0.5 >= PTR_THRESHOLD && !ptrRefreshing) {
      ptrRefreshing = true;
      indicator.classList.add('spinning', 'ready');
      indicator.style.transform = `translateX(-50%) translateY(56px)`;
      indicator.style.opacity = '1';
      if (navigator.vibrate) navigator.vibrate(15);
      await refreshApp();
      await new Promise(r => setTimeout(r, 350));
      indicator.classList.remove('spinning', 'ready');
      indicator.style.transform = `translateX(-50%) translateY(0px)`;
      indicator.style.opacity = '0';
      ptrRefreshing = false;
    } else {
      indicator.classList.remove('ready');
      indicator.style.transform = `translateX(-50%) translateY(0px)`;
      indicator.style.opacity = '0';
    }
  }, { passive: true });
}

// Retour utilisateur "effet waouh" : leger effet de profondeur (tilt 3D) au
// toucher sur les cartes "hero" (.tilt-card - defi de groupe, carte athlete) -
// la carte s'incline en suivant la position du doigt, puis revient a plat au
// relachement avec un petit rebond. Delegation d'evenements sur document
// (plutot qu'un ecouteur par carte, qu'il faudrait re-attacher a CHAQUE
// render() qui recree tout le DOM - meme contrainte que partout ailleurs dans
// ce fichier) : survit nativement a tous les re-renders, aucune re-attache
// necessaire. Jamais active si prefers-reduced-motion (effet purement
// decoratif, base sur du mouvement).
function initTiltCards() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let tiltEl = null;
  const resetTilt = (el) => {
    el.classList.add('tilt-resetting');
    el.style.transform = '';
    el.addEventListener('transitionend', () => el.classList.remove('tilt-resetting'), { once: true });
  };
  document.addEventListener('touchmove', (e) => {
    const card = e.target.closest && e.target.closest('.tilt-card');
    if (!card) {
      if (tiltEl) { resetTilt(tiltEl); tiltEl = null; }
      return;
    }
    card.classList.remove('tilt-resetting'); // suivi instantane pendant le glisser, pas de transition qui "traine"
    const touch = e.touches[0];
    const rect = card.getBoundingClientRect();
    const x = (touch.clientX - rect.left) / rect.width;
    const y = (touch.clientY - rect.top) / rect.height;
    const rotateY = (Math.min(1, Math.max(0, x)) - 0.5) * 10;
    const rotateX = (0.5 - Math.min(1, Math.max(0, y))) * 10;
    card.style.transform = `perspective(600px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    tiltEl = card;
  }, { passive: true });
  document.addEventListener('touchend', () => { if (tiltEl) { resetTilt(tiltEl); tiltEl = null; } }, { passive: true });
  document.addEventListener('touchcancel', () => { if (tiltEl) { resetTilt(tiltEl); tiltEl = null; } }, { passive: true });
}

// Retour utilisateur "effet waouh" : glisser une ligne "Mes amis" vers la
// gauche révèle son action cachée (retirer) - même geste que Gmail/WhatsApp
// (voir renderFriendActionRow()). Délégation sur document (comme
// initTiltCards() ci-dessus) : survit nativement à tous les re-renders.
// Distingue un TAP (mouvement infime) d'un VRAI glissement horizontal, pour
// ne jamais bloquer l'ouverture de la fiche ami (onclick de la ligne) sur un
// simple tap - seul un glissement REEL neutralise le clic qui suit.
const SWIPE_REVEAL_PX = 52;
function initSwipeableRows() {
  let dragRow = null, startX = null, startY = null, moved = false;
  document.addEventListener('touchstart', (e) => {
    const row = e.target.closest && e.target.closest('.swipeable-row-content');
    if (!row) { dragRow = null; return; }
    dragRow = row;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    moved = false;
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!dragRow) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
    if (Math.abs(dx) > Math.abs(dy)) { // glissement principalement HORIZONTAL - sinon laisser le scroll vertical agir normalement
      const clamped = Math.min(0, Math.max(-SWIPE_REVEAL_PX, dx));
      dragRow.style.transition = 'none';
      dragRow.style.transform = `translateX(${clamped}px)`;
    }
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if (!dragRow) return;
    const row = dragRow;
    const currentX = parseFloat((row.style.transform.match(/-?\d+\.?\d*/) || [])[0]) || 0;
    row.style.transition = 'transform 0.2s ease';
    row.style.transform = currentX < -SWIPE_REVEAL_PX / 2 ? `translateX(-${SWIPE_REVEAL_PX}px)` : '';
    if (moved) {
      // Neutralise le PROCHAIN clic uniquement (evite d'ouvrir la fiche ami juste
      // apres avoir glisse pour reveler l'action) - jamais les suivants.
      const suppressClick = (ev) => { ev.stopPropagation(); ev.preventDefault(); row.removeEventListener('click', suppressClick, true); };
      row.addEventListener('click', suppressClick, true);
    }
    dragRow = null;
  }, { passive: true });
}

// Retour utilisateur "effet waouh" : legere parallaxe sur l'image de
// demonstration de l'exercice (.parallax-img) - suit le defilement un peu
// plus LENTEMENT que le texte sous elle (facteur 0.15), illusion de profondeur
// classique. Un seul ecouteur de scroll pose UNE FOIS au demarrage (jamais
// reattache) - cherche l'element cible A CHAQUE evenement (peut etre un noeud
// different apres un re-render, meme contrainte que partout ailleurs dans ce
// fichier), no-op silencieux si aucun n'est present a l'ecran courant.
// Plafonne (+/-15px) : ce n'est qu'un clin d'oeil, jamais un decalage visible
// qui ferait deborder l'image de sa carte.
function initParallax() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  window.addEventListener('scroll', () => {
    const img = document.querySelector('.parallax-img');
    if (!img) return;
    const offset = Math.max(-15, Math.min(15, window.scrollY * 0.15));
    img.style.transform = `translateY(${offset}px)`;
  }, { passive: true });
}

    await loadActiveToday(); // vient après loadState() : dépend de todayKey
  }
  await evaluateStreakOnLoad();
  render(true);
}

/**
 * Suggestion du jour ("catégorie la plus délaissée") affichée sur l'onglet
 * Aujourd'hui. Retourne `null` tant que l'historique est trop court pour être
 * pertinent (voir seuil ci-dessous) plutôt que de risquer un faux signal.
 */
function getSuggestion() {
  // Pas assez d'historique pour être pertinent, on évite de harceler un nouvel utilisateur
  if (badges.totalCompletions < 3) return null;

  const cats = [...new Set(CHALLENGES.map(c => c.cat))];
  let worstCat = null;
  let worstDays = -1;

  for (const cat of cats) {
    const idsInCat = CHALLENGES.filter(c => c.cat === cat).map(c => c.id);
    const timestamps = idsInCat.map(id => lastCompleted[id]).filter(Boolean);
    if (timestamps.length === 0) continue; // jamais fait du tout, on ne harcèle pas dès le début
    const mostRecent = Math.max(...timestamps);
    const daysSince = (Date.now() - mostRecent) / 86400000;
    if (daysSince > worstDays) {
      worstDays = daysSince;
      worstCat = cat;
    }
  }

  if (!worstCat || worstDays < 3) return null;

  const days = Math.floor(worstDays);
  return tn('today.suggestion', days, { category: translateCategoryName(worstCat) });
}


/**
 * Raccourcis PWA (manifest.json "shortcuts", ex: "Défis"/"Journal" depuis un appui
 * long sur l'icône de l'appli) : lit `?tab=...` dans l'URL et positionne activeTab
 * en conséquence avant le tout premier rendu (affectation directe, PAS switchTab()
 * qui déclenche des effets de bord pensés pour un changement d'onglet interactif :
 * vibration, nettoyage du timer, etc. — ici on démarre simplement sur cet onglet).
 * Nettoie ensuite l'URL (history.replaceState) pour qu'un rechargement manuel
 * ultérieur ne re-déclenche pas la même redirection.
 */
function applyShortcutTabFromUrl() {
  const params = new URLSearchParams(location.search);
  const tab = params.get('tab');
  // 'history' : alias retro-compatible - le raccourci PWA "Journal" (manifest.json)
  // pointe toujours vers ?tab=history, meme depuis que le Journal a fusionne en
  // sous-onglet de Profil (voir profileView) plutot qu'un onglet a part entiere.
  if (tab === 'history') {
    activeTab = 'account';
    profileView = 'journal';
  } else if (['today', 'library', 'community', 'account'].includes(tab)) {
    activeTab = tab;
  }
  if (params.has('tab')) {
    history.replaceState(null, '', location.pathname);
  }
}

async function startApp() {
  if (showProfileOnboarding) {
    // Un onboarding est déjà affiché et en cours de saisie : on ne le relance pas,
    // au cas où startApp() serait appelée une seconde fois (double événement d'auth par ex.)
    return;
  }
  await loadAppData();
  applyShortcutTabFromUrl();
  if (!userProfile) {
    profileStep = 0;
    profileDraft = { age: null, sex: null, heightCm: null, weightKg: null, level: null };
    showProfileOnboarding = true;
    render();
    return;
  }
  // Compte déjà onboardé mais créé avant l'introduction du pseudo obligatoire (ou
  // onboarding profil déjà terminé sans avoir pu finir le choix du pseudo) : verrou
  // plein écran infranchissable, même principe que le repli PWA (#pwaInstallGate).
  if (!username) {
    usernameSetupMode = 'gate';
    render();
    return;
  }
  await proceedAfterProfile();
}

async function proceedAfterProfile() {
  await continueStartApp();
}

async function continueStartApp() {
  // loadAppData() (appelé juste avant, dans startApp()) a déjà chargé
  // customChallenges/profile/stats/badges/etc. en une seule lecture — il ne reste
  // que les documents par jour, qui en dépendent (todayKey/dailyActivity).
  await loadState(); // vient après : dépend de dailyActivity pour les pastilles de la semaine
  await loadActiveToday(); // vient après loadState() : dépend de todayKey
  await evaluateStreakOnLoad(); // vient après loadState() : dépend de todayKey
  startCommunityDailyListener(); // vient après loadState() : dépend de todayKey
  await refreshWeeklyBossBattleTargetCache(); // AVANT startBossBattleListener() : la detection de victoire lit getWeeklyBossBattleTarget() de facon synchrone
  startBossBattleListener();
  startRecentContributionsListener();
  // Pas de await : sert uniquement au badge de notification sur le bouton "Amis" (écran
  // Communauté), pas bloquant pour le premier rendu — se termine par son propre render().
  refreshFriendsData();
  // Idem : alimente myActiveGroupChallenges (voir registerGroupChallengeContributionsIfNeeded())
  // pour qu'une série loguée depuis N'IMPORTE QUEL onglet contribue aux défis de
  // groupe actifs, sans attendre une visite de l'onglet Groupes — pas bloquant.
  refreshMyGroupsAndActiveChallenges();
  // Idem : détermine si CE navigateur supporte le Web Push (async depuis la SDK
  // v9+) — pas bloquant, le réglage Notifications push reste discret tant que
  // le résultat n'est pas connu (voir renderSettingsSection()). Enchaîne
  // ensuite avec une demande de permission automatique tant qu'aucune décision
  // n'a encore été prise (voir maybePromptPushNotificationsOnStartup()) — donc
  // à CHAQUE démarrage de l'app, pas seulement le tout premier.
  detectPushNotificationsSupport();
  // Rattrapage natif inclus : les notifications non lues reçues hors ligne se
  // déclenchent exactement comme celles reçues en direct, dès ce premier instantané.
  startNotificationsListener();
  // Idee bonus #16 (retour utilisateur, "petite intro au premier lancement du
  // jour") : appelee AVANT #18 ci-dessous - les 2 partagent le meme emplacement
  // unique kiloPendingSocialReaction, donc si les 2 se declenchent le meme
  // jour (rare mais possible : anniversaire de compte ET 1er lancement du
  // jour), l'anniversaire (plus rare/personnel) doit gagner en etant pose
  // EN DERNIER, jamais l'inverse.
  maybeShowKiloDailyIntro();
  // Idee bonus #18 (retour utilisateur) : verification client-side, une seule
  // fois par demarrage - voir maybeQueueAccountAnniversaryReaction() plus bas.
  // Simplification volontaire assumee : pas de garde "deja affiche aujourd'hui"
  // persistee - un simple message dans une bulle (pas un popup bloquant), sans
  // consequence reelle si l'utilisateur rouvre l'appli plusieurs fois le jour J.
  maybeQueueAccountAnniversaryReaction();
  // loadState() se termine par un render() interne, mais avec l'ancien activeToday
  // (pas encore rechargé à ce moment-là) : sans ce second rendu, l'accueil reste
  // figé sur cet état obsolète (ex: liste vide ou d'une session précédente).
  render();
}

// Idee bonus #16 (retour utilisateur, "petite intro au premier lancement du
// jour") : au tout premier rendu de l'accueil de la journee CALENDAIRE (pas
// juste de la session courante - lastKiloIntroDate est PERSISTE, comparee a
// todayKey exactement comme lastShieldResetWeek compare une cle de periode),
// Kilo "apparait" avec une courte animation d'entree (classe CSS .intro,
// pilotee par kiloHomeIntroUntil - meme principe horodatage->render() que
// kiloHomeTapBounceUntil/kiloHomeFidgetUntil, jamais de manipulation DOM
// directe) et une replique de bienvenue dediee, en reutilisant TEL QUEL le
// mecanisme deja etabli kiloPendingSocialReaction (idees #9/#10/#18).
async function maybeShowKiloDailyIntro() {
  if (lastKiloIntroDate === todayKey) return;
  lastKiloIntroDate = todayKey;
  kiloHomeIntroUntil = Date.now() + KILO_INTRO_DURATION_MS;
  kiloPendingSocialReaction = { key: 'kilo.home.dailyGreeting', params: {} };
  await saveAppField('lastKiloIntroDate', lastKiloIntroDate);
  setTimeout(() => render(), KILO_INTRO_DURATION_MS + 50); // force un rendu a l expiration, meme sans autre interaction entre-temps
}

// Idee bonus #18 (retour utilisateur, rappel d'anniversaire de compte) :
// calcule via computeAccountAnniversaryYears() (fonction pure, testee
// separement) et met en file la reaction correspondante, reutilisant TEL
// QUEL le mecanisme deja etabli pour les idees #9/#10 (kiloPendingSocialReaction,
// consomme une fois par le prochain render() de l'accueil). Choix
// d'implementation client-side pur (currentUser.metadata.creationTime, deja
// disponible sans lecture Firestore supplementaire) plutot qu'une 2e Cloud
// Function dediee, pour ne pas etendre `functions/**` pour un simple rappel.
function maybeQueueAccountAnniversaryReaction() {
  if (!currentUser?.metadata?.creationTime) return;
  const years = computeAccountAnniversaryYears(new Date(), new Date(currentUser.metadata.creationTime));
  if (years) {
    // yearsLabel deja pluralise (tn(), "1 an" vs "{{n}} ans") - pickKiloLine()
    // n'interpole que des chaines deja resolues, aucun support de pluralisation
    // {one,other} a l'interieur d'une variante de punchline.
    kiloPendingSocialReaction = {
      key: 'kilo.home.accountAnniversary',
      params: { yearsLabel: tn('kilo.home.accountAnniversaryYears', years, { n: years }) },
    };
  }
}

initPullToRefresh();
initTiltCards();
initSwipeableRows();
initParallax();

</script>
