function getExercisePictogramKey(c) {
  // 1) Correspondance exacte par nom (tous les défis de la bibliothèque)
  if (EXERCISE_ICON_BY_NAME[c.name]) return EXERCISE_ICON_BY_NAME[c.name];
  // 2) Repli par mots-clés pour les défis personnalisés créés par l'utilisateur
  const name = (c.name || '').toLowerCase();
  const cat = (c.cat || '').toLowerCase();
  if (cat === 'haltères') return 'dumbbell_generic';
  if (name.includes('pompe') || name.includes('push-up') || name.includes('push up') || name.includes('pike') || name.includes('dip')) return 'pompes';
  if (name.includes('squat') || name.includes('fente') || name.includes('pistol') || name.includes('mollet') || name.includes('pont') || name.includes('bridge') || name.includes('step')) return 'squats';
  if (name.includes('planche') || name.includes('gainage') || name.includes('hollow') || name.includes('wall sit') || name.includes('chaise') || name.includes('superman')) return 'planche';
  if (name.includes('crunch') || name.includes('abdo') || name.includes('v-up') || name.includes('bicycle') || name.includes('leg raise') || name.includes('dead bug') || name.includes('twist') || name.includes('sit-up')) return 'crunchs';
  if (name.includes('course') || name.includes('running') || name.includes('sprint') || name.includes('corde') || name.includes('jumping') || name.includes('burpee') || name.includes('high knee') || name.includes('mountain climber') || name.includes('sauté')) return 'mountain_climbers';
  return 'generic';
}


function renderExercisePicto(c) {
  const key = getExercisePictogramKey(c);
  const svg = EXERCISE_PICTOGRAMS[key] || EXERCISE_PICTOGRAMS.generic;
  // Essaie d'abord l'image statique extraite (exercices/{key}-static.png), générée
  // à partir de la première image du PNG animé fourni. Si le fichier n'existe pas
  // encore (404), bascule automatiquement sur le pictogramme SVG dessiné à la main —
  // aucune modification de code nécessaire au fur et à mesure que les images arrivent.
  return `
    <div class="exercise-picto">
      <img src="exercices/${key}-static.png" alt="${c.name}" loading="lazy"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="exercise-picto-fallback">${svg}</div>
    </div>
  `;
}

// Phrase claire pour les exercices unilatéraux (haltère tenu à un seul bras).
// Ne retourne rien si l'exercice n'est pas concerné.
function armModeSentence(target, unit, armMode) {
  if (armMode !== 'perArm') return '';
  const u = unit === 'sec' ? 'sec' : 'reps';
  return `Chaque bras doit faire ${target} ${u}.`;
}

// ==== WAKE LOCK (empêche l'écran de s'éteindre pendant un chrono) ====
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {
    console.error('Wake Lock non disponible :', e);
  }
}

async function releaseWakeLock() {
  if (wakeLock) {
    try { await wakeLock.release(); } catch (e) { /* déjà relâché */ }
    wakeLock = null;
  }
}

// Le Wake Lock est automatiquement relâché par le système quand l'onglet passe
// en arrière-plan (écran verrouillé, changement d'appli...). On le redemande
// dès que l'app redevient visible, tant que le chrono tourne toujours.
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && timerRunning && !wakeLock) {
    await requestWakeLock();
  }
});

function clearTimerState() {
  if (timerIntervalId) clearInterval(timerIntervalId);
  timerIntervalId = null;
  timerRunning = false;
  timerStartMs = null;
  lastBeepSecond = 0;
  lastVoiceCueSecond = null;
  clearPrepCountdown();
  releaseWakeLock();
}

// ==== COMPTE À REBOURS (3... 2... 1...) ====
// Deux modes, partageant le même overlay/décompte :
// - 'start' (défaut) : décompte de préparation classique avant le tout premier
//   démarrage, se termine par "C'est parti !".
// - 'hardcore' : au passage en mode Hardcore, annonce d'abord "Mode Hardcore
//   enclenché !", puis (une fois la phrase terminée) le même décompte 3-2-1,
//   sans "C'est parti !" à la fin.
// Overlay ajouté directement au DOM (comme showToast()), indépendant du cycle render().
let prepCountdownValue = null;
let prepCountdownTimeoutId = null;
let prepCountdownMode = 'start';

// mode :
// - 'start' (défaut) : décompte de préparation classique, se termine par "C'est parti !".
// - 'hardcore-first' : tout premier lancement du Hardcore après l'objectif normal ->
//   annonce "Mode Hardcore enclenché !" puis décompte. Cette annonce ne doit se
//   produire qu'une seule fois (cf. entry.hardcoreAnnounced dans toggleTimer()).
// - 'hardcore-repeat' : reprises suivantes du Hardcore -> décompte immédiat, sans
//   ré-annoncer la phrase (déjà entendue), ni dire "C'est parti !" à la fin.
function beginPrepCountdown(mode) {
  unlockTimerAudio(); // dans le geste utilisateur du clic, pour débloquer l'audio (Safari/iOS)
  clearPrepCountdown();
  prepCountdownMode = mode || 'start';
  prepCountdownValue = 3;
  if (prepCountdownMode === 'hardcore-first') {
    // attend la fin REELLE de l'annonce (callback onend de SpeechSynthesis) avant
    // d'entamer le decompte audible, plutot qu'un delai fixe devine (speak() annule
    // sinon l'utterance en cours si on enchaine trop tot -> phrase coupee mi-mot).
    speak('Mode Hardcore enclenché !', () => {
      if (prepCountdownValue === null) return; // decompte annule entretemps (clearPrepCountdown)
      renderPrepCountdownOverlay();
      speak('3');
      prepCountdownTimeoutId = setTimeout(prepCountdownTick, 1000);
    });
  } else {
    renderPrepCountdownOverlay();
    speak('3');
    prepCountdownTimeoutId = setTimeout(prepCountdownTick, 1000);
  }
}

function prepCountdownTick() {
  if (prepCountdownValue === null) return;
  prepCountdownValue -= 1;
  if (prepCountdownValue > 0) {
    renderPrepCountdownOverlay();
    speak(String(prepCountdownValue));
    prepCountdownTimeoutId = setTimeout(prepCountdownTick, 1000);
  } else {
    clearPrepCountdown();
    if (prepCountdownMode === 'start') speak("C'est parti !");
    startTimer();
  }
}

function clearPrepCountdown() {
  if (prepCountdownTimeoutId) clearTimeout(prepCountdownTimeoutId);
  prepCountdownTimeoutId = null;
  prepCountdownValue = null;
  prepCountdownMode = 'start';
  if (typeof window !== 'undefined' && window.speechSynthesis) window.speechSynthesis.cancel();
  const el = document.getElementById('prepCountdownOverlay');
  if (el) el.remove();
}

function renderPrepCountdownOverlay() {
  let el = document.getElementById('prepCountdownOverlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'prepCountdownOverlay';
    el.className = 'prep-countdown-overlay';
    document.body.appendChild(el);
  }
  el.innerHTML = `<div class="prep-countdown-number">${prepCountdownValue}</div>`;
}

let lastVoiceCueSecond = null;

// Annonce vocale à l'approche de l'objectif NORMAL (chronos en secondes uniquement) :
// "3... 2... 1..." puis "Défi terminé ! Bravo !" une fois l'objectif atteint. Ne
// concerne que la phase normale : une fois entry.done, la phase Hardcore n'a pas
// de décompte (cf. tickTimer/toggleTimer pour ses propres annonces).
function announceTimerVoiceCues(elapsed) {
  if (!voiceCoachEnabled || !currentChallengeId) return;
  const c = getChallenge();
  if (!c || c.unit !== 'sec') return;
  const entry = getEntry(currentChallengeId);
  if (entry.done) return;
  const target = getTarget();
  if (!target) return;
  const remaining = target - (getTotal() + elapsed);
  if (remaining <= 3 && remaining >= 1 && remaining !== lastVoiceCueSecond) {
    lastVoiceCueSecond = remaining;
    speak(String(remaining));
  } else if (remaining <= 0 && lastVoiceCueSecond !== 0) {
    lastVoiceCueSecond = 0;
    speak('Défi terminé ! Bravo !');
  }
}

function startTimer() {
  timerRunning = true;
  timerStartMs = Date.now();
  lastBeepSecond = 0;
  lastVoiceCueSecond = null;
  unlockTimerAudio();
  timerIntervalId = setInterval(tickTimer, 250);
  requestWakeLock();
  render();
}

// Clic sur le disque du chrono (anneau entier cliquable) : bascule Play/Valider.
// - Pas encore d'objectif normal atteint -> décompte de préparation (3-2-1) puis démarrage.
// - Objectif normal déjà atteint (Hardcore pas encore réussi) -> décompte (3-2-1) avant
//   le démarrage réel ; l'annonce "Mode Hardcore enclenché !" ne se produit qu'au tout
//   premier lancement (cf. entry.hardcoreAnnounced), jamais sur les reprises suivantes.
// - Hardcore déjà réussi -> plus rien à démarrer.
function toggleTimer() {
  if (timerRunning) {
    stopTimer();
    return;
  }
  if (!currentChallengeId) return;
  const entry = getEntry(currentChallengeId);
  if (entry.hardcoreDone) return;
  if (entry.done) {
    if (!entry.hardcoreAnnounced) {
      entry.hardcoreAnnounced = true;
      saveState();
      beginPrepCountdown('hardcore-first');
    } else {
      beginPrepCountdown('hardcore-repeat');
    }
  } else {
    beginPrepCountdown();
  }
}

// À chaque tick : met à jour l'affichage, puis détecte le franchissement de
// l'objectif normal ou Hardcore pour arrêter automatiquement le chrono (plus besoin
// d'un bouton Stop manuel) et déclencher l'annonce vocale correspondante.
function tickTimer() {
  const elapsed = Math.floor((Date.now() - timerStartMs) / 1000);
  const entry = getEntry(currentChallengeId);
  const target = getTarget();
  const hcTarget = getHardcoreTarget(getChallenge());
  const projected = getTotal() + elapsed;

  // Le nombre affiché ne montre QUE le temps écoulé de la série en cours (repart
  // toujours de 0:00 à chaque démarrage) ; les anneaux, eux, restent cumulatifs
  // (progression globale vers l'objectif du jour) — deux informations distinctes.
  const el = document.getElementById('timerDisplay');
  if (el) el.textContent = formatTimer(elapsed);
  updateTimerRingDOM(elapsed);

  if (elapsed > 0 && elapsed % 30 === 0 && elapsed !== lastBeepSecond) {
    lastBeepSecond = elapsed;
    playTimerBeep();
  }

  announceTimerVoiceCues(elapsed);

  if (!entry.done && projected >= target) {
    stopTimer(elapsed); // arrêt automatique : "Défi terminé !" déjà annoncé ci-dessus, les popups XP/trophée suivent via addSet()
  } else if (entry.done && !entry.hardcoreDone && projected >= hcTarget) {
    if (voiceCoachEnabled) speak('Mode Hardcore réussi ! Un vrai Titan !');
    stopTimer(elapsed); // arrêt définitif
  }
}

// `precomputedElapsed` évite un léger écart d'arrondi quand stopTimer() est appelé
// depuis tickTimer() (arrêt automatique) plutôt que depuis un clic manuel (pause).
async function stopTimer(precomputedElapsed) {
  const elapsed = precomputedElapsed !== undefined ? precomputedElapsed : Math.round((Date.now() - timerStartMs) / 1000);
  clearTimerState();
  if (elapsed > 0) {
    await addSet(elapsed);
  } else {
    render();
  }
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

function formatDateLabel(d) {
  const days = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months = ['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}

let currentChallengeId = null;

function emptyDayState() {
  return { challenges: {} };
}

function emptyChallengeEntry() {
  return { sets: [], targetOverride: null, done: false, hardcoreDone: false, hardcoreAnnounced: false };
}

function getEntry(id) {
  if (!state.challenges[id]) {
    state.challenges[id] = emptyChallengeEntry();
  }
  if (state.challenges[id].hardcoreDone === undefined) {
    state.challenges[id].hardcoreDone = false; // migration
  }
  if (state.challenges[id].hardcoreAnnounced === undefined) {
    state.challenges[id].hardcoreAnnounced = false; // migration
  }
  return state.challenges[id];
}

async function loadState() {
  const today = new Date();
  todayKey = dateKey(today);
  try {
    const res = await dbGet('day:' + todayKey);
    state = JSON.parse(res.value);
    if (!state.challenges) state = emptyDayState(); // migration depuis l'ancien format
  } catch (e) {
    state = emptyDayState();
  }
  // Pastilles des 7 derniers jours : calculées à partir de dailyActivity (déjà chargé en
  // parallèle), au lieu de 7 appels Firestore séquentiels supplémentaires (un par jour).
  weekData = {};
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const k = dateKey(d);
    weekData[k] = (dailyActivity[k] || 0) > 0;
  }
  render();
}

async function saveState() {
  try {
    await dbSet('day:' + todayKey, JSON.stringify(state));
  } catch (e) {
    console.error('save failed', e);
  }
}

function getChallenge() {
  return resolveChallenge(CHALLENGES.find(c => c.id === currentChallengeId));
}

function getTarget() {
  const c = getChallenge();
  const entry = getEntry(currentChallengeId);
  return entry.targetOverride || (c ? c.target : 0);
}

function getHardcoreTarget(c) {
  if (!c) return 0;
  const base = c.hardcoreTarget || c.target * 2;
  return Math.max(base, c.target + 1);
}

function getTotal() {
  const entry = getEntry(currentChallengeId);
  return entry.sets.reduce((a,b) => a+b, 0);
}

async function pickChallenge(id) {
  clearTimerState();
  currentChallengeId = id;
  getEntry(id); // s'assure qu'une entrée existe (reprend celle du jour si déjà commencée)
  pushNavState();
  render(true);
}

async function addSet(amount) {
  if (amount <= 0) return;
  const entry = getEntry(currentChallengeId);
  entry.sets.push(amount);
  const total = getTotal();
  const target = getTarget();
  const willComplete = total >= target && !entry.done;

  // Records & totaux à vie
  if (!stats[currentChallengeId]) {
    stats[currentChallengeId] = { lifetimeTotal: 0, bestDay: { total: 0, date: null }, recordStreak: 0 };
  }
  const s = stats[currentChallengeId];
  if (s.recordStreak === undefined) s.recordStreak = 0;
  s.lifetimeTotal += amount;
  let newRecord = false;
  if (total > s.bestDay.total) {
    s.bestDay = { total, date: todayKey };
    newRecord = true;
  }

  if (willComplete) {
    s.recordStreak = newRecord ? s.recordStreak + 1 : 0;
  }
  await saveStats();

  if (willComplete) {
    entry.done = true;
    weekData[todayKey] = true;
    lastCompleted[currentChallengeId] = Date.now();
    await saveLastCompleted();

    const isFirstCompletionOfDay = !dailyActivity[todayKey];
    dailyActivity[todayKey] = (dailyActivity[todayKey] || 0) + 1;
    await saveDailyActivity();

    badges.totalCompletions += 1;
    const freshBadges = checkNewBadges();
    await saveBadges();

    const completedChallenge = getChallenge();
    const xpGained = xpForChallenge(completedChallenge, total);
    const trophyXp = freshBadges.reduce((sum, b) => sum + (b.xp || 0), 0);
    const { levelBefore, levelAfter } = await awardXp(xpGained + trophyXp);
    if (isFirstCompletionOfDay) await registerDailyStreak();

    if (navigator.vibrate) navigator.vibrate([45, 35, 45, 35, 90]);
    fireConfetti();
    playSuccessSound();

    enqueuePopup({
      icon: newRecord ? '🏆' : '✅',
      title: newRecord ? 'Nouveau record !' : 'Défi complété !',
      subtitle: `${completedChallenge.name} — ${total} ${completedChallenge.unit === 'sec' ? 'sec' : 'reps'}`,
      xp: xpGained,
    });
    enqueueTrophyPopups(freshBadges);
    enqueueLevelPopups(levelBefore, levelAfter);

    // Progression automatique : 3 records consécutifs -> proposer d'augmenter l'objectif par défaut
    if (s.recordStreak >= 3) {
      const c = getChallenge();
      const suggestedTarget = Math.ceil((total * 1.15) / 5) * 5;
      setTimeout(async () => {
        const accept = confirm(
          `🚀 Tu bats ton record 3 fois de suite sur "${c.name}" !\n\nVeux-tu augmenter l'objectif par défaut de ${formatTargetLabel(c.target, c.unit)} à ${formatTargetLabel(suggestedTarget, c.unit)} ?`
        );
        if (accept) {
          if (c.isCustom) {
            const custom = customChallenges.find(x => x.id === c.id);
            if (custom) custom.target = suggestedTarget;
            rebuildChallenges();
            await saveCustomChallenges();
          } else {
            manualTargetOverrides[c.id] = suggestedTarget;
            await saveManualTargetOverrides();
          }
          showToast(`🎯 Objectif mis à jour : ${formatTargetLabel(suggestedTarget, c.unit)}`);
        }
        s.recordStreak = 0;
        await saveStats();
      }, 1400);
    }
  }

  // Mode Hardcore : détection indépendante de la complétion normale
  const cForHardcore = getChallenge();
  const hcTarget = getHardcoreTarget(cForHardcore);
  const willCompleteHardcore = total >= hcTarget && !entry.hardcoreDone;
  if (willCompleteHardcore) {
    entry.hardcoreDone = true;
    badges.totalHardcore += 1;
    const freshHardcoreBadges = checkNewBadges();
    await saveBadges();
    const hcTrophyXp = freshHardcoreBadges.reduce((sum, b) => sum + (b.xp || 0), 0);
    const { levelBefore: hcLevelBefore, levelAfter: hcLevelAfter } = await awardXp(HARDCORE_XP_BONUS + hcTrophyXp);

    if (navigator.vibrate) navigator.vibrate([60, 40, 60, 40, 60, 40, 140]);
    fireConfetti('hardcore');
    playSuccessSound();

    enqueuePopup({
      epic: true,
      icon: '🔥',
      title: 'MODE HARDCORE complété !',
      subtitle: `${cForHardcore.name} — ${Math.min(total, hcTarget)} / ${hcTarget} ${cForHardcore.unit === 'sec' ? 'sec' : 'reps'}`,
      xp: HARDCORE_XP_BONUS,
    });
    enqueueTrophyPopups(freshHardcoreBadges);
    enqueueLevelPopups(hcLevelBefore, hcLevelAfter);
  }

  await saveState();
  render();
}

async function undoLast() {
  const entry = getEntry(currentChallengeId);
  const popped = entry.sets.pop();
  const total = getTotal();

  if (popped && stats[currentChallengeId]) {
    const s = stats[currentChallengeId];
    s.lifetimeTotal = Math.max(0, s.lifetimeTotal - popped);
    if (s.bestDay.date === todayKey) s.bestDay.total = total;
    await saveStats();
  }

  if (total < getTarget()) {
    entry.done = false;
    weekData[todayKey] = Object.values(state.challenges).some(e => e.done);
  }
  await saveState();
  render();
}

async function editTarget() {
  const c = getChallenge();
  const entry = getEntry(currentChallengeId);
  const current = getTarget();
  const input = prompt(`Objectif du jour (${c.unit === 'sec' ? 'secondes' : 'répétitions'}) :`, current);
  if (input === null) return;
  const val = parseInt(input, 10);
  if (isNaN(val) || val <= 0) return;
  entry.targetOverride = val;
  const total = getTotal();
  entry.done = total >= val;
  await saveState();
  render();
}

function customAddSubmit() {
  const input = document.getElementById('customAddInput');
  const val = parseInt(input.value, 10);
  if (!isNaN(val) && val > 0) {
    addSet(val);
    input.value = '';
  }
}

function applyContent(app, html, animate, afterRender) {
  if (animate) {
    app.classList.add('fade-out');
    setTimeout(() => {
      app.innerHTML = html;
      app.classList.remove('fade-out');
      if (afterRender) afterRender();
    }, 140);
  } else {
    app.innerHTML = html;
    if (afterRender) afterRender();
  }
}

function render(animate) {
  const app = document.getElementById('app');
  const today = new Date();

  if (showProfileOnboarding) {
    applyContent(app, renderProfileOnboardingScreen(), animate, initWheelPickers);
    return;
  }

  if (onboardingTransitionPhase) {
    applyContent(app, renderOnboardingTransitionScreen(), animate);
    return;
  }

  if (activeTab === 'history') {
    applyContent(app, renderHistoryScreen() + renderTabBar() + renderGuidedTourOverlay(), animate);
    return;
  }

  if (activeTab === 'library') {
    applyContent(app, renderLibraryScreen() + renderTabBar() + renderGuidedTourOverlay(), animate);
    return;
  }

  if (activeTab === 'account') {
    applyContent(app, renderAccountTabScreen() + renderTabBar() + renderGuidedTourOverlay(), animate);
    return;
  }

  let html = '';

  if (!currentChallengeId) {
    html += `
      <div class="header">
        <div class="date">${formatDateLabel(today)}</div>
        <button class="streak" onclick="showStreakInfoModal()">🔥 ${computeStreak()} j${hasShield ? ' 🛡️' : ''}</button>
      </div>
      <h1 class="title">Défi du jour</h1>
    `;
    const activeChallenges = CHALLENGES.filter(c => activeToday.has(c.id)).map(resolveChallenge);
    if (activeChallenges.length === 0) {
      html += renderTodayEmptyState();
    } else {
    const suggestion = getSuggestion();
    if (suggestion) {
      html += `
        <div class="suggestion-banner">
          <div class="suggestion-icon">💡</div>
          <div class="suggestion-text">${suggestion}</div>
        </div>
      `;
    }
    const cats = [...new Set(activeChallenges.map(c => c.cat))];
    for (const cat of cats) {
      html += `<div class="section-label">${cat}</div><div class="picker-grid">`;
      for (const c of activeChallenges.filter(x => x.cat === cat)) {
        html += renderChallengeCard(c, 'today');
      }
      html += `</div>`;
    }
    html += renderBadgesStrip();
    }
  } else {
    const c = getChallenge();
    const entry = getEntry(currentChallengeId);
    const total = getTotal();
    const target = getTarget();
    const pct = Math.min(100, Math.round((total/target)*100));
    const unitLabel = c.unit === 'sec' ? 'sec' : 'reps';
    const quicks = QUICK_ADD[c.unit];

    html += `
      <div class="active-card">
        <img class="exercise-hero-apng" src="exercices/${getExercisePictogramKey(c)}.png" alt="Démonstration : ${c.name}"
             onerror="this.remove();">
        <div class="active-name">${c.name}</div>

        ${c.cat === 'Haltères' ? `
          <div class="weight-row">
            <div class="weight-pill">
              🏋️ ${weights[c.id] ?? 8} kg
              <button onclick="editWeight()">modifier</button>
            </div>
          </div>
          ${armModeSentence(target, c.unit, c.armMode) ? `<div class="arm-mode-sentence">💪 ${armModeSentence(target, c.unit, c.armMode)}</div>` : ''}
        ` : ''}

        <div class="stats-row">
          <div class="stat-chip">🏆 Record : ${stats[c.id] ? stats[c.id].bestDay.total : 0}${unitLabel === 'sec' ? 's' : ''}</div>
          <div class="stat-chip">Σ ${(stats[c.id] ? stats[c.id].lifetimeTotal : 0).toLocaleString('fr-FR')} à vie</div>
        </div>

        <div class="progress-row">
          <div class="progress-numbers">
            <span class="progress-current">${total}</span><span class="progress-target"> / ${target}</span>
            <span class="progress-unit"> ${c.unit === 'sec' ? 'SEC' : 'reps'}</span>
            ${c.unit === 'sec' ? `<span class="progress-readable-inline">(${formatSecToReadable(target)})</span>` : ''}
            <button class="target-edit" onclick="editTarget()">modifier</button>
          </div>
          <div class="progress-pct">${pct}%</div>
        </div>

        <div class="bar-track">
          <div class="bar-fill${entry.done ? ' complete' : ''}" style="width:${pct}%"></div>
        </div>

        ${(() => {
          const hcTarget = getHardcoreTarget(c);
          const hcRange = hcTarget - target;
          const hcProgress = Math.max(0, total - target);
          const hcPct = Math.min(100, Math.round((hcProgress / hcRange) * 100));
          if (!entry.done) {
            return `
              <div class="hardcore-locked">🔒 Mode Hardcore débloqué à ${target} ${unitLabel} — objectif ${hcTarget} ${unitLabel}</div>
            `;
          }
          return `
            <div class="hardcore-row">
              <div class="hardcore-label">
                🔥 Hardcore
                <span class="hardcore-nums">${Math.min(total, hcTarget)} / ${hcTarget} ${unitLabel}</span>
              </div>
              <div class="hardcore-pct">${hcPct}%</div>
            </div>
            <div class="bar-track hardcore-track">
              <div class="bar-fill hardcore-fill${entry.hardcoreDone ? ' complete' : ''}" style="width:${hcPct}%"></div>
            </div>
            ${entry.hardcoreDone ? `<div class="hardcore-banner">🔥 MODE HARDCORE complété !</div>` : ''}
          `;
        })()}

        ${c.unit === 'sec' ? (() => {
          const hcT = getHardcoreTarget(c);
          const elapsedNow = timerRunning ? Math.floor((Date.now() - timerStartMs) / 1000) : 0;
          const projected = total + elapsedNow;
          const { normalPct, hardcorePct } = computeTimerRingPct(projected, target, hcT);
          return `
            <div class="timer-box">
              <div class="add-label">Chronométrer une série</div>
              <div class="timer-ring-wrap${entry.hardcoreDone ? ' done' : ''}" onclick="toggleTimer()">
                ${renderDoubleTimerRingSVG(normalPct, hardcorePct, 220)}
                <div class="timer-ring-center">
                  <div class="timer-display${timerRunning ? ' running' : ''}" id="timerDisplay">${formatTimer(elapsedNow)}</div>
                  ${entry.hardcoreDone
                    ? `<div class="timer-play-icon done">✓</div>`
                    : `<div class="timer-play-icon${timerRunning ? ' confirm' : ''}">${timerRunning ? '✓' : '▶'}</div>`
                  }
                </div>
              </div>
            </div>
          `;
        })() : `
          <div class="add-label">Ajouter une série</div>
          <div class="quick-add-grid">
            ${quicks.map(q => `<button class="qa-btn" onclick="addSet(${q})">+${q}</button>`).join('')}
          </div>
        `}
        <div class="custom-add-row">
          <input type="number" id="customAddInput" placeholder="Nombre personnalisé" inputmode="numeric">
          <button class="custom-add-btn" onclick="customAddSubmit()">Ajouter</button>
        </div>

        ${entry.sets.length > 0 ? `
          <div class="undo-row">
            <button class="undo-btn" onclick="undoLast()">Annuler la dernière série (${entry.sets[entry.sets.length-1]})</button>
          </div>
        ` : ''}

    `;
  }

  // week strip
  html += `<div class="week-strip">`;
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const k = dateKey(d);
    const isToday = k === todayKey;
    const done = weekData[k];
    html += `
      <div class="week-day">
        <div class="dow">${DOW_LABELS[d.getDay()]}</div>
        <div class="week-dot${done ? ' done' : ''}${isToday ? ' today' : ''}">${done ? '✓' : ''}</div>
      </div>
    `;
  }
  html += `</div>`;
  html += renderTabBar();
  html += renderGuidedTourOverlay();

  applyContent(app, html, animate, () => {
    const input = document.getElementById('customAddInput');
    if (input) {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') customAddSubmit();
      });
    }
  });
}

async function loadHistoryEntries() {
  const DAYS_BACK = 28;
  const entries = [];
  for (let i = 0; i < DAYS_BACK; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const k = dateKey(d);
    try {
      const res = await dbGet('day:' + k);
      const s = JSON.parse(res.value);
      if (s.challenges) {
        for (const [cid, entry] of Object.entries(s.challenges)) {
          if (entry.sets && entry.sets.length === 0) continue;
          const c = CHALLENGES.find(x => x.id === Number(cid));
          entries.push({
            key: k,
            date: d,
            challengeName: c ? c.name : 'Défi supprimé',
            cat: c ? c.cat : '',
            total: entry.sets ? entry.sets.reduce((a,b)=>a+b,0) : 0,
            target: entry.targetOverride || (c ? c.target : 0),
            unit: c ? c.unit : 'reps',
            done: !!entry.done,
          });
        }
      }
    } catch (e) {
      // no entry for this day
    }
  }
  historyEntries = entries;
}

// Carte d'exercice partagée entre l'accueil ("today", clic = ouvrir la fiche) et
// l'onglet Défis ("library", clic = activer/désactiver pour aujourd'hui). Même
// structure/CSS (.picker-item) des deux côtés ; seules différences : la colonne de
// droite (statut du jour vs pastille "Actif"), le poids affiché pour les défis
// haltères en mode bibliothèque, et les actions éditer/supprimer réservées aux
// défis personnalisés.
function renderChallengeCard(c, mode) {
  const resolved = resolveChallenge(c);
  const isActive = activeToday.has(c.id);
  const weightKg = weights[c.id] ?? computeStandardWeight(c, userProfile) ?? 8;
  // Poids affiché sous les reps, sur sa propre ligne, identique sur Défis et Aujourd'hui
  // (jamais "à côté" des reps).
  const weightBelow = c.cat === 'Haltères' ? `<div class="goal-weight">🏋️ ${weightKg}kg</div>` : '';

  let rightHtml;
  if (mode === 'library') {
    rightHtml = isActive ? `<div class="active-pill">✓ Actif</div>` : '';
  } else {
    const todayEntry = state.challenges[c.id];
    const rel = formatRelative(lastCompleted[c.id]);
    rightHtml = '';
    if (todayEntry && todayEntry.hardcoreDone) {
      rightHtml = `<div class="last-done status-hardcore">🔥 Hardcore complété</div>`;
    } else if (todayEntry && todayEntry.done) {
      rightHtml = `<div class="last-done status-done">✓ Terminé aujourd'hui</div>`;
    } else if (todayEntry && todayEntry.sets.length > 0) {
      const t = todayEntry.sets.reduce((a,b)=>a+b,0);
      const tgt = todayEntry.targetOverride || resolved.target;
      rightHtml = `<div class="last-done status-progress">● En cours — ${t}/${tgt}</div>`;
    } else if (rel) {
      rightHtml = `<div class="last-done">${rel}</div>`;
    }
  }

  const onclick = mode === 'library' ? `toggleActiveToday(${c.id})` : `pickChallenge(${c.id})`;

  return `
    <div class="picker-item" onclick="${onclick}">
      ${renderExercisePicto(c)}
      <div class="picker-item-body">
        <span class="name">${c.name}</span>
      </div>
      <div class="goal">
        ${resolved.unit === 'sec' ? formatTargetLabel(resolved.target, resolved.unit) : resolved.target + ' reps'}
        ${weightBelow}
        ${rightHtml}
      </div>
      ${mode === 'library' && c.isCustom ? `
        <div class="manage-actions">
          <button class="icon-btn" onclick="event.stopPropagation(); openEditChallengeForm(${c.id})">✏️</button>
          <button class="icon-btn danger" onclick="event.stopPropagation(); deleteChallenge(${c.id})">🗑️</button>
        </div>
      ` : ''}
    </div>
  `;
}

function renderHeatmap() {
  const WEEKS = 26; // ~6 mois, plus lisible sur mobile qu'une année complète
  const totalDays = WEEKS * 7;
  const days = [];
  for (let i = totalDays - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  // aligner sur Lundi pour la première colonne
  while ((days[0].getDay() + 6) % 7 !== 0) {
    const d = new Date(days[0]);
    d.setDate(d.getDate() - 1);
    days.unshift(d);
  }

  function levelFor(count) {
    if (!count) return 0;
    if (count === 1) return 1;
    if (count <= 2) return 2;
    return 3;
  }

  let cells = '';
  for (const d of days) {
    const k = dateKey(d);
    const count = dailyActivity[k] || 0;
    const lvl = levelFor(count);
    const isFuture = d > new Date();
    cells += `<div class="heat-cell lvl${lvl}${isFuture ? ' future' : ''}" title="${k} — ${count} défi(s)"></div>`;
  }

  return `
    <div class="section-label">Activité (6 derniers mois)</div>
    <div class="heatmap-grid">${cells}</div>
    <div class="heat-legend">
      <span>Moins</span>
      <div class="heat-cell lvl0"></div>
      <div class="heat-cell lvl1"></div>
      <div class="heat-cell lvl2"></div>
      <div class="heat-cell lvl3"></div>
      <span>Plus</span>
    </div>
  `;
}

            </div>

}

function renderHistoryScreen() {
  const today = new Date();
  const cells = [];
  const DAYS_BACK = 28;
  // build calendar: oldest first, pad to full weeks starting Monday
  const days = [];
  for (let i = DAYS_BACK - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  const firstDow = (days[0].getDay() + 6) % 7; // Monday=0
  let calHtml = `<div class="cal-grid">`;
  ['L','M','M','J','V','S','D'].forEach(l => calHtml += `<div class="cal-dow">${l}</div>`);
  for (let i = 0; i < firstDow; i++) calHtml += `<div class="cal-cell empty"></div>`;
  for (const d of days) {
    const k = dateKey(d);
    const dayEntries = historyEntries.filter(e => e.key === k);
    const isToday = k === todayKey;
    const done = dayEntries.some(e => e.done);
    calHtml += `<div class="cal-cell${done ? ' done' : ''}${isToday ? ' today' : ''}">${done ? '✓' : d.getDate()}</div>`;
  }
  calHtml += `</div>`;

  let listHtml = `<div class="history-list-label">Défis effectués</div>`;
  const withChallenge = historyEntries.filter(e => e.challengeName);
  if (historyLoading) {
    listHtml += `<div class="history-empty">Chargement…</div>`;
  } else if (withChallenge.length === 0) {
    listHtml += `<div class="history-empty">Pas encore d'historique</div>`;
  } else {
    for (const e of withChallenge) {
      const label = e.key === todayKey ? "Aujourd'hui" : formatDateLabel(e.date);
      listHtml += `
        <div class="history-entry">
          <div>
            <div class="hdate">${label}</div>
            <div class="hname">${e.challengeName}</div>
          </div>
          <div class="hprogress${e.done ? ' done' : ''}">${e.total}/${e.target} ${e.unit === 'sec' ? 'sec' : ''}${e.done ? ' ✓' : ''}</div>
        </div>
      `;
    }
  }

  return `
    <h1 class="title">Journal</h1>
    <div class="subtitle">Ta progression dans le temps</div>
    <button class="share-stats-btn" onclick="shareStatsImage()">📤 Partager mes stats</button>
    <div class="section-label">Calendrier du mois</div>
    ${calHtml}
    ${renderHeatmap()}
    ${listHtml}
  `;
}

// ==== "PARCOURS DE NIVEAU" (page détaillant toute la progression XP/titres) ====
let levelRoadmapOpen = false;

function renderLevelRoadmapSheet() {
  const { level, xpIntoLevel, xpNeeded } = xpProgress(xpTotal);
  const pct = xpNeeded > 0 ? Math.min(100, Math.round((xpIntoLevel / xpNeeded) * 100)) : 100;
  let prevMax = 0;
  const rows = ATHLETE_TITLE_TIERS.map(t => {
    const minLevel = prevMax + 1;
    const rangeLabel = t.maxLevel === Infinity ? `Niveau ${minLevel}+` : `Niveaux ${minLevel}–${t.maxLevel}`;
    const unlocked = level >= minLevel;
    const current = level >= minLevel && level <= t.maxLevel;
    prevMax = t.maxLevel;
    return `
      <div class="roadmap-row${unlocked ? ' unlocked' : ''}${current ? ' current' : ''}">
        <div class="roadmap-row-icon">${current ? '▶' : unlocked ? '✓' : lockIconSVG(14)}</div>
        <div class="roadmap-row-text">
          <div class="roadmap-row-title">${t.title}</div>
          <div class="roadmap-row-range">${rangeLabel}</div>
        </div>
      </div>
    `;
  }).join('');
  return `
    <div class="level-roadmap-sheet">
      <button class="level-roadmap-close" onclick="closeLevelRoadmap()">✕</button>
      <div class="level-roadmap-header">
        <div class="level-roadmap-level">Niveau ${level}</div>
        <div class="level-roadmap-title">${athleteTitle(level)}</div>
        <div class="athlete-xp-track"><div class="athlete-xp-fill" style="width:${pct}%"></div></div>
        <div class="level-roadmap-xp-label">${xpIntoLevel} / ${xpNeeded} XP jusqu'au niveau ${level + 1}</div>
      </div>
      <div class="section-label">Parcours des titres d'athlète</div>
      <div class="roadmap-list">${rows}</div>
    </div>
  `;
}

// ==== PULL TO REFRESH ====
let ptrStartY = null;
let ptrCurrentY = 0;
let ptrActive = false;
let ptrRefreshing = false;
const PTR_THRESHOLD = 70;

function initPullToRefresh() {
  const indicator = document.createElement('div');
  indicator.id = 'ptrIndicator';
  indicator.className = 'ptr-indicator';
  indicator.innerHTML = '<div class="ptr-spinner">↻</div>';
  document.body.appendChild(indicator);

  document.addEventListener('touchstart', (e) => {
    if (ptrRefreshing) return;
    if (window.scrollY <= 0 && !timerRunning) {
      ptrStartY = e.touches[0].clientY;
      ptrCurrentY = e.touches[0].clientY; // reset : un tap sans touchmove ne doit jamais hériter d'une ancienne valeur
      ptrActive = true;
    }
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!ptrActive || ptrStartY === null || ptrRefreshing) return;
    ptrCurrentY = e.touches[0].clientY;
    const delta = ptrCurrentY - ptrStartY;
    if (delta > 0 && window.scrollY <= 0) {
      const pulled = Math.min(delta * 0.5, 100);
      indicator.style.transform = `translateX(-50%) translateY(${pulled}px)`;
      indicator.style.opacity = Math.min(pulled / PTR_THRESHOLD, 1);
      if (pulled >= PTR_THRESHOLD) {
        indicator.classList.add('ready');
      } else {
        indicator.classList.remove('ready');
      }
    }
  }, { passive: true });

  document.addEventListener('touchend', async () => {
    if (!ptrActive || ptrStartY === null) return;
    const delta = ptrCurrentY - ptrStartY;
    ptrActive = false;
    ptrStartY = null;

    if (delta * 0.5 >= PTR_THRESHOLD && !ptrRefreshing) {
      ptrRefreshing = true;
      indicator.classList.add('spinning', 'ready');
      indicator.style.transform = `translateX(-50%) translateY(56px)`;
      indicator.style.opacity = '1';
      if (navigator.vibrate) navigator.vibrate(15);
      await refreshApp();
      await new Promise(r => setTimeout(r, 350));
      indicator.classList.remove('spinning', 'ready');
      indicator.style.transform = `translateX(-50%) translateY(0px)`;
      indicator.style.opacity = '0';
      ptrRefreshing = false;
    } else {
      indicator.classList.remove('ready');
      indicator.style.transform = `translateX(-50%) translateY(0px)`;
      indicator.style.opacity = '0';
    }
  }, { passive: true });
}

async function refreshApp() {
  await loadChallenges(); // doit rester en premier : loadWeights en dépend pour les poids par défaut
  await Promise.all([
    loadWeights(),
    loadLastCompleted(),
    loadStats(),
    loadBadges(),
    loadDailyActivity(),
    loadManualTargetOverrides(),
    loadStreakData(),
    loadXp(),
    loadVoiceCoachEnabled(),
  ]);
  if (activeTab === 'history') {
    await loadHistoryEntries();
  } else {
    await loadState(); // dépend de dailyActivity, chargé juste avant
    await loadActiveToday(); // vient après loadState() : dépend de todayKey
  }
  await evaluateStreakOnLoad();
  render(true);
}

function getSuggestion() {
  // Pas assez d'historique pour être pertinent, on évite de harceler un nouvel utilisateur
  if (badges.totalCompletions < 3) return null;

  const cats = [...new Set(CHALLENGES.map(c => c.cat))];
  let worstCat = null;
  let worstDays = -1;

  for (const cat of cats) {
    const idsInCat = CHALLENGES.filter(c => c.cat === cat).map(c => c.id);
    const timestamps = idsInCat.map(id => lastCompleted[id]).filter(Boolean);
    if (timestamps.length === 0) continue; // jamais fait du tout, on ne harcèle pas dès le début
    const mostRecent = Math.max(...timestamps);
    const daysSince = (Date.now() - mostRecent) / 86400000;
    if (daysSince > worstDays) {
      worstDays = daysSince;
      worstCat = cat;
    }
  }

  if (!worstCat || worstDays < 3) return null;

  const days = Math.floor(worstDays);
  return `Tu n'as pas fait <strong>${worstCat}</strong> depuis ${days} jour${days > 1 ? 's' : ''}`;
}


async function startApp() {
  if (showProfileOnboarding) {
    // Un onboarding est déjà affiché et en cours de saisie : on ne le relance pas,
    // au cas où startApp() serait appelée une seconde fois (double événement d'auth par ex.)
    return;
  }
  const hasProfile = await loadProfile();
  if (!hasProfile) {
    profileStep = 0;
    profileDraft = { age: null, sex: null, heightCm: null, weightKg: null, level: null };
    showProfileOnboarding = true;
    render();
    return;
  }
  await proceedAfterProfile();
}

async function proceedAfterProfile() {
  await loadChallenges();
  await continueStartApp();
}

async function continueStartApp() {
  // Ces chargements sont indépendants les uns des autres : on les lance
  // en parallèle plutôt qu'en série pour diviser le temps d'attente.
  await Promise.all([
    loadWeights(),
    loadLastCompleted(),
    loadStats(),
    loadBadges(),
    loadDailyActivity(),
    loadManualTargetOverrides(),
    loadStreakData(),
    loadXp(),
    loadVoiceCoachEnabled(),
  ]);
  await loadState(); // vient après : dépend de dailyActivity pour les pastilles de la semaine
  await loadActiveToday(); // vient après loadState() : dépend de todayKey
  await evaluateStreakOnLoad(); // vient après loadState() : dépend de todayKey
  // loadState() se termine par un render() interne, mais avec l'ancien activeToday
  // (pas encore rechargé à ce moment-là) : sans ce second rendu, l'accueil reste
  // figé sur cet état obsolète (ex: liste vide ou d'une session précédente).
  render();
}

// Micro-interaction : légère vibration sur chaque tap d'élément interactif
document.addEventListener('click', (e) => {
  const target = e.target.closest('button, .picker-item, .manage-item, .qa-btn, .timer-ring-wrap');
  if (target && navigator.vibrate) {
    navigator.vibrate(8);
  }
}, true);

initPullToRefresh();
