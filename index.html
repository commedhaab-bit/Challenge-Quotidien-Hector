// ==== PULL TO REFRESH ====
let ptrStartY = null;
let ptrCurrentY = 0;
let ptrActive = false;
let ptrRefreshing = false;
const PTR_THRESHOLD = 70;

function initPullToRefresh() {
  const indicator = document.createElement('div');
  indicator.id = 'ptrIndicator';
  indicator.className = 'ptr-indicator';
  indicator.innerHTML = '<div class="ptr-spinner">↻</div>';
  document.body.appendChild(indicator);

  document.addEventListener('touchstart', (e) => {
    // showProfileOnboarding : l'écran d'onboarding ne scrolle pas au niveau de la page
    // (window.scrollY reste à 0), donc un simple défilement de roulette (âge/taille/poids)
    // pouvait être mal interprété comme un pull-to-refresh — déclenchant refreshApp() /
    // render(true) en pleine saisie, ce qui réinitialisait les roulettes à leurs valeurs
    // par défaut (voir onWheelPickerScroll). refreshApp() ne concerne de toute façon que
    // les données déjà chargées, pas l'onboarding : aucune raison de l'autoriser ici.
    if (ptrRefreshing || showProfileOnboarding) return;
    if (window.scrollY <= 0 && !timerRunning) {
      ptrStartY = e.touches[0].clientY;
      ptrCurrentY = e.touches[0].clientY; // reset : un tap sans touchmove ne doit jamais hériter d'une ancienne valeur
      ptrActive = true;
    }
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!ptrActive || ptrStartY === null || ptrRefreshing) return;
    ptrCurrentY = e.touches[0].clientY;
    const delta = ptrCurrentY - ptrStartY;
    if (delta > 0 && window.scrollY <= 0) {
      const pulled = Math.min(delta * 0.5, 100);
      indicator.style.transform = `translateX(-50%) translateY(${pulled}px)`;
      indicator.style.opacity = Math.min(pulled / PTR_THRESHOLD, 1);
      if (pulled >= PTR_THRESHOLD) {
        indicator.classList.add('ready');
      } else {
        indicator.classList.remove('ready');
      }
    }
  }, { passive: true });

  document.addEventListener('touchend', async () => {
    if (!ptrActive || ptrStartY === null) return;
    const delta = ptrCurrentY - ptrStartY;
    ptrActive = false;
    ptrStartY = null;

    if (delta * 0.5 >= PTR_THRESHOLD && !ptrRefreshing) {
      ptrRefreshing = true;
      indicator.classList.add('spinning', 'ready');
      indicator.style.transform = `translateX(-50%) translateY(56px)`;
      indicator.style.opacity = '1';
      if (navigator.vibrate) navigator.vibrate(15);
      await refreshApp();
      await new Promise(r => setTimeout(r, 350));
      indicator.classList.remove('spinning', 'ready');
      indicator.style.transform = `translateX(-50%) translateY(0px)`;
      indicator.style.opacity = '0';
      ptrRefreshing = false;
    } else {
      indicator.classList.remove('ready');
      indicator.style.transform = `translateX(-50%) translateY(0px)`;
      indicator.style.opacity = '0';
    }
  }, { passive: true });
}

async function refreshApp() {
  await loadAppData();
  if (activeTab === 'account' && profileView === 'journal') {
    await loadHistoryEntries();
  } else {
    await loadState(); // dépend de dailyActivity, chargé juste avant
    await loadActiveToday(); // vient après loadState() : dépend de todayKey
  }
  await evaluateStreakOnLoad();
  render(true);
}

/**
 * Suggestion du jour ("catégorie la plus délaissée") affichée sur l'onglet
 * Aujourd'hui. Retourne `null` tant que l'historique est trop court pour être
 * pertinent (voir seuil ci-dessous) plutôt que de risquer un faux signal.
 */
function getSuggestion() {
  // Pas assez d'historique pour être pertinent, on évite de harceler un nouvel utilisateur
  if (badges.totalCompletions < 3) return null;

  const cats = [...new Set(CHALLENGES.map(c => c.cat))];
  let worstCat = null;
  let worstDays = -1;

  for (const cat of cats) {
    const idsInCat = CHALLENGES.filter(c => c.cat === cat).map(c => c.id);
    const timestamps = idsInCat.map(id => lastCompleted[id]).filter(Boolean);
    if (timestamps.length === 0) continue; // jamais fait du tout, on ne harcèle pas dès le début
    const mostRecent = Math.max(...timestamps);
    const daysSince = (Date.now() - mostRecent) / 86400000;
    if (daysSince > worstDays) {
      worstDays = daysSince;
      worstCat = cat;
    }
  }

  if (!worstCat || worstDays < 3) return null;

  const days = Math.floor(worstDays);
  return tn('today.suggestion', days, { category: translateCategoryName(worstCat) });
}


/**
 * Raccourcis PWA (manifest.json "shortcuts", ex: "Défis"/"Journal" depuis un appui
 * long sur l'icône de l'appli) : lit `?tab=...` dans l'URL et positionne activeTab
 * en conséquence avant le tout premier rendu (affectation directe, PAS switchTab()
 * qui déclenche des effets de bord pensés pour un changement d'onglet interactif :
 * vibration, nettoyage du timer, etc. — ici on démarre simplement sur cet onglet).
 * Nettoie ensuite l'URL (history.replaceState) pour qu'un rechargement manuel
 * ultérieur ne re-déclenche pas la même redirection.
 */
function applyShortcutTabFromUrl() {
  const params = new URLSearchParams(location.search);
  const tab = params.get('tab');
  // 'history' : alias retro-compatible - le raccourci PWA "Journal" (manifest.json)
  // pointe toujours vers ?tab=history, meme depuis que le Journal a fusionne en
  // sous-onglet de Profil (voir profileView) plutot qu'un onglet a part entiere.
  if (tab === 'history') {
    activeTab = 'account';
    profileView = 'journal';
  } else if (['today', 'library', 'community', 'account'].includes(tab)) {
    activeTab = tab;
  }
  if (params.has('tab')) {
    history.replaceState(null, '', location.pathname);
  }
}

async function startApp() {
  if (showProfileOnboarding) {
    // Un onboarding est déjà affiché et en cours de saisie : on ne le relance pas,
    // au cas où startApp() serait appelée une seconde fois (double événement d'auth par ex.)
    return;
  }
  await loadAppData();
  applyShortcutTabFromUrl();
  if (!userProfile) {
    profileStep = 0;
    profileDraft = { age: null, sex: null, heightCm: null, weightKg: null, level: null };
    showProfileOnboarding = true;
    render();
    return;
  }
  // Compte déjà onboardé mais créé avant l'introduction du pseudo obligatoire (ou
  // onboarding profil déjà terminé sans avoir pu finir le choix du pseudo) : verrou
  // plein écran infranchissable, même principe que le repli PWA (#pwaInstallGate).
  if (!username) {
    usernameSetupMode = 'gate';
    render();
    return;
  }
  await proceedAfterProfile();
}

async function proceedAfterProfile() {
  await continueStartApp();
}

async function continueStartApp() {
  // loadAppData() (appelé juste avant, dans startApp()) a déjà chargé
  // customChallenges/profile/stats/badges/etc. en une seule lecture — il ne reste
  // que les documents par jour, qui en dépendent (todayKey/dailyActivity).
  await loadState(); // vient après : dépend de dailyActivity pour les pastilles de la semaine
  await loadActiveToday(); // vient après loadState() : dépend de todayKey
  await evaluateStreakOnLoad(); // vient après loadState() : dépend de todayKey
  startCommunityDailyListener(); // vient après loadState() : dépend de todayKey
  await refreshWeeklyBossBattleTargetCache(); // AVANT startBossBattleListener() : la detection de victoire lit getWeeklyBossBattleTarget() de facon synchrone
  startBossBattleListener();
  startRecentContributionsListener();
  // Pas de await : sert uniquement au badge de notification sur le bouton "Amis" (écran
  // Communauté), pas bloquant pour le premier rendu — se termine par son propre render().
  refreshFriendsData();
  // Idem : alimente myActiveGroupChallenges (voir registerGroupChallengeContributionsIfNeeded())
  // pour qu'une série loguée depuis N'IMPORTE QUEL onglet contribue aux défis de
  // groupe actifs, sans attendre une visite de l'onglet Groupes — pas bloquant.
  refreshMyGroupsAndActiveChallenges();
  // Idem : détermine si CE navigateur supporte le Web Push (async depuis la SDK
  // v9+) — pas bloquant, le réglage Notifications push reste discret tant que
  // le résultat n'est pas connu (voir renderSettingsSection()). Enchaîne
  // ensuite avec une demande de permission automatique tant qu'aucune décision
  // n'a encore été prise (voir maybePromptPushNotificationsOnStartup()) — donc
  // à CHAQUE démarrage de l'app, pas seulement le tout premier.
  detectPushNotificationsSupport();
  // Rattrapage natif inclus : les notifications non lues reçues hors ligne se
  // déclenchent exactement comme celles reçues en direct, dès ce premier instantané.
  startNotificationsListener();
  // loadState() se termine par un render() interne, mais avec l'ancien activeToday
  // (pas encore rechargé à ce moment-là) : sans ce second rendu, l'accueil reste
  // figé sur cet état obsolète (ex: liste vide ou d'une session précédente).
  render();
}

// Micro-interaction : légère vibration sur chaque tap d'élément interactif
document.addEventListener('click', (e) => {
  const target = e.target.closest('button, .picker-item, .manage-item, .qa-btn, .timer-ring-wrap');
  if (target && navigator.vibrate) {
    navigator.vibrate(8);
  }
}, true);

initPullToRefresh();

</script>
