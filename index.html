function emptyDayState() {
  return { challenges: {} };
}

function emptyChallengeEntry() {
  return { sets: [], targetOverride: null, done: false, hardcoreDone: false, hardcoreAnnounced: false };
}

function getEntry(id) {
  if (!state.challenges[id]) {
    state.challenges[id] = emptyChallengeEntry();
  }
  if (state.challenges[id].hardcoreDone === undefined) {
    state.challenges[id].hardcoreDone = false; // migration
  }
  if (state.challenges[id].hardcoreAnnounced === undefined) {
    state.challenges[id].hardcoreAnnounced = false; // migration
  }
  return state.challenges[id];
}

/**
 * Charge la progression du jour (`day:{todayKey}`) dans `state`, recalcule
 * `todayKey`/`weekData`. Notifie `dayStateStore` à la fin — combiné au signal de
 * `loadActiveToday()`, c'est ce qui déclenche le premier vrai rendu de l'app
 * (voir `createStore`, Batch 6) plutôt qu'un `render()` manuel non coordonné.
 */
async function loadState() {
  const today = new Date();
  todayKey = dateKey(today);
  try {
    const res = await dbGet('day:' + todayKey);
    state = JSON.parse(res.value);
    if (!state.challenges) state = emptyDayState(); // migration depuis l'ancien format
  } catch (e) {
    state = emptyDayState();
  }
  // Pastilles de la semaine calendaire (Lundi -> Dimanche) : calculées à partir de
  // dailyActivity (déjà chargé en parallèle), au lieu d'appels Firestore séquentiels
  // supplémentaires (un par jour).
  weekData = {};
  for (const d of getCalendarWeekDates(today)) {
    const k = dateKey(d);
    weekData[k] = (dailyActivity[k] || 0) > 0;
  }
  render();
  dayStateStore.set({ ...dayStateStore.get(), stateLoaded: true });
}

async function saveState() {
  try {
    await dbSet('day:' + todayKey, JSON.stringify(state));
  } catch (e) {
    reportSaveError('save state failed', e);
  }
}

function getChallenge() {
  return resolveChallenge(CHALLENGES.find(c => c.id === currentChallengeId));
}

function getTarget() {
  const c = getChallenge();
  const entry = getEntry(currentChallengeId);
  return entry.targetOverride || (c ? c.target : 0);
}

function getHardcoreTarget(c) {
  if (!c) return 0;
  const base = c.hardcoreTarget || c.target * 2;
  return Math.max(base, c.target + 1);
}

function getTotal() {
  const entry = getEntry(currentChallengeId);
  return entry.sets.reduce((a,b) => a+b, 0);
}

async function pickChallenge(id) {
  clearTimerState();
  currentChallengeId = id;
  const entry = getEntry(id); // s'assure qu'une entrée existe (reprend celle du jour si déjà commencée)
  activeExerciseGroupChallenges = []; // évite d'afficher la progression du PRÉCÉDENT exercice le temps du chargement
  const c = getChallenge(); // remonté plus tôt (lecture pure) : réutilisé ci-dessous par l'idée bonus #6
  // Kilo, coach temps reel (retour utilisateur) : nouvelle replique d'ouverture
  // et flash remis a zero a chaque nouvel exercice choisi - jamais la replique
  // ou le flash motive d'un exercice PRECEDENT qui trainerait visuellement.
  exerciseKiloFlashUntil = 0;
  exerciseKiloBubbleText = pickKiloLine(
    'kilo.exercise.opening.' + computeKiloExerciseProgressBucket(getTotal(), getTarget(), entry.done),
    { current: getTotal(), target: getTarget() }
  );
  // Idees bonus #6/#7 (retour utilisateur) : un SEUL tirage partage decide si
  // la replique de palier ci-dessus est remplacee par une variante "fun" -
  // comparaison delirante du cumul a vie (#7, bande basse, ne se declenche
  // que si un cumul existe deja - rien d'absurde a comparer sur un exercice
  // jamais fait) OU reference explicite au jour de la semaine (#6, exemple
  // fourni par l'utilisateur : "C'est dimanche mais pas de repos pour les
  // abdos"). Un seul Math.random() (pas un tirage independant par idee) pour
  // garder des probabilites simples/additives : 15% comparaison, 25% jour,
  // 60% palier standard (par defaut, deja pose ci-dessus).
  const kiloLifetimeTotal = c ? (stats[c.id]?.lifetimeTotal || 0) : 0;
  const kiloOpeningRoll = c ? Math.random() : 1;
  if (kiloLifetimeTotal > 0 && kiloOpeningRoll < 0.15) {
    exerciseKiloBubbleText = pickKiloLine('kilo.exercise.statComparison', {
      lifetime: kiloLifetimeTotal.toLocaleString(LOCALE_TO_INTL[currentLocale]),
      exercise: challengeDisplayName(c),
    });
  } else if (kiloOpeningRoll < 0.4) {
    // t('dates.daysFull') est capitalise (reutilise ailleurs pour des libelles
    // de date autonomes, ex. formatDateLabel()) - le FR/ES ecrivent
    // conventionnellement les jours en minuscule en milieu de phrase (l'exemple
    // fourni par l'utilisateur : "C'est dimanche..."), contrairement a l'EN qui
    // capitalise toujours ses noms de jours.
    const dayNameRaw = t('dates.daysFull')[new Date().getDay()];
    exerciseKiloBubbleText = pickKiloLine('kilo.exercise.dayPunchline', {
      day: currentLocale === 'en' ? dayNameRaw : dayNameRaw.toLowerCase(),
      exercise: challengeDisplayName(c),
    });
  }
  pushNavState();
  render(true);
  if (c && c.slug) loadActiveExerciseGroupChallenges(c.slug); // fire-and-forget : re-rend dès que prêt, jamais bloquant pour la navigation
  if (!Object.prototype.hasOwnProperty.call(exerciseSparklineCache, id)) loadExerciseSparkline(id); // idem, mis en cache par exercice pour la session
}

// Retour utilisateur : afficher la progression du/des défi(s) de groupe liés à
// l'exercice courant (même exerciseSlug) sous l'objectif personnel du jour - évite
// l'impression de 2 mondes séparés ("je fais des pompes ici, mais je ne suis même
// pas sûr que ça compte pour le défi du groupe"). Une lecture Firestore par défi lié
// (rare : 0 la plupart du temps, 1 le plus souvent - plusieurs seulement si
// l'utilisateur est dans plusieurs groupes ayant chacun un défi actif sur ce même
// exercice, cas gardé generique plutot que suppose impossible).
async function loadActiveExerciseGroupChallenges(slug) {
  const matches = myActiveGroupChallenges.filter((m) => m.exerciseSlug === slug);
  const mySeq = ++activeExerciseGroupChallengesSeq;
  if (matches.length === 0) {
    if (mySeq === activeExerciseGroupChallengesSeq) activeExerciseGroupChallenges = [];
    return;
  }
  try {
    const results = await Promise.all(matches.map(async (m) => {
      const participantsSnap = await db.collection('groups').doc(m.groupId).collection('challenges').doc(m.challengeId).collection('participants').get();
      // Meme definition du total collectif que la carte hero de l ecran Groupes
      // (computeGroupTotalProgress()) - sinon cette mini-barre (fiche exercice)
      // et la carte hero afficheraient 2 totaux differents pour le MEME defi.
      const currentTotal = computeGroupTotalProgress(participantsSnap.docs.map((d) => d.data()));
      const group = myGroups.find((g) => g.groupId === m.groupId);
      return { groupId: m.groupId, challengeId: m.challengeId, groupName: group ? group.name : '', targetTotal: m.targetTotal || 0, currentTotal };
    }));
    // Jeton perime : un appel plus recent a deja ete emis (voir addSetInner(), qui
    // resynchronise juste apres chaque serie loguee) - ignorer ce resultat, sinon une
    // lecture LANCEE avant mais RESOLUE apres ecraserait des donnees plus fraiches
    // avec des donnees perimees (le bug reel signale par l utilisateur).
    if (mySeq !== activeExerciseGroupChallengesSeq) return;
    // Navigation rapide possible pendant le chargement : n'applique le résultat que
    // s'il correspond encore à l'exercice actuellement affiché.
    const c = getChallenge();
    if (!c || c.slug !== slug) return;
    activeExerciseGroupChallenges = results;
    render();
  } catch (e) {
    console.error('load active exercise group challenges failed', e);
  }
}

// Bouton "Faire {{exercice}}" sur la carte hero d'un défi de groupe (retour
// utilisateur : avant ce correctif, il fallait aller activer soi-même l'exercice
// dans l'onglet Défis PUIS retourner sur Aujourd'hui pour enfin logger une série -
// beaucoup de friction pour un geste qui devrait être immédiat). Réutilise
// toggleActiveToday() (jamais appelée si déjà active, donc jamais un toggle qui
// désactiverait par erreur) puis pickChallenge() - aucune nouvelle logique
// d'activation/navigation, juste les 2 déjà existantes enchaînées.
async function startGroupChallengeExercise(slug) {
  const c = CHALLENGE_LIBRARY.find((x) => x.slug === slug);
  if (!c) return;
  if (!activeToday.has(c.id)) await toggleActiveToday(c.id);
  // Bug reel signale : sans ceci, le clic ne "faisait rien" visuellement - render()
  // teste activeTab AVANT currentChallengeId (voir le dispatcheur principal), donc
  // rester sur activeTab === 'groups' faisait simplement re-afficher l'ecran Groupes
  // (currentChallengeId ignore), ce qui ressemblait a un simple rafraichissement.
  activeTab = 'today';
  await pickChallenge(c.id);
}

// Retour utilisateur "effet waouh" : mini-graphique (sparkline) des 7 derniers
// jours d'activite sur CET exercice precis, affiche a cote du total a vie -
// donne une tendance en un coup d'oeil (progresse/ralentit), que le simple
// total cumule ne montre jamais. Reutilise historyDayCache si deja peuple par
// le Journal (meme cache, memes cles dateKey) - sinon ne lit QUE les 7 jours
// necessaires (pas les 28 du Journal complet), reste econome en lectures. Mis
// en cache PAR EXERCICE pour la session (jamais relu une 2e fois pour le meme
// exercice) - voir pickChallenge().
let exerciseSparklineCache = {}; // { [challengeId]: [total x7, plus ancien -> plus recent] }

async function loadExerciseSparkline(challengeId) {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(dateKey(d));
  }
  try {
    const totals = await Promise.all(days.map(async (k) => {
      if (k === todayKey) {
        const entry = state.challenges[challengeId];
        return entry && entry.sets ? entry.sets.reduce((a, b) => a + b, 0) : 0;
      }
      let dayDoc;
      if (Object.prototype.hasOwnProperty.call(historyDayCache, k)) {
        dayDoc = historyDayCache[k];
      } else {
        try {
          const res = await dbGet('day:' + k);
          dayDoc = JSON.parse(res.value);
        } catch (e) {
          dayDoc = null;
        }
        historyDayCache[k] = dayDoc; // alimente le MEME cache que le Journal (loadHistoryEntries()), reutilisable ensuite
      }
      const entry = dayDoc && dayDoc.challenges ? dayDoc.challenges[challengeId] : null;
      return entry && entry.sets ? entry.sets.reduce((a, b) => a + b, 0) : 0;
    }));
    // Navigation rapide possible pendant le chargement : n'applique le resultat
    // que s'il correspond encore a l'exercice actuellement affiche.
    if (currentChallengeId !== challengeId) return;
    exerciseSparklineCache[challengeId] = totals;
    render();
  } catch (e) {
    console.error('load exercise sparkline failed', e);
  }
}

// Passe "premium" (retour utilisateur) : remplissage en degrade sous la ligne
// (plutot qu'un simple trait) + point final qui brille legerement - meme
// esprit que les jauges de progression en degrade avec glow ailleurs dans
// l'appli, applique ici a la mini-visualisation de tendance.
function renderExerciseSparkline(totals) {
  if (!totals || totals.every((v) => v === 0)) return '';
  const max = Math.max(...totals, 1);
  const w = 60, h = 18, pad = 2;
  const coords = totals.map((v, i) => {
    const x = pad + (i * (w - pad * 2)) / (totals.length - 1);
    const y = h - pad - (v / max) * (h - pad * 2);
    return [x, y];
  });
  const points = coords.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const [lastX, lastY] = coords[coords.length - 1];
  const areaPoints = `${pad.toFixed(1)},${h - pad} ${points} ${(w - pad).toFixed(1)},${h - pad}`;
  return `<svg class="exercise-sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="sparklineStroke" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="var(--accent-dim)"/>
        <stop offset="100%" stop-color="var(--accent)"/>
      </linearGradient>
      <linearGradient id="sparklineFill" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <polygon class="exercise-sparkline-area" points="${areaPoints}"></polygon>
    <polyline points="${points}"></polyline>
    <circle class="exercise-sparkline-dot" cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="1.6"></circle>
  </svg>`;
}

// ==== Garde-fou anti-spam humoristique (retour utilisateur) ====
// But dissuasif/comique, PAS un vrai systeme anti-triche : un simple tableau en
// memoire (timestamp + montant des derniers taps sur les boutons +5/+10/...),
// purge a chaque appel - aucune persistance, aucune preuve envoyee nulle part.
// Uniquement sur les defis a repetitions (unit 'reps') : un chrono represente du
// temps REELLEMENT ecoule (stopTimer(), voir addSetInner()), impossible a
// "spammer" de la meme facon qu'une suite de taps sur un bouton.
let recentQuickAddTaps = []; // [{amount, at}]
const SPAM_GUARD_WINDOW_MS = 6000;
// Seuil calibre sur le scenario type retenu (retour utilisateur) : 3 taps
// consecutifs sur le plus gros bouton +30 en moins de 6s = 90 repetitions,
// physiologiquement peu credible pour de vrais taps un par un.
const SPAM_GUARD_THRESHOLD_REPS = 90;

// Retourne true si l'ajout doit se poursuivre normalement, false s'il doit etre
// annule (voir addSet(), appelee AVANT toute ecriture Firestore - "intercepte
// l'action avant la validation Firebase"). Reinitialise la fenetre a chaque
// declenchement pour ne jamais reproposer la popup en boucle sur le tap suivant.
async function maybeInterceptSpammyTaps(amount) {
  const c = getChallenge();
  if (!c || c.unit !== 'reps') return true;
  const now = Date.now();
  recentQuickAddTaps.push({ amount, at: now });
  recentQuickAddTaps = recentQuickAddTaps.filter((tap) => now - tap.at <= SPAM_GUARD_WINDOW_MS);
  const totalInWindow = recentQuickAddTaps.reduce((sum, tap) => sum + tap.amount, 0);
  if (totalInWindow < SPAM_GUARD_THRESHOLD_REPS) return true;
  const elapsedSec = Math.max(1, Math.round((now - recentQuickAddTaps[0].at) / 1000));
  recentQuickAddTaps = [];
  // Retour tactile (leger, distinct du simple tap ~8-10ms utilise ailleurs) : casse
  // physiquement l'impulsion de spam en plus du blocage visuel de la popup.
  if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
  const fingerSlipped = await confirmModal({
    kiloState: 'warning',
    title: t('popups.spamGuard.title'),
    // exercise echappe explicitement : un defi personnalise a un nom LIBRE tape par
    // l'utilisateur (contrairement aux defis de la bibliotheque, toujours traduits) -
    // jamais interpoler du texte libre tel quel dans un innerHTML (confirmModal()
    // n'echappe pas son subtitle, voir son implementation).
    subtitle: t('popups.spamGuard.subtitle', {
      amount: totalInWindow,
      exercise: escapeHtml(challengeDisplayName(c)),
      seconds: elapsedSec,
    }),
    confirmLabel: t('popups.spamGuard.confirmLabel'),
    cancelLabel: t('popups.spamGuard.cancelLabel'),
  });
  // "Oups, mon doigt a glisse" (bouton principal, mis en avant) -> annule CETTE
  // serie. "Je suis vraiment une machine" (bouton secondaire, discret) -> valide
  // quand meme - appli basee sur la confiance, le message suffit a marquer les
  // esprits.
  return !fingerSlipped;
}

async function addSet(amount) {
  if (amount <= 0) return;
  if (!(await maybeInterceptSpammyTaps(amount))) return;
  beginAppDataBatch(); // stats/lastCompleted/dailyActivity/badges/xpTotal/xpWeeklyData/streakData : un seul aller-retour Firestore pour tout ce qui suit, voir saveAppField()
  try {
    await addSetInner(amount);
  } finally {
    // debounce:true : voir scheduleWorkoutWriteFlush() — fusionne l'écriture Firestore
    // de plusieurs taps rapprochés (+5/+10 répétés) en une seule, sans jamais retarder
    // la mise à jour locale/le rendu ci-dessus, déjà faits de façon synchrone.
    await endAppDataBatch({ debounce: true });
  }
}

async function addSetInner(amount) {
  const entry = getEntry(currentChallengeId);
  entry.sets.push(amount);
  await registerBossBattleContributionIfNeeded(currentChallengeId, amount); // chaque serie compte, pas seulement la complétion du défi
  const exerciseSlugForGroups = getChallenge() ? getChallenge().slug : null;
  await registerGroupChallengeContributionsIfNeeded(exerciseSlugForGroups, amount);
  // Bug reel signale (retour utilisateur, "malus Boulet") : l ancienne mise a jour
  // "optimiste" (currentTotal + amount, sans jamais consulter le serveur) etait
  // mathematiquement FAUSSE des qu un handicap Boulet est en jeu -
  // computeGroupTotalProgress() (server ET client) plafonne le NET de CHAQUE
  // participant (totalAmount - handicap) a 0 avant de sommer, donc une victime
  // encore SOUS son handicap qui loggue des repetitions ne fait PAS avancer le total
  // du groupe au meme rythme que le nombre brut tape - additionner naivement le
  // montant brut desynchronisait l affichage de facon instable (parfois "corrige"
  // par une lecture perimee arrivant plus tard et ecrasant la valeur, donnant
  // l impression qu un clic sur deux "ne comptait pas"). Resynchronise desormais
  // TOUJOURS via une relecture Firestore fraiche et autoritative
  // (loadActiveExerciseGroupChallenges(), meme fonction/meme formule que la carte
  // hero de l ecran Groupes - jamais de calcul duplique), protegee contre les
  // reponses perimees par activeExerciseGroupChallengesSeq (voir cette fonction).
  if (exerciseSlugForGroups && myActiveGroupChallenges.some((m) => m.exerciseSlug === exerciseSlugForGroups)) {
    await loadActiveExerciseGroupChallenges(exerciseSlugForGroups);
  }
  // Idem pour la sparkline (7 derniers jours) : le dernier point (aujourd'hui)
  // doit refleter la serie qu'on vient de loguer sans attendre un rechargement.
  if (exerciseSparklineCache[currentChallengeId]) {
    const spark = exerciseSparklineCache[currentChallengeId].slice();
    spark[spark.length - 1] += amount;
    exerciseSparklineCache[currentChallengeId] = spark;
  }
  const total = getTotal();
  const target = getTarget();
  const willComplete = total >= target && !entry.done;

  // Kilo, coach temps reel (retour utilisateur) : flash motive + nouvelle
  // punchline a CHAQUE serie loguee, quel que soit son montant - independant de
  // willComplete (une serie qui n'acheve pas encore l'objectif merite quand
  // meme une reaction immediate). setTimeout() force un nouveau rendu quand la
  // fenetre de flash se termine, meme si l'utilisateur ne retape pas entre-temps
  // (sinon Kilo resterait affiche en 'success' indefiniment jusqu'au prochain tap).
  exerciseKiloFlashUntil = Date.now() + 1600;
  // Fin de defi & appel au Mode Hardcore (retour utilisateur) : au moment
  // PRECIS ou l'objectif normal du jour vient d'etre atteint (willComplete,
  // deja calcule au-dessus), la punchline felicite ET invite explicitement
  // au Mode Hardcore - remplace la punchline generique/par famille, qui ne
  // s'applique donc qu'aux taps qui n'achevent PAS encore l'objectif.
  if (willComplete) {
    exerciseKiloBubbleText = pickKiloLine('kilo.exercise.hardcoreInvite', { amount });
  } else {
    // Idee bonus #4 (retour utilisateur) : punchline differenciee par TYPE
    // d'exploit (pompes/gainage/squats) quand l'exercice appartient a une
    // famille connue (computeKiloExerciseFamily(), memes 3 familles que les
    // trophees cumulatifs) - repli sur le pool generique existant sinon.
    const kiloTapFamily = computeKiloExerciseFamily(currentChallengeId);
    exerciseKiloBubbleText = pickKiloLine(
      kiloTapFamily ? 'kilo.exercise.tapPunchlineFamily.' + kiloTapFamily : 'kilo.exercise.tapPunchline',
      { amount }
    );
  }
  // Retour utilisateur (UI) : au retour de la fenetre de flash, une fenetre
  // de transition DOUCE (450ms - 400ms d'animation + une marge) prend le
  // relais, pour que le passage success -> etat stable soit aussi agreable
  // que l'entree en success (voir .kilo-idle.kilo-unflash dans styles.css).
  setTimeout(() => {
    exerciseKiloUnflashUntil = Date.now() + 450;
    render();
  }, 1650);

  // Chantier gamification Phase 2 : une serie "enorme" loguee d'un coup (au
  // moins la moitie de l'objectif du jour en UNE fois) fait pencher l'humeur
  // de Kilo sur l'ACCUEIL vers 'hype' pendant quelques minutes (voir
  // computeKiloMood()) - independant du flash local de cette fiche d'exercice.
  if (target > 0 && amount >= target * 0.5) {
    kiloHomeHugeSetUntil = Date.now() + KILO_HUGE_SET_WINDOW_MS;
  }

  // Records & totaux à vie
  if (!stats[currentChallengeId]) {
    stats[currentChallengeId] = { lifetimeTotal: 0, bestDay: { total: 0, date: null }, recordStreak: 0 };
  }
  const s = stats[currentChallengeId];
  if (s.recordStreak === undefined) s.recordStreak = 0;
  s.lifetimeTotal += amount;
  let newRecord = false;
  if (total > s.bestDay.total) {
    s.bestDay = { total, date: todayKey };
    newRecord = true;
  }

  if (willComplete) {
    s.recordStreak = newRecord ? s.recordStreak + 1 : 0;
    justCompletedDailyObjective = true; // consomme par le prochain render() de la fiche d'exercice (mini confettis)
  }
  await saveStats();

  // Retour utilisateur : les trophees bases sur un CUMUL A VIE (ex: "100 pompes
  // cumulees", sumLifetime(...) dans BADGE_DEFS) doivent etre detectes et
  // annonces DES QUE lifetimeTotal franchit le seuil - pas seulement quand
  // l'objectif personnel du jour est atteint (willComplete plus bas). Avant ce
  // correctif, des repetitions loguees pour un defi de groupe SANS jamais
  // completer le "Defi du Jour" personnel ne declenchaient jamais checkNewBadges()
  // - le nombre etait deja correct (lifetimeTotal, mis a jour juste au-dessus,
  // inconditionnellement) mais le trophee restait "gele" jusqu'a la prochaine
  // completion, n'importe laquelle, parfois des jours plus tard. Verifie ICI,
  // juste apres la mise a jour de lifetimeTotal - independant de willComplete.
  // Pour un exercice chronometre, addSet()/addSetInner() n'est appele qu'UNE
  // FOIS a l'arret du chrono (stopTimer(), voir tickTimer() plus bas dans le
  // fichier) - jamais a chaque tick - donc cette verification ne peut jamais
  // interrompre un chrono en cours, seulement reagir a une serie reellement
  // loguee. checkNewBadges() ignore deja tout badge present dans
  // badges.unlocked : aucun risque de double-declenchement avec les 2 autres
  // appels plus bas (completion normale / Hardcore), qui restent responsables
  // des badges bases sur badges.totalCompletions/computeStreak() (mis a jour
  // plus tard, dans leurs blocs respectifs, donc pas encore vrais ici).
  const earlyFreshBadges = checkNewBadges();
  if (earlyFreshBadges.length > 0) {
    await saveBadges();
    const earlyTrophyXp = earlyFreshBadges.reduce((sum, b) => sum + (b.xp || 0), 0);
    const { levelBefore: earlyLevelBefore, levelAfter: earlyLevelAfter } = await awardXp(earlyTrophyXp);
    enqueueTrophyPopups(earlyFreshBadges);
    enqueueLevelPopups(earlyLevelBefore, earlyLevelAfter);
  }
  // Chantier gamification Phase 3 (cosmetiques) : verifie a chaque fois qu un
  // badge vient d etre debloque (ce bloc ET les 2 autres plus bas) - branche
  // directement sur badges.unlocked, jamais de seuil duplique. Idempotent,
  // cout negligeable meme quand rien de nouveau.
  const earlyFreshAccessories = checkNewAccessories();
  if (earlyFreshAccessories.length > 0) {
    await saveUnlockedAccessories();
    enqueueAccessoryPopups(earlyFreshAccessories);
  }

  if (willComplete) {
    entry.done = true;
    weekData[todayKey] = true;
    lastCompleted[currentChallengeId] = Date.now();
    await saveLastCompleted();
    await registerCommunityCompletionIfNeeded(currentChallengeId);
    await registerActivityFeedEntryIfNeeded(getChallenge(), total);

    const isFirstCompletionOfDay = !dailyActivity[todayKey];
    dailyActivity[todayKey] = (dailyActivity[todayKey] || 0) + 1;
    await saveDailyActivity();

    badges.totalCompletions += 1;
    const freshBadges = checkNewBadges();
    await saveBadges();

    const completedChallenge = getChallenge();
    const xpGained = xpForChallenge(completedChallenge, total);
    const trophyXp = freshBadges.reduce((sum, b) => sum + (b.xp || 0), 0);
    const { levelBefore, levelAfter } = await awardXp(xpGained + trophyXp);
    if (isFirstCompletionOfDay) await registerDailyStreak();

    if (navigator.vibrate) navigator.vibrate(VIBRATE_COMPLETION_PATTERN);
    fireConfetti();
    playSuccessSound();

    enqueuePopup({
      icon: newRecord ? '🏆' : '✅',
      kiloState: 'success', // mascotte Kilo (retour utilisateur "effet waouh") a la validation d'un defi
      title: newRecord ? t('popups.challengeComplete.newRecordTitle') : t('popups.challengeComplete.doneTitle'),
      subtitle: `${challengeDisplayName(completedChallenge)} — ${total} ${completedChallenge.unit === 'sec' ? t('exercise.unitSecLabelLower') : t('exercise.unitRepsLabel')}`,
      xp: xpGained,
    });
    enqueueTrophyPopups(freshBadges);
    enqueueLevelPopups(levelBefore, levelAfter);
    // Chantier gamification Phase 3 (cosmetiques) - voir le commentaire au 1er
    // appel de checkNewAccessories() plus haut.
    const freshAccessories = checkNewAccessories();
    if (freshAccessories.length > 0) {
      await saveUnlockedAccessories();
      enqueueAccessoryPopups(freshAccessories);
    }

    // Progression automatique : 3 records consécutifs -> proposer d'augmenter l'objectif par défaut
    if (s.recordStreak >= 3) {
      const c = getChallenge();
      const suggestedTarget = Math.ceil((total * 1.15) / 5) * 5;
      setTimeout(async () => {
        const accept = await confirmModal({
          icon: '🚀',
          title: t('popups.recordStreak.title'),
          subtitle: t('popups.recordStreak.subtitle', { name: escapeHtml(challengeDisplayName(c)), from: formatTargetLabel(c.target, c.unit), to: formatTargetLabel(suggestedTarget, c.unit) }),
          confirmLabel: t('popups.recordStreak.confirmLabel'),
          cancelLabel: t('popups.recordStreak.cancelLabel'),
        });
        if (accept) {
          if (c.isCustom) {
            const custom = customChallenges.find(x => x.id === c.id);
            if (custom) custom.target = suggestedTarget;
            rebuildChallenges();
            await saveCustomChallenges();
          } else {
            manualTargetOverrides[c.id] = suggestedTarget;
            await saveManualTargetOverrides();
          }
          showToast(t('popups.recordStreak.updatedToast', { target: formatTargetLabel(suggestedTarget, c.unit) }));
        }
        s.recordStreak = 0;
        await saveStats();
      }, 1400);
    }
  }

  // Mode Hardcore : détection indépendante de la complétion normale
  const cForHardcore = getChallenge();
  const hcTarget = getHardcoreTarget(cForHardcore);
  const willCompleteHardcore = total >= hcTarget && !entry.hardcoreDone;
  if (willCompleteHardcore) {
    entry.hardcoreDone = true;
    badges.totalHardcore += 1;
    const freshHardcoreBadges = checkNewBadges();
    await saveBadges();
    const hcTrophyXp = freshHardcoreBadges.reduce((sum, b) => sum + (b.xp || 0), 0);
    const { levelBefore: hcLevelBefore, levelAfter: hcLevelAfter } = await awardXp(HARDCORE_XP_BONUS + hcTrophyXp);

    if (navigator.vibrate) navigator.vibrate(VIBRATE_FESTIVE_PATTERN);
    fireConfetti('hardcore');
    playSuccessSound();

    enqueuePopup({
      epic: true,
      icon: '🔥',
      title: t('popups.challengeComplete.hardcoreTitle'),
      subtitle: `${challengeDisplayName(cForHardcore)} — ${Math.min(total, hcTarget)} / ${hcTarget} ${cForHardcore.unit === 'sec' ? t('exercise.unitSecLabelLower') : t('exercise.unitRepsLabel')}`,
      xp: HARDCORE_XP_BONUS,
    });
    enqueueTrophyPopups(freshHardcoreBadges);
    enqueueLevelPopups(hcLevelBefore, hcLevelAfter);
    // Chantier gamification Phase 3 (cosmetiques) - voir le commentaire au 1er
    // appel de checkNewAccessories() plus haut (ex: hardcore_50 -> ceinture).
    const freshHardcoreAccessories = checkNewAccessories();
    if (freshHardcoreAccessories.length > 0) {
      await saveUnlockedAccessories();
      enqueueAccessoryPopups(freshHardcoreAccessories);
    }
  }

  // Écriture day:{todayKey} confiée au flush groupé : saveStats() plus haut (toujours
  // appelée, même sans complétion) a déjà mis appDataBatchDepth/pendingAppDataFields
  // dans l'état qui fera que le endAppDataBatch({debounce:true}) de addSet() (voir
  // plus haut) programme le flush — celui-ci rejoue aussi saveState(), jamais perdu
  // (voir scheduleWorkoutWriteFlush()/flushWorkoutWrites()).
  render();
}

async function undoLast() {
  beginAppDataBatch();
  try {
    await undoLastInner();
  } finally {
    // debounce:true : même raisonnement que addSet() plus haut — fusionne l'écriture
    // Firestore de plusieurs "annuler" rapprochés en une seule.
    await endAppDataBatch({ debounce: true });
  }
}

async function undoLastInner() {
  const entry = getEntry(currentChallengeId);
  const popped = entry.sets.pop();
  const total = getTotal();

  if (popped && stats[currentChallengeId]) {
    const s = stats[currentChallengeId];
    s.lifetimeTotal = Math.max(0, s.lifetimeTotal - popped);
    if (s.bestDay.date === todayKey) s.bestDay.total = total;
    await saveStats();
  }

  if (total < getTarget()) {
    entry.done = false;
    weekData[todayKey] = Object.values(state.challenges).some(e => e.done);
  }
  // Écriture day:{todayKey} confiée au flush groupé (voir addSet(), même mécanisme).
  render();
}

async function editTarget() {
  const c = getChallenge();
  const entry = getEntry(currentChallengeId);
  const current = getTarget();
  const input = prompt(c.unit === 'sec' ? t('exercise.editTargetPromptSec') : t('exercise.editTargetPromptReps'), current);
  if (input === null) return;
  const val = parseInt(input, 10);
  if (isNaN(val) || val <= 0) return;
  entry.targetOverride = val;
  const total = getTotal();
  entry.done = total >= val;
  await saveState();
  render();
}

function customAddSubmit() {
  const input = document.getElementById('customAddInput');
  const val = parseInt(input.value, 10);
  if (!isNaN(val) && val > 0) {
    addSet(val);
    input.value = '';
  }
}

// Passe UX "effet waouh" (retour utilisateur) : sur les navigateurs qui la
// supportent, une navigation animee (animate=true) utilise desormais la View
// Transitions API native plutot que le simple fade CSS manuel - resout un
// probleme architectural jamais contourne jusqu'ici (render() remplace TOUJOURS
// TOUT le innerHTML de #app, voir les nombreuses notes ailleurs dans ce fichier/
// CLAUDE.md sur "aucune vraie transition entre 2 etats sur un meme noeud n'est
// possible") : la View Transitions API capture un instantane AVANT/APRES le
// changement de DOM et anime automatiquement entre les deux, MEME si les noeuds
// sont entierement recrees - exactement le cas ici. Bonus "gratuit" : tout
// element portant un `view-transition-name` CSS identique avant/apres (ex:
// l'indicateur d'onglet actif, le bouton "+" qui devient un formulaire) morphe
// automatiquement d'une position/forme a l'autre, sans code JS supplementaire -
// voir renderTabBar()/renderGroupsScreen().
// Repli total si non supportee (Safari < 18, tres large repli mobile - voir
// CLAUDE.md) ou si l'utilisateur a demande moins de mouvement : redescend sur
// EXACTEMENT le comportement precedent (fade CSS manuel 140ms), aucune
// regression possible.
function applyContent(app, html, animate, afterRender) {
  const canUseViewTransition = animate
    && typeof document.startViewTransition === 'function'
    && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (canUseViewTransition) {
    document.startViewTransition(() => {
      app.innerHTML = html;
      if (afterRender) afterRender();
    });
  } else if (animate) {
    app.classList.add('fade-out');
    setTimeout(() => {
      app.innerHTML = html;
      app.classList.remove('fade-out');
      if (afterRender) afterRender();
    }, 140);
  } else {
    app.innerHTML = html;
    if (afterRender) afterRender();
  }
}

// applyContent() remplace TOUT le innerHTML de #app à chaque appel - y compris à
// chaque frappe dans un champ texte dont le oninput appelle render() pour mettre à
// jour un draft en direct (recherche, formulaires...). Sans filet, le NAVIGATEUR
// détruit l'ancien <input> et en crée un nouveau (même valeur affichée) qui ne
// reçoit jamais le focus : l'utilisateur ne peut alors taper qu'un seul caractère
// à la fois avant de devoir recliquer dans le champ (bug de prod signalé sur les
// formulaires de groupe). Générique (par ID, pas par écran) plutôt que dupliqué
// par formulaire : capture l'input actuellement focus AVANT le re-rendu, le
// retrouve par son id APRÈS, et lui rend le focus + la position du curseur.
function applyContentPreservingFocus(app, html, animate) {
  const el = document.activeElement;
  const wasFocused = !!(el && el.id);
  const focusedId = wasFocused ? el.id : null;
  const caret = (wasFocused && typeof el.selectionStart === 'number') ? el.selectionStart : null;
  applyContent(app, html, animate, () => {
    if (!focusedId) return;
    const input = document.getElementById(focusedId);
    if (!input) return;
    input.focus();
    if (caret !== null && input.setSelectionRange) {
      try { input.setSelectionRange(caret, caret); } catch (e) { /* certains types (number, select) ne supportent pas setSelectionRange */ }
    }
  });
}

// Retour utilisateur "effet waouh" : anime un nombre affiche de sa valeur
// precedente vers sa valeur cible (defilement), au lieu de sauter instantanement -
// beaucoup plus satisfaisant a chaque serie loguee. `key` (distinct de `elId`, ex:
// 'exercise:42') identifie CE compteur precis d un point de vue metier (pas juste
// son id DOM, qui peut etre reutilise par un exercice DIFFERENT) : ne rejoue
// jamais si la valeur n a pas change depuis le dernier appel pour cette meme cle,
// evite une animation "pour rien" sur un simple re-rendu sans changement reel.
// Ecrit directement dans le DOM (hors du cycle de render()) via
// requestAnimationFrame : si un nouveau render() remplace le noeud entre-temps,
// l animation s arrete silencieusement au prochain frame (le noeud detache
// n est simplement plus visible, aucune erreur).
const countUpLastValues = {};
function animateCountUp(elId, key, targetValue) {
  const previous = countUpLastValues[key];
  countUpLastValues[key] = targetValue;
  const el = document.getElementById(elId);
  if (!el) return;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (previous === undefined || previous === targetValue || reduceMotion) {
    el.textContent = targetValue;
    return;
  }
  const start = Date.now();
  const from = previous;
  const duration = 500;
  // Ignore volontairement le timestamp fourni par requestAnimationFrame (base sur
  // performance.now(), une horloge DIFFERENTE de Date.now() - les melanger
  // produirait un delta absurde) : relit Date.now() a chaque frame a la place.
  function step() {
    if (document.getElementById(elId) !== el) return; // noeud remplace par un re-render entre-temps
    const progress = Math.min(1, (Date.now() - start) / duration);
    const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubique
    el.textContent = Math.round(from + (targetValue - from) * eased);
    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      // Passe "premium" (retour utilisateur) : petit "boing" d'echelle une fois le
      // defilement termine, en plus du defilement lui-meme - void offsetWidth force
      // un reflow pour permettre de rejouer l'animation meme si la classe etait deja
      // presente (meme technique que kiloTap()/qa-btn.flash ailleurs dans ce fichier).
      el.classList.remove('num-pop');
      void el.offsetWidth;
      el.classList.add('num-pop');
    }
  }
  requestAnimationFrame(step);
}

function render(animate) {
  const app = document.getElementById('app');

  if (showProfileOnboarding) {

  }

    applyContent(app, renderOnboardingTransitionScreen(), animate);

  }

  if (usernameSetupMode) {

    // en direct) - voir applyContentPreservingFocus().
    applyContentPreservingFocus(app, renderUsernameSetupScreen(), animate);
    return;
  }

  if (friendsScreenOpen) {
    // updateFriendSearchQuery() appelle render() à chaque frappe - voir
    // applyContentPreservingFocus().
    applyContentPreservingFocus(app, renderFriendsScreen(), animate);
    return;
  }

  if (activeTab === 'library') {
    // updateLibrarySearch() appelle render() à chaque frappe - voir
    // applyContentPreservingFocus().
    applyContentPreservingFocus(app, renderLibraryScreen() + renderTabBar() + renderGuidedTourOverlay(), animate);
    return;
  }

  if (activeTab === 'account') {
    applyContent(app, renderAccountTabScreen() + renderTabBar() + renderGuidedTourOverlay(), animate);
    return;
  }

  if (activeTab === 'community') {
    applyContent(app, renderCommunityScreen() + renderTabBar() + renderGuidedTourOverlay(), animate);
    return;
  }

  if (activeTab === 'groups') {
    // Plusieurs champs texte possibles selon l'écran (créer un groupe, rejoindre par
    // code, formulaire de défi collectif...) - voir applyContentPreservingFocus().

  }

  let html = '';

  if (!currentChallengeId) {

      activeIds: [...activeToday],

    // Bulle d'accueil : recalculee UNIQUEMENT quand l'humeur change (jamais a
    // chaque render(), qui recalcule l'humeur elle-meme en continu - sinon la
    // replique clignoterait/se re-randomiserait sur un simple re-rendu sans
    // rapport). kiloHomeTap() met a jour exceptionnellement ce texte hors
    // changement d'humeur (encouragement au tap), ce garde-fou le laisse alors
    // intact puisque le mood recalcule ici n'a pas change entre-temps.
    if (kiloHomeMood !== kiloHomeBubbleMood) {
      kiloHomeBubbleMood = kiloHomeMood;
      kiloHomeBubbleText = pickKiloLine('kilo.home.' + kiloHomeMood, {});
    }
    // Idees bonus #9/#10 (retour utilisateur) : reaction sociale ponctuelle
    // (kudos recu / gros coup d'un ami, voir kiloPendingSocialReaction plus
    // haut dans le fichier) consommee UNE SEULE FOIS par CE render() -
    // remplace l'affichage (texte + humeur) SANS jamais toucher
    // kiloHomeBubbleMood (le cache de l'humeur "normale" ci-dessus), pour
    // que le prochain changement de mood reel soit toujours detecte
    // correctement au render() suivant, meme principe que
    // justCompletedDailyObjective (consomme une fois, jamais rejoue).
    let kiloHomeMoodDisplay = kiloHomeMood;
    let kiloHomeBubbleTextDisplay = kiloHomeBubbleText;
    if (kiloPendingSocialReaction) {
      kiloHomeBubbleTextDisplay = pickKiloLine(kiloPendingSocialReaction.key, kiloPendingSocialReaction.params);

    // Bug reel corrige (retour utilisateur, clignotement au tap sur Kilo) :

          // Une fois l'objectif normal atteint, l'effort en cours concerne le Hardcore :

        ${c.unit === 'sec' ? (() => {

          const projected = total + elapsedNow;

          return `

                ${renderDoubleTimerRingSVG(normalPct, hardcorePct, 220)}
                <div class="timer-ring-center">
                  <div class="timer-display${timerRunning ? ' running' : ''}" id="timerDisplay">${formatTimer(elapsedNow)}</div>
                  ${entry.hardcoreDone

        })() : `
          <div class="add-label">${t('exercise.addSetLabel')}</div>
          <div class="quick-add-grid">

        <div class="custom-add-row">
          <input type="number" id="customAddInput" placeholder="${t('exercise.customPlaceholder')}" inputmode="numeric">

        ${entry.sets.length > 0 ? `

      </div>

  }

  // week strip — semaine calendaire Lundi -> Dimanche, numéro du jour dans le cercle
  // (remplacé par ✓ une fois le jour validé). Nettoyage UI (retour utilisateur) :
  // retiré de la fiche d'exercice (currentChallengeId truthy, ci-dessus) — reste

/** Charge les 28 derniers jours d'historique (documents `day:{key}`), en parallèle. */
// Cache mémoire des jours PASSÉS (immuables une fois le jour terminé — jamais
// "aujourd'hui", qui peut encore changer et n'est donc jamais mis en cache ici) :
// sans ça, rouvrir l'onglet Journal plusieurs fois dans la même session relit les 28
// mêmes documents à chaque fois, alors que 27 d'entre eux n'ont pas pu changer depuis
// la dernière lecture. hasOwnProperty (pas juste un test de vérité) : un jour sans
// aucune activité est mis en cache comme `null`, qu'il ne faut jamais reconfondre avec
// "pas encore lu".
let historyDayCache = {};

async function loadHistoryEntries() {
  const DAYS_BACK = 28;
  const dayInfos = [];
  for (let i = 0; i < DAYS_BACK; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    dayInfos.push({ d, k: dateKey(d) });
  }
  // Lectures Firestore toujours en parallèle (règle du projet) : ce sont 28 documents
  // indépendants, aucune dépendance entre eux ne justifie de les lire en séquentiel
  // (jusqu'à 28 aller-retours réseau l'un après l'autre à chaque ouverture du Journal).
  const results = await Promise.all(dayInfos.map(({ k }) => {
    if (k !== todayKey && Object.prototype.hasOwnProperty.call(historyDayCache, k)) {
      return historyDayCache[k];
    }
    return dbGet('day:' + k).then(res => JSON.parse(res.value)).catch(() => null).then((val) => {
      if (k !== todayKey) historyDayCache[k] = val;
      return val;
    });
  }));
  const entries = [];
  results.forEach((s, idx) => {
    if (!s || !s.challenges) return;
    const { d, k } = dayInfos[idx];
    for (const [cid, entry] of Object.entries(s.challenges)) {
      if (entry.sets && entry.sets.length === 0) continue;
      const c = CHALLENGES.find(x => x.id === Number(cid));
      entries.push({
        key: k,
        date: d,
        challengeName: c ? challengeDisplayName(c) : t('history.deletedChallenge'),
        cat: c ? c.cat : '',
        total: entry.sets ? entry.sets.reduce((a,b)=>a+b,0) : 0,
        target: entry.targetOverride || (c ? c.target : 0),
        unit: c ? c.unit : 'reps',
        done: !!entry.done,
      });
    }
  });
  historyEntries = entries;
}

// Hero Banner communautaire : remplace l'ancien état vide générique quand aucun défi
// n'est encore sélectionné aujourd'hui (accompagnement "sans effort de choix" + FOMO).
// Repli sur renderTodayEmptyState() si les défis communautaires ne se résolvent pas
// (bibliothèque vide) — ne doit jamais laisser un écran cassé.
function renderCommunityHeroBanner() {
  const { challenge1, challenge2 } = getDailyCommunityChallenges();
  if (!challenge1 || !challenge2) return renderTodayEmptyState();
  // Même format de carte que l'onglet Défis (.picker-item : nom à gauche, reps/poids
  // à droite) plutôt qu'une mise en page dédiée — cohérence visuelle demandée entre les
  // 2 écrans pour le même genre d'information. `no-anim` : ces cartes se re-rendent à
  // chaque mise à jour temps réel de communityDailyCounts (onSnapshot), l'entrée en
  // cascade de .picker-item rejouerait donc en boucle sans cette classe.
  const cards = [challenge1, challenge2].map((c) => {
    const resolved = resolveChallenge(c);
    const targetLabel = resolved.unit === 'sec' ? formatSecToReadable(resolved.target) : resolved.target + ' ' + t('exercise.unitRepsLabel');
    const weightKg = weights[c.id] ?? computeStandardWeight(c, userProfile) ?? 8;
    const weightBelow = c.cat === 'Haltères' ? `<div class="goal-weight">🏋️ ${weightKg}kg</div>` : '';
    return `
      <div class="picker-item no-anim">
        ${renderExercisePicto(c)}
        <div class="picker-item-body">
          <span class="name">${escapeHtml(challengeDisplayName(c))}</span>
        </div>
        <div class="goal">
          ${targetLabel}
          ${weightBelow}
        </div>
      </div>
    `;
  }).join('');
  // Un seul compteur de participation en haut de la carte (pas répété sous chaque
  // exercice avec des chiffres différents) : "participants" compte les membres qui ont
  // cliqué sur "Relever le défi", indépendamment du fait qu'ils aient ensuite terminé
  // les 2 exercices — voir registerCommunityParticipantIfNeeded().
  const participants = communityDailyCounts.participants;
  return `
    <div class="community-hero-banner">
      <div class="community-hero-header">
        <span class="community-hero-badge">${t('today.hero.badge')}</span>
        <span class="community-hero-timer">${t('today.hero.timer', { n: hoursRemainingToday() })}</span>
      </div>
      <div class="community-hero-proof">${tn('today.hero.proof', participants)}</div>
      <div class="community-hero-list">${cards}</div>
      <button class="community-hero-accept-all-btn" onclick="acceptAllCommunityChallenges()">${t('today.hero.acceptAllBtn')}</button>
      <button class="community-hero-choose-btn" onclick="switchTab('library')">${t('today.hero.chooseBtn')}</button>
    </div>
  `;
}

// Toujours le module "Prochains trophées à portée de main" (2-3 trophées VERROUILLÉS
// les plus proches d'être débloqués), qu'il y ait 0 ou N trophées déjà débloqués :
// la version précédente ne remplaçait que la branche "0 débloqué", donc dès le premier
// trophée obtenu l'ancienne bande des trophées déjà réussis réapparaissait sans jamais
// montrer le teaser. Les trophées déjà débloqués restent consultables dans l'onglet Profil.
function renderBadgesStrip() {
  const locked = BADGE_DEFS.filter(b => !badges.unlocked.includes(b.id));
  if (locked.length === 0) {
    return `
      <div class="section-label">${t('today.trophies.allUnlockedLabel')}</div>
      <div class="badges-empty">${t('today.trophies.allUnlockedText')}</div>
    `;
  }
  const closest = locked
    .map(b => {
      const p = b.progress();
      const pct = p.target > 0 ? Math.min(100, (p.current / p.target) * 100) : 0;
      return { b, pct };
    })
    .sort((a, z) => z.pct - a.pct)
    .slice(0, 3);
  return `
    <div class="section-label">${t('today.trophies.nextLabel')}</div>
    <div class="next-trophies-grid">
      ${closest.map(({ b, pct }) => `
        <div class="next-trophy-card" onclick="showTrophyDetailModal('${b.id}')">
          <div class="next-trophy-icon">${b.icon}</div>
          <div class="next-trophy-body">
            <div class="next-trophy-name">${badgeLabel(b)}</div>
            <div class="next-trophy-track"><div class="next-trophy-fill" style="width:${Math.round(pct)}%"></div></div>
          </div>
          <div class="next-trophy-pct">${Math.round(pct)}%</div>
        </div>
      `).join('')}
    </div>
  `;
}

// Carte d'exercice partagée entre l'accueil ("today", clic = ouvrir la fiche) et
// l'onglet Défis ("library", clic = activer/désactiver pour aujourd'hui). Même
// structure/CSS (.picker-item) des deux côtés ; seules différences : la colonne de
// droite (statut du jour vs pastille "Actif"), le poids affiché pour les défis
// haltères en mode bibliothèque, et les actions éditer/supprimer réservées aux
// défis personnalisés.
function renderChallengeCard(c, mode, index, animate = true) {
  const resolved = resolveChallenge(c);
  const isActive = activeToday.has(c.id);
  const weightKg = weights[c.id] ?? computeStandardWeight(c, userProfile) ?? 8;
  // Poids affiché sous les reps, sur sa propre ligne, identique sur Défis et Aujourd'hui
  // (jamais "à côté" des reps).
  const weightBelow = c.cat === 'Haltères' ? `<div class="goal-weight">🏋️ ${weightKg}kg</div>` : '';

  // Objectif AFFICHÉ (utilisé aussi bien pour le libellé "goal" que pour le calcul de
  // progression ci-dessous) : priorité à l'objectif du jour (`entry.targetOverride`,
  // modifiable via le crayon ✏️ sur la fiche détail via editTarget()) sur l'objectif
  // standard résolu (`resolved.target`). Avant ce correctif, seule la ligne "En cours"
  // ci-dessous en tenait compte : le libellé "goal", lui, affichait TOUJOURS
  // `resolved.target`, ce qui désynchronisait visiblement la carte d'accueil (objectif
  // standard) de la fiche détail (objectif du jour réellement utilisé par getTarget()).
  const todayEntry = mode !== 'library' ? state.challenges[c.id] : null;
  const displayTarget = (todayEntry && todayEntry.targetOverride) || resolved.target;

  let rightHtml;
  if (mode === 'library') {
    rightHtml = '';
  } else {
    const rel = formatRelative(lastCompleted[c.id]);
    rightHtml = '';
    if (todayEntry && todayEntry.hardcoreDone) {
      rightHtml = `<div class="last-done status-hardcore">${t('card.hardcoreDone')}</div>`;
    } else if (todayEntry && todayEntry.done) {
      rightHtml = `<div class="last-done status-done">${t('card.doneToday')}</div>`;
    } else if (todayEntry && todayEntry.sets.length > 0) {
      const sumSoFar = todayEntry.sets.reduce((a,b)=>a+b,0);
      rightHtml = `<div class="last-done status-progress">${t('card.inProgress', { current: sumSoFar, target: displayTarget })}</div>`;
    } else if (rel) {
      rightHtml = `<div class="last-done">${rel}</div>`;
    }
  }

  const onclick = mode === 'library' ? `toggleActiveToday(${c.id})` : `pickChallenge(${c.id})`;
  // Contrôle d'activation explicite (bouton visible), en plus du clic sur la ligne :
  // l'état actif/inactif doit être identifiable sans avoir à deviner que la ligne est cliquable.
  const activateBtn = mode === 'library'
    ? `<button class="activate-toggle-btn${isActive ? ' active' : ''}" onclick="event.stopPropagation(); toggleActiveToday(${c.id})">${isActive ? t('card.active') : t('card.activate')}</button>`
    : '';

  // Entrée en cascade (léger décalage par carte), plafonné pour ne jamais laisser une
  // longue liste avec un délai interminable sur les dernières cartes ; absent si
  // index n'est pas fourni (repli sans délai, jamais d'animation cassée). `animate`
  // (par défaut true, comme avant) permet à renderLibraryScreen() de désactiver
  // l'animation quand un accordéon déjà ouvert se contente de re-render suite à un
  // toggle d'activation — seule une NOUVELLE ouverture de menu déroulant doit animer.
  const delayStyle = index !== undefined ? ` style="animation-delay:${Math.min(index, 8) * 40}ms"` : '';
  const noAnimClass = animate ? '' : ' no-anim';

  // Ruban + compteur "défi communautaire du jour" : garde le FOMO vivant même une
  // fois le défi accepté (sinon toute trace communautaire disparaîtrait dès
  // l'activation), ET reste visible dans la bibliothèque (mode "library") pour
  // qu'un utilisateur parti "choisir son propre défi" puisse quand même repérer
  // le(s) défi(s) du jour communautaires pendant qu'il parcourt le catalogue.
  const communitySlot = getCommunityDailySlot(c.id);
  const communityCount = communitySlot === 1 ? communityDailyCounts.completions1 : communitySlot === 2 ? communityDailyCounts.completions2 : 0;
  const communityRibbon = communitySlot
    ? `<span class="community-card-ribbon" title="${t('card.communityRibbonTitle', { n: communityCount })}">🌍 ${communityCount}</span>`
    : '';

  return `
    <div class="picker-item${noAnimClass}"${delayStyle} onclick="${onclick}">
      ${renderExercisePicto(c)}
      <div class="picker-item-body">
        <span class="name">${escapeHtml(challengeDisplayName(c))}</span>
        ${communityRibbon}
      </div>
      <div class="goal">
        ${resolved.unit === 'sec' ? formatSecToReadable(displayTarget) : displayTarget + ' ' + t('exercise.unitRepsLabel')}
        ${weightBelow}
        ${rightHtml}
      </div>
      ${activateBtn}
      ${mode === 'library' && c.isCustom ? `
        <div class="manage-actions">
          <button class="icon-btn" onclick="event.stopPropagation(); openEditChallengeForm(${c.id})">✏️</button>
          <button class="icon-btn danger" onclick="event.stopPropagation(); deleteChallenge(${c.id})">🗑️</button>
        </div>
      ` : ''}
    </div>
  `;
}

function renderLibraryScreen() {
  if (editingChallengeId !== null) {
    return renderChallengeForm();
  }
  let html = `
    <div class="library-header-row">
      <div>
        <h1 class="title">${t('library.title')}</h1>
        <div class="subtitle">${t('library.subtitle')}</div>
      </div>
      <button class="add-custom-fab" onclick="openNewChallengeForm()" title="${t('library.addCustomAria')}" aria-label="${t('library.addCustomAria')}">+</button>
    </div>
    <input class="library-search-input" id="librarySearchInput" type="text"
           placeholder="${t('library.searchPlaceholder')}" aria-label="${t('library.searchAria')}" value="${escapeHtml(librarySearchQuery)}"
           oninput="updateLibrarySearch(this.value)">
  `;
  // Recherche active : les catégories restent affichées mais 1) filtrées à leurs seuls
  // défis correspondants, 2) forcées ouvertes (peu importe libraryOpenCats), 3) masquées
  // entièrement si aucun défi ne correspond — réutilise l'accordéon existant tel quel,
  // pas de vue à plat séparée.
  const query = librarySearchQuery.trim().toLowerCase();
  const cats = [...new Set(CHALLENGES.map(c => c.cat))];
  let anyMatch = false;
  // Consomme le flag ici : seul CE rendu anime la catégorie qui vient d'être dépliée,
  // les rendus suivants (ex: toggle d'activation dans un accordéon déjà ouvert) non.
  const catToAnimate = libraryAnimatingCat;
  libraryAnimatingCat = null;
  for (const cat of cats) {
    let itemsInCat = CHALLENGES.filter(c => c.cat === cat);
    if (query) itemsInCat = itemsInCat.filter(c => challengeDisplayName(c).toLowerCase().includes(query));
    if (query && itemsInCat.length === 0) continue;
    anyMatch = true;
    const activeCount = itemsInCat.filter(c => activeToday.has(c.id)).length;
    const isOpen = query ? true : libraryOpenCats.has(cat);
    // N'anime que la catégorie tout juste dépliée (jamais pendant une recherche, qui
    // ne doit pas non plus clignoter à chaque frappe).
    const shouldAnimate = !query && cat === catToAnimate;
    html += `
      <div class="accordion${isOpen ? ' open' : ''}">
        <button class="accordion-header" onclick="toggleLibraryCategory('${escapeJsAttr(cat)}')">
          <span class="accordion-chevron">›</span>
          <span class="accordion-title">${escapeHtml(translateCategoryName(cat))}</span>
          <span class="accordion-count${activeCount > 0 ? ' has-active' : ''}">${tn('library.activeCount', activeCount)}</span>
        </button>
        ${isOpen ? `<div class="accordion-body">${itemsInCat.map((c, i) => renderChallengeCard(c, 'library', i, shouldAnimate)).join('')}</div>` : ''}
      </div>
    `;
  }
  if (query && !anyMatch) {
    html += `<div class="library-search-empty">${t('library.searchEmpty', { query: escapeHtml(librarySearchQuery.trim()) })}</div>`;
  }
  return html;
}

function renderHeatmap() {
  const WEEKS = 26; // ~6 mois, plus lisible sur mobile qu'une année complète
  // Semaine calendaire (Lundi -> Dimanche) contenant aujourd'hui, puis on remonte de
  // 25 semaines pleines supplémentaires : garantit TOUJOURS exactement 26 colonnes de 7
  // jours (contrairement à l'ancien "aligner sur Lundi en remontant depuis aujourd'hui",
  // qui pouvait ajouter jusqu'à 6 jours de trop et décaler aujourd'hui hors de la 26e
  // colonne — la ligne d'en-tête des mois, elle-même limitée à 26 colonnes, ratait alors
  // silencieusement le mois en cours).
  const currentWeekMonday = getCalendarWeekDates(new Date())[0];
  const start = new Date(currentWeekMonday);
  start.setDate(start.getDate() - (WEEKS - 1) * 7);
  const days = [];
  for (let i = 0; i < WEEKS * 7; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    days.push(d);
  }

  // 3 niveaux seulement (au lieu de 4) : plus lisible/contraste qu'une gradation fine
  // difficile a distinguer d'un coup d'oeil sur une heatmap mobile.
  function levelFor(count) {
    if (!count) return 0;
    if (count === 1) return 1;
    return 2;
  }

  let cells = '';
  for (const d of days) {
    const k = dateKey(d);
    const count = dailyActivity[k] || 0;
    const lvl = levelFor(count);
    const isFuture = d > new Date();
    cells += `<div class="heat-cell lvl${lvl}${isFuture ? ' future' : ''}" title="${k} — ${count} défi(s)"></div>`;
  }

  // En-tête des mois : un libellé abrégé sur la colonne qui contient le 1er jour d'un
  // mois (comme le graphique de contributions GitHub), sur la même grille à 26 colonnes
  // que heatmap-grid (1 colonne = 1 semaine). Règle stricte : un mois n'est libellé que
  // s'il est ENTIÈREMENT visible, c'est-à-dire que son 1er jour fait partie de la
  // fenêtre — un mois entamé avant le début de la heatmap (coupé à gauche) n'a donc,
  // par construction, jamais son propre jour 1 dans `days` et ne reçoit jamais de
  // libellé. Détecter le jour 1 dans chaque colonne (plutôt que le mois du seul Lundi
  // de la colonne) est nécessaire pour ne pas rater le mois en cours quand celui-ci
  // démarre au milieu d'une semaine (ex: 1er tombant un samedi).
  const MONTH_ABBR = t('dates.monthsAbbrCap');
  let monthsHtml = '';
  for (let col = 0; col < WEEKS; col++) {
    const colDays = days.slice(col * 7, col * 7 + 7);
    const firstOfMonthDay = colDays.find(d => d.getDate() === 1);
    monthsHtml += `<div class="heat-month-label">${firstOfMonthDay ? MONTH_ABBR[firstOfMonthDay.getMonth()] : ''}</div>`;
  }

  return `
    <div class="section-label">${t('history.heatmapLabel')}</div>
    <div class="heatmap-months">${monthsHtml}</div>
    <div class="heatmap-grid">${cells}</div>
    <div class="heat-legend">
      <span class="heat-legend-item"><span class="heat-cell lvl0"></span>${t('history.heatmapLegendNone')}</span>
      <span class="heat-legend-item"><span class="heat-cell lvl1"></span>${t('history.heatmapLegendOne')}</span>
      <span class="heat-legend-item"><span class="heat-cell lvl2"></span>${t('history.heatmapLegendMany')}</span>
    </div>
  `;
}

// Contenu du sous-onglet "Journal" de Profil (voir renderAccountTabScreen()) - le
// h1/sous-titre "Journal" sont geres par l'ecran englobant, pas ici.
function renderJournalSection() {
  const today = new Date();
  // Calendrier du MOIS EN COURS (du 1er au dernier jour), pas une fenêtre glissante de
  // 28 jours (qui faisait disparaître les 1ers jours du mois sur un mois de 30/31 jours).
  // Le statut "fait" vient de dailyActivity (déjà chargé au complet, pas limité aux 28
  // derniers jours comme historyEntries), même source que la heatmap ci-dessous.
  const year = today.getFullYear();
  const month = today.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const days = [];
  for (let day = 1; day <= daysInMonth; day++) {
    days.push(new Date(year, month, day));
  }
  const firstDow = (days[0].getDay() + 6) % 7; // Monday=0
  let calHtml = `<div class="cal-grid">`;
  t('dates.dowShortMonFirst').forEach(l => calHtml += `<div class="cal-dow">${l}</div>`);
  for (let i = 0; i < firstDow; i++) calHtml += `<div class="cal-cell empty"></div>`;
  for (const d of days) {
    const k = dateKey(d);
    const isToday = k === todayKey;
    const done = (dailyActivity[k] || 0) > 0;
    calHtml += `<div class="cal-cell${done ? ' done' : ''}${isToday ? ' today' : ''}" onclick="showDayDetailModal('${k}')">${done ? '✓' : d.getDate()}</div>`;
  }
  calHtml += `</div>`;

  let listHtml = `<div class="history-list-label">${t('history.listLabel')}</div>`;
  const withChallenge = historyEntries.filter(e => e.challengeName);
  if (historyLoading) {
    listHtml += `<div class="history-empty">${t('history.loading')}</div>`;
  } else if (withChallenge.length === 0) {
    listHtml += `<div class="history-empty">${t('history.empty')}</div>`;
  } else {
    for (const e of withChallenge) {
      const label = e.key === todayKey ? t('history.today') : formatDateLabel(e.date);
      listHtml += `
        <div class="history-entry">
          <div>
            <div class="hdate">${label}</div>
            <div class="hname">${e.challengeName}</div>
          </div>
          <div class="hprogress${e.done ? ' done' : ''}">${e.total}/${e.target} ${e.unit === 'sec' ? t('exercise.unitSecLabelLower') : ''}${e.done ? ' ✓' : ''}</div>
        </div>
      `;
    }
  }

  return `
    <button class="share-stats-btn" onclick="shareStatsImage()">
      <svg class="share-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      ${t('history.shareBtn')}
    </button>
    <div class="section-label">${t('history.calendarLabel')}</div>
    ${calHtml}
    ${renderHeatmap()}
    ${listHtml}
  `;
}

// Bloc niveau/titre/barre XP, factorisé pour être réutilisable avec l'XP de N'IMPORTE
// QUEL utilisateur (renderAthleteCard() pour soi-même, renderFriendProfileSheet() pour
// un ami) — pure fonction d'un total d'XP, aucune dépendance à l'utilisateur courant.
// `clickable` (par défaut true, pour ne rien changer aux appels existants avant ce
// correctif) contrôle SEULEMENT le texte d'indice "appuie pour voir ta progression" -
// trompeur sur la fiche d'un ami (bug réel signalé), qui n'ouvre jamais le Parcours
// de niveau (ce serait le TIEN, pas le sien) contrairement à ta propre carte.
function renderAthleteLevelBlock(xpTotalValue, clickable = true) {
  const { level, xpIntoLevel, xpNeeded } = xpProgress(xpTotalValue);
  const title = athleteTitle(level);
  const pct = xpNeeded > 0 ? Math.min(100, Math.round((xpIntoLevel / xpNeeded) * 100)) : 100;
  const xpLabel = clickable
    ? t('profileTab.xpProgress', { current: xpIntoLevel, needed: xpNeeded })
    : t('profileTab.xpProgressPlain', { current: xpIntoLevel, needed: xpNeeded });
  const titleClass = isLegendaryLevel(level) ? ' holo' : '';
  return `
    <div class="athlete-level-row">
      <div class="athlete-level">${t('profileTab.levelLabel', { n: level })}</div>
    </div>
    <div class="athlete-title${titleClass}">${title}</div>
    <div class="athlete-xp-track"><div class="athlete-xp-fill" style="width:${pct}%"></div></div>
    <div class="athlete-xp-label">${xpLabel}</div>
  `;
}

function renderLevelRoadmapSheet() {
  const { level, xpIntoLevel, xpNeeded } = xpProgress(xpTotal);
  const pct = xpNeeded > 0 ? Math.min(100, Math.round((xpIntoLevel / xpNeeded) * 100)) : 100;
  let prevMax = 0;
  // Parametre renomme `tier` (pas `t`) : `t` masquerait la fonction globale de
  // traduction dans cette portee, meme piege deja rencontre dans renderChallengeCard()
  // (voir CLAUDE.md, batch 3 du chantier i18n).
  const rows = ATHLETE_TITLE_TIERS.map(tier => {
    const minLevel = prevMax + 1;
    const rangeLabel = tier.maxLevel === Infinity ? t('profileTab.roadmap.rangeMax', { min: minLevel }) : t('profileTab.roadmap.rangeBetween', { min: minLevel, max: tier.maxLevel });
    const unlocked = level >= minLevel;
    const current = level >= minLevel && level <= tier.maxLevel;
    prevMax = tier.maxLevel;
    return `
      <div class="roadmap-row${unlocked ? ' unlocked' : ''}${current ? ' current' : ''}">
        <div class="roadmap-row-icon">${current ? '▶' : unlocked ? '✓' : lockIconSVG(14)}</div>
        <div class="roadmap-row-text">
          <div class="roadmap-row-title">${t('athleteTitles.' + tier.id)} ${tier.icon}</div>
          <div class="roadmap-row-range">${rangeLabel}</div>
        </div>
      </div>
    `;
  }).join('');
  return `
    <div class="level-roadmap-sheet">
      <div class="sheet-drag-handle"></div>
      <button class="level-roadmap-close" onclick="closeLevelRoadmap()">✕</button>
      <div class="level-roadmap-header">
        <div class="level-roadmap-level">${t('profileTab.levelLabel', { n: level })}</div>
        <div class="level-roadmap-title">${athleteTitle(level)}</div>
        <div class="athlete-xp-track"><div class="athlete-xp-fill" style="width:${pct}%"></div></div>
        <div class="level-roadmap-xp-label">${t('profileTab.roadmap.xpToNext', { current: xpIntoLevel, needed: xpNeeded, n: level + 1 })}</div>
      </div>
      <div class="section-label">${t('profileTab.roadmap.titlesLabel')}</div>
      <div class="roadmap-list">${rows}</div>
    </div>
  `;
}

// Retour utilisateur "effet waouh" : les panneaux (parcours de niveau, fiche
// d'ami, info groupe) deviennent de VRAIES feuilles a glisser (bottom sheets) -
// suivent le doigt en temps reel pendant le glissement, reviennent a leur place
// si relachees trop tot, se ferment si tirees assez loin. Fonction PARTAGEE
// (pas dupliquee par panneau) : les 3 ecrans qui utilisent ce meme patron DOM
// (.level-roadmap-overlay/.level-roadmap-sheet, cree hors du cycle render()
// principal - voir plus haut) en beneficient identiquement. Le tap sur le FOND
// (backdrop, pas la feuille elle-meme) ferme aussi le panneau, comme tout
// bottom sheet natif.
function attachSheetBehavior(overlayEl, closeFn) {
  overlayEl.onclick = (e) => { if (e.target === overlayEl) closeFn(); };
  const sheet = overlayEl.querySelector('.level-roadmap-sheet');
  if (!sheet) return;
  let startY = null;
  sheet.addEventListener('touchstart', (e) => {
    // Le glisser-pour-fermer ne s'engage que depuis le HAUT de la feuille (deja
    // scrollee tout en haut) - sinon un glissement doit continuer a faire
    // defiler normalement une liste longue (activite recente d'un ami, etc.).
    startY = sheet.scrollTop <= 0 ? e.touches[0].clientY : null;
  }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (startY === null) return;
    const delta = e.touches[0].clientY - startY;
    if (delta > 0) {
      sheet.style.transition = 'none';
      sheet.style.transform = `translateY(${delta}px)`;
    }
  }, { passive: true });
  sheet.addEventListener('touchend', (e) => {
    if (startY === null) return;
    const delta = e.changedTouches[0].clientY - startY;
    sheet.style.transition = 'transform 0.25s cubic-bezier(0.22, 1, 0.36, 1)';
    if (delta > 120) {
      sheet.style.transform = 'translateY(100%)';
      setTimeout(closeFn, 200);
    } else {
      sheet.style.transform = '';
    }
    startY = null;
  }, { passive: true });
}

// ==== FICHE PROFIL D'UN AMI (clic sur une ligne dans l'onglet Amis) ====
// Même pattern que le Level Roadmap ci-dessus : overlay DOM autonome, hors du cycle
// render() principal, son propre bouton ✕. Contrairement au Level Roadmap (données
// déjà en mémoire), les données d'un ami sont chargées de façon async APRÈS l'ouverture :
// on affiche d'abord un état "chargement", puis on repeint le même noeud DOM une fois
// les données arrivées (garde sur friendProfileOpenUid pour ignorer une réponse tardive
// si la fiche a été fermée ou changée entre-temps).
let friendProfileOpenUid = null;

function renderFriendProfileSheet({ displayName, photoURL, loading, profile, activities, activitiesFailed }) {
  const avatar = photoURL
    ? `<img src="${escapeHtml(photoURL)}" class="leaderboard-avatar" referrerpolicy="no-referrer">`
    : `<div class="leaderboard-avatar-fallback">${escapeHtml(displayName.charAt(0).toUpperCase())}</div>`;
  let bodyHtml;
  if (loading) {
    // Retour utilisateur "effet waouh" : ecran squelette (shimmer) pendant le
    // chargement async du profil, a la place d un simple texte "Chargement..." -
    // reutilise TEL QUEL le meme keyframe que le shimmer des images
    // (picto-shimmer), deja respectueux de prefers-reduced-motion.
    bodyHtml = `
      <div class="skeleton-block skeleton-text" style="width:70%"></div>
      <div class="skeleton-block skeleton-text" style="width:45%"></div>
      <div class="skeleton-block skeleton-bar"></div>
      <div class="skeleton-block skeleton-row"></div>
      <div class="skeleton-block skeleton-row"></div>
      <div class="skeleton-block skeleton-row"></div>
    `;
  } else if (!profile) {
    bodyHtml = `<div class="history-empty">${t('friends.profileUnavailable')}</div>`;
  } else {
    const activitiesHtml = activitiesFailed
      ? `<div class="history-empty">${t('friends.noRecentActivity')}</div>`
      : (activities.length > 0
        ? `<div class="activity-feed-list">${activities.map(entry => renderActivityFeedRow(entry)).join('')}</div>`
        : `<div class="history-empty">${t('friends.noRecentActivity')}</div>`);
    bodyHtml = `
      <div class="athlete-card">${renderAthleteLevelBlock(profile.xpTotal, false)}</div>
      <div class="friend-profile-streak">${t('community.streakValue', { n: profile.streakCount })}</div>
      <div class="section-label">${t('friends.recentActivityLabel')}</div>
      ${activitiesHtml}
    `;
  }
  return `
    <div class="level-roadmap-sheet">
      <div class="sheet-drag-handle"></div>
      <button class="level-roadmap-close" onclick="closeFriendProfile()">✕</button>
      <div class="level-roadmap-header friend-profile-header">
        ${avatar}
        <div class="level-roadmap-title">${escapeHtml(displayName)}</div>
      </div>
      ${bodyHtml}
    </div>
  `;
}

async function openFriendProfile(uid, displayName, photoURL) {
  closeFriendProfile();
  friendProfileOpenUid = uid;
  const el = document.createElement('div');
  el.id = 'friendProfileOverlay';
  el.className = 'level-roadmap-overlay';
  el.innerHTML = renderFriendProfileSheet({ displayName, photoURL, loading: true });
  document.body.appendChild(el);
  attachSheetBehavior(el, closeFriendProfile);

  let profile = null, activities = [], activitiesFailed = false;
  try {
    profile = await fetchPublicProfile(uid);
  } catch (e) {
    console.error('friend profile fetch failed', e);
  }
  if (profile) {
    try {
      activities = await fetchFriendRecentActivities(uid);
    } catch (e) {
      activitiesFailed = true;
      console.error('friend activities fetch failed', e);
    }
  }
  if (friendProfileOpenUid !== uid) return;
  el.innerHTML = renderFriendProfileSheet({ displayName, photoURL, loading: false, profile, activities, activitiesFailed });
  attachSheetBehavior(el, closeFriendProfile); // le noeud .level-roadmap-sheet vient d'etre recree (innerHTML), ses ecouteurs de glissement le sont donc aussi
}

function closeFriendProfile() {
  const el = document.getElementById('friendProfileOverlay');
  if (el) el.remove();
  friendProfileOpenUid = null;
}

/**
 * Filet de secours pour un appareil resté bloqué sur une ancienne version malgré
 * skipWaiting()/clients.claim() (ex: PWA "ajoutée à l'écran d'accueil" qui ne
 * revérifie jamais le service worker). Désenregistre TOUS les service workers de
 * cette origine et vide tout le Cache Storage (jamais purgé par un simple "vider
 * le cache" du navigateur sur certaines plateformes), puis recharge.
 */
async function forceAppUpdate() {
  const accepted = await confirmModal({
    icon: '🔄',
    title: t('settings.troubleshooting.forceUpdateModal.title'),
    subtitle: t('settings.troubleshooting.forceUpdateModal.subtitle'),
    confirmLabel: t('settings.troubleshooting.forceUpdateModal.confirmLabel'),
  });
  if (!accepted) return;
  try {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) {
    console.error('forceAppUpdate failed', e);
  }
  location.reload();
}
