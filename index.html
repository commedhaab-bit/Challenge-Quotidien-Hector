function showToast(html, duration = 2600) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    el.setAttribute('aria-live', 'polite'); // annonce le toast aux lecteurs d ecran sans voler le focus
    document.body.appendChild(el);
  }
  el.innerHTML = html;
  el.classList.remove('show');
  void el.offsetWidth; // force reflow pour rejouer l'anim si déjà visible
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), duration);
}

function fireConfetti(variant) {
  const colors = variant === 'hardcore'
    ? ['#ff6b35', '#ef5350', '#ffb347', '#ff9d5c', '#eef2ef']
    : variant === 'title'
    ? ['#ffd700', '#fff2b0', '#39e97a', '#eaffef', '#ffb347']
    : ['#39e97a', '#5fbf7a', '#eaffef', '#1f6b3e', '#eef2ef'];
  const canvas = document.createElement('canvas');
  canvas.className = 'confetti-canvas';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const particles = Array.from({ length: 70 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height * 0.3,
    r: 3 + Math.random() * 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    vx: (Math.random() - 0.5) * 3,
    vy: 2 + Math.random() * 3,
    rot: Math.random() * 360,
    vrot: (Math.random() - 0.5) * 10,
  }));
  let frame = 0;
  function tick() {
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rot += p.vrot;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r, -p.r * 0.6, p.r * 2, p.r * 1.2);
      ctx.restore();
    }
    if (frame < 110) {
      requestAnimationFrame(tick);
    } else {
      canvas.remove();
    }
  }
  tick();
}

function playSuccessSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const notes = [523.25, 659.25, 783.99]; // do-mi-sol
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const start = ctx.currentTime + i * 0.09;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
      osc.start(start);
      osc.stop(start + 0.4);
    });
  } catch (e) { /* audio non disponible, tant pis */ }
}

function getLifetimeSummary() {
  let totalReps = 0, totalSeconds = 0;
  const catVolume = {};
  for (const c of CHALLENGES) {
    const s = stats[c.id];
    if (!s) continue;
    if (c.unit === 'reps') totalReps += s.lifetimeTotal;
    else totalSeconds += s.lifetimeTotal;
    catVolume[c.cat] = (catVolume[c.cat] || 0) + s.lifetimeTotal;
  }
  let favCat = null, favVal = -1;
  for (const [cat, val] of Object.entries(catVolume)) {
    if (val > favVal) { favVal = val; favCat = cat; }
  }
  return { totalReps, totalSeconds, favCat };
}

// Double anneau concentrique : intérieur (vert néon) = phase normale, extérieur
// (feu) = phase Hardcore, quasiment collé au premier (~1px d'écart visuel une
// fois les demi-épaisseurs de trait prises en compte). Toujours calculés
// ensemble, à partir du total cumulé (+ l'écoulé de la session en cours si elle tourne).
const TIMER_RING_INNER_RADIUS = 78;
const TIMER_RING_OUTER_RADIUS = 88;
const TIMER_RING_INNER_CIRCUMFERENCE = 2 * Math.PI * TIMER_RING_INNER_RADIUS;
const TIMER_RING_OUTER_CIRCUMFERENCE = 2 * Math.PI * TIMER_RING_OUTER_RADIUS;

function computeTimerRingPct(projectedTotal, target, hcTarget) {
  const normalPct = target > 0 ? Math.min(1, projectedTotal / target) : 0;
  const hcRange = hcTarget - target;
  const hcProgress = Math.max(0, projectedTotal - target);
  const hardcorePct = hcRange > 0 ? Math.min(1, hcProgress / hcRange) : 0;
  return { normalPct, hardcorePct };
}

function renderDoubleTimerRingSVG(normalPct, hardcorePct, sizePx) {
  const nClamped = Math.min(1, Math.max(0, normalPct));
  const hClamped = Math.min(1, Math.max(0, hardcorePct));
  const nOffset = TIMER_RING_INNER_CIRCUMFERENCE * (1 - nClamped);
  const hOffset = TIMER_RING_OUTER_CIRCUMFERENCE * (1 - hClamped);
  const size = sizePx || 220;
  return `
    <svg class="timer-ring" viewBox="0 0 220 220" width="${size}" height="${size}">
      <circle class="timer-ring-bg-outer" cx="110" cy="110" r="${TIMER_RING_OUTER_RADIUS}"></circle>
      <circle class="timer-ring-bg-inner" cx="110" cy="110" r="${TIMER_RING_INNER_RADIUS}"></circle>
      <circle class="timer-ring-fill-hardcore${hClamped >= 1 ? ' complete' : ''}" id="timerRingHardcoreFill"
        cx="110" cy="110" r="${TIMER_RING_OUTER_RADIUS}"
        style="stroke-dasharray:${TIMER_RING_OUTER_CIRCUMFERENCE}; stroke-dashoffset:${hOffset};"></circle>
      <circle class="timer-ring-fill${nClamped >= 1 ? ' complete' : ''}" id="timerRingFill"
        cx="110" cy="110" r="${TIMER_RING_INNER_RADIUS}"
        style="stroke-dasharray:${TIMER_RING_INNER_CIRCUMFERENCE}; stroke-dashoffset:${nOffset};"></circle>
    </svg>
  `;
}

// Met à jour les deux anneaux déjà présents dans le DOM (appelé à chaque tick, sans re-render complet)
function updateTimerRingDOM(elapsedSec) {
  if (!currentChallengeId) return;
  const target = getTarget();
  const hcTarget = getHardcoreTarget(getChallenge());
  const total = getTotal();
  const { normalPct, hardcorePct } = computeTimerRingPct(total + elapsedSec, target, hcTarget);

  const ringInner = document.getElementById('timerRingFill');
  if (ringInner) {
    ringInner.style.strokeDashoffset = String(TIMER_RING_INNER_CIRCUMFERENCE * (1 - normalPct));
    ringInner.classList.toggle('complete', normalPct >= 1);
  }
  const ringOuter = document.getElementById('timerRingHardcoreFill');
  if (ringOuter) {
    ringOuter.style.strokeDashoffset = String(TIMER_RING_OUTER_CIRCUMFERENCE * (1 - hardcorePct));
    ringOuter.classList.toggle('complete', hardcorePct >= 1);
  }
}

// Échappe une chaîne pour une insertion sûre dans du HTML (contenu ou attribut
// délimité par des guillemets doubles) : noms/catégories de défis personnalisés et
// nom de compte Google sont du texte libre saisi par l'utilisateur, jamais fiable
// tel quel dans un template literal HTML (sinon injection possible via <, >, ", &).
function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Échappe une chaîne pour une insertion sûre à l'intérieur d'une chaîne JS à guillemets
// simples, elle-même dans un attribut HTML à guillemets doubles (ex: onclick="fn('...')") :
// il faut neutraliser à la fois le guillemet simple (fin de la chaîne JS) et le double
// (fin de l'attribut HTML).
function escapeJsAttr(str) {
  return String(str ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// Anonymise un nom complet en "Prénom N." (ex: "Jean Dupont" -> "Jean D.", "Sarah" ->
// "Sarah" inchangé, "Alexandre Martin Dupont" -> "Alexandre D." — seule l'initiale du
// DERNIER mot est gardée, pas des mots intermédiaires). Appliquée à l'ÉCRITURE (avant
// même que le nom n'atteigne Firestore, dans syncLeaderboardEntry()/
// registerBossBattleContributionIfNeeded()) — pas seulement à l'affichage — pour que le
// nom complet ne soit JAMAIS stocké dans les collections communautaires partagées,
// lisibles par n'importe quel autre utilisateur authentifié. Idempotente (appliquer
// deux fois ne change rien : "Jean D." redonne "Jean D."), donc sans risque de
// ré-appliquer aussi à l'affichage en filet de sécurité sur d'éventuelles données déjà
// écrites avant ce correctif.
// Repli 'Athlete' (anglais, pas de t()) si fullName est vide : cette valeur est ECRITE
// dans Firestore (collections communautaires partagees), lue par TOUS les autres
// utilisateurs quelle que soit LEUR langue — un repli traduit a la source figerait la
// langue de l'AUTEUR au moment de l'ecriture pour tous les lecteurs (aucun mecanisme de
// re-traduction a la lecture pour les noms, contrairement a exerciseSlug). L'anglais est
// le choix le plus largement compris par un public FR/EN/ES, donc le repli "le moins
// pire" tant qu'il reste dans une seule langue fixe.
function formatDisplayName(fullName) {
  const trimmed = String(fullName ?? '').trim().replace(/\s+/g, ' ');
  if (!trimmed) return 'Athlete';
  const parts = trimmed.split(' ');
  if (parts.length === 1) return parts[0];
  const lastInitial = parts[parts.length - 1].charAt(0).toUpperCase();
  return `${parts[0]} ${lastInitial}.`;
}

// formatSecToReadable / formatTargetLabel vivent désormais dans exercise-data.js
// (script classique chargé avant celui-ci, voir <head>) — restent des globaux,
// aucun changement d'usage ici.

// EXERCISE_PICTOGRAMS, EXERCISE_ICON_BY_NAME, PICTOGRAM_ASSET_MISSING et
// getExercisePictogramKey() vivent désormais dans exercise-pictograms.js /
// exercise-data.js (scripts classiques chargés avant celui-ci, voir <head>) —
// toujours des globaux, aucun changement d'usage ici.
function renderExercisePicto(c) {
  const key = getExercisePictogramKey(c);
  const svg = EXERCISE_PICTOGRAMS[key] || EXERCISE_PICTOGRAMS.generic;
  if (PICTOGRAM_ASSET_MISSING.has(key)) {
    // Aucun fichier exercices/{key}(-static).png|webp n'existe pour cette clé : on
    // rend directement le SVG, sans requête réseau vouée à un 404 garanti (et sans
    // effet de chargement puisqu'il n'y a rien à attendre).
    return `<div class="exercise-picto loaded"><div class="exercise-picto-fallback" style="display:flex;">${svg}</div></div>`;
  }
  // Essaie d'abord le WebP (généré par generate-webp-assets.py, bien plus léger),
  // puis le PNG si absent, puis le pictogramme SVG dessiné à la main en dernier
  // recours — aucune modification de code nécessaire au fur et à mesure que les
  // images arrivent. width/height fixes : cohérent avec le conteneur (déjà de
  // taille fixe) et évite tout redimensionnement implicite pendant le décodage.
  // La classe .loaded (posée par onload OU par le dernier repli onerror, quel que
  // soit le chemin emprunté) fait disparaître le skeleton "shimmer" et fait
  // apparaître l'image en fondu, pour ne jamais montrer de pop-in brut.
  return `
    <div class="exercise-picto">
      <img src="exercices/${key}-static.webp" alt="${escapeHtml(challengeDisplayName(c))}" loading="lazy" decoding="async" width="64" height="64"
           onload="this.classList.add('loaded'); this.parentElement.classList.add('loaded');"
           onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='exercices/${key}-static.png';}else{this.style.display='none'; this.nextElementSibling.style.display='flex'; this.parentElement.classList.add('loaded');}">
      <div class="exercise-picto-fallback">${svg}</div>
    </div>
  `;
}

// Phrase claire pour les exercices unilatéraux (haltère tenu à un seul bras).
// Ne retourne rien si l'exercice n'est pas concerné.
function armModeSentence(target, unit, armMode) {
  if (armMode !== 'perArm') return '';
  const u = unit === 'sec' ? t('exercise.unitSecLabelLower') : t('exercise.unitRepsLabel');
  return t('exercise.armModeSentence', { target, unit: u });
}

// ==== WAKE LOCK (empêche l'écran de s'éteindre pendant un chrono) ====
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {
    console.error('Wake Lock non disponible :', e);
  }
}

async function releaseWakeLock() {
  if (wakeLock) {
    try { await wakeLock.release(); } catch (e) { /* déjà relâché */ }
    wakeLock = null;
  }
}

// Le Wake Lock est automatiquement relâché par le système quand l'onglet passe
// en arrière-plan (écran verrouillé, changement d'appli...). On le redemande
// dès que l'app redevient visible, tant que le chrono tourne toujours.
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && timerRunning && !wakeLock) {
    await requestWakeLock();
  }
});

function clearTimerState() {
  if (timerIntervalId) clearInterval(timerIntervalId);
  timerIntervalId = null;
  timerRunning = false;
  timerStartMs = null;
  lastBeepSecond = 0;
  lastVoiceCueSecond = null;
  clearPrepCountdown();
  releaseWakeLock();
}

// ==== COMPTE À REBOURS (3... 2... 1...) ====
// Deux modes, partageant le même overlay/décompte :
// - 'start' (défaut) : décompte de préparation classique avant le tout premier
//   démarrage, se termine par "C'est parti !".
// - 'hardcore' : au passage en mode Hardcore, annonce d'abord "Mode Hardcore
//   enclenché !", puis (une fois la phrase terminée) le même décompte 3-2-1,
//   sans "C'est parti !" à la fin.
// Overlay ajouté directement au DOM (comme showToast()), indépendant du cycle render().
let prepCountdownValue = null;
let prepCountdownTimeoutId = null;
let prepCountdownMode = 'start';

// mode :
// - 'start' (défaut) : décompte de préparation classique, se termine par "C'est parti !".
// - 'hardcore-first' : tout premier lancement du Hardcore après l'objectif normal ->
//   annonce "Mode Hardcore enclenché !" puis décompte. Cette annonce ne doit se
//   produire qu'une seule fois (cf. entry.hardcoreAnnounced dans toggleTimer()).
// - 'hardcore-repeat' : reprises suivantes du Hardcore -> décompte immédiat, sans
//   ré-annoncer la phrase (déjà entendue), ni dire "C'est parti !" à la fin.
function beginPrepCountdown(mode) {
  unlockTimerAudio(); // dans le geste utilisateur du clic, pour débloquer l'audio (Safari/iOS)
  clearPrepCountdown();
  prepCountdownMode = mode || 'start';
  prepCountdownValue = 3;
  if (prepCountdownMode === 'hardcore-first') {
    // attend la fin REELLE de l'annonce (callback onend de SpeechSynthesis) avant
    // d'entamer le decompte audible, plutot qu'un delai fixe devine (speak() annule
    // sinon l'utterance en cours si on enchaine trop tot -> phrase coupee mi-mot).
    speak(t('popups.voiceCoach.hardcoreEngaged'), () => {
      if (prepCountdownValue === null) return; // decompte annule entretemps (clearPrepCountdown)
      renderPrepCountdownOverlay();
      speak('3');
      prepCountdownTimeoutId = setTimeout(prepCountdownTick, 1000);
    });
  } else {
    renderPrepCountdownOverlay();
    speak('3');
    prepCountdownTimeoutId = setTimeout(prepCountdownTick, 1000);
  }
}

function prepCountdownTick() {
  if (prepCountdownValue === null) return;
  prepCountdownValue -= 1;
  if (prepCountdownValue > 0) {
    renderPrepCountdownOverlay();
    speak(String(prepCountdownValue));
    prepCountdownTimeoutId = setTimeout(prepCountdownTick, 1000);
  } else {
    clearPrepCountdown();
    if (prepCountdownMode === 'start') speak(t('popups.voiceCoach.go'));
    startTimer();
  }
}

function clearPrepCountdown() {
  if (prepCountdownTimeoutId) clearTimeout(prepCountdownTimeoutId);
  prepCountdownTimeoutId = null;
  prepCountdownValue = null;
  prepCountdownMode = 'start';
  if (typeof window !== 'undefined' && window.speechSynthesis) window.speechSynthesis.cancel();
  const el = document.getElementById('prepCountdownOverlay');
  if (el) el.remove();
}

function renderPrepCountdownOverlay() {
  let el = document.getElementById('prepCountdownOverlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'prepCountdownOverlay';
    el.className = 'prep-countdown-overlay';
    document.body.appendChild(el);
  }
  el.innerHTML = `<div class="prep-countdown-number">${prepCountdownValue}</div>`;
}

let lastVoiceCueSecond = null;

// Annonce vocale à l'approche de l'objectif NORMAL (chronos en secondes uniquement) :
// "3... 2... 1..." puis "Défi terminé ! Bravo !" une fois l'objectif atteint. Ne
// concerne que la phase normale : une fois entry.done, la phase Hardcore n'a pas
// de décompte (cf. tickTimer/toggleTimer pour ses propres annonces).
function announceTimerVoiceCues(elapsed) {
  if (!voiceCoachEnabled || !currentChallengeId) return;
  const c = getChallenge();
  if (!c || c.unit !== 'sec') return;
  const entry = getEntry(currentChallengeId);
  if (entry.done) return;
  const target = getTarget();
  if (!target) return;
  const remaining = target - (getTotal() + elapsed);
  if (remaining <= 3 && remaining >= 1 && remaining !== lastVoiceCueSecond) {
    lastVoiceCueSecond = remaining;
    speak(String(remaining));
  } else if (remaining <= 0 && lastVoiceCueSecond !== 0) {
    lastVoiceCueSecond = 0;
    speak(t('popups.voiceCoach.challengeDone'));
  }
}

function startTimer() {
  timerRunning = true;
  timerStartMs = Date.now();
  lastBeepSecond = 0;
  lastVoiceCueSecond = null;
  unlockTimerAudio();
  timerIntervalId = setInterval(tickTimer, 250);
  requestWakeLock();
  render();
}

// Clic sur le disque du chrono (anneau entier cliquable) : bascule Play/Valider.
// - Pas encore d'objectif normal atteint -> décompte de préparation (3-2-1) puis démarrage.
// - Objectif normal déjà atteint (Hardcore pas encore réussi) -> décompte (3-2-1) avant
//   le démarrage réel ; l'annonce "Mode Hardcore enclenché !" ne se produit qu'au tout
//   premier lancement (cf. entry.hardcoreAnnounced), jamais sur les reprises suivantes.
// - Hardcore déjà réussi -> plus rien à démarrer.
function toggleTimer() {
  if (timerRunning) {
    stopTimer();
    return;
  }
  if (!currentChallengeId) return;
  const entry = getEntry(currentChallengeId);
  if (entry.hardcoreDone) return;
  if (entry.done) {
    if (!entry.hardcoreAnnounced) {
      entry.hardcoreAnnounced = true;
      saveState();
      beginPrepCountdown('hardcore-first');
    } else {
      beginPrepCountdown('hardcore-repeat');
    }
  } else {
    beginPrepCountdown();
  }
}

// À chaque tick : met à jour l'affichage, puis détecte le franchissement de
// l'objectif normal ou Hardcore pour arrêter automatiquement le chrono (plus besoin
// d'un bouton Stop manuel) et déclencher l'annonce vocale correspondante.
function tickTimer() {
  const elapsed = Math.floor((Date.now() - timerStartMs) / 1000);
  const entry = getEntry(currentChallengeId);
  const target = getTarget();
  const hcTarget = getHardcoreTarget(getChallenge());
  const projected = getTotal() + elapsed;

  // Le nombre affiché ne montre QUE le temps écoulé de la série en cours (repart
  // toujours de 0:00 à chaque démarrage) ; les anneaux, eux, restent cumulatifs
  // (progression globale vers l'objectif du jour) — deux informations distinctes.
  const el = document.getElementById('timerDisplay');
  if (el) el.textContent = formatTimer(elapsed);
  updateTimerRingDOM(elapsed);

  if (elapsed > 0 && elapsed % 30 === 0 && elapsed !== lastBeepSecond) {
    lastBeepSecond = elapsed;
    playTimerBeep();
  }

  announceTimerVoiceCues(elapsed);

  if (!entry.done && projected >= target) {
    stopTimer(elapsed); // arrêt automatique : "Défi terminé !" déjà annoncé ci-dessus, les popups XP/trophée suivent via addSet()
  } else if (entry.done && !entry.hardcoreDone && projected >= hcTarget) {
    if (voiceCoachEnabled) speak(t('popups.voiceCoach.hardcoreSuccess'));
    stopTimer(elapsed); // arrêt définitif
  }
}

// `precomputedElapsed` évite un léger écart d'arrondi quand stopTimer() est appelé
// depuis tickTimer() (arrêt automatique) plutôt que depuis un clic manuel (pause).
async function stopTimer(precomputedElapsed) {
  const elapsed = precomputedElapsed !== undefined ? precomputedElapsed : Math.round((Date.now() - timerStartMs) / 1000);
  clearTimerState();
  if (elapsed > 0) {
    await addSet(elapsed);
  } else {
    render();
  }
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

function formatDateLabel(d) {
  const days = t('dates.daysFull');
  const months = t('dates.monthsAbbr');
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}

let currentChallengeId = null;

function emptyDayState() {
  return { challenges: {} };
}

function emptyChallengeEntry() {
  return { sets: [], targetOverride: null, done: false, hardcoreDone: false, hardcoreAnnounced: false };
}

function getEntry(id) {
  if (!state.challenges[id]) {
    state.challenges[id] = emptyChallengeEntry();
  }
  if (state.challenges[id].hardcoreDone === undefined) {
    state.challenges[id].hardcoreDone = false; // migration
  }
  if (state.challenges[id].hardcoreAnnounced === undefined) {
    state.challenges[id].hardcoreAnnounced = false; // migration
  }
  return state.challenges[id];
}

/**
 * Charge la progression du jour (`day:{todayKey}`) dans `state`, recalcule
 * `todayKey`/`weekData`. Notifie `dayStateStore` à la fin — combiné au signal de
 * `loadActiveToday()`, c'est ce qui déclenche le premier vrai rendu de l'app
 * (voir `createStore`, Batch 6) plutôt qu'un `render()` manuel non coordonné.
 */
async function loadState() {
  const today = new Date();
  todayKey = dateKey(today);
  try {
    const res = await dbGet('day:' + todayKey);
    state = JSON.parse(res.value);
    if (!state.challenges) state = emptyDayState(); // migration depuis l'ancien format
  } catch (e) {
    state = emptyDayState();
  }
  // Pastilles de la semaine calendaire (Lundi -> Dimanche) : calculées à partir de
  // dailyActivity (déjà chargé en parallèle), au lieu d'appels Firestore séquentiels
  // supplémentaires (un par jour).
  weekData = {};
  for (const d of getCalendarWeekDates(today)) {
    const k = dateKey(d);
    weekData[k] = (dailyActivity[k] || 0) > 0;
  }
  render();
  dayStateStore.set({ ...dayStateStore.get(), stateLoaded: true });
}

async function saveState() {
  try {
    await dbSet('day:' + todayKey, JSON.stringify(state));
  } catch (e) {
    reportSaveError('save state failed', e);
  }
}

function getChallenge() {
  return resolveChallenge(CHALLENGES.find(c => c.id === currentChallengeId));
}

function getTarget() {
  const c = getChallenge();
  const entry = getEntry(currentChallengeId);
  return entry.targetOverride || (c ? c.target : 0);
}

function getHardcoreTarget(c) {
  if (!c) return 0;
  const base = c.hardcoreTarget || c.target * 2;
  return Math.max(base, c.target + 1);
}

function getTotal() {
  const entry = getEntry(currentChallengeId);
  return entry.sets.reduce((a,b) => a+b, 0);
}

async function pickChallenge(id) {
  clearTimerState();
  currentChallengeId = id;
  getEntry(id); // s'assure qu'une entrée existe (reprend celle du jour si déjà commencée)
  pushNavState();
  render(true);
}

async function addSet(amount) {
  if (amount <= 0) return;
  beginAppDataBatch(); // stats/lastCompleted/dailyActivity/badges/xpTotal/xpWeeklyData/streakData : un seul aller-retour Firestore pour tout ce qui suit, voir saveAppField()
  try {
    await addSetInner(amount);
  } finally {
    // debounce:true : voir scheduleWorkoutWriteFlush() — fusionne l'écriture Firestore
    // de plusieurs taps rapprochés (+5/+10 répétés) en une seule, sans jamais retarder
    // la mise à jour locale/le rendu ci-dessus, déjà faits de façon synchrone.
    await endAppDataBatch({ debounce: true });
  }
}

async function addSetInner(amount) {
  const entry = getEntry(currentChallengeId);
  entry.sets.push(amount);
  await registerBossBattleContributionIfNeeded(currentChallengeId, amount); // chaque serie compte, pas seulement la complétion du défi
  await registerGroupChallengeContributionsIfNeeded(getChallenge() ? getChallenge().slug : null, amount);
  const total = getTotal();
  const target = getTarget();
  const willComplete = total >= target && !entry.done;

  // Records & totaux à vie
  if (!stats[currentChallengeId]) {
    stats[currentChallengeId] = { lifetimeTotal: 0, bestDay: { total: 0, date: null }, recordStreak: 0 };
  }
  const s = stats[currentChallengeId];
  if (s.recordStreak === undefined) s.recordStreak = 0;
  s.lifetimeTotal += amount;
  let newRecord = false;
  if (total > s.bestDay.total) {
    s.bestDay = { total, date: todayKey };
    newRecord = true;
  }

  if (willComplete) {
    s.recordStreak = newRecord ? s.recordStreak + 1 : 0;
  }
  await saveStats();

  if (willComplete) {
    entry.done = true;
    weekData[todayKey] = true;
    lastCompleted[currentChallengeId] = Date.now();
    await saveLastCompleted();
    await registerCommunityCompletionIfNeeded(currentChallengeId);
    await registerActivityFeedEntryIfNeeded(getChallenge(), total);

    const isFirstCompletionOfDay = !dailyActivity[todayKey];
    dailyActivity[todayKey] = (dailyActivity[todayKey] || 0) + 1;
    await saveDailyActivity();

    badges.totalCompletions += 1;
    const freshBadges = checkNewBadges();
    await saveBadges();

    const completedChallenge = getChallenge();
    const xpGained = xpForChallenge(completedChallenge, total);
    const trophyXp = freshBadges.reduce((sum, b) => sum + (b.xp || 0), 0);
    const { levelBefore, levelAfter } = await awardXp(xpGained + trophyXp);
    if (isFirstCompletionOfDay) await registerDailyStreak();

    if (navigator.vibrate) navigator.vibrate([45, 35, 45, 35, 90]);
    fireConfetti();
    playSuccessSound();

    enqueuePopup({
      icon: newRecord ? '🏆' : '✅',
      title: newRecord ? t('popups.challengeComplete.newRecordTitle') : t('popups.challengeComplete.doneTitle'),
      subtitle: `${challengeDisplayName(completedChallenge)} — ${total} ${completedChallenge.unit === 'sec' ? t('exercise.unitSecLabelLower') : t('exercise.unitRepsLabel')}`,
      xp: xpGained,
    });
    enqueueTrophyPopups(freshBadges);
    enqueueLevelPopups(levelBefore, levelAfter);

    // Progression automatique : 3 records consécutifs -> proposer d'augmenter l'objectif par défaut
    if (s.recordStreak >= 3) {
      const c = getChallenge();
      const suggestedTarget = Math.ceil((total * 1.15) / 5) * 5;
      setTimeout(async () => {
        const accept = await confirmModal({
          icon: '🚀',
          title: t('popups.recordStreak.title'),
          subtitle: t('popups.recordStreak.subtitle', { name: escapeHtml(challengeDisplayName(c)), from: formatTargetLabel(c.target, c.unit), to: formatTargetLabel(suggestedTarget, c.unit) }),
          confirmLabel: t('popups.recordStreak.confirmLabel'),
          cancelLabel: t('popups.recordStreak.cancelLabel'),
        });
        if (accept) {
          if (c.isCustom) {
            const custom = customChallenges.find(x => x.id === c.id);
            if (custom) custom.target = suggestedTarget;
            rebuildChallenges();
            await saveCustomChallenges();
          } else {
            manualTargetOverrides[c.id] = suggestedTarget;
            await saveManualTargetOverrides();
          }
          showToast(t('popups.recordStreak.updatedToast', { target: formatTargetLabel(suggestedTarget, c.unit) }));
        }
        s.recordStreak = 0;
        await saveStats();
      }, 1400);
    }
  }

  // Mode Hardcore : détection indépendante de la complétion normale
  const cForHardcore = getChallenge();
  const hcTarget = getHardcoreTarget(cForHardcore);
  const willCompleteHardcore = total >= hcTarget && !entry.hardcoreDone;
  if (willCompleteHardcore) {
    entry.hardcoreDone = true;
    badges.totalHardcore += 1;
    const freshHardcoreBadges = checkNewBadges();
    await saveBadges();
    const hcTrophyXp = freshHardcoreBadges.reduce((sum, b) => sum + (b.xp || 0), 0);
    const { levelBefore: hcLevelBefore, levelAfter: hcLevelAfter } = await awardXp(HARDCORE_XP_BONUS + hcTrophyXp);

    if (navigator.vibrate) navigator.vibrate([60, 40, 60, 40, 60, 40, 140]);
    fireConfetti('hardcore');
    playSuccessSound();

    enqueuePopup({
      epic: true,
      icon: '🔥',
      title: t('popups.challengeComplete.hardcoreTitle'),
      subtitle: `${challengeDisplayName(cForHardcore)} — ${Math.min(total, hcTarget)} / ${hcTarget} ${cForHardcore.unit === 'sec' ? t('exercise.unitSecLabelLower') : t('exercise.unitRepsLabel')}`,
      xp: HARDCORE_XP_BONUS,
    });
    enqueueTrophyPopups(freshHardcoreBadges);
    enqueueLevelPopups(hcLevelBefore, hcLevelAfter);
  }

  // Écriture day:{todayKey} confiée au flush groupé : saveStats() plus haut (toujours
  // appelée, même sans complétion) a déjà mis appDataBatchDepth/pendingAppDataFields
  // dans l'état qui fera que le endAppDataBatch({debounce:true}) de addSet() (voir
  // plus haut) programme le flush — celui-ci rejoue aussi saveState(), jamais perdu
  // (voir scheduleWorkoutWriteFlush()/flushWorkoutWrites()).
  render();
}

async function undoLast() {
  beginAppDataBatch();
  try {
    await undoLastInner();
  } finally {
    // debounce:true : même raisonnement que addSet() plus haut — fusionne l'écriture
    // Firestore de plusieurs "annuler" rapprochés en une seule.
    await endAppDataBatch({ debounce: true });
  }
}

async function undoLastInner() {
  const entry = getEntry(currentChallengeId);
  const popped = entry.sets.pop();
  const total = getTotal();

  if (popped && stats[currentChallengeId]) {
    const s = stats[currentChallengeId];
    s.lifetimeTotal = Math.max(0, s.lifetimeTotal - popped);
    if (s.bestDay.date === todayKey) s.bestDay.total = total;
    await saveStats();
  }

  if (total < getTarget()) {
    entry.done = false;
    weekData[todayKey] = Object.values(state.challenges).some(e => e.done);
  }
  // Écriture day:{todayKey} confiée au flush groupé (voir addSet(), même mécanisme).
  render();
}

async function editTarget() {
  const c = getChallenge();
  const entry = getEntry(currentChallengeId);
  const current = getTarget();
  const input = prompt(c.unit === 'sec' ? t('exercise.editTargetPromptSec') : t('exercise.editTargetPromptReps'), current);
  if (input === null) return;
  const val = parseInt(input, 10);
  if (isNaN(val) || val <= 0) return;
  entry.targetOverride = val;
  const total = getTotal();
  entry.done = total >= val;
  await saveState();
  render();
}

function customAddSubmit() {
  const input = document.getElementById('customAddInput');
  const val = parseInt(input.value, 10);
  if (!isNaN(val) && val > 0) {

    input.value = '';
  }
}

function applyContent(app, html, animate, afterRender) {
  if (animate) {
    app.classList.add('fade-out');
    setTimeout(() => {
      app.innerHTML = html;
      app.classList.remove('fade-out');
      if (afterRender) afterRender();
    }, 140);
  } else {
    app.innerHTML = html;
    if (afterRender) afterRender();
  }
}

// applyContent() remplace TOUT le innerHTML de #app à chaque appel - y compris à
// chaque frappe dans un champ texte dont le oninput appelle render() pour mettre à
// jour un draft en direct (recherche, formulaires...). Sans filet, le NAVIGATEUR
// détruit l'ancien <input> et en crée un nouveau (même valeur affichée) qui ne
// reçoit jamais le focus : l'utilisateur ne peut alors taper qu'un seul caractère
// à la fois avant de devoir recliquer dans le champ (bug de prod signalé sur les
// formulaires de groupe). Générique (par ID, pas par écran) plutôt que dupliqué
// par formulaire : capture l'input actuellement focus AVANT le re-rendu, le
// retrouve par son id APRÈS, et lui rend le focus + la position du curseur.
function applyContentPreservingFocus(app, html, animate) {
  const el = document.activeElement;
  const wasFocused = !!(el && el.id);
  const focusedId = wasFocused ? el.id : null;
  const caret = (wasFocused && typeof el.selectionStart === 'number') ? el.selectionStart : null;
  applyContent(app, html, animate, () => {
    if (!focusedId) return;
    const input = document.getElementById(focusedId);
    if (!input) return;
    input.focus();
    if (caret !== null && input.setSelectionRange) {
      try { input.setSelectionRange(caret, caret); } catch (e) { /* certains types (number, select) ne supportent pas setSelectionRange */ }
    }
  });
}

  if (showProfileOnboarding) {

    applyContent(app, renderOnboardingTransitionScreen(), animate);

  if (usernameSetupMode) {

  }

  if (friendsScreenOpen) {

  // (remplacé par ✓ une fois le jour validé).
  html += `<div class="week-strip">`;
  for (const d of getCalendarWeekDates(new Date())) {

  html += renderTabBar();

  applyContent(app, html, animate, () => {
    const input = document.getElementById('customAddInput');
    if (input) {

    }
  });
}

/** Charge les 28 derniers jours d'historique (documents `day:{key}`), en parallèle. */
// Cache mémoire des jours PASSÉS (immuables une fois le jour terminé — jamais
// "aujourd'hui", qui peut encore changer et n'est donc jamais mis en cache ici) :
// sans ça, rouvrir l'onglet Journal plusieurs fois dans la même session relit les 28
// mêmes documents à chaque fois, alors que 27 d'entre eux n'ont pas pu changer depuis
// la dernière lecture. hasOwnProperty (pas juste un test de vérité) : un jour sans
// aucune activité est mis en cache comme `null`, qu'il ne faut jamais reconfondre avec
// "pas encore lu".
let historyDayCache = {};

async function loadHistoryEntries() {
  const DAYS_BACK = 28;
  const dayInfos = [];
  for (let i = 0; i < DAYS_BACK; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    dayInfos.push({ d, k: dateKey(d) });
  }
  // Lectures Firestore toujours en parallèle (règle du projet) : ce sont 28 documents
  // indépendants, aucune dépendance entre eux ne justifie de les lire en séquentiel
  // (jusqu'à 28 aller-retours réseau l'un après l'autre à chaque ouverture du Journal).
  const results = await Promise.all(dayInfos.map(({ k }) => {
    if (k !== todayKey && Object.prototype.hasOwnProperty.call(historyDayCache, k)) {
      return historyDayCache[k];
    }
    return dbGet('day:' + k).then(res => JSON.parse(res.value)).catch(() => null).then((val) => {
      if (k !== todayKey) historyDayCache[k] = val;
      return val;
    });
  }));
  const entries = [];
  results.forEach((s, idx) => {
    if (!s || !s.challenges) return;
    const { d, k } = dayInfos[idx];
    for (const [cid, entry] of Object.entries(s.challenges)) {
      if (entry.sets && entry.sets.length === 0) continue;
      const c = CHALLENGES.find(x => x.id === Number(cid));
      entries.push({
        key: k,
        date: d,
        challengeName: c ? challengeDisplayName(c) : t('history.deletedChallenge'),
        cat: c ? c.cat : '',
        total: entry.sets ? entry.sets.reduce((a,b)=>a+b,0) : 0,
        target: entry.targetOverride || (c ? c.target : 0),
        unit: c ? c.unit : 'reps',
        done: !!entry.done,
      });
    }
  });
  historyEntries = entries;
}

// Hero Banner communautaire : remplace l'ancien état vide générique quand aucun défi
// n'est encore sélectionné aujourd'hui (accompagnement "sans effort de choix" + FOMO).
// Repli sur renderTodayEmptyState() si les défis communautaires ne se résolvent pas
// (bibliothèque vide) — ne doit jamais laisser un écran cassé.
function renderCommunityHeroBanner() {
  const { challenge1, challenge2 } = getDailyCommunityChallenges();
  if (!challenge1 || !challenge2) return renderTodayEmptyState();
  // Même format de carte que l'onglet Défis (.picker-item : nom à gauche, reps/poids
  // à droite) plutôt qu'une mise en page dédiée — cohérence visuelle demandée entre les
  // 2 écrans pour le même genre d'information. `no-anim` : ces cartes se re-rendent à
  // chaque mise à jour temps réel de communityDailyCounts (onSnapshot), l'entrée en
  // cascade de .picker-item rejouerait donc en boucle sans cette classe.
  const cards = [challenge1, challenge2].map((c) => {
    const resolved = resolveChallenge(c);
    const targetLabel = resolved.unit === 'sec' ? formatSecToReadable(resolved.target) : resolved.target + ' ' + t('exercise.unitRepsLabel');
    const weightKg = weights[c.id] ?? computeStandardWeight(c, userProfile) ?? 8;
    const weightBelow = c.cat === 'Haltères' ? `<div class="goal-weight">🏋️ ${weightKg}kg</div>` : '';
    return `
      <div class="picker-item no-anim">
        ${renderExercisePicto(c)}
        <div class="picker-item-body">
          <span class="name">${escapeHtml(challengeDisplayName(c))}</span>
        </div>
        <div class="goal">
          ${targetLabel}
          ${weightBelow}
        </div>
      </div>
    `;
  }).join('');
  // Un seul compteur de participation en haut de la carte (pas répété sous chaque
  // exercice avec des chiffres différents) : "participants" compte les membres qui ont
  // cliqué sur "Relever le défi", indépendamment du fait qu'ils aient ensuite terminé
  // les 2 exercices — voir registerCommunityParticipantIfNeeded().
  const participants = communityDailyCounts.participants;
  return `
    <div class="community-hero-banner">
      <div class="community-hero-header">
        <span class="community-hero-badge">${t('today.hero.badge')}</span>
        <span class="community-hero-timer">${t('today.hero.timer', { n: hoursRemainingToday() })}</span>
      </div>
      <div class="community-hero-proof">${tn('today.hero.proof', participants)}</div>
      <div class="community-hero-list">${cards}</div>
      <button class="community-hero-accept-all-btn" onclick="acceptAllCommunityChallenges()">${t('today.hero.acceptAllBtn')}</button>
      <button class="community-hero-choose-btn" onclick="switchTab('library')">${t('today.hero.chooseBtn')}</button>
    </div>
  `;
}

// Toujours le module "Prochains trophées à portée de main" (2-3 trophées VERROUILLÉS
// les plus proches d'être débloqués), qu'il y ait 0 ou N trophées déjà débloqués :
// la version précédente ne remplaçait que la branche "0 débloqué", donc dès le premier
// trophée obtenu l'ancienne bande des trophées déjà réussis réapparaissait sans jamais
// montrer le teaser. Les trophées déjà débloqués restent consultables dans l'onglet Profil.
function renderBadgesStrip() {
  const locked = BADGE_DEFS.filter(b => !badges.unlocked.includes(b.id));
  if (locked.length === 0) {
    return `
      <div class="section-label">${t('today.trophies.allUnlockedLabel')}</div>
      <div class="badges-empty">${t('today.trophies.allUnlockedText')}</div>
    `;
  }
  const closest = locked
    .map(b => {
      const p = b.progress();
      const pct = p.target > 0 ? Math.min(100, (p.current / p.target) * 100) : 0;
      return { b, pct };
    })
    .sort((a, z) => z.pct - a.pct)
    .slice(0, 3);
  return `
    <div class="section-label">${t('today.trophies.nextLabel')}</div>
    <div class="next-trophies-grid">
      ${closest.map(({ b, pct }) => `
        <div class="next-trophy-card" onclick="showTrophyDetailModal('${b.id}')">
          <div class="next-trophy-icon">${b.icon}</div>
          <div class="next-trophy-body">
            <div class="next-trophy-name">${badgeLabel(b)}</div>
            <div class="next-trophy-track"><div class="next-trophy-fill" style="width:${Math.round(pct)}%"></div></div>
          </div>
          <div class="next-trophy-pct">${Math.round(pct)}%</div>
        </div>
      `).join('')}
    </div>
  `;
}

// Carte d'exercice partagée entre l'accueil ("today", clic = ouvrir la fiche) et
// l'onglet Défis ("library", clic = activer/désactiver pour aujourd'hui). Même
// structure/CSS (.picker-item) des deux côtés ; seules différences : la colonne de
// droite (statut du jour vs pastille "Actif"), le poids affiché pour les défis
// haltères en mode bibliothèque, et les actions éditer/supprimer réservées aux
// défis personnalisés.
function renderChallengeCard(c, mode, index, animate = true) {
  const resolved = resolveChallenge(c);
  const isActive = activeToday.has(c.id);
  const weightKg = weights[c.id] ?? computeStandardWeight(c, userProfile) ?? 8;
  // Poids affiché sous les reps, sur sa propre ligne, identique sur Défis et Aujourd'hui
  // (jamais "à côté" des reps).
  const weightBelow = c.cat === 'Haltères' ? `<div class="goal-weight">🏋️ ${weightKg}kg</div>` : '';

  // Objectif AFFICHÉ (utilisé aussi bien pour le libellé "goal" que pour le calcul de
  // progression ci-dessous) : priorité à l'objectif du jour (`entry.targetOverride`,
  // modifiable via le crayon ✏️ sur la fiche détail via editTarget()) sur l'objectif
  // standard résolu (`resolved.target`). Avant ce correctif, seule la ligne "En cours"
  // ci-dessous en tenait compte : le libellé "goal", lui, affichait TOUJOURS
  // `resolved.target`, ce qui désynchronisait visiblement la carte d'accueil (objectif
  // standard) de la fiche détail (objectif du jour réellement utilisé par getTarget()).
  const todayEntry = mode !== 'library' ? state.challenges[c.id] : null;
  const displayTarget = (todayEntry && todayEntry.targetOverride) || resolved.target;

  let rightHtml;
  if (mode === 'library') {
    rightHtml = '';
  } else {
    const rel = formatRelative(lastCompleted[c.id]);
    rightHtml = '';
    if (todayEntry && todayEntry.hardcoreDone) {
      rightHtml = `<div class="last-done status-hardcore">${t('card.hardcoreDone')}</div>`;
    } else if (todayEntry && todayEntry.done) {
      rightHtml = `<div class="last-done status-done">${t('card.doneToday')}</div>`;
    } else if (todayEntry && todayEntry.sets.length > 0) {
      const sumSoFar = todayEntry.sets.reduce((a,b)=>a+b,0);
      rightHtml = `<div class="last-done status-progress">${t('card.inProgress', { current: sumSoFar, target: displayTarget })}</div>`;
    } else if (rel) {
      rightHtml = `<div class="last-done">${rel}</div>`;
    }
  }

  const onclick = mode === 'library' ? `toggleActiveToday(${c.id})` : `pickChallenge(${c.id})`;
  // Contrôle d'activation explicite (bouton visible), en plus du clic sur la ligne :
  // l'état actif/inactif doit être identifiable sans avoir à deviner que la ligne est cliquable.
  const activateBtn = mode === 'library'
    ? `<button class="activate-toggle-btn${isActive ? ' active' : ''}" onclick="event.stopPropagation(); toggleActiveToday(${c.id})">${isActive ? t('card.active') : t('card.activate')}</button>`
    : '';

  // Entrée en cascade (léger décalage par carte), plafonné pour ne jamais laisser une
  // longue liste avec un délai interminable sur les dernières cartes ; absent si
  // index n'est pas fourni (repli sans délai, jamais d'animation cassée). `animate`
  // (par défaut true, comme avant) permet à renderLibraryScreen() de désactiver
  // l'animation quand un accordéon déjà ouvert se contente de re-render suite à un
  // toggle d'activation — seule une NOUVELLE ouverture de menu déroulant doit animer.
  const delayStyle = index !== undefined ? ` style="animation-delay:${Math.min(index, 8) * 40}ms"` : '';
  const noAnimClass = animate ? '' : ' no-anim';

  // Ruban + compteur "défi communautaire du jour" : garde le FOMO vivant même une
  // fois le défi accepté (sinon toute trace communautaire disparaîtrait dès
  // l'activation), ET reste visible dans la bibliothèque (mode "library") pour
  // qu'un utilisateur parti "choisir son propre défi" puisse quand même repérer
  // le(s) défi(s) du jour communautaires pendant qu'il parcourt le catalogue.
  const communitySlot = getCommunityDailySlot(c.id);
  const communityCount = communitySlot === 1 ? communityDailyCounts.completions1 : communitySlot === 2 ? communityDailyCounts.completions2 : 0;
  const communityRibbon = communitySlot
    ? `<span class="community-card-ribbon" title="${t('card.communityRibbonTitle', { n: communityCount })}">🌍 ${communityCount}</span>`
    : '';

  return `
    <div class="picker-item${noAnimClass}"${delayStyle} onclick="${onclick}">
      ${renderExercisePicto(c)}
      <div class="picker-item-body">
        <span class="name">${escapeHtml(challengeDisplayName(c))}</span>
        ${communityRibbon}
      </div>
      <div class="goal">
        ${resolved.unit === 'sec' ? formatSecToReadable(displayTarget) : displayTarget + ' ' + t('exercise.unitRepsLabel')}
        ${weightBelow}
        ${rightHtml}
      </div>
      ${activateBtn}
      ${mode === 'library' && c.isCustom ? `
        <div class="manage-actions">
          <button class="icon-btn" onclick="event.stopPropagation(); openEditChallengeForm(${c.id})">✏️</button>
          <button class="icon-btn danger" onclick="event.stopPropagation(); deleteChallenge(${c.id})">🗑️</button>
        </div>
      ` : ''}
    </div>
  `;
}

function renderLibraryScreen() {
  if (editingChallengeId !== null) {
    return renderChallengeForm();
  }
  let html = `
    <div class="library-header-row">
      <div>
        <h1 class="title">${t('library.title')}</h1>
        <div class="subtitle">${t('library.subtitle')}</div>
      </div>
      <button class="add-custom-fab" onclick="openNewChallengeForm()" title="${t('library.addCustomAria')}" aria-label="${t('library.addCustomAria')}">+</button>
    </div>
    <input class="library-search-input" id="librarySearchInput" type="text"
           placeholder="${t('library.searchPlaceholder')}" aria-label="${t('library.searchAria')}" value="${escapeHtml(librarySearchQuery)}"
           oninput="updateLibrarySearch(this.value)">
  `;
  // Recherche active : les catégories restent affichées mais 1) filtrées à leurs seuls
  // défis correspondants, 2) forcées ouvertes (peu importe libraryOpenCats), 3) masquées
  // entièrement si aucun défi ne correspond — réutilise l'accordéon existant tel quel,
  // pas de vue à plat séparée.
  const query = librarySearchQuery.trim().toLowerCase();
  const cats = [...new Set(CHALLENGES.map(c => c.cat))];
  let anyMatch = false;
  // Consomme le flag ici : seul CE rendu anime la catégorie qui vient d'être dépliée,
  // les rendus suivants (ex: toggle d'activation dans un accordéon déjà ouvert) non.
  const catToAnimate = libraryAnimatingCat;
  libraryAnimatingCat = null;
  for (const cat of cats) {
    let itemsInCat = CHALLENGES.filter(c => c.cat === cat);
    if (query) itemsInCat = itemsInCat.filter(c => challengeDisplayName(c).toLowerCase().includes(query));
    if (query && itemsInCat.length === 0) continue;
    anyMatch = true;
    const activeCount = itemsInCat.filter(c => activeToday.has(c.id)).length;
    const isOpen = query ? true : libraryOpenCats.has(cat);
    // N'anime que la catégorie tout juste dépliée (jamais pendant une recherche, qui
    // ne doit pas non plus clignoter à chaque frappe).
    const shouldAnimate = !query && cat === catToAnimate;
    html += `
      <div class="accordion${isOpen ? ' open' : ''}">
        <button class="accordion-header" onclick="toggleLibraryCategory('${escapeJsAttr(cat)}')">
          <span class="accordion-chevron">›</span>
          <span class="accordion-title">${escapeHtml(translateCategoryName(cat))}</span>
          <span class="accordion-count${activeCount > 0 ? ' has-active' : ''}">${tn('library.activeCount', activeCount)}</span>
        </button>
        ${isOpen ? `<div class="accordion-body">${itemsInCat.map((c, i) => renderChallengeCard(c, 'library', i, shouldAnimate)).join('')}</div>` : ''}
      </div>
    `;
  }
  if (query && !anyMatch) {
    html += `<div class="library-search-empty">${t('library.searchEmpty', { query: escapeHtml(librarySearchQuery.trim()) })}</div>`;
  }
  return html;
}

function renderHeatmap() {
  const WEEKS = 26; // ~6 mois, plus lisible sur mobile qu'une année complète
  // Semaine calendaire (Lundi -> Dimanche) contenant aujourd'hui, puis on remonte de
  // 25 semaines pleines supplémentaires : garantit TOUJOURS exactement 26 colonnes de 7
  // jours (contrairement à l'ancien "aligner sur Lundi en remontant depuis aujourd'hui",
  // qui pouvait ajouter jusqu'à 6 jours de trop et décaler aujourd'hui hors de la 26e
  // colonne — la ligne d'en-tête des mois, elle-même limitée à 26 colonnes, ratait alors
  // silencieusement le mois en cours).
  const currentWeekMonday = getCalendarWeekDates(new Date())[0];
  const start = new Date(currentWeekMonday);
  start.setDate(start.getDate() - (WEEKS - 1) * 7);
  const days = [];
  for (let i = 0; i < WEEKS * 7; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    days.push(d);
  }

  // 3 niveaux seulement (au lieu de 4) : plus lisible/contraste qu'une gradation fine
  // difficile a distinguer d'un coup d'oeil sur une heatmap mobile.
  function levelFor(count) {
    if (!count) return 0;
    if (count === 1) return 1;
    return 2;
  }

  let cells = '';
  for (const d of days) {
    const k = dateKey(d);
    const count = dailyActivity[k] || 0;
    const lvl = levelFor(count);
    const isFuture = d > new Date();
    cells += `<div class="heat-cell lvl${lvl}${isFuture ? ' future' : ''}" title="${k} — ${count} défi(s)"></div>`;
  }

  // En-tête des mois : un libellé abrégé sur la colonne qui contient le 1er jour d'un
  // mois (comme le graphique de contributions GitHub), sur la même grille à 26 colonnes
  // que heatmap-grid (1 colonne = 1 semaine). Règle stricte : un mois n'est libellé que
  // s'il est ENTIÈREMENT visible, c'est-à-dire que son 1er jour fait partie de la
  // fenêtre — un mois entamé avant le début de la heatmap (coupé à gauche) n'a donc,
  // par construction, jamais son propre jour 1 dans `days` et ne reçoit jamais de
  // libellé. Détecter le jour 1 dans chaque colonne (plutôt que le mois du seul Lundi
  // de la colonne) est nécessaire pour ne pas rater le mois en cours quand celui-ci
  // démarre au milieu d'une semaine (ex: 1er tombant un samedi).
  const MONTH_ABBR = t('dates.monthsAbbrCap');
  let monthsHtml = '';
  for (let col = 0; col < WEEKS; col++) {
    const colDays = days.slice(col * 7, col * 7 + 7);
    const firstOfMonthDay = colDays.find(d => d.getDate() === 1);
    monthsHtml += `<div class="heat-month-label">${firstOfMonthDay ? MONTH_ABBR[firstOfMonthDay.getMonth()] : ''}</div>`;
  }

  return `
    <div class="section-label">${t('history.heatmapLabel')}</div>
    <div class="heatmap-months">${monthsHtml}</div>
    <div class="heatmap-grid">${cells}</div>
    <div class="heat-legend">
      <span class="heat-legend-item"><span class="heat-cell lvl0"></span>${t('history.heatmapLegendNone')}</span>
      <span class="heat-legend-item"><span class="heat-cell lvl1"></span>${t('history.heatmapLegendOne')}</span>
      <span class="heat-legend-item"><span class="heat-cell lvl2"></span>${t('history.heatmapLegendMany')}</span>
    </div>
  `;
}

// Contenu du sous-onglet "Journal" de Profil (voir renderAccountTabScreen()) - le
// h1/sous-titre "Journal" sont geres par l'ecran englobant, pas ici.
function renderJournalSection() {
  const today = new Date();
  // Calendrier du MOIS EN COURS (du 1er au dernier jour), pas une fenêtre glissante de
  // 28 jours (qui faisait disparaître les 1ers jours du mois sur un mois de 30/31 jours).
  // Le statut "fait" vient de dailyActivity (déjà chargé au complet, pas limité aux 28
  // derniers jours comme historyEntries), même source que la heatmap ci-dessous.
  const year = today.getFullYear();
  const month = today.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const days = [];
  for (let day = 1; day <= daysInMonth; day++) {
    days.push(new Date(year, month, day));
  }
  const firstDow = (days[0].getDay() + 6) % 7; // Monday=0
  let calHtml = `<div class="cal-grid">`;
  t('dates.dowShortMonFirst').forEach(l => calHtml += `<div class="cal-dow">${l}</div>`);
  for (let i = 0; i < firstDow; i++) calHtml += `<div class="cal-cell empty"></div>`;
  for (const d of days) {
    const k = dateKey(d);
    const isToday = k === todayKey;
    const done = (dailyActivity[k] || 0) > 0;
    calHtml += `<div class="cal-cell${done ? ' done' : ''}${isToday ? ' today' : ''}" onclick="showDayDetailModal('${k}')">${done ? '✓' : d.getDate()}</div>`;
  }
  calHtml += `</div>`;

  let listHtml = `<div class="history-list-label">${t('history.listLabel')}</div>`;
  const withChallenge = historyEntries.filter(e => e.challengeName);
  if (historyLoading) {
    listHtml += `<div class="history-empty">${t('history.loading')}</div>`;
  } else if (withChallenge.length === 0) {
    listHtml += `<div class="history-empty">${t('history.empty')}</div>`;
  } else {
    for (const e of withChallenge) {
      const label = e.key === todayKey ? t('history.today') : formatDateLabel(e.date);
      listHtml += `
        <div class="history-entry">
          <div>
            <div class="hdate">${label}</div>
            <div class="hname">${e.challengeName}</div>
          </div>
          <div class="hprogress${e.done ? ' done' : ''}">${e.total}/${e.target} ${e.unit === 'sec' ? t('exercise.unitSecLabelLower') : ''}${e.done ? ' ✓' : ''}</div>
        </div>
      `;
    }
  }

  return `
    <button class="share-stats-btn" onclick="shareStatsImage()">
      <svg class="share-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      ${t('history.shareBtn')}
    </button>
    <div class="section-label">${t('history.calendarLabel')}</div>
    ${calHtml}
    ${renderHeatmap()}
    ${listHtml}
  `;
}

// Bloc niveau/titre/barre XP, factorisé pour être réutilisable avec l'XP de N'IMPORTE
// QUEL utilisateur (renderAthleteCard() pour soi-même, renderFriendProfileSheet() pour
// un ami) — pure fonction d'un total d'XP, aucune dépendance à l'utilisateur courant.
// `clickable` (par défaut true, pour ne rien changer aux appels existants avant ce
// correctif) contrôle SEULEMENT le texte d'indice "appuie pour voir ta progression" -
// trompeur sur la fiche d'un ami (bug réel signalé), qui n'ouvre jamais le Parcours
// de niveau (ce serait le TIEN, pas le sien) contrairement à ta propre carte.
function renderAthleteLevelBlock(xpTotalValue, clickable = true) {
  const { level, xpIntoLevel, xpNeeded } = xpProgress(xpTotalValue);
  const title = athleteTitle(level);
  const pct = xpNeeded > 0 ? Math.min(100, Math.round((xpIntoLevel / xpNeeded) * 100)) : 100;
  const xpLabel = clickable
    ? t('profileTab.xpProgress', { current: xpIntoLevel, needed: xpNeeded })
    : t('profileTab.xpProgressPlain', { current: xpIntoLevel, needed: xpNeeded });
  return `
    <div class="athlete-level-row">
      <div class="athlete-level">${t('profileTab.levelLabel', { n: level })}</div>
    </div>
    <div class="athlete-title">${title}</div>
    <div class="athlete-xp-track"><div class="athlete-xp-fill" style="width:${pct}%"></div></div>
    <div class="athlete-xp-label">${xpLabel}</div>
  `;
}

function renderAthleteCard() {

// ==== "PARCOURS DE NIVEAU" (page détaillant toute la progression XP/titres) ====
let levelRoadmapOpen = false;

function renderLevelRoadmapSheet() {
  const { level, xpIntoLevel, xpNeeded } = xpProgress(xpTotal);
  const pct = xpNeeded > 0 ? Math.min(100, Math.round((xpIntoLevel / xpNeeded) * 100)) : 100;
  let prevMax = 0;
  // Parametre renomme `tier` (pas `t`) : `t` masquerait la fonction globale de
  // traduction dans cette portee, meme piege deja rencontre dans renderChallengeCard()
  // (voir CLAUDE.md, batch 3 du chantier i18n).
  const rows = ATHLETE_TITLE_TIERS.map(tier => {
    const minLevel = prevMax + 1;
    const rangeLabel = tier.maxLevel === Infinity ? t('profileTab.roadmap.rangeMax', { min: minLevel }) : t('profileTab.roadmap.rangeBetween', { min: minLevel, max: tier.maxLevel });
    const unlocked = level >= minLevel;
    const current = level >= minLevel && level <= tier.maxLevel;
    prevMax = tier.maxLevel;
    return `
      <div class="roadmap-row${unlocked ? ' unlocked' : ''}${current ? ' current' : ''}">
        <div class="roadmap-row-icon">${current ? '▶' : unlocked ? '✓' : lockIconSVG(14)}</div>
        <div class="roadmap-row-text">
          <div class="roadmap-row-title">${t('athleteTitles.' + tier.id)} ${tier.icon}</div>
          <div class="roadmap-row-range">${rangeLabel}</div>
        </div>
      </div>
    `;
  }).join('');
  return `
    <div class="level-roadmap-sheet">
      <button class="level-roadmap-close" onclick="closeLevelRoadmap()">✕</button>
      <div class="level-roadmap-header">
        <div class="level-roadmap-level">${t('profileTab.levelLabel', { n: level })}</div>

      </div>
      <div class="section-label">${t('profileTab.roadmap.titlesLabel')}</div>
      <div class="roadmap-list">${rows}</div>
    </div>
  `;
}

// Même pattern que le Level Roadmap ci-dessus : overlay DOM autonome, hors du cycle
// render() principal, son propre bouton ✕. Contrairement au Level Roadmap (données
// déjà en mémoire), les données d'un ami sont chargées de façon async APRÈS l'ouverture :
// on affiche d'abord un état "chargement", puis on repeint le même noeud DOM une fois
// les données arrivées (garde sur friendProfileOpenUid pour ignorer une réponse tardive
// si la fiche a été fermée ou changée entre-temps).
let friendProfileOpenUid = null;

function renderFriendProfileSheet({ displayName, photoURL, loading, profile, activities, activitiesFailed }) {
  const avatar = photoURL
    ? `<img src="${escapeHtml(photoURL)}" class="leaderboard-avatar" referrerpolicy="no-referrer">`
    : `<div class="leaderboard-avatar-fallback">${escapeHtml(displayName.charAt(0).toUpperCase())}</div>`;
  let bodyHtml;
  if (loading) {
    bodyHtml = `<div class="history-empty">${t('friends.profileLoading')}</div>`;
  } else if (!profile) {
    bodyHtml = `<div class="history-empty">${t('friends.profileUnavailable')}</div>`;
  } else {
    const activitiesHtml = activitiesFailed
      ? `<div class="history-empty">${t('friends.noRecentActivity')}</div>`
      : (activities.length > 0
        ? `<div class="activity-feed-list">${activities.map(entry => renderActivityFeedRow(entry)).join('')}</div>`
        : `<div class="history-empty">${t('friends.noRecentActivity')}</div>`);
    bodyHtml = `
      <div class="athlete-card">${renderAthleteLevelBlock(profile.xpTotal, false)}</div>
      <div class="friend-profile-streak">${t('community.streakValue', { n: profile.streakCount })}</div>
      <div class="section-label">${t('friends.recentActivityLabel')}</div>
      ${activitiesHtml}
    `;
  }
  return `
    <div class="level-roadmap-sheet">
      <button class="level-roadmap-close" onclick="closeFriendProfile()">✕</button>
      <div class="level-roadmap-header friend-profile-header">
        ${avatar}
        <div class="level-roadmap-title">${escapeHtml(displayName)}</div>
      </div>
      ${bodyHtml}
    </div>
  `;
}

async function openFriendProfile(uid, displayName, photoURL) {
  closeFriendProfile();
  friendProfileOpenUid = uid;
  const el = document.createElement('div');
  el.id = 'friendProfileOverlay';
  el.className = 'level-roadmap-overlay';
  el.innerHTML = renderFriendProfileSheet({ displayName, photoURL, loading: true });
  document.body.appendChild(el);

  let profile = null, activities = [], activitiesFailed = false;
  try {
    profile = await fetchPublicProfile(uid);
  } catch (e) {
    console.error('friend profile fetch failed', e);
  }
  if (profile) {
    try {
      activities = await fetchFriendRecentActivities(uid);

      activitiesFailed = true;

    }

  if (friendProfileOpenUid !== uid) return;
  el.innerHTML = renderFriendProfileSheet({ displayName, photoURL, loading: false, profile, activities, activitiesFailed });
}

/**
 * Filet de secours pour un appareil resté bloqué sur une ancienne version malgré
 * skipWaiting()/clients.claim() (ex: PWA "ajoutée à l'écran d'accueil" qui ne
 * revérifie jamais le service worker). Désenregistre TOUS les service workers de
 * cette origine et vide tout le Cache Storage (jamais purgé par un simple "vider
 * le cache" du navigateur sur certaines plateformes), puis recharge.
 */
async function forceAppUpdate() {
  const accepted = await confirmModal({
    icon: '🔄',
    title: t('settings.troubleshooting.forceUpdateModal.title'),
    subtitle: t('settings.troubleshooting.forceUpdateModal.subtitle'),
    confirmLabel: t('settings.troubleshooting.forceUpdateModal.confirmLabel'),
  });
  if (!accepted) return;
  try {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) {
    console.error('forceAppUpdate failed', e);
  }
  location.reload();
}

  return `

// Sérialise tout ce qui est déjà en mémoire (aucune lecture Firestore
// supplémentaire) en un fichier JSON téléchargeable — sauvegarde manuelle avant un
// changement d'appareil/de compte.
function exportUserData() {
  const data = {
    exportedAt: new Date().toISOString(),
    profile: userProfile,
    customChallenges,
    manualTargetOverrides,
    weights,
    lastCompleted,
    stats,
    badges,
    dailyActivity,
    streakData: { streakCount, lastCompletedDate, hasShield, lastShieldResetWeek },
    xpTotal,
    voiceCoachEnabled,
    activeToday: [...activeToday],
    todayKey,
    todayState: state,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `defi-du-jour-export-${dateKey(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// Réécrit chaque clé reconnue via les save*() existants (jamais un accès Firestore
// direct), pour rester cohérent avec le reste du code et bénéficier des mêmes
// garanties. Passe par confirmModal() avant d'écraser quoi que ce soit : c'est une
// action destructrice et irréversible pour les données actuelles.
async function importUserData(event) {
  const file = event.target.files[0];
  if (!file) return;
  let data;
  try {
    data = JSON.parse(await file.text());
  } catch (e) {
    event.target.value = '';
    showToast(t('popups.importData.invalidFile'));
    return;
  }

  const accepted = await confirmModal({
    icon: '📥',
    title: t('popups.importData.confirmTitle'),
    subtitle: t('popups.importData.confirmSubtitle'),
    confirmLabel: t('popups.importData.confirmLabel'),
    danger: true,
  });
  if (!accepted) {
    event.target.value = '';
    return;
  }

  if (data.profile) { userProfile = data.profile; await saveProfile(); }
  if (Array.isArray(data.customChallenges)) {
    customChallenges = data.customChallenges;
    await saveCustomChallenges();
    rebuildChallenges();
  }
  if (data.manualTargetOverrides) { manualTargetOverrides = data.manualTargetOverrides; await saveManualTargetOverrides(); }
  if (data.weights) { weights = data.weights; await saveWeights(); }
  if (data.lastCompleted) { lastCompleted = data.lastCompleted; await saveLastCompleted(); }
  if (data.stats) { stats = data.stats; await saveStats(); }
  if (data.badges) { badges = data.badges; await saveBadges(); }
  if (data.dailyActivity) { dailyActivity = data.dailyActivity; await saveDailyActivity(); }
  if (data.streakData) {
    streakCount = data.streakData.streakCount ?? 0;
    lastCompletedDate = data.streakData.lastCompletedDate ?? null;
    hasShield = data.streakData.hasShield ?? true;
    lastShieldResetWeek = data.streakData.lastShieldResetWeek ?? null;
    await saveStreakData();
  }
  if (typeof data.xpTotal === 'number') { xpTotal = data.xpTotal; await saveXp(); }
  if (typeof data.voiceCoachEnabled === 'boolean') { voiceCoachEnabled = data.voiceCoachEnabled; await saveVoiceCoachEnabled(); }
  if (Array.isArray(data.activeToday)) { activeToday = new Set(data.activeToday); await saveActiveToday(); }
  if (data.todayState && data.todayKey === todayKey) { state = data.todayState; await saveState(); }

  event.target.value = '';
  showToast(t('popups.importData.done'));
  render(true);
}

// Une ligne de classement (top N ou ma propre ligne si hors Top N) : avatar/initiale,
// nom, valeur formatée selon la vue (jours de série vs XP), rang. `highlight` marque
// la ligne de l'utilisateur courant. `rank` est TOUJOURS un nombre désormais (gratuit
// dans le Top N mis en cache — simple index du tableau ; calculé à la demande via
// getMyRank() sinon, voir fetchMyRank()) — depuis le passage au classement précalculé
// côté serveur, plus besoin du compromis "badge Hors Top 50" (voir CLAUDE.md).
function renderLeaderboardRow(entry, rank, view, highlight) {
  const value = entry.value || 0;
  const valueLabel = view === 'streaks' ? t('community.streakValue', { n: value }) : t('community.xpValue', { n: value });
  // formatDisplayName() est déjà appliqué à l'écriture (syncLeaderboardEntry()) : ré-
  // appliqué ici en filet de sécurité, idempotent, pour tout document déjà écrit avant
  // ce correctif (nom complet encore stocké, se corrigera de lui-même à la prochaine
  // synchronisation de son auteur).
  const name = formatDisplayName(entry.displayName);
  const avatar = entry.photoURL
    ? `<img src="${escapeHtml(entry.photoURL)}" class="leaderboard-avatar" referrerpolicy="no-referrer">`
    : `<div class="leaderboard-avatar-fallback">${escapeHtml(name.charAt(0).toUpperCase())}</div>`;
  // Jamais sur sa propre ligne. Contrairement aux kudos événementiels (fil d'activité/
  // Boss Battle), pas de retrait ici : 1 kudos par JOUR et par personne (voir
  // giveKudosToPerson()), plus simple, pas besoin de la symétrie d'un like sur un
  // événement ponctuel.
  const kudosHtml = highlight ? '' : `<button class="kudos-btn${myKudosGivenToday.has(entry.uid) ? ' given' : ''}" onclick="event.stopPropagation(); giveKudosToPerson('${escapeJsAttr(entry.uid)}')">👏 ${entry.kudosTotal || 0}</button>`;
  return `
    <div class="leaderboard-row${highlight ? ' me' : ''}">
      <span class="leaderboard-rank">#${rank}</span>
      ${avatar}
      <span class="leaderboard-name">${escapeHtml(name)}</span>
      <span class="leaderboard-value">${valueLabel}</span>
      ${kudosHtml}
    </div>
  `;
}

// Invite à partager le lien de l'app depuis l'écran Communauté (empty state du
// classement) : navigator.share si disponible (mobile), sinon copie presse-papiers +
// toast de confirmation — jamais d'échec silencieux si aucun des deux n'est supporté.
async function shareCommunityInvite() {
  const text = t('community.shareInviteText');
  const url = location.href;
  if (navigator.share) {
    try {
      await navigator.share({ title: 'Défi du Jour', text, url });
      return;
    } catch (e) { return; } // annulé par l'utilisateur : pas d'erreur à afficher
  }
  try {
    await navigator.clipboard.writeText(`${text} ${url}`);
    showToast(t('popups.communityInvite.linkCopied'));
  } catch (e) {
    reportSaveError('share community invite failed', e);
  }
}

function renderBossBattleSection() {
  const weekStart = mondayOfWeek(new Date());

  if (!target) return '';
  const challenge = CHALLENGE_LIBRARY.find(c => c.id === target.targetChallengeId);
  if (!challenge) return '';
  const pct = Math.min(100, Math.round((communityBossBattleProgress / target.targetAmount) * 100));
  const unitLabel = challenge.unit === 'sec' ? t('exercise.unitSecLabelLower') : t('exercise.unitRepsLabel');
  const contributorHtml = communityTopContributorToday
    ? `<div class="boss-battle-contributor">${t('community.bossBattle.contributor', { name: escapeHtml(formatDisplayName(communityTopContributorToday.displayName)), amount: communityTopContributorToday.amount, unit: unitLabel })}</div>`
    : '';
  // Fil des contributions individuelles (temps réel, ~20 dernières) : FOMO en direct,

  const feedHtml = communityRecentContributions.length > 0
    ? `<div class="boss-battle-feed">${communityRecentContributions.map(c => `

      <div class="boss-battle-track"><div class="boss-battle-fill" style="width:${pct}%"></div></div>
      <div class="boss-battle-pct">${pct}%</div>

// Pure (aucun acces Firestore) : regroupe les entrees ledger IDENTIQUES (meme
// debiteur/creancier, meme type de gage, meme statut honore ou non) en une seule
// ligne avec un compteur - evite la fragmentation demandee ("3 bieres" au lieu de
// 3 lignes distinctes). stakeType='beer' regroupe TOUJOURS (texte structure, pas
// de variation possible) ; stakeType='custom' (ou absent - anciens defis d'avant
// ce champ) ne regroupe que les textes EXACTEMENT identiques, jamais des libelles
// differents. Ne regroupe jamais un gage honore avec un gage encore en attente
// (statuts distincts), pour ne pas donner l'impression qu'honorer 1 des 3 en
// honore 3.
function groupLedgerEntriesForDisplay(entries) {
  const groups = new Map();
  const order = [];
  for (const entry of entries) {
    const stakeType = entry.stakeType || 'custom';
    const key = [entry.fromUid, entry.toUid, stakeType, stakeType === 'custom' ? (entry.stakeDescription || '') : '', entry.honoredAt ? 'h' : 'p'].join('|');
    if (!groups.has(key)) {
      groups.set(key, {
        fromUid: entry.fromUid, toUid: entry.toUid, stakeType,
        stakeDescription: entry.stakeDescription || '', honored: !!entry.honoredAt,
        count: 0, entryIds: [],
      });
      order.push(key);
    }
    const g = groups.get(key);
    g.count++;
    g.entryIds.push(entry.entryId);
  }
  return order.map((key) => groups.get(key));
}

// Rendu partage d'une ligne de gage groupe (from doit un gage a to, + libelle
// du gage) - utilise par la liste detaillee (avec bouton "honorer") ET par le
// resume des soldes nets ci-dessous (sans action, purement informatif).
function renderLedgerRow(nameById, g, actionHtml) {
  const fromName = escapeHtml(nameById[g.fromUid] || '?');
  const toName = escapeHtml(nameById[g.toUid] || '?');
  // Gage structure (beer) : label toujours pluralise correctement (tn()). Gage
  // libre (custom) : texte saisi tel quel, suffixe "x{{n}}" uniquement si regroupe.
  const stakeLabel = g.stakeType === 'beer'
    ? tn('groups.stakeTypes.beerLabel', g.count)
    : (g.count > 1 ? t('groups.stakeCustomCount', { desc: g.stakeDescription, n: g.count }) : g.stakeDescription);
  return `
    <div class="leaderboard-row">
      <span class="leaderboard-name">${t('groups.ledgerLine', { from: fromName, to: toName })}</span>
      ${actionHtml || ''}
    </div>
    ${stakeLabel ? `<div class="rank-bar-hint">${escapeHtml(stakeLabel)}</div>` : ''}
  `;
}

// Solde net par personne (retour utilisateur, inspire du resume "qui doit quoi"
// de Splitwise) : au lieu de forcer a parcourir toute la liste chronologique pour
// comprendre la situation, nette les gages EN ATTENTE (honores exclus - deja
// regles) entre les 2 sens d'UNE MEME paire ET d'UN MEME type de gage exact.
// Un gage "biere" ne s'annule JAMAIS avec un gage "vaisselle" de l'autre sens
// (pas fongible, contrairement a de l'argent chez Splitwise) - seule une
// correspondance EXACTE de type/description est nettee.
function computeGroupNetBalances(entries) {
  const buckets = new Map();
  for (const entry of entries) {
    if (entry.honoredAt) continue;
    const stakeType = entry.stakeType || 'custom';
    const stakeDescription = stakeType === 'custom' ? (entry.stakeDescription || '') : '';
    const [uidLo, uidHi] = [entry.fromUid, entry.toUid].sort();
    const key = [uidLo, uidHi, stakeType, stakeDescription].join('|');
    if (!buckets.has(key)) buckets.set(key, { uidLo, uidHi, stakeType, stakeDescription, loOwesHi: 0, hiOwesLo: 0 });
    const b = buckets.get(key);
    if (entry.fromUid === uidLo) b.loOwesHi++; else b.hiOwesLo++;
  }
  const balances = [];
  for (const b of buckets.values()) {
    const net = b.loOwesHi - b.hiOwesLo;
    if (net === 0) continue; // quittes sur ce type de gage precis
    balances.push({
      fromUid: net > 0 ? b.uidLo : b.uidHi,
      toUid: net > 0 ? b.uidHi : b.uidLo,
      stakeType: b.stakeType,
      stakeDescription: b.stakeDescription,
      count: Math.abs(net),
    });
  }
  return balances;
}

function renderGroupBalancesSummary(entries) {
  const balances = computeGroupNetBalances(entries);
  if (balances.length === 0) return renderGroupsEmptyState('🎉', t('groups.allSettled'));
  const nameById = {};
  groupDetailMembers.forEach((m) => { nameById[m.uid] = m.displayName; });
  return balances.map((g) => renderLedgerRow(nameById, g, '')).join('');
}
