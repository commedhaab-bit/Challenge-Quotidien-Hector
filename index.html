// Détail d'une journée du calendrier mensuel (Journal) : liste des défis réalisés ce
// jour-là. Le jour cliqué peut être hors de la fenêtre de 28 jours de historyEntries
// (mois de 31 jours), donc on relit son document Firestore à la demande plutôt que
// de préchager tous les jours du mois d'un coup.
async function showDayDetailModal(dayKeyStr) {
  const [y, m, d] = dayKeyStr.split('-').map(Number);
  const label = formatDateLabel(new Date(y, m - 1, d));
  let entries = [];
  try {
    const res = await dbGet('day:' + dayKeyStr);
    const s = JSON.parse(res.value);
    if (s.challenges) {
      for (const [cid, entry] of Object.entries(s.challenges)) {
        if (!entry.sets || entry.sets.length === 0) continue;
        const c = CHALLENGES.find(x => x.id === Number(cid));
        entries.push({
          name: c ? challengeDisplayName(c) : t('history.deletedChallenge'),
          total: entry.sets.reduce((a, b) => a + b, 0),
          target: entry.targetOverride || (c ? c.target : 0),
          unit: c ? c.unit : 'reps',
          done: !!entry.done,
        });
      }
    }
  } catch (e) {
    entries = [];
  }
  const listHtml = entries.length === 0
    ? `<div class="history-empty">${t('popups.dayDetail.empty')}</div>`
    : entries.map(e => `
        <div class="history-entry">
          <div class="hname">${e.name}</div>
          <div class="hprogress${e.done ? ' done' : ''}">${e.total}/${e.target}${e.unit === 'sec' ? ' ' + t('exercise.unitSecLabelLower') : ''}${e.done ? ' ✓' : ''}</div>
        </div>
      `).join('');
  enqueuePopup({
    // 🗓️ (et non 📅) : le dessin Apple de l'emoji "tear-off calendar" grave en dur
    // "17 JUL" (illustration historique d'iCal) et faisait croire a un bug de date
    // bloquee au 17 juillet des qu'il apparaissait a cote de la date reellement
    // selectionnee.
    icon: '🗓️',
    title: label,
    listHtml,
    closable: true,
    btnLabel: t('common.close'),
  });
}

// ==== POPUPS PLEIN ÉCRAN STYLE DUOLINGO ====
// Un seul moteur de popup pour tous les évènements de gamification (série, bouclier,
// fin de défi/Hardcore avec cartes XP/trophée, level up, nouveau titre) : ajouté
// directement au DOM, comme showToast()/fireConfetti(), indépendant du cycle render().
let popupQueue = [];
let popupOpen = false; // état suivi explicitement (pas de fiabilité à attendre d'un getElementById sur un id qui vient d'être retiré du DOM selon les moteurs)
let currentPopupHtml = ''; // dernier contenu affiché (introspection/tests)

function enqueuePopup(opts) {
  popupQueue.push(opts);
  if (!popupOpen) drainPopupQueue();
}

function buildPopupInnerHtml(next) {
  const chips = [];
  if (next.xp) chips.push(`<div class="popup-chip xp-chip">⚡ +${next.xp} XP</div>`);
  const progressHtml = next.progressLabel ? `
    <div class="popup-progress-track"><div class="popup-progress-fill" style="width:${next.progressPct}%"></div></div>
    <div class="popup-progress-label">${next.progressLabel}</div>
  ` : '';
  // Mascotte Kilo (retour utilisateur "effet waouh") : si next.kiloState est fourni,
  // remplace l'icone emoji par Kilo dans la pose/expression correspondante -
  // reutilise le meme composant que partout ailleurs (accueil, etc.).
  // kiloAccessories (chantier gamification Phase 3) : optionnel, fait porter a
  // Kilo un/des accessoire(s) precis dans CETTE popup (ex: annonce de
  // deblocage, voir enqueueAccessoryPopups()) - jamais l equipement "normal"
  // de Kilo (computeEquippedAccessory()), qui reste propre a chaque ecran.
  const iconHtml = next.kiloState ? renderKilo(next.kiloState, { size: 118, clickable: true, accessories: next.kiloAccessories || [] }) : next.icon;
  return `
    <div class="app-popup-card${next.epic ? ' epic' : ''}">
      ${next.closable ? `<button class="app-popup-close-x" id="appPopupCloseX" aria-label="${t('common.close')}">✕</button>` : ''}
      <div class="app-popup-icon${next.locked ? ' locked' : ''}${next.kiloState ? ' kilo-icon' : ''}">${iconHtml}</div>
      <div class="app-popup-title">${next.title}</div>
      ${next.big !== undefined ? `<div class="app-popup-big${next.bigHighlight ? ' big-highlight' : ''}">${next.big}</div>` : ''}
      ${next.bigLabel ? `<div class="app-popup-big-label">${next.bigLabel}</div>` : ''}
      ${next.subtitle ? `<div class="app-popup-sub">${next.subtitle}</div>` : ''}
      ${next.badgeLine || ''}
      ${next.listHtml ? `<div class="popup-list">${next.listHtml}</div>` : ''}
      ${progressHtml}
      ${chips.length ? `<div class="app-popup-chips">${chips.join('')}</div>` : ''}
      <button class="app-popup-btn" id="appPopupCloseBtn">${next.btnLabel || 'Continuer'}</button>
    </div>
  `;
}

function drainPopupQueue() {
  const next = popupQueue.shift();
  if (!next) { popupOpen = false; currentPopupHtml = ''; return; }
  popupOpen = true;
  if (next.variant === 'title' || next.variant === 'trophy') fireConfetti('title');
  const el = document.createElement('div');
  el.id = 'appPopup';
  el.className = 'app-popup-overlay';
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.innerHTML = buildPopupInnerHtml(next);
  currentPopupHtml = el.innerHTML;
  document.body.appendChild(el);
  document.getElementById('appPopupCloseBtn').onclick = () => {
    el.remove();
    drainPopupQueue();
  };
  const closeX = document.getElementById('appPopupCloseX');
  if (closeX) {
    closeX.onclick = () => {
      el.remove();
      drainPopupQueue();
    };
  }
}

// Modale de confirmation stylée (Annuler/Confirmer), à la place des confirm() natifs
// du navigateur (moches, non personnalisables). Volontairement INDÉPENDANTE de la
// file enqueuePopup/drainPopupQueue (qui reste single-bouton, fire-and-forget, comme
// partout ailleurs dans l'appli) : ici on a besoin d'attendre une vraie décision de
// l'utilisateur avant de continuer, donc on retourne une Promise<boolean> — chose que
// la file générique ne permet pas. Réutilise le même habillage visuel
// (.app-popup-overlay/.app-popup-card) pour rester cohérent avec le reste de l'appli.
let currentConfirmModalHtml = ''; // dernier contenu affiché (introspection/tests, même principe que currentPopupHtml)
let currentConfirmModalEl = null; // dernier élément popup créé (introspection/tests, pour vérifier la portée de querySelector)
// kiloState (optionnel, retour utilisateur - garde-fou anti-spam) : remplace l'icone
// emoji par la mascotte Kilo dans la pose/expression correspondante (ex: 'warning'),
// meme convention que buildPopupInnerHtml()/enqueuePopup() - classe .kilo-icon
// necessaire pour le meme correctif de centrage (un SVG display:block ignore
// text-align, voir CLAUDE.md).
function confirmModal({ icon = '⚠️', kiloState = null, title = '', subtitle = '', confirmLabel = t('common.confirm'), cancelLabel = t('common.cancel'), danger = false } = {}) {
  return new Promise((resolve) => {
    const el = document.createElement('div');
    el.className = 'app-popup-overlay';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    const confirmIconHtml = kiloState ? renderKilo(kiloState, { size: 118, clickable: true }) : icon;
    el.innerHTML = `
      <div class="app-popup-card">
        <div class="app-popup-icon${kiloState ? ' kilo-icon' : ''}">${confirmIconHtml}</div>
        ${title ? `<div class="app-popup-title">${title}</div>` : ''}
        ${subtitle ? `<div class="app-popup-sub">${subtitle}</div>` : ''}
        <div class="app-popup-actions">
          <button class="app-popup-btn-cancel" id="confirmModalCancelBtn">${cancelLabel}</button>
          <button class="app-popup-btn${danger ? ' danger' : ''}" id="confirmModalConfirmBtn">${confirmLabel}</button>
        </div>
      </div>
    `;
    currentConfirmModalHtml = el.innerHTML;
    currentConfirmModalEl = el;
    document.body.appendChild(el);
    const finish = (result) => { el.remove(); resolve(result); };
    // Recherche SCOPÉE à ce popup précis (el.querySelector), pas document.getElementById()
    // (global) : confirmModal() n'a, contrairement à drainPopupQueue(), AUCUN garde-fou
    // d'instance unique (pas de "popupOpen") — deux appels concurrents (ex: terminer 2
    // défis différents chacun avec 3 records d'affilée, à quelques secondes d'écart,
    // chacun programmant son propre setTimeout(1400ms)) créent deux <div id="confirmModal...">
    // avec les MÊMES id. document.getElementById() aurait alors pu se lier au premier
    // popup (déjà fermé ou caché derrière), laissant les boutons du second (celui
    // réellement visible/cliqué par l'utilisateur) totalement inertes.
    el.querySelector('#confirmModalCancelBtn').onclick = () => finish(false);
    el.querySelector('#confirmModalConfirmBtn').onclick = () => finish(true);
  });
}

// Une popup épique dédiée par trophée fraîchement débloqué (icône animée, effets
// lumineux dorés, pluie de confettis) — distincte de la popup de complétion du défi.
function enqueueTrophyPopups(freshBadges) {
  for (const b of freshBadges) {
    enqueuePopup({
      variant: 'trophy',
      epic: true,
      icon: b.icon,
      title: t('popups.trophy.unlockedTitle'),
      big: badgeLabel(b),
      subtitle: t('popups.trophy.unlockedSubtitle'),
      xp: b.xp,
    });
  }
}

// Chantier gamification Phase 3 (cosmetiques) - meme pattern que
// enqueueTrophyPopups() ci-dessus. kiloAccessories (voir buildPopupInnerHtml())
// fait porter a Kilo l accessoire tout juste debloque, pour le montrer
// directement dans la popup d annonce plutot que de decrire juste par texte.
function enqueueAccessoryPopups(freshAccessories) {
  for (const a of freshAccessories) {
    enqueuePopup({
      kiloState: 'success',
      kiloAccessories: [a.id],
      icon: a.icon,
      title: t('kilo.accessories.unlockedTitle'),
      big: accessoryLabel(a),
      subtitle: t('kilo.accessories.unlockedSubtitle'),
    });
  }
}

// Petit cadenas métallique/gris (pas un gros cadenas jaune uniforme) : SVG plutôt
// qu'un emoji, pour garder une couleur/taille sobres et cohérentes quel que soit
// l'appareil (les emoji cadenas se rendent en jaune/or sur la plupart des systèmes).
function lockIconSVG(size) {
  const s = size || 12;
  return `<svg class="lock-icon-svg" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
    <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
}

// Passe "premium" (retour utilisateur) : coche qui se DESSINE (trace SVG
// progressif via stroke-dasharray/dashoffset, voir .check-draw-svg dans
// styles.css) plutot qu'un glyphe "✓" statique - effet "confirmation de
// paiement", nettement plus qualitatif sur un etat de succes. currentColor
// pour heriter la couleur du texte environnant, comme lockIconSVG() ci-dessus.
function checkmarkSVG(size) {
  const s = size || 16;
  return `<svg class="check-draw-svg" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M4 12.5L9.5 18L20 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

// Petites icônes (vert néon via currentColor) remplaçant les mots "Chrono"/"Répétitions"
// sur les cartes d'exercice des listes (Défis/Aujourd'hui) : chrono épuré pour les
// défis en secondes, traits de comptage à la craie pour les défis en répétitions.
// Popover de détail au clic sur une carte de trophée : icône, condition de
// déblocage, barre de progression en temps réel et récompense d'XP — que le
// trophée soit déjà débloqué ou non.
function showTrophyDetailModal(badgeId) {
  const b = BADGE_DEFS.find(x => x.id === badgeId);
  if (!b) return;
  const unlocked = badges.unlocked.includes(b.id);
  const { current, target } = b.progress();
  const fmt = (n) => b.secondsBased ? formatSecToReadable(Math.round(n)) : Math.round(n).toLocaleString(LOCALE_TO_INTL[currentLocale]);
  enqueuePopup({
    icon: b.icon,
    locked: !unlocked,
    title: unlocked ? t('popups.trophy.detailUnlockedTitle') : t('popups.trophy.detailLockedTitle'),
    big: badgeLabel(b),
    subtitle: unlocked
      ? t('popups.trophy.detailUnlockedSubtitle')
      : t('popups.trophy.detailLockedSubtitle'),
    progressPct: Math.min(100, Math.round((current / target) * 100)),
    progressLabel: `${fmt(Math.min(current, target))} / ${fmt(target)}`,
    xp: b.xp,
  });
}

// Détecte un changement de niveau (et, le cas échéant, de titre) entre deux mesures
// d'XP et enfile la popup adaptée (level up simple, ou popup "titre" plus épique).
function enqueueLevelPopups(levelBefore, levelAfter) {
  if (levelAfter <= levelBefore) return;
  // Retour haptique festif ici (chokepoint unique) plutot qu'a chaque site
  // d'appel (completion normale, Hardcore, trophee "cumul a vie" precoce) :
  // couvre les 3 chemins d'un seul coup, sans jamais dupliquer la logique. Si
  // un level up survient dans le meme tick qu'une vibration de completion deja
  // declenchee juste avant (voir addSetInner()), celle-ci la remplace
  // naturellement (la Vibration API annule toujours l'appel precedent) - le
  // palier le plus festif gagne toujours, jamais de double-retour percu.
  if (navigator.vibrate) navigator.vibrate(VIBRATE_FESTIVE_PATTERN);
  const titleBefore = athleteTitle(levelBefore);
  const titleAfter = athleteTitle(levelAfter);
  if (titleAfter !== titleBefore) {
    enqueuePopup({
      variant: 'title',
      epic: true,
      icon: '👑',
      kiloState: 'level_up', // mascotte Kilo (etat dedie : couronne + trophee brandi + halo) - remplace l'icone couronne
      title: t('popups.levelUp.newTitleUnlocked'),
      big: titleAfter,
      subtitle: t('popups.levelUp.newTitleSubtitle', { title: titleAfter, n: levelAfter }),
    });
  } else {
    enqueuePopup({
      variant: 'levelup',
      icon: '⭐',
      kiloState: 'success', // mascotte Kilo (retour utilisateur "effet waouh") - le nouveau titre (branche ci-dessus) a son propre etat dedie (level_up)
      title: t('popups.levelUp.title'),
      big: t('profileTab.levelLabel', { n: levelAfter }),
      subtitle: athleteTitle(levelAfter),
    });
  }
}

// ==== XP, NIVEAUX & TITRES D'ATHLÈTE ====
let xpTotal = 0;
// XP de la semaine calendaire en cours (classement "Hebdomadaire", reset le lundi) —
// champ SÉPARÉ de xpTotal (jamais fusionné dedans) pour ne rien changer au modèle
// existant : `xpWeekStart` (lundi de la semaine du dernier ajout) suit exactement le
// même mécanisme que `lastShieldResetWeek` (mondayOfWeek() comparé à chaque écriture).
let xpWeekly = 0;
let xpWeekStart = null;
// Participation au classement communautaire (activée par défaut, désactivable dans
// Paramètres) : si désactivée, syncLeaderboardEntry() ne doit RIEN écrire, et le doc
// leaderboard/{uid} déjà existant doit être supprimé (pas juste ignoré en lecture,
// pour ne laisser aucune trace publique une fois l'utilisateur retiré).
let leaderboardOptOut = false;

async function loadXp() {
  try { const res = await dbGet('xpTotal'); xpTotal = parseInt(res.value, 10) || 0; }
  catch (e) { xpTotal = 0; }
}
async function saveXp() {
  await saveAppField('xpTotal', xpTotal);
}
async function loadXpWeekly() {
  try {
    const res = await dbGet('xpWeeklyData');
    const d = JSON.parse(res.value);
    xpWeekly = d.xpWeekly || 0;
    xpWeekStart = d.xpWeekStart || null;
  } catch (e) {
    xpWeekly = 0;
    xpWeekStart = null;
  }
}
async function saveXpWeekly() {
  await saveAppField('xpWeeklyData', { xpWeekly, xpWeekStart });
}
async function loadLeaderboardOptOut() {
  try { const res = await dbGet('leaderboardOptOut'); leaderboardOptOut = res.value === 'true'; }
  catch (e) { leaderboardOptOut = false; }
}
async function saveLeaderboardOptOut() {
  await saveAppField('leaderboardOptOut', leaderboardOptOut);
}

// Écrit (merge) la ligne publique et minimale de classement de l'utilisateur — jamais
// le document appData complet (profil/poids restent privés). No-op silencieux si
// l'utilisateur a désactivé sa participation.
//
// Peut être appelée 2 fois pour un seul événement (ex: awardXp() PUIS
// registerDailyStreak() lors de la 1ère complétion du jour) — écrit à chaque fois
// EXACTEMENT le même instantané des champs courants, donc la 2e écriture est une
// pure redite. À l'intérieur d'un lot appData (voir beginAppDataBatch()), l'écriture
// réelle est différée à la fin du lot : plusieurs appels se fondent en une seule
// écriture Firestore, avec les valeurs déjà à jour au moment du flush (100%
// invisible, même document final, juste moins d'allers-retours).
let pendingLeaderboardSync = false;

async function syncLeaderboardEntry() {
  if (leaderboardOptOut || !currentUser) return;
  if (appDataBatchDepth > 0) {
    pendingLeaderboardSync = true;
    return;
  }
  try {
    await db.collection('leaderboard').doc(currentUser.uid).set({
      displayName: formatDisplayName(currentUser.displayName),
      photoURL: currentUser.photoURL || '',
      streakCount,
      xpWeekly,
      xpWeekStart,
      xpTotal,
      lastActiveDate: todayKey,
    }, { merge: true });
    // Sans ça, un cache classement déjà valide (TTL 15 min, voir fetchLeaderboardTop()/
    // fetchMyRank()) afficherait NOTRE PROPRE rang/valeur obsolète après une action qui
    // vient de le changer (ex: on vient de gagner de l'XP mais l'onglet Communauté
    // montre encore l'ancien total) — règle explicitement demandée : le cache TTL ne
    // doit jamais retarder l'affichage de MON PROPRE score.
    invalidateLeaderboardCache();
  } catch (e) {
    reportSaveError('leaderboard sync failed', e);
  }
}

async function toggleLeaderboardOptOut() {
  leaderboardOptOut = !leaderboardOptOut;
  await saveLeaderboardOptOut();
  if (leaderboardOptOut) {
    try { await db.collection('leaderboard').doc(currentUser.uid).delete(); }
    catch (e) { reportSaveError('leaderboard opt-out delete failed', e); }
    invalidateLeaderboardCache();
  } else {
    await syncLeaderboardEntry();
  }
  render();
}

// ==== CLASSEMENT PRECALCULE COTE SERVEUR (Cloud Functions, voir CLAUDE.md) ====
// Ancienne approche 100% cliente (Top 50 par .limit() + 2 requêtes ciblées "voisins"
// pour approximer la position hors Top 50, sans jamais afficher de rang exact —
// .count() indisponible sur le SDK compat client) abandonnée au profit d'une
// agrégation planifiée côté serveur (`aggregateLeaderboard`, Scheduled Function,
// 15 min) : le client se contente désormais de lire UN SEUL document déjà calculé
// (`leaderboardCache/{view}`) au lieu de scanner/interroger `leaderboard` lui-même.
// Le rang exact redevient bon marché pour tout le monde : gratuit pour le Top 100
// (simple index dans le tableau déjà en cache), et via un Callable dédié
// (`getMyRank`, `.count()` côté Admin SDK — fonctionnel, contrairement au SDK compat
// client) pour tous les autres, appelé uniquement quand je regarde réellement mon
// propre rang (jamais un balayage proactif de toute la communauté).
//
// Cache CLIENT par vue (streaks/hebdo/all-time), TTL 15 minutes (même compromis
// qu'avant : les données des AUTRES membres peuvent avoir jusqu'à 15 min de retard,
// en échange de moins de lectures) — MAIS invalidé IMMÉDIATEMENT dès que MES propres
// données changent (voir l'appel dans syncLeaderboardEntry()), pour que je voie
// toujours mon propre score à jour tout de suite après une séance.
const LEADERBOARD_CACHE_TTL_MS = 15 * 60 * 1000;
let leaderboardTopCache = {}; // { [view]: { at, data: { entries, totalCount } } }
let leaderboardRankCache = {}; // { [view]: { at, data: { rank, value } } }

function invalidateLeaderboardCache() {
  leaderboardTopCache = {};
  leaderboardRankCache = {};
}

// Lit le document déjà agrégé par la Cloud Function aggregateLeaderboard() — 1 seule
// lecture, quelle que soit la taille de la communauté (remplace l'ancienne requête
// .limit(n) directe sur la collection leaderboard).
async function fetchLeaderboardTop(view) {
  const cached = leaderboardTopCache[view];
  if (cached && (Date.now() - cached.at) < LEADERBOARD_CACHE_TTL_MS) return cached.data;
  const doc = await db.collection('leaderboardCache').doc(view).get();
  const data = doc.exists ? doc.data() : { entries: [], totalCount: 0 };
  leaderboardTopCache[view] = { at: Date.now(), data };
  return data;
}

// Rang exact via la Cloud Function getMyRank (Callable) — n'est appelée QUE si je ne
// suis pas déjà visible dans le Top 100 mis en cache (voir loadCommunityLeaderboard()).
// weekStart calculé ICI en heure locale (comme xpWeekStart à l'écriture), transmis
// au serveur plutôt que recalculé côté fonction, pour rester coherent avec ma propre
// notion de "cette semaine" (voir le commentaire équivalent dans functions/index.js).
async function fetchMyRank(view) {
  const cached = leaderboardRankCache[view];
  if (cached && (Date.now() - cached.at) < LEADERBOARD_CACHE_TTL_MS) return cached.data;
  const weekStart = view === 'weekly' ? mondayOfWeek(new Date()) : null;
  const result = await functionsClient.httpsCallable('getMyRank')({ view, weekStart });
  const data = result.data;
  leaderboardRankCache[view] = { at: Date.now(), data };
  return data;
}

// Ne déclenche aucune popup elle-même : renvoie juste les niveaux avant/après pour
// laisser l'appelant décider de l'ordre d'affichage (ex: popup de complétion d'abord,
// puis éventuellement level up / nouveau titre).
async function awardXp(amount) {
  const levelBefore = computeLevel(xpTotal);
  xpTotal += amount;
  const wk = mondayOfWeek(new Date());
  if (xpWeekStart !== wk) { xpWeekly = 0; xpWeekStart = wk; }
  xpWeekly += amount;
  await saveXp();
  await saveXpWeekly();
  await syncLeaderboardEntry();
  const levelAfter = computeLevel(xpTotal);
  return { levelBefore, levelAfter };
}

// Seuils d'XP par niveau, en dur et arrondis (demande explicite : des paliers
// "propres" comme 150/350/700/1200, pas une formule qui retomberait sur des
// nombres quelconques). Calibrés sur le gain réel d'un défi Hardcore (~150 à
// 225 XP selon l'exercice, cf. xpForChallenge + HARDCORE_XP_BONUS) pour que 2
// défis Hardcore amènent au plus au niveau 2, ou tout début de niveau 3 —
// avant, l'ancienne courbe faisait grimper à un niveau 4 dès 2 défis.
// Au-delà de la table, la progression continue avec le même facteur de
// croissance que ses derniers paliers (cf. xpForLevel).
const XP_LEVEL_THRESHOLDS = [
  0, 150, 350, 700, 1200, 1750, 2400, 3100, 3900, 4800,
  5800, 6900, 8100, 9500, 11000, 12750, 14750, 17000, 19500, 22250,
  25250, 28750, 32500, 36750, 41500, 47000, 53000, 59750, 67250, 75750,
  85250, 96000, 108000, 121250, 136250, 153000, 171750, 192750, 216250, 242750,
  272250, 305250, 342250, 383750, 430250, 482250, 540500, 605750,
];
const XP_LEVEL_TABLE_GROWTH = 1.12; // croissance des paliers au-dela de la table ci-dessus
function xpForLevel(n) {
  if (n <= 1) return 0;
  if (n <= XP_LEVEL_THRESHOLDS.length) return XP_LEVEL_THRESHOLDS[n - 1];
  const lastIndex = XP_LEVEL_THRESHOLDS.length - 1;
  const lastIncrement = XP_LEVEL_THRESHOLDS[lastIndex] - XP_LEVEL_THRESHOLDS[lastIndex - 1];
  const extra = n - XP_LEVEL_THRESHOLDS.length;
  const growthSum = lastIncrement * XP_LEVEL_TABLE_GROWTH * (Math.pow(XP_LEVEL_TABLE_GROWTH, extra) - 1) / (XP_LEVEL_TABLE_GROWTH - 1);
  return Math.round(XP_LEVEL_THRESHOLDS[lastIndex] + growthSum);
}
/** Niveau atteint pour un total d'XP donné, en cherchant le plus haut seuil (`xpForLevel`) franchi. */
function computeLevel(xp) {
  let level = 1;
  while (xpForLevel(level + 1) <= xp) level++;
  return level;
}
function xpProgress(xp) {
  const level = computeLevel(xp);
  const currentThreshold = xpForLevel(level);
  const nextThreshold = xpForLevel(level + 1);
  return { level, xpIntoLevel: xp - currentThreshold, xpNeeded: nextThreshold - currentThreshold };
}

// Titres d'athlète, du niveau 1 au niveau max — source unique utilisée pour le
// titre courant (athleteTitle) ET pour la carte "Parcours de niveau" (roadmap).
// `id` (stable, langue-agnostique) remplace l'ancien `title` figé en français : le nom
// traduit se résout au RENDU via t('athleteTitles.' + id), voir athleteTitle() et
// renderLevelRoadmapSheet(). `icon` reste séparé (décoratif, jamais traduit).

// ==== NOTIFICATIONS PUSH (Firebase Cloud Messaging, Phase B) ====
// null tant que pas encore determine (verifie une fois, en tache de fond, voir
// continueStartApp()) - le reglage reste discret/masque en attendant plutot que
// d'afficher un toggle qui pourrait ne rien faire. firebase.messaging.isSupported()
// est asynchrone depuis la SDK v9+ (contrairement aux versions precedentes) et
// couvre deja precisement le cas iOS Safari (false hors PWA installee, iOS <16.4) -
// aucune detection manuelle supplementaire necessaire.
let pushNotificationsSupported = null;
async function detectPushNotificationsSupport() {
  try {
    pushNotificationsSupported = 'serviceWorker' in navigator && typeof Notification !== 'undefined' && await firebase.messaging.isSupported();
  } catch (e) {
    pushNotificationsSupported = false;
  }
  render();
  maybePromptPushNotificationsOnStartup();
}

// Pure (aucun acces navigateur) : faut-il declencher automatiquement la
// demande de permission a CE demarrage ? Retour utilisateur explicite : la
// plupart des grandes apps redemandent a chaque ouverture tant que
// l'utilisateur n'a pas encore tranche, plutot que d'attendre un tap manuel
// dans les reglages. Uniquement si le support est confirme ET qu'aucune
// decision n'a encore ete prise ('default') - jamais si deja 'granted'
// (inutile) ni si deja 'denied' (le navigateur ignore silencieusement toute
// nouvelle demande une fois refusee : AUCUN moyen cote code de re-afficher le
// prompt natif, seul l'utilisateur peut le reactiver depuis ses reglages
// navigateur - autant ne pas tenter et laisser le texte explicatif du reglage
// Parametres faire le travail dans ce cas).
function shouldAutoPromptPushNotifications(supported, permission) {
  return supported === true && permission === 'default';
}

// Pure (aucun acces navigateur) : faut-il RAFRAICHIR silencieusement le token
// (sans re-demander la permission, deja accordee) a CE demarrage ? Bug reel
// signale par l'utilisateur : un token FCM peut devenir invalide sans que
// Notification.permission ne change (ex: "Forcer la mise a jour de l'appli"
// dans Depannage desinscrit le service worker, ce qui invalide le token
// associe cote Google) - la Cloud Function le detecte alors et supprime le
// doc pushTokens correspondant (voir sendPushToUser()), mais RIEN ne le
// regenerait automatiquement : le reglage Parametres continuait d'afficher
// "actif" (il ne regarde que localStorage/permission, jamais la presence
// reelle cote serveur), et plus aucun push n'arrivait, silencieusement.
function shouldRefreshPushToken(supported, permission) {
  return supported === true && permission === 'granted';
}

async function maybePromptPushNotificationsOnStartup() {
  let permission = null;
  try { permission = typeof Notification !== 'undefined' ? Notification.permission : null; } catch (e) { permission = null; }
  if (!shouldAutoPromptPushNotifications(pushNotificationsSupported, permission) && !shouldRefreshPushToken(pushNotificationsSupported, permission)) return;
  // Dans les 2 cas, enablePushNotifications() reste la bonne fonction : elle
  // gere deja correctement le cas "permission deja accordee" (Notification.requestPermission()
  // resout alors immediatement sans rien afficher) en (re)obtenant/(re)sauvegardant
  // le token cote serveur - exactement le comportement de reparation necessaire ici.
  await enablePushNotifications();
}

// Retour utilisateur : le switch manuel "Notifications push" de Parametres a
// ete retire (doublon confus avec la popup systeme native - la seule source de
// verite desormais est Notification.permission). Appelee UNIQUEMENT depuis
// maybePromptPushNotificationsOnStartup() (au demarrage, tant qu'aucune
// decision n'a encore ete prise, ou pour rafraichir silencieusement un token
// perime). Notification.requestPermission() ne declenche reellement le prompt
// natif du navigateur que si la permission est encore 'default' (sinon elle
// resout immediatement sans rien afficher). Si l'utilisateur refuse, on ne
// force rien - aucun texte/etat a afficher cote reglages, il n'y a plus de
// reglage a afficher.
async function enablePushNotifications() {
  if (!pushNotificationsSupported) return;
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') { render(); return; }
    const registration = await navigator.serviceWorker.ready;
    const messaging = firebase.messaging();
    // onMessage : premier plan (app deja ouverte) - deliberement un no-op. Le
    // listener Firestore existant (startNotificationsListener()) affiche deja la
    // popup in-app correspondante en temps reel ; sans ce handler explicite, la
    // SDK Firebase peut logguer un avertissement "no onMessage handler" en console.
    messaging.onMessage(() => {});
    const token = await messaging.getToken({ vapidKey: VAPID_PUBLIC_KEY, serviceWorkerRegistration: registration });
    if (!token) { render(); return; }
    await db.collection('users').doc(currentUser.uid).collection('pushTokens').doc(token).set({
      token, createdAt: Date.now(), userAgent: navigator.userAgent,
    });
    if (navigator.vibrate) navigator.vibrate(10);
    render();
  } catch (e) {
    reportSaveError('enable push notifications failed', e);
    render();
  }
}

// cancel() avant chaque prise de parole pour éviter les retards/empilements audio ;
// tolère l'absence de synthèse vocale (navigateur non compatible ou bloquée).
// `onEnd`, si fourni, se déclenche une fois la phrase RÉELLEMENT terminée (callback
// natif SpeechSynthesisUtterance.onend), pour enchaîner un son/décompte sans jamais
// couper l'annonce en cours (cf. le décompte du mode Hardcore). Un filet de sécurité
// (setTimeout) évite de rester bloqué si le navigateur ne déclenche jamais onend.
function speak(text, onEnd) {
  if (!voiceCoachEnabled) {
    if (onEnd) onEnd();
    return;
  }
  if (typeof window === 'undefined' || !window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') {
    if (onEnd) onEnd();
    return;
  }
  try {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = LOCALE_TO_INTL[currentLocale];
    if (onEnd) {
      let called = false;
      const finish = () => { if (!called) { called = true; onEnd(); } };
      utterance.onend = finish;
      utterance.onerror = finish;
      setTimeout(finish, 4000); // filet de securite (bug navigateur : onend jamais declenche)
    }
    window.speechSynthesis.speak(utterance);
  } catch (e) {
    console.error('Coach vocal indisponible :', e);
    if (onEnd) onEnd();
  }
}

function formatRelative(ms) {
  if (!ms) return null;
  const diff = Date.now() - ms;
  const min = diff / 60000;
  if (min < 1) return t('dates.relative.now');
  if (min < 60) return t('dates.relative.minutesAgo', { n: Math.round(min) });
  const hrs = diff / 3600000;
  if (hrs < 24) return t('dates.relative.hoursAgo', { n: Math.round(hrs) });
  const days = diff / 86400000;
  return t('dates.relative.daysAgo', { n: Math.round(days) });
}

// computeEquippedAccessory() : Kilo "porte" toujours l accessoire debloque le
// plus prestigieux, jamais plusieurs a la fois (equipement v1 volontairement
// simple, pas de garde-robe/ecran de selection dans cette version).
const ACCESSORY_PRESTIGE_ORDER = ['medal', 'belt', 'cape'];

// `label` reste TOUJOURS le texte canonique francais - meme convention que
// badgeLabel()/challengeDisplayName().
function accessoryLabel(a) {

/**
 * Parcourt ACCESSORY_DEFS, debloque tout accessoire dont check() devient vrai
 * et n est pas deja dans unlockedAccessories. Retourne uniquement les
 * accessoires NOUVELLEMENT debloques par cet appel (pour piloter la popup),
 * sans persister - l appelant doit encore appeler saveUnlockedAccessories().
 * Idempotent, meme garantie que checkNewBadges().
 */
function checkNewAccessories() {
  const freshlyUnlocked = [];
  for (const a of ACCESSORY_DEFS) {
    if (!unlockedAccessories.includes(a.id) && a.check()) {
      unlockedAccessories.push(a.id);
      freshlyUnlocked.push(a);
    }
  }
  return freshlyUnlocked;
}

// Fonction PURE (aucun acces a l etat global) : quel accessoire Kilo doit-il
// porter maintenant, parmi ceux deja debloques ? Le plus prestigieux (voir
// ACCESSORY_PRESTIGE_ORDER), ou aucun (null) si rien n est encore debloque.
function computeEquippedAccessory(unlocked) {
  for (let i = ACCESSORY_PRESTIGE_ORDER.length - 1; i >= 0; i--) {
    if (unlocked.includes(ACCESSORY_PRESTIGE_ORDER[i])) return ACCESSORY_PRESTIGE_ORDER[i];
  }
  return null;
}

// Idee bonus #13 (retour utilisateur, accessoires saisonniers) : 3 accessoires
// TEMPORAIRES, delibrement HORS de ACCESSORY_DEFS/unlockedAccessories - pas un
// deblocage permanent a ceremonie (popup) une seule fois dans la vie du
// compte, juste un signe des temps porte automatiquement pendant la periode
// concernee, recalcule a chaque fois (jamais persiste). Fonction PURE :
// toutes les dates sont des parametres, jamais new Date() lu en interne -
// testable de facon deterministe. `accountCreatedAt` peut etre absent/invalide
// (voir currentUser.metadata, absent des objets utilisateur factices des
// tests) : traite alors simplement comme "pas d'anniversaire aujourd'hui".
// Priorite documentee (un seul accessoire saisonnier a la fois) :
// anniversaire de compte (evenement personnel, le plus rare) > Noel > ete.
function computeSeasonalAccessory(date, accountCreatedAt) {
  if (
    accountCreatedAt &&
    date.getMonth() === accountCreatedAt.getMonth() &&
    date.getDate() === accountCreatedAt.getDate() &&
    date.getFullYear() !== accountCreatedAt.getFullYear()
  ) {
    return 'birthday_hat';
  }
  if (date.getMonth() === 11 && date.getDate() >= 20) return 'santa_hat'; // 20-31 decembre
  if (date.getMonth() >= 5 && date.getMonth() <= 7) return 'summer_sunglasses'; // juin-aout
  return null;
}

// Idee bonus #18 (retour utilisateur, rappel d'anniversaire de compte) :
// nombre d'annees pleines ecoulees si AUJOURD'HUI est le jour anniversaire de
// creation du compte (meme mois/jour, annee differente - jamais le jour de
// creation lui-meme), sinon null. Fonction PURE, meme convention que
// computeSeasonalAccessory() ci-dessus (dates en parametres).
function computeAccountAnniversaryYears(date, accountCreatedAt) {
  if (!accountCreatedAt) return null;
  if (date.getMonth() !== accountCreatedAt.getMonth() || date.getDate() !== accountCreatedAt.getDate()) return null;
  const years = date.getFullYear() - accountCreatedAt.getFullYear();
  return years > 0 ? years : null;
}

function showToast(html, duration = 2600) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    el.setAttribute('aria-live', 'polite'); // annonce le toast aux lecteurs d ecran sans voler le focus
    document.body.appendChild(el);
  }
  el.innerHTML = html;
  el.classList.remove('show');
  void el.offsetWidth; // force reflow pour rejouer l'anim si déjà visible
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), duration);
}

function fireConfetti(variant) {
  const colors = variant === 'hardcore'
    ? ['#ff6b35', '#ef5350', '#ffb347', '#ff9d5c', '#eef2ef']
    : variant === 'title'
    ? ['#ffd700', '#fff2b0', '#39e97a', '#eaffef', '#ffb347']
    : ['#39e97a', '#5fbf7a', '#eaffef', '#1f6b3e', '#eef2ef'];
  const canvas = document.createElement('canvas');
  canvas.className = 'confetti-canvas';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const particles = Array.from({ length: 70 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height * 0.3,
    r: 3 + Math.random() * 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    vx: (Math.random() - 0.5) * 3,
    vy: 2 + Math.random() * 3,
    rot: Math.random() * 360,
    vrot: (Math.random() - 0.5) * 10,
  }));
  let frame = 0;
  function tick() {
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rot += p.vrot;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r, -p.r * 0.6, p.r * 2, p.r * 1.2);
      ctx.restore();
    }
    if (frame < 110) {
      requestAnimationFrame(tick);
    } else {
      canvas.remove();
    }
  }
  tick();
}

// Retour utilisateur "effet waouh" : desormais optionnelle (soundEffectsEnabled,

function getLifetimeSummary() {
  let totalReps = 0, totalSeconds = 0;
  const catVolume = {};
  for (const c of CHALLENGES) {
    const s = stats[c.id];
    if (!s) continue;
    if (c.unit === 'reps') totalReps += s.lifetimeTotal;
    else totalSeconds += s.lifetimeTotal;
    catVolume[c.cat] = (catVolume[c.cat] || 0) + s.lifetimeTotal;
  }
  let favCat = null, favVal = -1;
  for (const [cat, val] of Object.entries(catVolume)) {
    if (val > favVal) { favVal = val; favCat = cat; }
  }
  return { totalReps, totalSeconds, favCat };
}

let timerRunning = false;
let timerStartMs = null;
let timerIntervalId = null;
let lastBeepSecond = 0;
let timerAudioCtx = null;

// Cree (ou reprend) l'AudioContext dans le geste utilisateur qui demarre le
// chrono : certains navigateurs (Safari/iOS) bloquent l'audio s'il n'est pas
// initialise depuis un clic direct.
function unlockTimerAudio() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!timerAudioCtx) timerAudioCtx = new AudioCtx();
    if (timerAudioCtx.state === 'suspended') timerAudioCtx.resume();
  } catch (e) { /* audio non disponible, tant pis */ }
}

function playTimerBeep() {
  if (!timerAudioCtx) return;
  try {
    const osc = timerAudioCtx.createOscillator();
    const gain = timerAudioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    osc.connect(gain);
    gain.connect(timerAudioCtx.destination);
    const start = timerAudioCtx.currentTime;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.9, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
    osc.start(start);
    osc.stop(start + 0.32);
  } catch (e) { /* audio non disponible, tant pis */ }
}

function formatTimer(totalSec) {
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${pad(s)}`;
}

// Double anneau concentrique : intérieur (vert néon) = phase normale, extérieur
// (feu) = phase Hardcore, quasiment collé au premier (~1px d'écart visuel une
// fois les demi-épaisseurs de trait prises en compte). Toujours calculés
// ensemble, à partir du total cumulé (+ l'écoulé de la session en cours si elle tourne).
const TIMER_RING_INNER_RADIUS = 78;
const TIMER_RING_OUTER_RADIUS = 88;
const TIMER_RING_INNER_CIRCUMFERENCE = 2 * Math.PI * TIMER_RING_INNER_RADIUS;
const TIMER_RING_OUTER_CIRCUMFERENCE = 2 * Math.PI * TIMER_RING_OUTER_RADIUS;

function computeTimerRingPct(projectedTotal, target, hcTarget) {
  const normalPct = target > 0 ? Math.min(1, projectedTotal / target) : 0;
  const hcRange = hcTarget - target;
  const hcProgress = Math.max(0, projectedTotal - target);
  const hardcorePct = hcRange > 0 ? Math.min(1, hcProgress / hcRange) : 0;
  return { normalPct, hardcorePct };
}

function renderDoubleTimerRingSVG(normalPct, hardcorePct, sizePx) {
  const nClamped = Math.min(1, Math.max(0, normalPct));
  const hClamped = Math.min(1, Math.max(0, hardcorePct));
  const nOffset = TIMER_RING_INNER_CIRCUMFERENCE * (1 - nClamped);
  const hOffset = TIMER_RING_OUTER_CIRCUMFERENCE * (1 - hClamped);
  const size = sizePx || 220;
  return `
    <svg class="timer-ring" viewBox="0 0 220 220" width="${size}" height="${size}">
      <circle class="timer-ring-bg-outer" cx="110" cy="110" r="${TIMER_RING_OUTER_RADIUS}"></circle>
      <circle class="timer-ring-bg-inner" cx="110" cy="110" r="${TIMER_RING_INNER_RADIUS}"></circle>
      <circle class="timer-ring-fill-hardcore${hClamped >= 1 ? ' complete' : ''}" id="timerRingHardcoreFill"
        cx="110" cy="110" r="${TIMER_RING_OUTER_RADIUS}"
        style="stroke-dasharray:${TIMER_RING_OUTER_CIRCUMFERENCE}; stroke-dashoffset:${hOffset};"></circle>
      <circle class="timer-ring-fill${nClamped >= 1 ? ' complete' : ''}" id="timerRingFill"
        cx="110" cy="110" r="${TIMER_RING_INNER_RADIUS}"
        style="stroke-dasharray:${TIMER_RING_INNER_CIRCUMFERENCE}; stroke-dashoffset:${nOffset};"></circle>
    </svg>
  `;
}

// Met à jour les deux anneaux déjà présents dans le DOM (appelé à chaque tick, sans re-render complet)
function updateTimerRingDOM(elapsedSec) {
  if (!currentChallengeId) return;
  const target = getTarget();
  const hcTarget = getHardcoreTarget(getChallenge());
  const total = getTotal();
  const { normalPct, hardcorePct } = computeTimerRingPct(total + elapsedSec, target, hcTarget);

  const ringInner = document.getElementById('timerRingFill');
  if (ringInner) {
    ringInner.style.strokeDashoffset = String(TIMER_RING_INNER_CIRCUMFERENCE * (1 - normalPct));
    ringInner.classList.toggle('complete', normalPct >= 1);
  }
  const ringOuter = document.getElementById('timerRingHardcoreFill');
  if (ringOuter) {
    ringOuter.style.strokeDashoffset = String(TIMER_RING_OUTER_CIRCUMFERENCE * (1 - hardcorePct));
    ringOuter.classList.toggle('complete', hardcorePct >= 1);
  }
}

// Échappe une chaîne pour une insertion sûre dans du HTML (contenu ou attribut
// délimité par des guillemets doubles) : noms/catégories de défis personnalisés et
// nom de compte Google sont du texte libre saisi par l'utilisateur, jamais fiable
// tel quel dans un template literal HTML (sinon injection possible via <, >, ", &).
function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Échappe une chaîne pour une insertion sûre à l'intérieur d'une chaîne JS à guillemets
// simples, elle-même dans un attribut HTML à guillemets doubles (ex: onclick="fn('...')") :
// il faut neutraliser à la fois le guillemet simple (fin de la chaîne JS) et le double
// (fin de l'attribut HTML).
function escapeJsAttr(str) {
  return String(str ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// Anonymise un nom complet en "Prénom N." (ex: "Jean Dupont" -> "Jean D.", "Sarah" ->
// "Sarah" inchangé, "Alexandre Martin Dupont" -> "Alexandre D." — seule l'initiale du
// DERNIER mot est gardée, pas des mots intermédiaires). Appliquée à l'ÉCRITURE (avant
// même que le nom n'atteigne Firestore, dans syncLeaderboardEntry()/
// registerBossBattleContributionIfNeeded()) — pas seulement à l'affichage — pour que le
// nom complet ne soit JAMAIS stocké dans les collections communautaires partagées,
// lisibles par n'importe quel autre utilisateur authentifié. Idempotente (appliquer
// deux fois ne change rien : "Jean D." redonne "Jean D."), donc sans risque de
// ré-appliquer aussi à l'affichage en filet de sécurité sur d'éventuelles données déjà
// écrites avant ce correctif.
// Repli 'Athlete' (anglais, pas de t()) si fullName est vide : cette valeur est ECRITE
// dans Firestore (collections communautaires partagees), lue par TOUS les autres
// utilisateurs quelle que soit LEUR langue — un repli traduit a la source figerait la
// langue de l'AUTEUR au moment de l'ecriture pour tous les lecteurs (aucun mecanisme de
// re-traduction a la lecture pour les noms, contrairement a exerciseSlug). L'anglais est
// le choix le plus largement compris par un public FR/EN/ES, donc le repli "le moins
// pire" tant qu'il reste dans une seule langue fixe.
function formatDisplayName(fullName) {
  const trimmed = String(fullName ?? '').trim().replace(/\s+/g, ' ');
  if (!trimmed) return 'Athlete';
  const parts = trimmed.split(' ');
  if (parts.length === 1) return parts[0];
  const lastInitial = parts[parts.length - 1].charAt(0).toUpperCase();
  return `${parts[0]} ${lastInitial}.`;
}

// formatSecToReadable / formatTargetLabel vivent désormais dans exercise-data.js
// (script classique chargé avant celui-ci, voir <head>) — restent des globaux,
// aucun changement d'usage ici.

// Bug reel signale (retour utilisateur) : cliquer sur Kilito (accueil) faisait
// clignoter une fraction de seconde les apercus d'exercice des cartes en
// dessous, alors qu'aucune de leurs donnees ne change au clic. Cause reelle :
// render() remplace TOUJOURS tout le innerHTML de #app (architecture du
// projet, voir CLAUDE.md) - chaque <img> de vignette est donc entierement
// RECREEE a chaque re-rendu, meme quand son src est identique. Une image deja
// en cache HTTP ne re-telecharge rien, mais le nouveau noeud <img> redemarre
// quand meme a zero cote DOM : `loading="lazy"` retarde le debut du chargement
// (recalcul d'intersection avec le viewport avant meme de consulter le cache),
// puis onload() ne se declenche que de façon asynchrone (au moins un tour de
// boucle d'evenements) avant que la classe .loaded ne retire le skeleton
// "shimmer" - assez de delai pour un flash perceptible, sans le moindre
// veritable re-telechargement. Corrige en memorisant, cote client et pour la
// SESSION uniquement (jamais persiste), quelles vignettes ont deja fini de
// charger au moins une fois : un re-rendu ulterieur du MEME exercice rend
// alors sa vignette DEJA marquee .loaded (et en chargement "eager", puisqu'on
// sait deja qu'elle est utile) directement dans le HTML genere, sans jamais
// repasser par l'etat "shimmer" ni attendre un nouvel evenement onload.
let loadedPictoKeys = new Set();
// Meme principe, pour l'image "hero" (GIF/APNG de demonstration) de la fiche
// d'exercice - voir son site d'utilisation, plus bas, pour le detail du bug
// resolu (flash a CHAQUE tap +5/+10, pas seulement a l'ouverture de la fiche).
let loadedHeroImageKeys = new Set();

// EXERCISE_PICTOGRAMS, EXERCISE_ICON_BY_NAME, PICTOGRAM_ASSET_MISSING et
// getExercisePictogramKey() vivent désormais dans exercise-pictograms.js /
// exercise-data.js (scripts classiques chargés avant celui-ci, voir <head>) —
// toujours des globaux, aucun changement d'usage ici.
function renderExercisePicto(c) {
  const key = getExercisePictogramKey(c);
  const svg = EXERCISE_PICTOGRAMS[key] || EXERCISE_PICTOGRAMS.generic;
  if (PICTOGRAM_ASSET_MISSING.has(key)) {
    // Aucun fichier exercices/{key}(-static).png|webp n'existe pour cette clé : on
    // rend directement le SVG, sans requête réseau vouée à un 404 garanti (et sans
    // effet de chargement puisqu'il n'y a rien à attendre).
    return `<div class="exercise-picto loaded"><div class="exercise-picto-fallback" style="display:flex;">${svg}</div></div>`;
  }
  // Essaie d'abord le WebP (généré par generate-webp-assets.py, bien plus léger),
  // puis le PNG si absent, puis le pictogramme SVG dessiné à la main en dernier
  // recours — aucune modification de code nécessaire au fur et à mesure que les
  // images arrivent. width/height fixes : cohérent avec le conteneur (déjà de
  // taille fixe) et évite tout redimensionnement implicite pendant le décodage.
  // La classe .loaded (posée par onload OU par le dernier repli onerror, quel que
  // soit le chemin emprunté) fait disparaître le skeleton "shimmer" et fait
  // apparaître l'image en fondu, pour ne jamais montrer de pop-in brut.
  const alreadyLoaded = loadedPictoKeys.has(key);
  return `
    <div class="exercise-picto${alreadyLoaded ? ' loaded' : ''}">
      <img src="exercices/${key}-static.webp" alt="${escapeHtml(challengeDisplayName(c))}" loading="${alreadyLoaded ? 'eager' : 'lazy'}" decoding="async" width="64" height="64"${alreadyLoaded ? ' class="loaded"' : ''}
           onload="loadedPictoKeys.add('${key}'); this.classList.add('loaded'); this.parentElement.classList.add('loaded');"
           onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='exercices/${key}-static.png';}else{loadedPictoKeys.add('${key}'); this.style.display='none'; this.nextElementSibling.style.display='flex'; this.parentElement.classList.add('loaded');}">
      <div class="exercise-picto-fallback">${svg}</div>
    </div>
  `;
}

// ==== WAKE LOCK (empêche l'écran de s'éteindre pendant un chrono) ====
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {
    console.error('Wake Lock non disponible :', e);
  }
}

async function releaseWakeLock() {
  if (wakeLock) {
    try { await wakeLock.release(); } catch (e) { /* déjà relâché */ }
    wakeLock = null;
  }
}

// Le Wake Lock est automatiquement relâché par le système quand l'onglet passe
// en arrière-plan (écran verrouillé, changement d'appli...). On le redemande
// dès que l'app redevient visible, tant que le chrono tourne toujours.
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && timerRunning && !wakeLock) {
    await requestWakeLock();
  }
});

function clearTimerState() {
  if (timerIntervalId) clearInterval(timerIntervalId);
  timerIntervalId = null;
  timerRunning = false;
  timerStartMs = null;
  lastBeepSecond = 0;
  lastVoiceCueSecond = null;
  clearPrepCountdown();
  releaseWakeLock();
}

// ==== COMPTE À REBOURS (3... 2... 1...) ====
// Deux modes, partageant le même overlay/décompte :
// - 'start' (défaut) : décompte de préparation classique avant le tout premier
//   démarrage, se termine par "C'est parti !".
// - 'hardcore' : au passage en mode Hardcore, annonce d'abord "Mode Hardcore
//   enclenché !", puis (une fois la phrase terminée) le même décompte 3-2-1,
//   sans "C'est parti !" à la fin.
// Overlay ajouté directement au DOM (comme showToast()), indépendant du cycle render().
let prepCountdownValue = null;
let prepCountdownTimeoutId = null;
let prepCountdownMode = 'start';

// mode :
// - 'start' (défaut) : décompte de préparation classique, se termine par "C'est parti !".
// - 'hardcore-first' : tout premier lancement du Hardcore après l'objectif normal ->
//   annonce "Mode Hardcore enclenché !" puis décompte. Cette annonce ne doit se
//   produire qu'une seule fois (cf. entry.hardcoreAnnounced dans toggleTimer()).
// - 'hardcore-repeat' : reprises suivantes du Hardcore -> décompte immédiat, sans
//   ré-annoncer la phrase (déjà entendue), ni dire "C'est parti !" à la fin.
function beginPrepCountdown(mode) {
  unlockTimerAudio(); // dans le geste utilisateur du clic, pour débloquer l'audio (Safari/iOS)
  clearPrepCountdown();
  prepCountdownMode = mode || 'start';
  prepCountdownValue = 3;
  if (prepCountdownMode === 'hardcore-first') {
    // attend la fin REELLE de l'annonce (callback onend de SpeechSynthesis) avant
    // d'entamer le decompte audible, plutot qu'un delai fixe devine (speak() annule
    // sinon l'utterance en cours si on enchaine trop tot -> phrase coupee mi-mot).
    speak(t('popups.voiceCoach.hardcoreEngaged'), () => {
      if (prepCountdownValue === null) return; // decompte annule entretemps (clearPrepCountdown)
      renderPrepCountdownOverlay();
      speak('3');
      prepCountdownTimeoutId = setTimeout(prepCountdownTick, 1000);
    });
  } else {
    renderPrepCountdownOverlay();
    speak('3');
    prepCountdownTimeoutId = setTimeout(prepCountdownTick, 1000);
  }
}

function prepCountdownTick() {
  if (prepCountdownValue === null) return;
  prepCountdownValue -= 1;
  if (prepCountdownValue > 0) {
    renderPrepCountdownOverlay();
    speak(String(prepCountdownValue));
    prepCountdownTimeoutId = setTimeout(prepCountdownTick, 1000);
  } else {
    clearPrepCountdown();
    if (prepCountdownMode === 'start') speak(t('popups.voiceCoach.go'));
    startTimer();
  }
}

function clearPrepCountdown() {
  if (prepCountdownTimeoutId) clearTimeout(prepCountdownTimeoutId);
  prepCountdownTimeoutId = null;
  prepCountdownValue = null;
  prepCountdownMode = 'start';
  if (typeof window !== 'undefined' && window.speechSynthesis) window.speechSynthesis.cancel();
  const el = document.getElementById('prepCountdownOverlay');
  if (el) el.remove();
}

function renderPrepCountdownOverlay() {
  let el = document.getElementById('prepCountdownOverlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'prepCountdownOverlay';
    el.className = 'prep-countdown-overlay';
    document.body.appendChild(el);
  }
  el.innerHTML = `<div class="prep-countdown-number">${prepCountdownValue}</div>`;
}

let lastVoiceCueSecond = null;

// Annonce vocale à l'approche de l'objectif NORMAL (chronos en secondes uniquement) :
// "3... 2... 1..." puis "Défi terminé ! Bravo !" une fois l'objectif atteint. Ne
// concerne que la phase normale : une fois entry.done, la phase Hardcore n'a pas
// de décompte (cf. tickTimer/toggleTimer pour ses propres annonces).
function announceTimerVoiceCues(elapsed) {
  if (!voiceCoachEnabled || !currentChallengeId) return;
  const c = getChallenge();
  if (!c || c.unit !== 'sec') return;
  const entry = getEntry(currentChallengeId);
  if (entry.done) return;
  const target = getTarget();
  if (!target) return;
  const remaining = target - (getTotal() + elapsed);
  if (remaining <= 3 && remaining >= 1 && remaining !== lastVoiceCueSecond) {
    lastVoiceCueSecond = remaining;
    speak(String(remaining));
  } else if (remaining <= 0 && lastVoiceCueSecond !== 0) {
    lastVoiceCueSecond = 0;
    speak(t('popups.voiceCoach.challengeDone'));
  }
}

function startTimer() {
  timerRunning = true;
  timerStartMs = Date.now();
  lastBeepSecond = 0;
  lastVoiceCueSecond = null;
  unlockTimerAudio();
  timerIntervalId = setInterval(tickTimer, 250);
  requestWakeLock();
  render();
}

// Clic sur le disque du chrono (anneau entier cliquable) : bascule Play/Valider.
// - Pas encore d'objectif normal atteint -> décompte de préparation (3-2-1) puis démarrage.
// - Objectif normal déjà atteint (Hardcore pas encore réussi) -> décompte (3-2-1) avant
//   le démarrage réel ; l'annonce "Mode Hardcore enclenché !" ne se produit qu'au tout
//   premier lancement (cf. entry.hardcoreAnnounced), jamais sur les reprises suivantes.
// - Hardcore déjà réussi -> plus rien à démarrer.
function toggleTimer() {
  if (timerRunning) {
    stopTimer();
    return;
  }
  if (!currentChallengeId) return;
  const entry = getEntry(currentChallengeId);
  if (entry.hardcoreDone) return;
  if (entry.done) {
    if (!entry.hardcoreAnnounced) {
      entry.hardcoreAnnounced = true;
      saveState();
      beginPrepCountdown('hardcore-first');
    } else {
      beginPrepCountdown('hardcore-repeat');
    }
  } else {
    beginPrepCountdown();
  }
}

// À chaque tick : met à jour l'affichage, puis détecte le franchissement de
// l'objectif normal ou Hardcore pour arrêter automatiquement le chrono (plus besoin
// d'un bouton Stop manuel) et déclencher l'annonce vocale correspondante.
function tickTimer() {
  const elapsed = Math.floor((Date.now() - timerStartMs) / 1000);
  const entry = getEntry(currentChallengeId);
  const target = getTarget();
  const hcTarget = getHardcoreTarget(getChallenge());
  const projected = getTotal() + elapsed;

  // Le nombre affiché ne montre QUE le temps écoulé de la série en cours (repart
  // toujours de 0:00 à chaque démarrage) ; les anneaux, eux, restent cumulatifs
  // (progression globale vers l'objectif du jour) — deux informations distinctes.
  const el = document.getElementById('timerDisplay');
  if (el) el.textContent = formatTimer(elapsed);
  updateTimerRingDOM(elapsed);

  if (elapsed > 0 && elapsed % 30 === 0 && elapsed !== lastBeepSecond) {
    lastBeepSecond = elapsed;
    playTimerBeep();
  }

  announceTimerVoiceCues(elapsed);

  if (!entry.done && projected >= target) {
    stopTimer(elapsed); // arrêt automatique : "Défi terminé !" déjà annoncé ci-dessus, les popups XP/trophée suivent via addSet()
  } else if (entry.done && !entry.hardcoreDone && projected >= hcTarget) {
    if (voiceCoachEnabled) speak(t('popups.voiceCoach.hardcoreSuccess'));
    stopTimer(elapsed); // arrêt définitif
  }
}

// `precomputedElapsed` évite un léger écart d'arrondi quand stopTimer() est appelé
// depuis tickTimer() (arrêt automatique) plutôt que depuis un clic manuel (pause).
async function stopTimer(precomputedElapsed) {
  const elapsed = precomputedElapsed !== undefined ? precomputedElapsed : Math.round((Date.now() - timerStartMs) / 1000);
  clearTimerState();
  if (elapsed > 0) {
    await addSet(elapsed);
  } else {
    render();
  }
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

function formatDateLabel(d) {
  const days = t('dates.daysFull');
  const months = t('dates.monthsAbbr');
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}
