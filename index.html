<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Défi du Jour</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Défi du Jour">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<!-- Firebase (gratuit, plan Spark) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  @font-face {
    font-family: 'system-condensed';
    src: local('Arial Narrow');
  }

  :root {
    --bg: #0a0d0b;
    --bg-raised: #121613;
    --bg-card: #171c18;
    --chalk: #eef2ef;
    --chalk-dim: #8a958e;
    --accent: #39e97a;
    --accent-soft: #1f6b3e;
    --accent-dim: #235c39;
    --accent-glow: rgba(57, 233, 122, 0.35);
    --line: #212a23;
    --good: #5fbf7a;
    --danger: #ef5350;
    --hardcore: #ff6b35;
    --track-bg: #1e293b; /* fond distinct des jauges de progression (XP, series, trophees) */
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--chalk);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    overscroll-behavior-y: contain;
  }

  body {
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.03), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(255,255,255,0.02), transparent 50%);
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 18px 100px;
    min-height: 100vh;
    opacity: 1;
    transition: opacity 0.14s ease;
  }
  .app.fade-out {
    opacity: 0;
  }

  /* BARRE DE NAVIGATION PERSISTANTE (bas d'écran) */
  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    background: var(--bg-raised);
    border-top: 1px solid var(--line);
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
    z-index: 500;
  }
  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: none;
    border: none;
    color: var(--chalk-dim);
    font-size: 10.5px;
    font-weight: 700;
    padding: 6px 2px;
    cursor: pointer;
    border-radius: 12px;
    transition: color 0.15s ease;
  }
  .tab-btn:active {
    background: var(--bg-card);
    transform: scale(0.96);
  }
  .tab-icon {
    font-size: 21px;
    line-height: 1;
    transition: transform 0.15s ease;
  }
  .tab-btn.active {
    color: var(--accent);
  }
  .tab-btn.active .tab-icon {
    transform: scale(1.18);
    filter: drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 10px var(--accent-glow)) drop-shadow(0 0 20px var(--accent-glow));
    animation: tab-icon-halo-pulse 1.8s ease-in-out infinite;
  }
  @keyframes tab-icon-halo-pulse {
    0%, 100% { filter: drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 10px var(--accent-glow)) drop-shadow(0 0 20px var(--accent-glow)); }
    50% { filter: drop-shadow(0 0 5px var(--accent)) drop-shadow(0 0 16px var(--accent-glow)) drop-shadow(0 0 28px var(--accent-glow)); }
  }
  .tab-label {
    letter-spacing: 0.01em;
  }

  /* MINI TOUR GUIDÉ (première connexion) — arrière-plan assombri + flou pour détacher
     nettement la bulle de formation du reste de l'app (immersif, premier plan net). */
  /* Overlay ultra-léger par défaut (étapes d'explication des onglets) : l'utilisateur
     doit continuer à voir clairement l'interface derrière la bulle. Seule la toute
     1ère carte (introduction, .intro) assombrit/floute pour annoncer le tutoriel. */
  .tour-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0 18px calc(64px + env(safe-area-inset-bottom, 0px));
    z-index: 600;
    background: rgba(0, 0, 0, 0.15);
    animation: app-popup-fade-in 0.25s ease;
  }
  .tour-overlay.intro {
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .tour-bubble {
    pointer-events: auto;
    width: 100%;
    max-width: 444px;
    background: var(--bg-card);
    border: 1.5px solid var(--accent);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }
  .tour-bubble-title {
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 6px;
  }
  .tour-bubble-text {
    font-size: 13px;
    color: var(--chalk-dim);
    line-height: 1.5;
    margin-bottom: 14px;
  }
  .tour-bubble-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .tour-dots { display: flex; gap: 5px; }
  .tour-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line);
  }
  .tour-dot.active { background: var(--accent); }
  .tour-next-btn {
    background: var(--accent);
    color: #0a0d0b;
    border: none;
    font-weight: 800;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tour-next-btn:active { transform: scale(0.96); }

  .tour-spinner {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 4px solid var(--line);
    border-top-color: var(--accent);
    margin: 0 auto;
    animation: tour-spin 0.8s linear infinite;
  }
  @keyframes tour-spin { to { transform: rotate(360deg); } }

  /* COMPTE À REBOURS DE PRÉPARATION (avant démarrage du chrono) */
  .prep-countdown-overlay {
    position: fixed;
    inset: 0;
    z-index: 950;
    background: rgba(6,10,8,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .prep-countdown-number {
    font-size: 160px;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 0 60px var(--accent-glow);
    animation: prep-countdown-pop 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes prep-countdown-pop {
    from { transform: scale(0.4); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* POPUP PLEIN ÉCRAN STYLE DUOLINGO — série/bouclier, fin de défi (XP/trophée),
     level up, nouveau titre (epic) ; z-index au-dessus du confetti (998). */
  .app-popup-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(6,10,8,0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    animation: app-popup-fade-in 0.2s ease;
  }
  @keyframes app-popup-fade-in { from { opacity: 0; } to { opacity: 1; } }
  .app-popup-card {
    background: var(--bg-card);
    border: 1px solid var(--accent-dim);
    border-radius: 22px;
    padding: 40px 28px 28px;
    text-align: center;
    max-width: 340px;
    width: 100%;
    animation: app-popup-pop-in 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes app-popup-pop-in {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  /* Variante "épique" (Hardcore, nouveau titre) : bordure dorée pulsante premium */
  .app-popup-card.epic {
    border: 1.5px solid #ffd700;
    box-shadow: 0 0 30px rgba(255,215,0,0.35), 0 0 70px rgba(255,215,0,0.15);
    animation: app-popup-pop-in 0.4s cubic-bezier(.34,1.56,.64,1), app-popup-epic-glow 1.6s ease-in-out infinite;
  }
  @keyframes app-popup-epic-glow {
    0%, 100% { box-shadow: 0 0 30px rgba(255,215,0,0.35), 0 0 70px rgba(255,215,0,0.15); }
    50% { box-shadow: 0 0 44px rgba(255,215,0,0.55), 0 0 100px rgba(255,215,0,0.28); }
  }
  .app-popup-icon {
    font-size: 72px;
    line-height: 1;
    animation: app-popup-icon-bounce 0.7s ease-in-out infinite alternate;
  }
  @keyframes app-popup-icon-bounce {
    from { transform: translateY(0) scale(1); }
    to { transform: translateY(-8px) scale(1.06); }
  }
  .app-popup-icon.locked {
    filter: grayscale(1) opacity(0.45);
    animation: none; /* un trophee verrouille ne "respire" pas comme un trophee obtenu */
  }
  /* Barre de progression en temps réel (modal de détail d'un trophée) — même
     langage visuel que les jauges d'XP : épaisse, bords arrondis, lueur néon. */
  .popup-progress-track {
    height: 10px;
    border-radius: 9999px;
    background: var(--track-bg);
    border: 1px solid var(--line);
    margin-top: 18px;
  }
  .popup-progress-fill {
    height: 100%;
    border-radius: 9999px;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    box-shadow: 0 0 10px var(--accent-glow), 0 0 4px var(--accent);
    transition: width 0.3s;
  }
  .popup-progress-label {
    font-size: 12.5px;
    color: var(--chalk-dim);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .app-popup-title { font-size: 21px; font-weight: 900; margin-top: 14px; }
  .app-popup-card.epic .app-popup-title { color: #ffd700; letter-spacing: 0.02em; }
  .app-popup-big {
    font-size: 30px;
    font-weight: 900;
    color: var(--accent);
    margin: 14px 0 6px;
    line-height: 1.2;
  }
  .app-popup-card.epic .app-popup-big { color: #ffd700; text-shadow: 0 0 18px rgba(255,215,0,0.5); }
  .app-popup-sub { font-size: 14px; color: var(--chalk-dim); line-height: 1.5; margin-top: 4px; }
  .app-popup-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 18px;
  }
  .popup-chip {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 800;
  }
  .popup-chip.xp-chip { color: var(--accent); border-color: var(--accent-dim); }
  .popup-chip.trophy-chip { color: #ffd700; border-color: rgba(255,215,0,0.4); }
  .app-popup-btn {
    width: 100%;
    background: var(--accent);
    color: #0a0d0b;
    border: none;
    font-weight: 800;
    font-size: 15px;
    padding: 14px;
    border-radius: 14px;
    cursor: pointer;
    margin-top: 22px;
  }
  .app-popup-card.epic .app-popup-btn { background: #ffd700; }
  .app-popup-btn:active { transform: scale(0.97); }

  /* CARTE ATHLÈTE (niveau, titre, XP) — onglet Profil, cliquable (parcours de niveau) */
  .athlete-card {
    background: linear-gradient(135deg, rgba(57,233,122,0.10), rgba(57,233,122,0.02));
    border: 1px solid var(--accent-dim);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 22px;
    cursor: pointer;
  }
  .athlete-card:active { transform: scale(0.98); }
  .athlete-level-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2px;
  }
  .athlete-level { font-size: 20px; font-weight: 900; }
  .athlete-title { font-size: 20px; color: var(--accent); font-weight: 900; margin-bottom: 22px; text-shadow: 0 0 16px var(--accent-glow); }
  .athlete-xp-track {
    height: 10px;
    border-radius: 9999px;
    background: var(--track-bg);
    border: 1px solid var(--line);
  }
  .athlete-xp-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    border-radius: 9999px;
    box-shadow: 0 0 10px var(--accent-glow), 0 0 4px var(--accent);
    transition: width 0.3s;
  }
  .athlete-xp-label {
    font-size: 11.5px;
    color: var(--chalk-dim);
    margin-top: 6px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* PARCOURS DE NIVEAU — page complète ouverte depuis la carte athlète */
  .level-roadmap-overlay {
    position: fixed;
    inset: 0;
    z-index: 970;
    background: var(--bg);
    overflow-y: auto;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    animation: app-popup-fade-in 0.2s ease;
  }
  .level-roadmap-sheet {
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }
  .level-roadmap-close {
    position: absolute;
    top: 0;
    right: 0;
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--chalk);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
  }
  .level-roadmap-close:active { transform: scale(0.94); }
  .level-roadmap-header { padding-top: 8px; margin-bottom: 26px; }
  .level-roadmap-level { font-size: 30px; font-weight: 900; margin-bottom: 2px; }
  .level-roadmap-title { font-size: 22px; color: var(--accent); font-weight: 900; margin-bottom: 24px; text-shadow: 0 0 16px var(--accent-glow); }
  .level-roadmap-xp-label {
    font-size: 12px;
    color: var(--chalk-dim);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .roadmap-list { display: flex; flex-direction: column; gap: 8px; }
  .roadmap-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
  }
  /* Icône grisée pour un palier verrouillé, mais texte toujours bien lisible
     (gris clair, PAS l'ancienne opacité ~0.5 sur toute la ligne qui rendait le
     titre du palier quasi invisible). */
  .roadmap-row:not(.unlocked) .roadmap-row-icon { opacity: 0.5; }
  .roadmap-row:not(.unlocked) .roadmap-row-title,
  .roadmap-row:not(.unlocked) .roadmap-row-range {
    color: rgba(209, 213, 219, 0.7);
  }
  .roadmap-row.current {
    border-color: var(--accent);
    box-shadow: 0 0 16px var(--accent-glow);
  }
  .roadmap-row-icon { font-size: 18px; width: 22px; text-align: center; flex-shrink: 0; color: #9aa0a6; }
  .roadmap-row.current .roadmap-row-icon { color: var(--accent); opacity: 1; }
  .roadmap-row-title { font-size: 14.5px; font-weight: 800; }
  .roadmap-row-range { font-size: 12px; color: var(--chalk-dim); margin-top: 2px; }

  /* PARAMÈTRES (onglet Profil) */
  .settings-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px 16px;
    margin-bottom: 26px;
  }
  .settings-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
  }
  .settings-row-label { font-size: 14.5px; font-weight: 700; }
  .settings-row-desc { font-size: 12px; color: var(--chalk-dim); font-weight: 400; margin-top: 3px; line-height: 1.4; }
  .switch {
    width: 46px;
    height: 26px;
    border-radius: 20px;
    background: var(--line);
    border: none;
    position: relative;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .switch.on { background: var(--accent); }
  .switch-knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--chalk);
    transition: left 0.2s;
  }
  .switch.on .switch-knob { left: 22px; }

  /* HEADER */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 22px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .header .date {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    font-weight: 600;
  }
  .header .streak {
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .header .streak:active { background: var(--bg-raised); transform: scale(0.95); }

  /* HISTORY SCREEN */
  .history-back {
    background: none;
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    margin-bottom: 18px;
  }
  .history-back:active { background: var(--bg-raised); transform: scale(0.95); }

  .share-stats-btn {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, var(--accent-dim), var(--accent));
    color: #0a0d0b;
    border: none;
    font-weight: 800;
    font-size: 14.5px;
    padding: 14px;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 24px;
  }
  .share-stats-btn:active { transform: scale(0.98); }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 26px;
  }
  .cal-dow {
    text-align: center;
    font-size: 10px;
    color: var(--chalk-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
  }
  .cal-cell {
    aspect-ratio: 1;
    border-radius: 7px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--chalk-dim);
    position: relative;
  }
  .cal-cell.done {
    background: var(--good);
    border-color: var(--good);
    color: #0a0d0b;
    font-weight: 800;
  }
  .cal-cell.today {
    border-color: var(--accent);
    border-width: 2px;
  }
  .cal-cell.empty {
    background: none;
    border: none;
  }

  .history-list-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--chalk-dim);
    font-weight: 700;
    margin: 0 0 10px;
  }
  .history-entry {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .history-entry .hdate {
    font-size: 11px;
    color: var(--chalk-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }
  .history-entry .hname {
    font-size: 14.5px;
    font-weight: 700;
  }
  .history-entry .hprogress {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--chalk-dim);
    white-space: nowrap;
    margin-left: 10px;
  }
  .history-entry .hprogress.done {
    color: var(--good);
    font-weight: 700;
  }
  .history-empty {
    text-align: center;
    color: var(--chalk-dim);
    padding: 30px 0;
    font-size: 14px;
  }

  /* HEATMAP — grille en pourcentage (pas de largeur fixe) pour tenir sur 100%
     de la largeur de l'écran sans scroll horizontal ; les cellules (carrées,
     via aspect-ratio) rétrécissent ensemble plutôt que de déborder. */
  .heatmap-grid {
    display: grid;
    grid-template-columns: repeat(26, 1fr);
    grid-template-rows: repeat(7, 1fr);
    grid-auto-flow: column;
    gap: 2px;
    width: 100%;
    margin-bottom: 8px;
  }
  .heat-cell {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 2px;
    background: var(--bg-card);
    border: 1px solid var(--line);
  }
  .heat-cell.lvl1 { background: #1a2e20; border-color: #1a2e20; }
  .heat-cell.lvl2 { background: var(--accent-dim); border-color: var(--accent-dim); }
  .heat-cell.lvl3 { background: var(--accent); border-color: var(--accent); }
  .heat-cell.future { visibility: hidden; }
  .heat-legend {
    display: flex;
    align-items: center;
    gap: 4px;
    justify-content: flex-end;
    font-size: 10px;
    color: var(--chalk-dim);
    margin-bottom: 26px;
  }
  .heat-legend .heat-cell { width: 10px; height: 10px; }

  /* TROPHY GRID (onglet Profil, verrouillés + débloqués) — cliquables (popover de détail) */
  .trophy-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 26px;
  }
  .trophy-item {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 4px;
    text-align: center;
    cursor: pointer;
  }
  .trophy-item:active { transform: scale(0.95); }
  .trophy-item.unlocked {
    border-color: var(--accent-dim);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .trophy-item.locked .badge-icon {
    filter: grayscale(1) opacity(0.45);
  }
  /* Texte bien lisible même verrouillé (gris clair, PAS l'ancienne opacité ~0.5
     sur toute la carte qui rendait le libellé quasi illisible). */
  .trophy-item.locked .badge-label {
    color: rgba(209, 213, 219, 0.7);
  }
  .badge-lock-badge {
    position: absolute;
    bottom: -2px;
    right: 50%;
    transform: translateX(20px);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: #9aa0a6;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ACCOUNT SECTION */
  .account-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 30px;
  }
  .account-info {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .account-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--line);
  }
  .account-avatar-fallback {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--accent-dim);
    color: #0a0d0b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 18px;
  }
  .account-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--chalk);
  }
  .account-email {
    font-size: 12.5px;
    color: var(--chalk-dim);
    margin-top: 1px;
  }
  .signout-btn {
    display: block;
    width: 100%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--chalk);
    font-weight: 700;
    font-size: 14px;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .signout-btn:active { transform: scale(0.98); }
  .delete-account-btn {
    display: block;
    width: 100%;
    background: none;
    border: 1px solid var(--danger);
    color: var(--danger);
    font-weight: 700;
    font-size: 13px;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
  }
  .delete-account-btn:active { background: rgba(217, 99, 79, 0.1); transform: scale(0.98); }

  /* MANAGE LINK + BADGES STRIP */
  .badges-empty {
    color: var(--chalk-dim);
    font-size: 13px;
    text-align: center;
    padding: 16px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .badges-strip {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .badge-chip {
    flex: 0 0 auto;
    width: 76px;
    background: var(--bg-card);
    border: 1px solid var(--accent-dim);
    border-radius: 12px;
    padding: 12px 6px;
    text-align: center;
  }
  .badge-icon { position: relative; font-size: 26px; margin-bottom: 4px; }
  .badge-label {
    font-size: 9.5px;
    color: var(--chalk-dim);
    line-height: 1.2;
  }

  /* DÉFIS (ex-Bibliothèque) — en-tête + bouton compact d'ajout */
  .library-header-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .add-custom-fab {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--bg-card);
    border: 1.5px solid var(--accent-dim);
    color: var(--accent);
    font-size: 20px;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .add-custom-fab:active { transform: scale(0.94); background: var(--bg-raised); }

  /* PROFILE ONBOARDING (coach virtuel) */
  .profile-onboarding {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 2000;
    display: flex;
    flex-direction: column;
    padding: 20px 22px 32px;
  }
  .pf-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .pf-header > div:empty {
    width: 34px;
  }
  .pf-back {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    font-size: 18px;
    cursor: pointer;
  }
  .pf-back:active { transform: scale(0.92); }
  .pf-progress {
    display: flex;
    gap: 6px;
  }
  .pf-dot {
    width: 22px;
    height: 4px;
    border-radius: 3px;
    background: var(--line);
  }
  .pf-dot.active { background: var(--accent); }
  .pf-dot.done { background: var(--accent-dim); }

  .pf-step {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    max-width: 420px;
    margin: 0 auto;
    width: 100%;
  }
  .pf-emoji { font-size: 46px; margin-bottom: 14px; }
  .pf-question {
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 20px;
    line-height: 1.2;
  }
  .pf-subtitle {
    font-size: 13.5px;
    color: var(--chalk-dim);
    line-height: 1.5;
    margin: -10px 0 22px;
  }
  /* ROULEAU DE SÉLECTION (wheel picker) — âge/taille/poids à l'onboarding, à la
     place d'un <input type="number"> pour ne jamais ouvrir le clavier virtuel.
     Défilement natif + scroll-snap : aucune logique de drag/inertie en JS. */
  .wheel-picker {
    position: relative;
    height: 220px; /* 5 lignes visibles de 44px */
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    background: var(--bg-card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    margin-bottom: 20px;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
    mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
    /* force sa propre couche de compositing GPU : evite le jank/repaint chaotique
       que provoque parfois le mask-image sur un conteneur en cours de scroll,
       notamment sur Safari/WebViews mobiles */
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    will-change: scroll-position;
  }
  .wheel-picker::-webkit-scrollbar { display: none; }
  .wheel-picker-track { padding: 88px 0; } /* 2 items de marge haut/bas pour amener les valeurs extrêmes au centre */
  .wheel-picker-item {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: var(--chalk-dim);
    font-variant-numeric: tabular-nums;
    scroll-snap-align: center;
    scroll-snap-stop: always; /* empeche un flick rapide de sauter plusieurs valeurs sans s'arreter */
  }
  /* Cadre de sélection : rectangle complet (pas juste des filets haut/bas) pour
     identifier immédiatement la valeur active du rouleau. */
  .wheel-picker-highlight {
    position: absolute;
    top: 50%;
    left: 8px;
    right: 8px;
    height: 40px;
    transform: translateY(-50%);
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    background: rgba(57, 233, 122, 0.08);
    box-shadow: 0 0 10px var(--accent-glow);
    pointer-events: none;
  }

  .pf-two-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    margin-bottom: 22px;
  }
  .pf-input-group label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--chalk-dim);
    font-weight: 700;
    margin-bottom: 8px;
  }

  .pf-next-btn {
    width: 100%;
    background: var(--accent);
    color: #0a0d0b;
    border: none;
    font-weight: 800;
    font-size: 16px;
    padding: 16px;
    border-radius: 14px;
    cursor: pointer;
  }
  .pf-next-btn:active { transform: scale(0.97); }

  .pf-choice-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  .pf-choice {
    background: var(--bg-card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, transform 0.1s;
  }
  .pf-choice:active { transform: scale(0.98); }
  .pf-choice.selected {
    border-color: var(--accent);
    background: rgba(242, 193, 78, 0.08);
  }
  .pf-choice-emoji { font-size: 26px; }
  .pf-choice-label { font-size: 15px; font-weight: 700; }

  .pf-level-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  .pf-level-card {
    background: var(--bg-card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }
  .pf-level-card:active { transform: scale(0.98); }
  .pf-level-card.selected {
    border-color: var(--accent);
    background: rgba(242, 193, 78, 0.08);
  }
  .pf-level-title { font-size: 16px; font-weight: 800; margin-bottom: 3px; }
  .pf-level-desc { font-size: 12.5px; color: var(--chalk-dim); }

  /* ÉCRAN DE BIENVENUE (intro coach virtuel) */
  .pf-step-welcome { justify-content: center; }
  .pf-welcome-badge {
    width: 76px;
    height: 76px;
    border-radius: 22px;
    background: linear-gradient(145deg, var(--accent), var(--accent-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin: 0 auto 22px;
    box-shadow: 0 10px 30px rgba(242, 193, 78, 0.25);
  }
  .pf-welcome-title {
    font-size: 28px;
    font-weight: 900;
    line-height: 1.25;
    margin: 0 0 16px;
  }
  .pf-brand {
    color: var(--accent);
  }
  .pf-welcome-desc {
    font-size: 14.5px;
    color: var(--chalk-dim);
    line-height: 1.6;
    margin-bottom: 26px;
  }
  .pf-algo-callout {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    background: linear-gradient(135deg, rgba(57,233,122,0.10), rgba(57,233,122,0.03));
    border: 1px solid var(--accent-dim);
    border-radius: 16px;
    padding: 18px;
    text-align: left;
    margin-bottom: 28px;
  }
  .pf-algo-icon {
    font-size: 28px;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 8px rgba(57,233,122,0.3));
  }
  .pf-algo-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 5px;
  }
  .pf-algo-desc {
    font-size: 13px;
    color: var(--chalk);
    line-height: 1.5;
  }

  .save-challenge-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .manage-actions { display: flex; gap: 6px; }
  .icon-btn {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    padding: 7px 9px;
    cursor: pointer;
  }
  .icon-btn.danger { border-color: var(--danger); }
  .icon-btn:active { transform: scale(0.94); }

  /* BIBLIOTHÈQUE — accordéons par catégorie */
  .accordion { margin-bottom: 10px; }
  .accordion-header {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    color: var(--chalk);
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
  }
  .accordion-header:active { transform: scale(0.99); }
  .accordion-chevron {
    display: inline-block;
    color: var(--accent);
    font-size: 19px;
    flex-shrink: 0;
    transition: transform 0.18s ease;
  }
  .accordion.open .accordion-chevron { transform: rotate(90deg); }
  .accordion-title { flex: 1; }
  .accordion-count {
    font-size: 11px;
    font-weight: 700;
    color: var(--chalk-dim);
    background: var(--bg-raised);
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .accordion-count.has-active {
    color: #9dff00;
    background: rgba(157, 255, 0, 0.12);
  }
  .accordion-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px 2px 4px;
  }

  /* DÉFIS — pastille "Actif" (seule différence visuelle avec la carte d'accueil) */
  .active-pill {

    align-items: center;
    gap: 3px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #0a0d0b;
    background: #9dff00;
    padding: 3px 8px;
    border-radius: 999px;
    box-shadow: 0 0 8px rgba(157, 255, 0, 0.55);

  /* AUJOURD'HUI — écran vide (aucun défi actif) */

  }

  .today-empty-title { font-size: 17px; font-weight: 800; margin-bottom: 8px; }
  .today-empty-text {
    font-size: 13.5px;
    color: var(--chalk-dim);
    line-height: 1.5;
    margin-bottom: 22px;
  }
  .today-empty-btn {
    background: var(--accent);
    color: #0a0d0b;
    border: none;
    font-weight: 800;
    font-size: 14.5px;
    padding: 14px 20px;
    border-radius: 12px;
    cursor: pointer;
  }

  .form-field { margin-bottom: 16px; }
  .form-field label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--chalk-dim);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .field-hint {
    text-transform: none;

  .form-field input, .form-field select {

  .form-field input:focus, .form-field select:focus { outline: 1px solid var(--accent); }
  .form-row-2 {

    grid-template-columns: 1fr 1fr;

  .save-challenge-btn {

    color: #0a0d0b;

    font-size: 15px;
    padding: 14px;

  .save-challenge-btn:active { transform: scale(0.98); }

  /* LOGIN SCREEN */

    align-items: center;
    gap: 10px;

    font-size: 15px;
    font-weight: 700;

  .google-btn:active { transform: scale(0.97); }
  .login-error {
    margin-top: 16px;
    color: var(--danger);
    font-size: 13px;
    max-width: 300px;
  }

  h1.title {
    font-family: 'Arial Narrow', system-condensed, sans-serif;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    margin: 0 0 4px;
    line-height: 0.95;
  }
  .subtitle {
    color: var(--chalk-dim);
    font-size: 14px;
    margin-bottom: 26px;
  }

  /* PICKER (no challenge chosen yet) */
  .picker-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .picker-item {
    background: var(--bg-card);
    border: 1px solid var(--line);

    padding: 2px 16px;

  .picker-item:active { transform: scale(0.98); }
  .picker-item:hover { border-color: var(--accent-dim); }

  .picker-item-body {

  .exercise-picto {

  .exercise-hero-apng {
    display: block;

    background: var(--bg-card);

  .picker-item .name {
    font-size: 15.5px;
    font-weight: 600;
  }
  .picker-item .goal {
    font-size: 13px;
    color: var(--chalk-dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    margin-left: 12px;
    text-align: right;
  }
  .last-done {
    font-size: 10.5px;
    color: var(--accent);
    font-weight: 700;
    margin-top: 3px;
    text-transform: none;
    letter-spacing: 0;
  }
  .goal-weight {

    color: var(--chalk-dim);
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .last-done.status-progress {

  .last-done.status-done {

  .last-done.status-hardcore {

  }

  .suggestion-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(242, 193, 78, 0.1);
    border: 1px solid var(--accent-dim);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 18px;
  }
  .suggestion-icon { font-size: 18px; flex-shrink: 0; }
  .suggestion-text {

    color: var(--chalk);

  /* SECTION LABELS in picker */
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--chalk-dim);
    margin: 20px 0 8px;
    font-weight: 700;
  }
  .section-label:first-child { margin-top: 0; }

  /* ACTIVE CHALLENGE VIEW */
  .active-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 6px 20px 20px;
    position: relative;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
  }
  .active-cat {

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let currentUser = null;

async function dbGet(key) {
  const doc = await db.collection('users').doc(currentUser.uid).collection('kv').doc(key).get();
  if (!doc.exists) throw new Error('not found: ' + key);
  return { key, value: doc.data().value };
}

async function dbSet(key, value) {
  await db.collection('users').doc(currentUser.uid).collection('kv').doc(key).set({ value });
  return { key, value };
}

function signIn() {
  const provider = new firebase.auth.GoogleAuthProvider();
  document.getElementById('loginError').textContent = '';
  auth.signInWithPopup(provider).catch(err => {
    document.getElementById('loginError').textContent = "Connexion impossible : " + err.message;
  });
}

function signOutUser() {
  auth.signOut();
}

async function deleteMyAccount() {
  if (!currentUser) return;

  const step1 = confirm(
    '⚠️ ATTENTION\n\nCeci va supprimer DÉFINITIVEMENT toutes tes données : défis, historique, statistiques, records et trophées.\n\nCette action est irréversible. Continuer ?'
  );
  if (!step1) return;

  const step2 = confirm(
    'Es-tu vraiment certain ? Il n\'y aura aucun moyen de récupérer ces données ensuite.'
  );
  if (!step2) return;

  try {
    const uid = currentUser.uid;

    // Supprime tous les documents de données de l'utilisateur (kv store)
    const snap = await db.collection('users').doc(uid).collection('kv').get();
    const batch = db.batch();
    snap.forEach(doc => batch.delete(doc.ref));
    await batch.commit();

    // Tente de supprimer le compte Google Auth lui-même
    try {
      await currentUser.delete();
    } catch (e) {
      if (e.code === 'auth/requires-recent-login') {
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await currentUser.reauthenticateWithPopup(provider);
          await currentUser.delete();
        } catch (e2) {
          console.error('Suppression du compte Auth impossible (données déjà effacées) :', e2);
        }
      } else {
        console.error('Suppression du compte Auth impossible (données déjà effacées) :', e);
      }
    }

    alert('Ton compte et toutes tes données ont été supprimés.');
    await auth.signOut();
  } catch (e) {
    alert('Une erreur est survenue pendant la suppression : ' + e.message);
  }
}

let lastAuthUid = null;

auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    if (lastAuthUid === user.uid) {
      // Firebase peut déclencher ce callback plusieurs fois pour la même session
      // (état mis en cache, puis revalidé ~1s après) — on ignore les répétitions
      // pour ne pas relancer startApp() et perdre la saisie en cours (ex: onboarding profil).
      return;
    }
    lastAuthUid = user.uid;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    startApp();
  } else {
    lastAuthUid = null;
    currentUser = null;

    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

// ==== MOTEUR DE PERSONNALISATION (coach virtuel) ====
// Objectif Final = Objectif Standard × Coef(Niveau) × Coef(Âge) × Coef(Sexe) × Coef(IMC)
// Poids Final    = Poids Standard    × Coef(Niveau) × Coef(Âge) × Coef(Sexe, haltères)
//
// Les "Objectifs Standards" ci-dessus (target/hardcoreTarget/standardWeightKg) sont calibrés
// pour un homme de 30 ans, niveau intermédiaire, IMC normal — volontairement exigeants.
// Sources de calibration (normes ACSM/CSEP pompes) : écart hommes/femmes ~2x en max sur
// un set, écart d'environ -10 à -15% par décennie après 40 ans.

const COEF_LEVEL = {
  debutant: 0.6,      // remise en forme
  intermediaire: 1.0, // 2 séances de sport / semaine (référence)
  avance: 1.2,         // 3+ séances de sport / semaine
};

function getAgeCoef(age) {
  if (age < 30) return 1.0;
  if (age < 40) return 1.0;   // tranche de référence (30 ans)
  if (age < 50) return 0.88;
  if (age < 60) return 0.75;
  if (age < 70) return 0.60;
  return 0.45;
}

function getBmi(heightCm, weightKg) {
  if (!heightCm || !weightKg) return 22; // valeur neutre par défaut
  const heightM = heightCm / 100;
  return weightKg / (heightM * heightM);
}

// Coefficient IMC "brut" (avant pondération par l'impact spécifique à l'exercice)
function getBmiCoefRaw(bmi) {
  if (bmi < 18.5) return 0.9;   // maigreur : masse musculaire souvent moindre
  if (bmi < 25)   return 1.0;   // corpulence normale (référence)
  if (bmi < 30)   return 0.90;  // surpoids : souvent en partie musculaire chez les pratiquants réguliers, malus modéré
  return 0.70;                  // obésité : impact plus marqué sur les mouvements au poids du corps
}

// Coefficient sexe appliqué aux répétitions/secondes, dépend de la catégorie du défi
function getSexRepsCoef(sex, cat) {
  if (sex !== 'femme') return 1.0;
  if (cat === 'Haut du corps') return 0.65; // écart le plus marqué, cohérent avec les normes ACSM pompes
  return 1.0; // Gainage/Core et Bas du corps : pas de malus (endurance/mobilité comparables)
}

// Coefficient sexe appliqué au poids d'haltère suggéré (mouvements du haut du corps)
function getSexWeightCoef(sex) {
  if (sex === 'femme') return 0.6;
  if (sex === 'autre') return 0.8; // valeur neutre intermédiaire
  return 1.0;
}

function computeStandardTarget(c, profile) {
  if (!profile) return c.target;
  const levelCoef = COEF_LEVEL[profile.level] ?? 1;
  const ageCoef = getAgeCoef(profile.age);
  const bmi = getBmi(profile.heightCm, profile.weightKg);
  const bmiRaw = getBmiCoefRaw(bmi);
  const impact = c.bmiImpact ?? 0;
  const bmiEffective = 1 + (bmiRaw - 1) * impact; // pondère l'effet IMC selon l'exercice
  const sexCoef = getSexRepsCoef(profile.sex, c.cat);
  const raw = c.target * levelCoef * ageCoef * sexCoef * bmiEffective;
  const stepped = Math.round(raw / 5) * 5;
  return Math.max(c.unit === 'sec' ? 15 : 10, stepped);
}

function computeStandardWeight(c, profile) {
  if (c.cat !== 'Haltères' || !c.standardWeightKg) return null;
  if (!profile) return Math.round(c.standardWeightKg);
  const levelCoef = COEF_LEVEL[profile.level] ?? 1;
  const ageCoef = getAgeCoef(profile.age);
  const sexCoef = getSexWeightCoef(profile.sex);
  const raw = c.standardWeightKg * levelCoef * ageCoef * sexCoef;
  return Math.max(1, Math.round(raw)); // toujours un nombre entier de kg
}

// ==== ROULEAUX DE SÉLECTION (wheel pickers) — âge/taille/poids ====
// Remplacent les <input type="number"> pour éviter d'ouvrir le clavier virtuel.
// Défilement natif (scroll-snap CSS) ; aucune logique de drag en JS. La valeur
// sélectionnée se déduit simplement du scrollTop courant (pas de suivi d'état
// séparé à synchroniser) : robuste, y compris pendant l'inertie du scroll.
const WHEEL_ITEM_HEIGHT = 44;

function renderWheelPicker(id, min, max, step, suffix) {
  let items = '';
  for (let v = min; v <= max; v += step) {
    items += `<div class="wheel-picker-item">${v}${suffix ? ' ' + suffix : ''}</div>`;
  }
  return `
    <div class="wheel-picker" id="${id}" data-min="${min}" data-max="${max}" data-step="${step}" data-item-height="${WHEEL_ITEM_HEIGHT}"
         onscroll="onWheelPickerScroll('${id}')">
      <div class="wheel-picker-highlight"></div>
      <div class="wheel-picker-track">${items}</div>
    </div>
  `;
}

function getWheelPickerValue(id) {
  const el = document.getElementById(id);
  if (!el) return NaN;
  const itemHeight = parseInt(el.dataset.itemHeight, 10);
  const min = parseInt(el.dataset.min, 10);
  const max = parseInt(el.dataset.max, 10);
  const step = parseInt(el.dataset.step, 10);
  const maxIndex = Math.round((max - min) / step);
  let index = Math.round(el.scrollTop / itemHeight);
  index = Math.max(0, Math.min(maxIndex, index)); // tolère un léger rebond élastique (overscroll iOS)
  return min + index * step;
}

// Retour haptique discret à chaque cran franchi pendant la rotation du rouleau.
// Ne lit QUE le scrollTop (aucune manipulation du DOM/re-render du picker) pour ne
// jamais interférer avec le scroll natif en cours (cause du "re-render chaotique").
const wheelPickerLastValue = {};
function onWheelPickerScroll(id) {
  const value = getWheelPickerValue(id);
  if (wheelPickerLastValue[id] !== value) {
    wheelPickerLastValue[id] = value;
    if (navigator.vibrate) navigator.vibrate(10);
  }
}

function setWheelPickerValue(id, value) {
  const el = document.getElementById(id);
  if (!el) return;
  const itemHeight = parseInt(el.dataset.itemHeight, 10);
  const min = parseInt(el.dataset.min, 10);
  const step = parseInt(el.dataset.step, 10);
  const index = Math.round((value - min) / step);
  el.scrollTop = index * itemHeight;
}

// Positionne les rouleaux visibles sur l'étape courante à leur valeur actuelle
// (celle du brouillon de profil, ou une valeur par défaut raisonnable). Appelé
// en afterRender juste après le rendu de l'écran d'onboarding.
function initWheelPickers() {
  setWheelPickerValue('pfAge', profileDraft.age ?? 30);
  setWheelPickerValue('pfHeight', profileDraft.heightCm ?? 175);
  setWheelPickerValue('pfWeight', profileDraft.weightKg ?? 75);
}

function profileNext() {
  if (profileStep === 0) {
    // Écran de bienvenue : rien à valider, on passe simplement à la suite
  } else if (profileStep === 1) {
    const val = getWheelPickerValue('pfAge');
    if (isNaN(val) || val < 12 || val > 100) {
      alert("Merci d'indiquer un âge valide (12 à 100 ans).");
      return;
    }
    profileDraft.age = val;
  } else if (profileStep === 2) {
    if (!profileDraft.sex) {
      alert('Merci de sélectionner une option.');
      return;
    }
  } else if (profileStep === 3) {
    const h = getWheelPickerValue('pfHeight');
    const w = getWheelPickerValue('pfWeight');
    if (isNaN(h) || h < 100 || h > 250) {
      alert('Merci d\'indiquer une taille valide (100 à 250 cm).');
      return;
    }
    if (isNaN(w) || w < 30 || w > 300) {
      alert('Merci d\'indiquer un poids valide (30 à 300 kg).');
      return;
    }
    profileDraft.heightCm = h;
    profileDraft.weightKg = w;
  } else if (profileStep === 4) {
    if (!profileDraft.level) {
      alert('Merci de sélectionner ton niveau.');
      return;
    }
    finishProfileOnboarding();
    return;
  }
  profileStep++;
  render(true);
}

function profilePrev() {
  if (profileStep > 0) {
    profileStep--;
    render(true);
  }
}

// Objectif/hardcore réellement affichés pour un défi : ceux saisis tels quels pour
// un défi personnalisé, ou l'objectif standard personnalisé (profil) éventuellement

function resolveChallenge(c) {
  if (!c) return c;

}

async function submitChallengeForm() {

  const unit = document.getElementById('cfUnit').value;
  const hcRaw = document.getElementById('cfHardcore').value;
  const hardcoreTarget = hcRaw.trim() === '' ? target * 2 : parseInt(hcRaw, 10);

  if (!name || !cat || isNaN(target) || target <= 0) {
    alert('Merci de remplir tous les champs correctement.');
    return;
  }
  if (isNaN(hardcoreTarget) || hardcoreTarget <= target) {

    return;
  }

  if (editingChallengeId === 'new') {
    customChallenges.push({ id: getNextChallengeId(), cat, name, target, unit, hardcoreTarget, isCustom: true });
  } else {
    const c = customChallenges.find(x => x.id === editingChallengeId);
    if (c) { c.name = name; c.cat = cat; c.target = target; c.unit = unit; c.hardcoreTarget = hardcoreTarget; }
  }
  rebuildChallenges();
  await saveCustomChallenges();
  history.back(); // referme le formulaire (editingChallengeId) via goBackOneLevel, retour à la bibliothèque
}

  await saveCustomChallenges();
  activeToday.delete(id);

  delete manualTargetOverrides[id];
  await saveManualTargetOverrides();

// streakCount / lastCompletedDate / hasShield / lastShieldResetWeek sont regroupés
// dans un seul document Firestore ('streakData'), comme stats/badges/dailyActivity —
// mêmes noms de variables que le cahier des charges, juste stockés en un seul blob JSON.
let streakCount = 0;
let lastCompletedDate = null; // 'YYYY-MM-DD' ou null
let hasShield = true;
let lastShieldResetWeek = null; // clé du lundi de la semaine du dernier reset

async function loadStreakData() {
  try {
    const res = await dbGet('streakData');
    const d = JSON.parse(res.value);
    streakCount = d.streakCount || 0;
    lastCompletedDate = d.lastCompletedDate || null;
    hasShield = d.hasShield !== undefined ? d.hasShield : true;
    lastShieldResetWeek = d.lastShieldResetWeek || null;
  } catch (e) {
    streakCount = 0;
    lastCompletedDate = null;
    hasShield = true;
    lastShieldResetWeek = null;
  }
}
async function saveStreakData() {
  try {
    await dbSet('streakData', JSON.stringify({ streakCount, lastCompletedDate, hasShield, lastShieldResetWeek }));
  } catch (e) { console.error('save streakData failed', e); }
}

function mondayOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay(); // 0=dim..6=sam
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  return dateKey(date);
}

function daysBetween(keyA, keyB) {
  const [ya, ma, da] = keyA.split('-').map(Number);
  const [yb, mb, db] = keyB.split('-').map(Number);
  const a = Date.UTC(ya, ma - 1, da);
  const b = Date.UTC(yb, mb - 1, db);
  return Math.round((b - a) / 86400000);
}

// Appelé une fois au chargement de l'app (après loadState(), donc todayKey connu) :
// recharge le bouclier hebdomadaire si besoin, puis vérifie si un ou plusieurs jours
// ont été manqués depuis la dernière validation.
async function evaluateStreakOnLoad() {
  const wk = mondayOfWeek(new Date());
  if (lastShieldResetWeek !== wk) {
    hasShield = true;
    lastShieldResetWeek = wk;
  }

  let shieldTriggered = false;
  if (streakCount > 0 && lastCompletedDate && lastCompletedDate !== todayKey) {
    const gap = daysBetween(lastCompletedDate, todayKey);
    if (gap >= 2) {
      if (hasShield) {
        hasShield = false;
        shieldTriggered = true;
      } else {
        streakCount = 0;
      }
    }
  }

  await saveStreakData();

  if (shieldTriggered) {
    enqueuePopup({
      icon: '🛡️',
      title: 'Bouclier activé !',
      subtitle: "Ton bouclier de pause t'a sauvé la série ! 🛡️ Pense à réaliser ton défi aujourd'hui.",
    });
  }
}

// Appelé lors de la toute première validation de défi de la journée (dailyActivity

  streakCount += 1;

// ==== POPUPS PLEIN ÉCRAN STYLE DUOLINGO ====
// Un seul moteur de popup pour tous les évènements de gamification (série, bouclier,
// fin de défi/Hardcore avec cartes XP/trophée, level up, nouveau titre) : ajouté
// directement au DOM, comme showToast()/fireConfetti(), indépendant du cycle render().
let popupQueue = [];
let popupOpen = false; // état suivi explicitement (pas de fiabilité à attendre d'un getElementById sur un id qui vient d'être retiré du DOM selon les moteurs)
let currentPopupHtml = ''; // dernier contenu affiché (introspection/tests)

function enqueuePopup(opts) {
  popupQueue.push(opts);
  if (!popupOpen) drainPopupQueue();
}

function buildPopupInnerHtml(next) {
  const chips = [];
  if (next.xp) chips.push(`<div class="popup-chip xp-chip">⚡ +${next.xp} XP</div>`);
  const progressHtml = next.progressLabel ? `
    <div class="popup-progress-track"><div class="popup-progress-fill" style="width:${next.progressPct}%"></div></div>
    <div class="popup-progress-label">${next.progressLabel}</div>
  ` : '';
  return `
    <div class="app-popup-card${next.epic ? ' epic' : ''}">
      <div class="app-popup-icon${next.locked ? ' locked' : ''}">${next.icon}</div>
      <div class="app-popup-title">${next.title}</div>
      ${next.big !== undefined ? `<div class="app-popup-big">${next.big}</div>` : ''}
      ${next.subtitle ? `<div class="app-popup-sub">${next.subtitle}</div>` : ''}
      ${progressHtml}
      ${chips.length ? `<div class="app-popup-chips">${chips.join('')}</div>` : ''}
      <button class="app-popup-btn" id="appPopupCloseBtn">${next.btnLabel || 'Continuer'}</button>
    </div>
  `;
}

function drainPopupQueue() {
  const next = popupQueue.shift();
  if (!next) { popupOpen = false; currentPopupHtml = ''; return; }
  popupOpen = true;
  if (next.variant === 'title' || next.variant === 'trophy') fireConfetti('title');
  const el = document.createElement('div');
  el.id = 'appPopup';
  el.className = 'app-popup-overlay';
  el.innerHTML = buildPopupInnerHtml(next);
  currentPopupHtml = el.innerHTML;
  document.body.appendChild(el);
  document.getElementById('appPopupCloseBtn').onclick = () => {
    el.remove();
    drainPopupQueue();
  };
}

// Seuils d'XP par niveau, en dur et arrondis (demande explicite : des paliers
// "propres" comme 150/350/700/1200, pas une formule qui retomberait sur des
// nombres quelconques). Calibrés sur le gain réel d'un défi Hardcore (~150 à
// 225 XP selon l'exercice, cf. xpForChallenge + HARDCORE_XP_BONUS) pour que 2
// défis Hardcore amènent au plus au niveau 2, ou tout début de niveau 3 —
// avant, l'ancienne courbe faisait grimper à un niveau 4 dès 2 défis.
// Au-delà de la table, la progression continue avec le même facteur de
// croissance que ses derniers paliers (cf. xpForLevel).
const XP_LEVEL_THRESHOLDS = [
  0, 150, 350, 700, 1200, 1750, 2400, 3100, 3900, 4800,
  5800, 6900, 8100, 9500, 11000, 12750, 14750, 17000, 19500, 22250,
  25250, 28750, 32500, 36750, 41500, 47000, 53000, 59750, 67250, 75750,
  85250, 96000, 108000, 121250, 136250, 153000, 171750, 192750, 216250, 242750,
  272250, 305250, 342250, 383750, 430250, 482250, 540500, 605750,
];
const XP_LEVEL_TABLE_GROWTH = 1.12; // croissance des paliers au-dela de la table ci-dessus
function xpForLevel(n) {
  if (n <= 1) return 0;
  if (n <= XP_LEVEL_THRESHOLDS.length) return XP_LEVEL_THRESHOLDS[n - 1];
  const lastIndex = XP_LEVEL_THRESHOLDS.length - 1;
  const lastIncrement = XP_LEVEL_THRESHOLDS[lastIndex] - XP_LEVEL_THRESHOLDS[lastIndex - 1];
  const extra = n - XP_LEVEL_THRESHOLDS.length;
  const growthSum = lastIncrement * XP_LEVEL_TABLE_GROWTH * (Math.pow(XP_LEVEL_TABLE_GROWTH, extra) - 1) / (XP_LEVEL_TABLE_GROWTH - 1);
  return Math.round(XP_LEVEL_THRESHOLDS[lastIndex] + growthSum);
}
function computeLevel(xp) {
  let level = 1;
  while (xpForLevel(level + 1) <= xp) level++;
  return level;
}
function xpProgress(xp) {
  const level = computeLevel(xp);
  const currentThreshold = xpForLevel(level);
  const nextThreshold = xpForLevel(level + 1);
  return { level, xpIntoLevel: xp - currentThreshold, xpNeeded: nextThreshold - currentThreshold };
}

// Titres d'athlète, du niveau 1 au niveau max — source unique utilisée pour le
// titre courant (athleteTitle) ET pour la carte "Parcours de niveau" (roadmap).
const ATHLETE_TITLE_TIERS = [
  { title: 'Recrue 🥉', maxLevel: 5 },
  { title: 'Initié 🎖️', maxLevel: 10 },
  { title: 'Motivé 🥈', maxLevel: 15 },
  { title: 'Régulier 📅', maxLevel: 20 },
  { title: 'Athlète 🥇', maxLevel: 26 },
  { title: 'Guerrier ⚔️', maxLevel: 32 },
  { title: 'Expert ⚡', maxLevel: 38 },
  { title: 'Titan 🏆', maxLevel: 43 },
  { title: 'Demi-Dieu 🌌', maxLevel: 47 },
  { title: 'Légende Immortelle 👑', maxLevel: Infinity },
];
function athleteTitle(level) {
  return ATHLETE_TITLE_TIERS.find(t => level <= t.maxLevel).title;
}
// 50 XP de base + bonus selon le volume (reps/sec) et, pour les haltères, la charge.
function xpForChallenge(c, total) {
  let bonus = c.unit === 'sec' ? Math.round(total / 5) : Math.round(total / 2);
  if (c.cat === 'Haltères') {
    bonus += Math.round(weights[c.id] ?? 8);
  }
  return 50 + Math.max(0, bonus);
}

// cancel() avant chaque prise de parole pour éviter les retards/empilements audio ;
// tolère l'absence de synthèse vocale (navigateur non compatible ou bloquée).
// `onEnd`, si fourni, se déclenche une fois la phrase RÉELLEMENT terminée (callback
// natif SpeechSynthesisUtterance.onend), pour enchaîner un son/décompte sans jamais
// couper l'annonce en cours (cf. le décompte du mode Hardcore). Un filet de sécurité
// (setTimeout) évite de rester bloqué si le navigateur ne déclenche jamais onend.
function speak(text, onEnd) {
  if (!voiceCoachEnabled) {
    if (onEnd) onEnd();
    return;
  }
  if (typeof window === 'undefined' || !window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') {
    if (onEnd) onEnd();
    return;
  }
  try {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'fr-FR';
    if (onEnd) {
      let called = false;
      const finish = () => { if (!called) { called = true; onEnd(); } };
      utterance.onend = finish;
      utterance.onerror = finish;
      setTimeout(finish, 4000); // filet de securite (bug navigateur : onend jamais declenche)
    }
    window.speechSynthesis.speak(utterance);
  } catch (e) {
    console.error('Coach vocal indisponible :', e);
    if (onEnd) onEnd();
  }
}

function formatRelative(ms) {
  if (!ms) return null;
  const diff = Date.now() - ms;
  const min = diff / 60000;
  if (min < 1) return "à l'instant";
  if (min < 60) return `il y a ${Math.round(min)}min`;
  const hrs = diff / 3600000;
  if (hrs < 24) return `il y a ${Math.round(hrs)}h`;
  const days = diff / 86400000;
  return `il y a ${Math.round(days)}j`;
}

function checkNewBadges() {
  const freshlyUnlocked = [];
  for (const b of BADGE_DEFS) {
    if (!badges.unlocked.includes(b.id) && b.check()) {
      badges.unlocked.push(b.id);
      freshlyUnlocked.push(b);
    }
  }
  return freshlyUnlocked;
}

function showToast(html, duration = 2600) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.innerHTML = html;
  el.classList.remove('show');
  void el.offsetWidth; // force reflow pour rejouer l'anim si déjà visible
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), duration);
}

function fireConfetti(variant) {
  const colors = variant === 'hardcore'
    ? ['#ff6b35', '#ef5350', '#ffb347', '#ff9d5c', '#eef2ef']
    : variant === 'title'
    ? ['#ffd700', '#fff2b0', '#39e97a', '#eaffef', '#ffb347']
    : ['#39e97a', '#5fbf7a', '#eaffef', '#1f6b3e', '#eef2ef'];
  const canvas = document.createElement('canvas');
  canvas.className = 'confetti-canvas';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const particles = Array.from({ length: 70 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height * 0.3,
    r: 3 + Math.random() * 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    vx: (Math.random() - 0.5) * 3,
    vy: 2 + Math.random() * 3,
    rot: Math.random() * 360,
    vrot: (Math.random() - 0.5) * 10,
  }));
  let frame = 0;
  function tick() {
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rot += p.vrot;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r, -p.r * 0.6, p.r * 2, p.r * 1.2);
      ctx.restore();
    }
    if (frame < 110) {
      requestAnimationFrame(tick);
    } else {
      canvas.remove();
    }
  }
  tick();
}

function playSuccessSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const notes = [523.25, 659.25, 783.99]; // do-mi-sol
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const start = ctx.currentTime + i * 0.09;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
      osc.start(start);
      osc.stop(start + 0.4);
    });
  } catch (e) { /* audio non disponible, tant pis */ }
}

function getLifetimeSummary() {
  let totalReps = 0, totalSeconds = 0;
  const catVolume = {};
  for (const c of CHALLENGES) {
    const s = stats[c.id];
    if (!s) continue;
    if (c.unit === 'reps') totalReps += s.lifetimeTotal;
    else totalSeconds += s.lifetimeTotal;
    catVolume[c.cat] = (catVolume[c.cat] || 0) + s.lifetimeTotal;
  }
  let favCat = null, favVal = -1;
  for (const [cat, val] of Object.entries(catVolume)) {
    if (val > favVal) { favVal = val; favCat = cat; }
  }
  return { totalReps, totalSeconds, favCat };
}

async function shareStatsImage() {
  showToast('🖼️ Génération de l\'image…', 1500);
  const summary = getLifetimeSummary();
  const streak = computeStreak();
  const completions = badges.totalCompletions;
  const unlockedCount = badges.unlocked.length;

  const W = 1080, H = 1350;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0f1310');
  grad.addColorStop(1, '#0a0d0b');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.beginPath();
  ctx.arc(W - 80, 140, 240, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(57,233,122,0.10)';
  ctx.fill();

  ctx.fillStyle = '#39e97a';
  ctx.font = '700 32px sans-serif';
  ctx.fillText('DÉFI DU JOUR', 64, 100);

  ctx.fillStyle = '#eef2ef';
  ctx.font = '900 66px sans-serif';
  ctx.fillText('Mes stats', 64, 178);

  ctx.fillStyle = '#8a958e';
  ctx.font = '400 26px sans-serif';
  ctx.fillText(new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }), 64, 216);

  ctx.strokeStyle = 'rgba(238,242,239,0.12)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(64, 250); ctx.lineTo(W - 64, 250); ctx.stroke();

  function drawStat(y, label, value, color) {
    ctx.fillStyle = color || '#39e97a';
    ctx.font = '900 92px sans-serif';
    ctx.fillText(value, 64, y);
    ctx.fillStyle = '#8a958e';
    ctx.font = '600 27px sans-serif';
    ctx.fillText(label, 64, y + 38);
  }

  let y = 380;
  drawStat(y, 'jours de suite 🔥', String(streak)); y += 160;
  drawStat(y, 'défis complétés', String(completions)); y += 160;
  drawStat(y, 'répétitions totales', summary.totalReps.toLocaleString('fr-FR')); y += 160;
  if (summary.totalSeconds > 0) {
    drawStat(y, 'minutes chronométrées', String(Math.round(summary.totalSeconds / 60)));
    y += 160;
  }

  if (summary.favCat) {
    ctx.fillStyle = '#5fbf7a';
    ctx.font = '700 30px sans-serif';
    ctx.fillText(`💪 Catégorie favorite : ${summary.favCat}`, 64, y + 10);
  }

  ctx.fillStyle = '#eef2ef';
  ctx.font = '600 26px sans-serif';
  ctx.fillText(`🏆 ${unlockedCount}/${BADGE_DEFS.length} trophées débloqués`, 64, H - 70);

  canvas.toBlob(async (blob) => {
    if (!blob) return;
    const file = new File([blob], 'mes-stats-defi-du-jour.png', { type: 'image/png' });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'Mes stats — Défi du Jour' });
        return;
      } catch (e) { /* annulé par l'utilisateur ou échec, on tente le téléchargement */ }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mes-stats-defi-du-jour.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }, 'image/png');
}

// Cree (ou reprend) l'AudioContext dans le geste utilisateur qui demarre le
// chrono : certains navigateurs (Safari/iOS) bloquent l'audio s'il n'est pas
// initialise depuis un clic direct.
function unlockTimerAudio() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!timerAudioCtx) timerAudioCtx = new AudioCtx();
    if (timerAudioCtx.state === 'suspended') timerAudioCtx.resume();
  } catch (e) { /* audio non disponible, tant pis */ }
}

function playTimerBeep() {
  if (!timerAudioCtx) return;
  try {
    const osc = timerAudioCtx.createOscillator();
    const gain = timerAudioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    osc.connect(gain);
    gain.connect(timerAudioCtx.destination);
    const start = timerAudioCtx.currentTime;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.9, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
    osc.start(start);
    osc.stop(start + 0.32);
  } catch (e) { /* audio non disponible, tant pis */ }
}

function formatTimer(totalSec) {
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${pad(s)}`;
}

// Double anneau concentrique : intérieur (vert néon) = phase normale, extérieur
// (feu) = phase Hardcore, quasiment collé au premier (~1px d'écart visuel une
// fois les demi-épaisseurs de trait prises en compte). Toujours calculés
// ensemble, à partir du total cumulé (+ l'écoulé de la session en cours si elle tourne).
const TIMER_RING_INNER_RADIUS = 78;
const TIMER_RING_OUTER_RADIUS = 88;
const TIMER_RING_INNER_CIRCUMFERENCE = 2 * Math.PI * TIMER_RING_INNER_RADIUS;
const TIMER_RING_OUTER_CIRCUMFERENCE = 2 * Math.PI * TIMER_RING_OUTER_RADIUS;

function computeTimerRingPct(projectedTotal, target, hcTarget) {
  const normalPct = target > 0 ? Math.min(1, projectedTotal / target) : 0;
  const hcRange = hcTarget - target;
  const hcProgress = Math.max(0, projectedTotal - target);
  const hardcorePct = hcRange > 0 ? Math.min(1, hcProgress / hcRange) : 0;
  return { normalPct, hardcorePct };
}

function renderDoubleTimerRingSVG(normalPct, hardcorePct, sizePx) {
  const nClamped = Math.min(1, Math.max(0, normalPct));
  const hClamped = Math.min(1, Math.max(0, hardcorePct));
  const nOffset = TIMER_RING_INNER_CIRCUMFERENCE * (1 - nClamped);
  const hOffset = TIMER_RING_OUTER_CIRCUMFERENCE * (1 - hClamped);
  const size = sizePx || 220;
  return `
    <svg class="timer-ring" viewBox="0 0 220 220" width="${size}" height="${size}">
      <circle class="timer-ring-bg-outer" cx="110" cy="110" r="${TIMER_RING_OUTER_RADIUS}"></circle>
      <circle class="timer-ring-bg-inner" cx="110" cy="110" r="${TIMER_RING_INNER_RADIUS}"></circle>
      <circle class="timer-ring-fill-hardcore${hClamped >= 1 ? ' complete' : ''}" id="timerRingHardcoreFill"
        cx="110" cy="110" r="${TIMER_RING_OUTER_RADIUS}"
        style="stroke-dasharray:${TIMER_RING_OUTER_CIRCUMFERENCE}; stroke-dashoffset:${hOffset};"></circle>
      <circle class="timer-ring-fill${nClamped >= 1 ? ' complete' : ''}" id="timerRingFill"
        cx="110" cy="110" r="${TIMER_RING_INNER_RADIUS}"
        style="stroke-dasharray:${TIMER_RING_INNER_CIRCUMFERENCE}; stroke-dashoffset:${nOffset};"></circle>
    </svg>
  `;
}

// Met à jour les deux anneaux déjà présents dans le DOM (appelé à chaque tick, sans re-render complet)
function updateTimerRingDOM(elapsedSec) {
  if (!currentChallengeId) return;
  const target = getTarget();
  const hcTarget = getHardcoreTarget(getChallenge());
  const total = getTotal();
  const { normalPct, hardcorePct } = computeTimerRingPct(total + elapsedSec, target, hcTarget);

  const ringInner = document.getElementById('timerRingFill');
  if (ringInner) {
    ringInner.style.strokeDashoffset = String(TIMER_RING_INNER_CIRCUMFERENCE * (1 - normalPct));
    ringInner.classList.toggle('complete', normalPct >= 1);
  }
  const ringOuter = document.getElementById('timerRingHardcoreFill');
  if (ringOuter) {
    ringOuter.style.strokeDashoffset = String(TIMER_RING_OUTER_CIRCUMFERENCE * (1 - hardcorePct));
    ringOuter.classList.toggle('complete', hardcorePct >= 1);
  }
}

function formatSecToReadable(totalSec) {
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  if (m === 0) return `${s} s`;
  if (s === 0) return `${m} min`;
  return `${m} min ${s} s`;
}

// Affichage complet d'une valeur cible selon son unité, ex: "335 SEC (5 min 35 s)" ou "100 reps"
function formatTargetLabel(value, unit) {
  if (unit === 'sec') {
    return `${value} SEC (${formatSecToReadable(value)})`;
  }
  return `${value} reps`;
}
