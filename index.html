<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Défi du Jour</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1d1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Défi du Jour">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<!-- Firebase (gratuit, plan Spark) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  @font-face {
    font-family: 'system-condensed';
    src: local('Arial Narrow');
  }

  :root {
    --bg: #1e1d1b;
    --bg-raised: #262421;
    --bg-card: #2b2926;
    --chalk: #ede7db;
    --chalk-dim: #a39d8f;
    --accent: #f2c14e;
    --accent-dim: #a9863a;
    --line: #3d3a35;
    --good: #7fb069;
    --danger: #d9634f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--chalk);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    overscroll-behavior-y: contain;
  }

  body {
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.03), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(255,255,255,0.02), transparent 50%);
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 18px 40px;
    min-height: 100vh;
    opacity: 1;
    transition: opacity 0.14s ease;
  }
  .app.fade-out {
    opacity: 0;
  }

  /* HEADER */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 22px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .header .date {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    font-weight: 600;
  }
  .header .streak {
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .header .streak:active { background: var(--bg-raised); transform: scale(0.95); }

  /* HISTORY SCREEN */
  .history-back {
    background: none;
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    margin-bottom: 18px;
  }
  .history-back:active { background: var(--bg-raised); transform: scale(0.95); }

  .share-stats-btn {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, var(--accent-dim), var(--accent));
    color: #1e1d1b;
    border: none;
    font-weight: 800;
    font-size: 14.5px;
    padding: 14px;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 24px;
  }
  .share-stats-btn:active { transform: scale(0.98); }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 26px;
  }
  .cal-dow {
    text-align: center;
    font-size: 10px;
    color: var(--chalk-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
  }
  .cal-cell {
    aspect-ratio: 1;
    border-radius: 7px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--chalk-dim);
    position: relative;
  }
  .cal-cell.done {
    background: var(--good);
    border-color: var(--good);
    color: #1e1d1b;
    font-weight: 800;
  }
  .cal-cell.today {
    border-color: var(--accent);
    border-width: 2px;
  }
  .cal-cell.empty {
    background: none;
    border: none;
  }

  .history-list-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--chalk-dim);
    font-weight: 700;
    margin: 0 0 10px;
  }
  .history-entry {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .history-entry .hdate {
    font-size: 11px;
    color: var(--chalk-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }
  .history-entry .hname {
    font-size: 14.5px;
    font-weight: 700;
  }
  .history-entry .hprogress {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--chalk-dim);
    white-space: nowrap;
    margin-left: 10px;
  }
  .history-entry .hprogress.done {
    color: var(--good);
    font-weight: 700;
  }
  .history-empty {
    text-align: center;
    color: var(--chalk-dim);
    padding: 30px 0;
    font-size: 14px;
  }

  /* WEEKLY CHART */
  .chart-wrap {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    height: 120px;
    margin-bottom: 26px;
    gap: 6px;
  }
  .chart-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    justify-content: flex-end;
  }
  .chart-bar-track {
    width: 100%;
    max-width: 26px;
    height: 80px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .chart-bar {
    width: 100%;
    background: var(--accent-dim);
    border-radius: 4px 4px 0 0;
    transition: height 0.3s ease;
  }
  .chart-bar.today { background: var(--accent); }
  .chart-val {
    font-size: 10px;
    color: var(--chalk-dim);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
    height: 12px;
  }
  .chart-dow {
    font-size: 10px;
    color: var(--chalk-dim);
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* HEATMAP */
  .heatmap-scroll {
    overflow-x: auto;
    margin-bottom: 8px;
    padding-bottom: 4px;
  }
  .heatmap-grid {
    display: grid;
    grid-template-rows: repeat(7, 12px);
    grid-auto-flow: column;
    grid-auto-columns: 12px;
    gap: 3px;
    width: max-content;
  }
  .heat-cell {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    background: var(--bg-card);
    border: 1px solid var(--line);
  }
  .heat-cell.lvl1 { background: #4a4025; border-color: #4a4025; }
  .heat-cell.lvl2 { background: var(--accent-dim); border-color: var(--accent-dim); }
  .heat-cell.lvl3 { background: var(--accent); border-color: var(--accent); }
  .heat-cell.future { visibility: hidden; }
  .heat-legend {
    display: flex;
    align-items: center;
    gap: 4px;
    justify-content: flex-end;
    font-size: 10px;
    color: var(--chalk-dim);
    margin-bottom: 26px;
  }
  .heat-legend .heat-cell { width: 10px; height: 10px; }

  /* TROPHY GRID (history screen, locked + unlocked) */
  .trophy-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 26px;
  }
  .trophy-item {
    background: var(--bg-card);
    border: 1px solid var(--accent-dim);
    border-radius: 12px;
    padding: 12px 4px;
    text-align: center;
  }
  .trophy-item.locked {
    border-color: var(--line);
    opacity: 0.5;
  }

  /* ACCOUNT SECTION */
  .account-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 30px;
  }
  .account-info {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .account-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--line);
  }
  .account-avatar-fallback {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--accent-dim);
    color: #1e1d1b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 18px;
  }
  .account-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--chalk);
  }
  .account-email {
    font-size: 12.5px;
    color: var(--chalk-dim);
    margin-top: 1px;
  }
  .signout-btn {
    display: block;
    width: 100%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--chalk);
    font-weight: 700;
    font-size: 14px;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .signout-btn:active { transform: scale(0.98); }
  .delete-account-btn {
    display: block;
    width: 100%;
    background: none;
    border: 1px solid var(--danger);
    color: var(--danger);
    font-weight: 700;
    font-size: 13px;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
  }
  .delete-account-btn:active { background: rgba(217, 99, 79, 0.1); transform: scale(0.98); }

  /* MANAGE LINK + BADGES STRIP */
  .manage-link {
    display: block;
    width: 100%;
    background: none;
    border: 1px dashed var(--line);
    color: var(--chalk-dim);
    font-size: 13px;
    font-weight: 600;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 22px;
  }
  .manage-link:active { background: var(--bg-raised); transform: scale(0.98); }

  .badges-empty {
    color: var(--chalk-dim);
    font-size: 13px;
    text-align: center;
    padding: 16px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .badges-strip {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .badge-chip {
    flex: 0 0 auto;
    width: 76px;
    background: var(--bg-card);
    border: 1px solid var(--accent-dim);
    border-radius: 12px;
    padding: 12px 6px;
    text-align: center;
  }
  .badge-icon { font-size: 26px; margin-bottom: 4px; }
  .badge-label {
    font-size: 9.5px;
    color: var(--chalk-dim);
    line-height: 1.2;
  }

  /* MANAGE SCREEN */
  .manage-btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
  }
  .manage-action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: var(--bg-card);
    border: 1.5px solid var(--accent-dim);
    color: var(--chalk);
    font-weight: 800;
    font-size: 12.5px;
    padding: 16px 8px;
    border-radius: 12px;
    cursor: pointer;
    text-align: center;
    line-height: 1.3;
  }
  .manage-action-btn:active { transform: scale(0.97); background: var(--bg-raised); }
  .manage-action-icon { font-size: 22px; }

  /* CHECKBOX ITEMS (onboarding + bibliothèque) */
  .check-item {
    align-items: center;
  }
  .check-box {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    border: 1.5px solid var(--line);
    background: var(--bg-raised);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: var(--accent);
    flex-shrink: 0;
    margin-left: 12px;
  }
  .check-item.checked .check-box {
    background: var(--accent);
    border-color: var(--accent);
    color: #1e1d1b;
  }
  .check-item.checked {
    border-color: var(--accent-dim);
  }
  .rec-badge {
    display: inline-block;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 800;
    color: #1e1d1b;
    background: var(--accent);
    padding: 2px 6px;
    border-radius: 5px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* PROFILE ONBOARDING (coach virtuel) */
  .profile-onboarding {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 2000;
    display: flex;
    flex-direction: column;
    padding: 20px 22px 32px;
  }
  .pf-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .pf-header > div:empty {
    width: 34px;
  }
  .pf-back {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    font-size: 18px;
    cursor: pointer;
  }
  .pf-back:active { transform: scale(0.92); }
  .pf-progress {
    display: flex;
    gap: 6px;
  }
  .pf-dot {
    width: 22px;
    height: 4px;
    border-radius: 3px;
    background: var(--line);
  }
  .pf-dot.active { background: var(--accent); }
  .pf-dot.done { background: var(--accent-dim); }

  .pf-step {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    max-width: 420px;
    margin: 0 auto;
    width: 100%;
  }
  .pf-emoji { font-size: 46px; margin-bottom: 14px; }
  .pf-question {
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 20px;
    line-height: 1.2;
  }
  .pf-subtitle {
    font-size: 13.5px;
    color: var(--chalk-dim);
    line-height: 1.5;
    margin: -10px 0 22px;
  }
  .pf-number-input {
    width: 100%;
    background: var(--bg-card);
    border: 1.5px solid var(--line);
    color: var(--chalk);
    font-size: 32px;
    font-weight: 800;
    text-align: center;
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 20px;
    font-variant-numeric: tabular-nums;
  }
  .pf-number-input:focus { outline: none; border-color: var(--accent); }
  .pf-number-input.small { font-size: 24px; padding: 14px; margin-bottom: 0; }

  .pf-two-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    margin-bottom: 22px;
  }
  .pf-input-group label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--chalk-dim);
    font-weight: 700;
    margin-bottom: 8px;
  }

  .pf-next-btn {
    width: 100%;
    background: var(--accent);
    color: #1e1d1b;
    border: none;
    font-weight: 800;
    font-size: 16px;
    padding: 16px;
    border-radius: 14px;
    cursor: pointer;
  }
  .pf-next-btn:active { transform: scale(0.97); }

  .pf-choice-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  .pf-choice {
    background: var(--bg-card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, transform 0.1s;
  }
  .pf-choice:active { transform: scale(0.98); }
  .pf-choice.selected {
    border-color: var(--accent);
    background: rgba(242, 193, 78, 0.08);
  }
  .pf-choice-emoji { font-size: 26px; }
  .pf-choice-label { font-size: 15px; font-weight: 700; }

  .pf-level-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  .pf-level-card {
    background: var(--bg-card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }
  .pf-level-card:active { transform: scale(0.98); }
  .pf-level-card.selected {
    border-color: var(--accent);
    background: rgba(242, 193, 78, 0.08);
  }
  .pf-level-title { font-size: 16px; font-weight: 800; margin-bottom: 3px; }
  .pf-level-desc { font-size: 12.5px; color: var(--chalk-dim); }

  /* ÉCRAN DE BIENVENUE (intro coach virtuel) */
  .pf-step-welcome { justify-content: center; }
  .pf-welcome-badge {
    width: 76px;
    height: 76px;
    border-radius: 22px;
    background: linear-gradient(145deg, var(--accent), var(--accent-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin: 0 auto 22px;
    box-shadow: 0 10px 30px rgba(242, 193, 78, 0.25);
  }
  .pf-welcome-title {
    font-size: 28px;
    font-weight: 900;
    line-height: 1.25;
    margin: 0 0 16px;
  }
  .pf-brand {
    color: var(--accent);
  }
  .pf-welcome-desc {
    font-size: 14.5px;
    color: var(--chalk-dim);
    line-height: 1.6;
    margin-bottom: 26px;
  }
  .pf-algo-callout {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    background: linear-gradient(135deg, rgba(242,193,78,0.10), rgba(242,193,78,0.03));
    border: 1px solid var(--accent-dim);
    border-radius: 16px;
    padding: 18px;
    text-align: left;
    margin-bottom: 28px;
  }
  .pf-algo-icon {
    font-size: 28px;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 8px rgba(242,193,78,0.3));
  }
  .pf-algo-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 5px;
  }
  .pf-algo-desc {
    font-size: 13px;
    color: var(--chalk);
    line-height: 1.5;
  }

  .onboarding-header {
    text-align: center;
    margin-bottom: 26px;
  }
  .onboarding-header .emoji { font-size: 44px; margin-bottom: 10px; }
  .onboarding-header .title { font-size: 34px; }
  .onboarding-header .subtitle { line-height: 1.5; }
  .onboarding-footer {
    position: sticky;
    bottom: 12px;
    margin-top: 16px;
    padding-top: 10px;
  }
  .save-challenge-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .manage-item {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .manage-item .goal-inline {
    font-size: 12px;
    color: var(--chalk-dim);
    margin-top: 2px;
  }
  .manage-actions { display: flex; gap: 6px; }
  .icon-btn {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    padding: 7px 9px;
    cursor: pointer;
  }
  .icon-btn.danger { border-color: var(--danger); }
  .icon-btn:active { transform: scale(0.94); }

  .form-field { margin-bottom: 16px; }
  .form-field label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--chalk-dim);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .field-hint {
    text-transform: none;
    letter-spacing: 0;
    font-weight: 500;
    color: var(--chalk-dim);
    opacity: 0.7;
  }
  .form-field input, .form-field select {
    width: 100%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--chalk);
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 10px;
  }
  .form-field input:focus, .form-field select:focus { outline: 1px solid var(--accent); }
  .form-row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .save-challenge-btn {
    display: block;
    width: 100%;
    background: var(--accent);
    color: #1e1d1b;
    border: none;
    font-weight: 800;
    font-size: 15px;
    padding: 14px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
  }
  .save-challenge-btn:active { transform: scale(0.98); }

  /* LOGIN SCREEN */
  .login-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }

<script>
// ==== CONFIGURATION FIREBASE ====
// Remplace ces valeurs par celles de TON projet Firebase (voir guide fourni)
const firebaseConfig = {
  apiKey: "AIzaSyBE0DL8Q6y8Md4R2aM0D1imx_cTUlHP5c4",
  authDomain: "challenge-quotidien-hector.firebaseapp.com",
  projectId: "challenge-quotidien-hector",
  storageBucket: "challenge-quotidien-hector.firebasestorage.app",
  messagingSenderId: "613473786890",
  appId: "1:613473786890:web:c77ccf3c2d99857df9d3f3",
  measurementId: "G-CXQPEGDHW7"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let currentUser = null;

async function dbGet(key) {
  const doc = await db.collection('users').doc(currentUser.uid).collection('kv').doc(key).get();
  if (!doc.exists) throw new Error('not found: ' + key);
  return { key, value: doc.data().value };
}

async function dbSet(key, value) {
  await db.collection('users').doc(currentUser.uid).collection('kv').doc(key).set({ value });
  return { key, value };
}

function signIn() {
  const provider = new firebase.auth.GoogleAuthProvider();
  document.getElementById('loginError').textContent = '';
  auth.signInWithPopup(provider).catch(err => {
    document.getElementById('loginError').textContent = "Connexion impossible : " + err.message;
  });
}

function signOutUser() {
  auth.signOut();
}

async function deleteMyAccount() {
  if (!currentUser) return;

  const step1 = confirm(
    '⚠️ ATTENTION\n\nCeci va supprimer DÉFINITIVEMENT toutes tes données : défis, historique, statistiques, records et trophées.\n\nCette action est irréversible. Continuer ?'
  );
  if (!step1) return;

  const step2 = confirm(
    'Es-tu vraiment certain ? Il n\'y aura aucun moyen de récupérer ces données ensuite.'
  );
  if (!step2) return;

  try {
    const uid = currentUser.uid;

    // Supprime tous les documents de données de l'utilisateur (kv store)
    const snap = await db.collection('users').doc(uid).collection('kv').get();
    const batch = db.batch();
    snap.forEach(doc => batch.delete(doc.ref));
    await batch.commit();

    // Tente de supprimer le compte Google Auth lui-même
    try {
      await currentUser.delete();
    } catch (e) {
      if (e.code === 'auth/requires-recent-login') {
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await currentUser.reauthenticateWithPopup(provider);
          await currentUser.delete();
        } catch (e2) {
          console.error('Suppression du compte Auth impossible (données déjà effacées) :', e2);
        }
      } else {
        console.error('Suppression du compte Auth impossible (données déjà effacées) :', e);
      }
    }

    alert('Ton compte et toutes tes données ont été supprimés.');
    await auth.signOut();
  } catch (e) {
    alert('Une erreur est survenue pendant la suppression : ' + e.message);
  }
}

let lastAuthUid = null;

auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    if (lastAuthUid === user.uid) {
      // Firebase peut déclencher ce callback plusieurs fois pour la même session
      // (état mis en cache, puis revalidé ~1s après) — on ignore les répétitions
      // pour ne pas relancer startApp() et perdre la saisie en cours (ex: onboarding profil).
      return;
    }
    lastAuthUid = user.uid;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    startApp();
  } else {
    lastAuthUid = null;
    currentUser = null;
    // Réinitialise la navigation pour que le prochain compte connecté reparte de l'accueil
    showHistory = false;
    showManage = false;
    currentChallengeId = null;

// ==== MOTEUR DE PERSONNALISATION (coach virtuel) ====
// Objectif Final = Objectif Standard × Coef(Niveau) × Coef(Âge) × Coef(Sexe) × Coef(IMC)
// Poids Final    = Poids Standard    × Coef(Niveau) × Coef(Âge) × Coef(Sexe, haltères)
//
// Les "Objectifs Standards" ci-dessus (target/hardcoreTarget/standardWeightKg) sont calibrés
// pour un homme de 30 ans, niveau intermédiaire, IMC normal — volontairement exigeants.
// Sources de calibration (normes ACSM/CSEP pompes) : écart hommes/femmes ~2x en max sur
// un set, écart d'environ -10 à -15% par décennie après 40 ans.

const COEF_LEVEL = {
  debutant: 0.6,      // remise en forme
  intermediaire: 1.0, // 2 séances de sport / semaine (référence)
  avance: 1.2,         // 3+ séances de sport / semaine
};

function getAgeCoef(age) {
  if (age < 30) return 1.0;
  if (age < 40) return 1.0;   // tranche de référence (30 ans)
  if (age < 50) return 0.88;
  if (age < 60) return 0.75;
  if (age < 70) return 0.60;
  return 0.45;
}

function getBmi(heightCm, weightKg) {
  if (!heightCm || !weightKg) return 22; // valeur neutre par défaut
  const heightM = heightCm / 100;
  return weightKg / (heightM * heightM);
}

// Coefficient IMC "brut" (avant pondération par l'impact spécifique à l'exercice)
function getBmiCoefRaw(bmi) {
  if (bmi < 18.5) return 0.9;   // maigreur : masse musculaire souvent moindre
  if (bmi < 25)   return 1.0;   // corpulence normale (référence)
  if (bmi < 30)   return 0.90;  // surpoids : souvent en partie musculaire chez les pratiquants réguliers, malus modéré
  return 0.70;                  // obésité : impact plus marqué sur les mouvements au poids du corps
}

// Coefficient sexe appliqué aux répétitions/secondes, dépend de la catégorie du défi
function getSexRepsCoef(sex, cat) {
  if (sex !== 'femme') return 1.0;
  if (cat === 'Haut du corps') return 0.65; // écart le plus marqué, cohérent avec les normes ACSM pompes
  return 1.0; // Gainage/Core et Bas du corps : pas de malus (endurance/mobilité comparables)
}

// Coefficient sexe appliqué au poids d'haltère suggéré (mouvements du haut du corps)
function getSexWeightCoef(sex) {
  if (sex === 'femme') return 0.6;
  if (sex === 'autre') return 0.8; // valeur neutre intermédiaire
  return 1.0;
}

function computeStandardTarget(c, profile) {
  if (!profile) return c.target;
  const levelCoef = COEF_LEVEL[profile.level] ?? 1;
  const ageCoef = getAgeCoef(profile.age);
  const bmi = getBmi(profile.heightCm, profile.weightKg);
  const bmiRaw = getBmiCoefRaw(bmi);
  const impact = c.bmiImpact ?? 0;
  const bmiEffective = 1 + (bmiRaw - 1) * impact; // pondère l'effet IMC selon l'exercice
  const sexCoef = getSexRepsCoef(profile.sex, c.cat);
  const raw = c.target * levelCoef * ageCoef * sexCoef * bmiEffective;
  const stepped = Math.round(raw / 5) * 5;
  return Math.max(c.unit === 'sec' ? 15 : 10, stepped);
}

function computeStandardWeight(c, profile) {
  if (c.cat !== 'Haltères' || !c.standardWeightKg) return null;
  if (!profile) return Math.round(c.standardWeightKg);
  const levelCoef = COEF_LEVEL[profile.level] ?? 1;
  const ageCoef = getAgeCoef(profile.age);
  const sexCoef = getSexWeightCoef(profile.sex);
  const raw = c.standardWeightKg * levelCoef * ageCoef * sexCoef;
  return Math.max(1, Math.round(raw)); // toujours un nombre entier de kg
}

  if (profileStep === 0) {

  } else if (profileStep === 1) {
    const input = document.getElementById('pfAge');
    const val = parseInt(input?.value, 10);

      alert("Merci d'indiquer un âge valide (12 à 100 ans).");

  } else if (profileStep === 2) {
    if (!profileDraft.sex) {

      return;
    }
  } else if (profileStep === 3) {
    const hInput = document.getElementById('pfHeight');
    const wInput = document.getElementById('pfWeight');
    const h = parseInt(hInput?.value, 10);
    const w = parseFloat(wInput?.value);
    if (isNaN(h) || h < 100 || h > 250) {
      alert('Merci d\'indiquer une taille valide (100 à 250 cm).');
      return;
    }
    if (isNaN(w) || w < 30 || w > 300) {
      alert('Merci d\'indiquer un poids valide (30 à 300 kg).');
      return;
    }
    profileDraft.heightCm = h;
    profileDraft.weightKg = w;
  } else if (profileStep === 4) {
    if (!profileDraft.level) {
      alert('Merci de sélectionner ton niveau.');
      return;
    }
    finishProfileOnboarding();
    return;
  }
  profileStep++;
  render(true);
}

  if (profileStep > 0) {
    profileStep--;
    render(true);
  }
}

  }

  }

}

async function submitChallengeForm() {
  const name = document.getElementById('cfName').value.trim();
  const cat = document.getElementById('cfCat').value.trim();
  const target = parseInt(document.getElementById('cfTarget').value, 10);
  const unit = document.getElementById('cfUnit').value;
  const hcRaw = document.getElementById('cfHardcore').value;
  const hardcoreTarget = hcRaw.trim() === '' ? target * 2 : parseInt(hcRaw, 10);

  if (!name || !cat || isNaN(target) || target <= 0) {
    alert('Merci de remplir tous les champs correctement.');
    return;
  }
  if (isNaN(hardcoreTarget) || hardcoreTarget <= target) {
    alert("L'objectif hardcore doit être supérieur à l'objectif normal.");

  }

  if (editingChallengeId === 'new') {
    CHALLENGES.push({ id: getNextChallengeId(), cat, name, target, unit, hardcoreTarget });
  } else {
    const c = CHALLENGES.find(x => x.id === editingChallengeId);
    if (c) { c.name = name; c.cat = cat; c.target = target; c.unit = unit; c.hardcoreTarget = hardcoreTarget; }

  history.back(); // referme le formulaire (editingChallengeId) via goBackOneLevel, retour à la liste de gestion
}

function formatRelative(ms) {
  if (!ms) return null;
  const diff = Date.now() - ms;
  const min = diff / 60000;
  if (min < 1) return "à l'instant";
  if (min < 60) return `il y a ${Math.round(min)}min`;
  const hrs = diff / 3600000;
  if (hrs < 24) return `il y a ${Math.round(hrs)}h`;
  const days = diff / 86400000;
  return `il y a ${Math.round(days)}j`;
}

    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.innerHTML = html;
  el.classList.remove('show');
  void el.offsetWidth; // force reflow pour rejouer l'anim si déjà visible
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), duration);
}

function fireConfetti(variant) {
  const colors = variant === 'hardcore'
    ? ['#ff6b35', '#d9634f', '#ede7db', '#a9863a', '#ff9d5c']
    : ['#f2c14e', '#7fb069', '#e8dfc8', '#d9634f', '#a9863a'];
  const canvas = document.createElement('canvas');
  canvas.className = 'confetti-canvas';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const particles = Array.from({ length: 70 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height * 0.3,
    r: 3 + Math.random() * 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    vx: (Math.random() - 0.5) * 3,
    vy: 2 + Math.random() * 3,
    rot: Math.random() * 360,
    vrot: (Math.random() - 0.5) * 10,
  }));
  let frame = 0;
  function tick() {
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rot += p.vrot;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r, -p.r * 0.6, p.r * 2, p.r * 1.2);
      ctx.restore();
    }
    if (frame < 110) {
      requestAnimationFrame(tick);
    } else {
      canvas.remove();
    }
  }
  tick();
}

function playSuccessSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const notes = [523.25, 659.25, 783.99]; // do-mi-sol
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const start = ctx.currentTime + i * 0.09;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
      osc.start(start);
      osc.stop(start + 0.4);
    });
  } catch (e) { /* audio non disponible, tant pis */ }
}

function getLifetimeSummary() {
  let totalReps = 0, totalSeconds = 0;
  const catVolume = {};
  for (const c of CHALLENGES) {
    const s = stats[c.id];
    if (!s) continue;
    if (c.unit === 'reps') totalReps += s.lifetimeTotal;
    else totalSeconds += s.lifetimeTotal;
    catVolume[c.cat] = (catVolume[c.cat] || 0) + s.lifetimeTotal;
  }
  let favCat = null, favVal = -1;
  for (const [cat, val] of Object.entries(catVolume)) {
    if (val > favVal) { favVal = val; favCat = cat; }
  }
  return { totalReps, totalSeconds, favCat };
}

function formatTimer(totalSec) {
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${pad(s)}`;
}

function formatSecToReadable(totalSec) {
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  if (m === 0) return `${s} s`;
  if (s === 0) return `${m} min`;
  return `${m} min ${s} s`;
}

// Affichage complet d'une valeur cible selon son unité, ex: "335 sec (5 min 35 s)" ou "100 reps"
function formatTargetLabel(value, unit) {
  if (unit === 'sec') {
    return `${value} sec (${formatSecToReadable(value)})`;
  }
  return `${value} reps`;
}

// ==== WAKE LOCK (empêche l'écran de s'éteindre pendant un chrono) ====
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {
    console.error('Wake Lock non disponible :', e);
  }
}

async function releaseWakeLock() {
  if (wakeLock) {
    try { await wakeLock.release(); } catch (e) { /* déjà relâché */ }
    wakeLock = null;
  }
}

// Le Wake Lock est automatiquement relâché par le système quand l'onglet passe
// en arrière-plan (écran verrouillé, changement d'appli...). On le redemande
// dès que l'app redevient visible, tant que le chrono tourne toujours.
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && timerRunning && !wakeLock) {
    await requestWakeLock();
  }
});

function clearTimerState() {
  if (timerIntervalId) clearInterval(timerIntervalId);
  timerIntervalId = null;
  timerRunning = false;
  timerStartMs = null;
  releaseWakeLock();
}

function startTimer() {
  timerRunning = true;
  timerStartMs = Date.now();
  timerIntervalId = setInterval(tickTimer, 250);
  requestWakeLock();
  render();
}

function enterFocusMode() {
  focusMode = true;
  if (navigator.vibrate) navigator.vibrate(10);
  pushNavState();
  render(true);
}

function exitFocusMode() {
  history.back();
}

function tickTimer() {
  const el = document.getElementById('timerDisplay');
  if (!el) return;
  const elapsed = Math.floor((Date.now() - timerStartMs) / 1000);
  el.textContent = formatTimer(elapsed);
}

async function stopTimer() {
  const elapsed = Math.round((Date.now() - timerStartMs) / 1000);
  clearTimerState();
  const wasFocus = focusMode;
  if (elapsed > 0) {
    await addSet(elapsed);
  }
  if (wasFocus) {
    history.back(); // ferme le mode focus via goBackOneLevel, reste cohérent avec la pile de navigation
  } else if (elapsed <= 0) {
    render();
  }
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

function formatDateLabel(d) {
  const days = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months = ['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}

function getHardcoreTarget(c) {
  if (!c) return 0;
  const base = c.hardcoreTarget || c.target * 2;
  return Math.max(base, c.target + 1);
}

function getTotal() {
  const entry = getEntry(currentChallengeId);

}

async function addSet(amount) {
  if (amount <= 0) return;
  const entry = getEntry(currentChallengeId);
  entry.sets.push(amount);
  const total = getTotal();
  const target = getTarget();
  const willComplete = total >= target && !entry.done;

  // Records & totaux à vie
  if (!stats[currentChallengeId]) {
    stats[currentChallengeId] = { lifetimeTotal: 0, bestDay: { total: 0, date: null }, recordStreak: 0 };
  }
  const s = stats[currentChallengeId];
  if (s.recordStreak === undefined) s.recordStreak = 0;
  s.lifetimeTotal += amount;
  let newRecord = false;
  if (total > s.bestDay.total) {
    s.bestDay = { total, date: todayKey };
    newRecord = true;
  }

  if (willComplete) {
    s.recordStreak = newRecord ? s.recordStreak + 1 : 0;
  }
  await saveStats();

  if (willComplete) {
    entry.done = true;
    weekData[todayKey] = true;
    lastCompleted[currentChallengeId] = Date.now();
    await saveLastCompleted();

    dailyActivity[todayKey] = (dailyActivity[todayKey] || 0) + 1;
    await saveDailyActivity();

    badges.totalCompletions += 1;
    const freshBadges = checkNewBadges();
    await saveBadges();

    if (navigator.vibrate) navigator.vibrate([45, 35, 45, 35, 90]);
    fireConfetti();
    playSuccessSound();

    if (freshBadges.length > 0) {
      const b = freshBadges[0];
      setTimeout(() => showToast(`${b.icon} Trophée débloqué — ${b.label}`, 3200), 500);
    } else {
      showToast(`✓ Défi complété${newRecord ? ' — nouveau record ! 🏆' : ' !'}`);
    }

    // Progression automatique : 3 records consécutifs -> proposer d'augmenter l'objectif par défaut
    if (s.recordStreak >= 3) {
      const c = getChallenge();
      const suggestedTarget = Math.ceil((total * 1.15) / 5) * 5;
      setTimeout(async () => {
        const accept = confirm(
          `🚀 Tu bats ton record 3 fois de suite sur "${c.name}" !\n\nVeux-tu augmenter l'objectif par défaut de ${formatTargetLabel(c.target, c.unit)} à ${formatTargetLabel(suggestedTarget, c.unit)} ?`
        );
        if (accept) {
          c.target = suggestedTarget;
          await saveChallenges();
          showToast(`🎯 Objectif mis à jour : ${formatTargetLabel(suggestedTarget, c.unit)}`);
        }
        s.recordStreak = 0;
        await saveStats();
      }, 1400);
    }
  }

  // Mode Hardcore : détection indépendante de la complétion normale
  const cForHardcore = getChallenge();
  const hcTarget = getHardcoreTarget(cForHardcore);
  const willCompleteHardcore = total >= hcTarget && !entry.hardcoreDone;
  if (willCompleteHardcore) {
    entry.hardcoreDone = true;
    badges.totalHardcore += 1;
    const freshHardcoreBadges = checkNewBadges();
    await saveBadges();

    if (navigator.vibrate) navigator.vibrate([60, 40, 60, 40, 60, 40, 140]);
    fireConfetti('hardcore');
    playSuccessSound();

    setTimeout(() => {
      if (freshHardcoreBadges.length > 0) {
        const b = freshHardcoreBadges[0];
        showToast(`${b.icon} Trophée débloqué — ${b.label}`, 3200);
      } else {
        showToast('🔥 MODE HARDCORE complété !', 3000);
      }
    }, willComplete ? 900 : 400);
  }

  await saveState();
  render();
}

async function undoLast() {
  const entry = getEntry(currentChallengeId);
  const popped = entry.sets.pop();
  const total = getTotal();

  if (popped && stats[currentChallengeId]) {
    const s = stats[currentChallengeId];
    s.lifetimeTotal = Math.max(0, s.lifetimeTotal - popped);
    if (s.bestDay.date === todayKey) s.bestDay.total = total;
    await saveStats();
  }

  if (total < getTarget()) {
    entry.done = false;
    weekData[todayKey] = Object.values(state.challenges).some(e => e.done);
  }
  await saveState();
  render();
}

function renderTally(total, target, unit) {
  // represent progress in tally groups of 5, scaled so it doesn't explode for "sec" units
  const scale = unit === 'sec' ? Math.max(1, Math.round(target / 40)) : 1;
  const marks = Math.min(60, Math.round(total / scale));
  let html = '';
  const groups = Math.ceil(marks / 5) || 0;
  for (let g = 0; g < groups; g++) {
    html += '<div class="tally-group">';
    const inGroup = Math.min(5, marks - g*5);
    for (let i = 0; i < inGroup; i++) {
      const isStrike = i === 4;
      html += `<div class="tally-mark${isStrike ? ' strike' : ''}"></div>`;
    }
    html += '</div>';
  }
  return html;
}

function applyContent(app, html, animate, afterRender) {
  if (animate) {
    app.classList.add('fade-out');
    setTimeout(() => {
      app.innerHTML = html;
      app.classList.remove('fade-out');
      if (afterRender) afterRender();
    }, 140);
  } else {
    app.innerHTML = html;
    if (afterRender) afterRender();
  }
}

            }

          <div class="quick-add-grid">

          </div>
        `}

          <input type="number" id="customAddInput" placeholder="Nombre personnalisé" inputmode="numeric">
          <button class="custom-add-btn" onclick="customAddSubmit()">Ajouter</button>

        ${entry.sets.length > 0 ? `
          <div class="undo-row">
            <button class="undo-btn" onclick="undoLast()">Annuler la dernière série (${entry.sets[entry.sets.length-1]})</button>
          </div>
        ` : ''}

        ${entry.done ? `<div class="done-banner">✓ Défi complété aujourd'hui</div>` : ''}
      </div>
    `;
  }

  // week strip
  html += `<div class="week-strip">`;
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const k = dateKey(d);
    const isToday = k === todayKey;
    const done = weekData[k];
    html += `

      </div>
    `;
  }
  html += `</div>`;

  applyContent(app, html, animate, () => {
    const input = document.getElementById('customAddInput');
    if (input) {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') customAddSubmit();
      });
    }
  });
}

async function loadHistoryEntries() {
  const DAYS_BACK = 28;
  const entries = [];
  for (let i = 0; i < DAYS_BACK; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const k = dateKey(d);
    try {
      const res = await dbGet('day:' + k);
      const s = JSON.parse(res.value);
      if (s.challenges) {
        for (const [cid, entry] of Object.entries(s.challenges)) {
          if (entry.sets && entry.sets.length === 0) continue;
          const c = CHALLENGES.find(x => x.id === Number(cid));
          entries.push({
            key: k,
            date: d,
            challengeName: c ? c.name : 'Défi supprimé',
            cat: c ? c.cat : '',
            total: entry.sets ? entry.sets.reduce((a,b)=>a+b,0) : 0,
            target: entry.targetOverride || (c ? c.target : 0),
            unit: c ? c.unit : 'reps',
            done: !!entry.done,
          });
        }
      }
    } catch (e) {
      // no entry for this day
    }
  }
  historyEntries = entries;
}

function renderWeeklyChart() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  const totals = days.map(d => {
    const k = dateKey(d);
    return historyEntries.filter(e => e.key === k).reduce((sum, e) => sum + e.total, 0);
  });
  const max = Math.max(1, ...totals);

  let bars = '';
  days.forEach((d, i) => {
    const h = Math.round((totals[i] / max) * 100);
    const isToday = dateKey(d) === todayKey;
    bars += `
      <div class="chart-col">
        <div class="chart-bar-track">
          <div class="chart-bar${isToday ? ' today' : ''}" style="height:${Math.max(h, totals[i] > 0 ? 6 : 0)}%"></div>
        </div>
        <div class="chart-val">${totals[i] || ''}</div>
        <div class="chart-dow">${DOW_LABELS[d.getDay()]}</div>
      </div>
    `;
  });

  return `
    <div class="section-label">Volume des 7 derniers jours</div>
    <div class="chart-wrap">${bars}</div>
  `;
}

function renderHeatmap() {
  const WEEKS = 26; // ~6 mois, plus lisible sur mobile qu'une année complète
  const totalDays = WEEKS * 7;
  const days = [];
  for (let i = totalDays - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  // aligner sur Lundi pour la première colonne
  while ((days[0].getDay() + 6) % 7 !== 0) {
    const d = new Date(days[0]);
    d.setDate(d.getDate() - 1);
    days.unshift(d);
  }

  function levelFor(count) {
    if (!count) return 0;
    if (count === 1) return 1;
    if (count <= 2) return 2;
    return 3;
  }

  let cells = '';
  for (const d of days) {
    const k = dateKey(d);
    const count = dailyActivity[k] || 0;
    const lvl = levelFor(count);
    const isFuture = d > new Date();
    cells += `<div class="heat-cell lvl${lvl}${isFuture ? ' future' : ''}" title="${k} — ${count} défi(s)"></div>`;
  }

  return `
    <div class="section-label">Activité (6 derniers mois)</div>
    <div class="heatmap-scroll">
      <div class="heatmap-grid">${cells}</div>
    </div>
    <div class="heat-legend">
      <span>Moins</span>
      <div class="heat-cell lvl0"></div>
      <div class="heat-cell lvl1"></div>
      <div class="heat-cell lvl2"></div>
      <div class="heat-cell lvl3"></div>
      <span>Plus</span>
    </div>
  `;
}

  const firstDow = (days[0].getDay() + 6) % 7; // Monday=0
  let calHtml = `<div class="cal-grid">`;
  ['L','M','M','J','V','S','D'].forEach(l => calHtml += `<div class="cal-dow">${l}</div>`);
  for (let i = 0; i < firstDow; i++) calHtml += `<div class="cal-cell empty"></div>`;
  for (const d of days) {
    const k = dateKey(d);
    const dayEntries = historyEntries.filter(e => e.key === k);
    const isToday = k === todayKey;
    const done = dayEntries.some(e => e.done);
    calHtml += `<div class="cal-cell${done ? ' done' : ''}${isToday ? ' today' : ''}">${done ? '✓' : d.getDate()}</div>`;
  }
  calHtml += `</div>`;

  let listHtml = `<div class="history-list-label">Défis effectués</div>`;
  const withChallenge = historyEntries.filter(e => e.challengeName);
  if (historyLoading) {
    listHtml += `<div class="history-empty">Chargement…</div>`;
  } else if (withChallenge.length === 0) {
    listHtml += `<div class="history-empty">Pas encore d'historique</div>`;
  } else {
    for (const e of withChallenge) {
      const label = e.key === todayKey ? "Aujourd'hui" : formatDateLabel(e.date);
      listHtml += `
        <div class="history-entry">
          <div>
            <div class="hdate">${label}</div>
            <div class="hname">${e.challengeName}</div>
          </div>
          <div class="hprogress${e.done ? ' done' : ''}">${e.total}/${e.target} ${e.unit === 'sec' ? 'sec' : ''}${e.done ? ' ✓' : ''}</div>
        </div>
      `;
    }
  }

  return `
    <button class="history-back" onclick="closeHistory()">‹ Retour</button>
    <h1 class="title">Historique</h1>
    <div class="subtitle">Ta progression dans le temps</div>
    <button class="share-stats-btn" onclick="shareStatsImage()">📤 Partager mes stats</button>
    ${renderWeeklyChart()}
    ${renderHeatmap()}
    ${renderTrophiesGrid()}
    <div class="section-label">Calendrier du mois</div>
    ${calHtml}
    ${listHtml}
    ${renderAccountSection()}
  `;
}

function renderAccountSection() {
  const name = currentUser?.displayName || 'Compte';
  const email = currentUser?.email || '';
  const photo = currentUser?.photoURL || '';
  return `
    <div class="section-label">Compte</div>
    <div class="account-card">
      <div class="account-info">
        ${photo ? `<img src="${photo}" class="account-avatar" referrerpolicy="no-referrer">` : `<div class="account-avatar-fallback">${name.charAt(0).toUpperCase()}</div>`}
        <div>
          <div class="account-name">${name}</div>
          ${email ? `<div class="account-email">${email}</div>` : ''}
        </div>
      </div>
      <button class="signout-btn" onclick="signOutUser()">🚪 Se déconnecter</button>
      <button class="delete-account-btn" onclick="deleteMyAccount()">🗑️ Supprimer mon compte et mes données</button>
    </div>
  `;
}


// ==== PULL TO REFRESH ====
let ptrStartY = null;
let ptrCurrentY = 0;
let ptrActive = false;
let ptrRefreshing = false;
const PTR_THRESHOLD = 70;

function initPullToRefresh() {
  const indicator = document.createElement('div');
  indicator.id = 'ptrIndicator';
  indicator.className = 'ptr-indicator';
  indicator.innerHTML = '<div class="ptr-spinner">↻</div>';
  document.body.appendChild(indicator);

  document.addEventListener('touchstart', (e) => {
    if (ptrRefreshing) return;
    if (window.scrollY <= 0 && !timerRunning) {
      ptrStartY = e.touches[0].clientY;
      ptrActive = true;
    }
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!ptrActive || ptrStartY === null || ptrRefreshing) return;
    ptrCurrentY = e.touches[0].clientY;
    const delta = ptrCurrentY - ptrStartY;
    if (delta > 0 && window.scrollY <= 0) {
      const pulled = Math.min(delta * 0.5, 100);
      indicator.style.transform = `translateX(-50%) translateY(${pulled}px)`;
      indicator.style.opacity = Math.min(pulled / PTR_THRESHOLD, 1);
      if (pulled >= PTR_THRESHOLD) {
        indicator.classList.add('ready');
      } else {
        indicator.classList.remove('ready');
      }
    }
  }, { passive: true });

  document.addEventListener('touchend', async () => {
    if (!ptrActive || ptrStartY === null) return;
    const delta = ptrCurrentY - ptrStartY;
    ptrActive = false;
    ptrStartY = null;

    if (delta * 0.5 >= PTR_THRESHOLD && !ptrRefreshing) {
      ptrRefreshing = true;
      indicator.classList.add('spinning', 'ready');
      indicator.style.transform = `translateX(-50%) translateY(56px)`;
      indicator.style.opacity = '1';
      if (navigator.vibrate) navigator.vibrate(15);
      await refreshApp();
      await new Promise(r => setTimeout(r, 350));
      indicator.classList.remove('spinning', 'ready');
      indicator.style.transform = `translateX(-50%) translateY(0px)`;
      indicator.style.opacity = '0';
      ptrRefreshing = false;
    } else {
      indicator.classList.remove('ready');
      indicator.style.transform = `translateX(-50%) translateY(0px)`;
      indicator.style.opacity = '0';
    }
  }, { passive: true });
}

async function refreshApp() {
  await loadChallenges();
  await loadWeights();
  await loadLastCompleted();
  await loadStats();
  await loadBadges();
  await loadDailyActivity();
  if (showHistory) {
    await loadHistoryEntries();
  } else {
    await loadState();
  }
  render(true);
}

function getSuggestion() {
  // Pas assez d'historique pour être pertinent, on évite de harceler un nouvel utilisateur
  if (badges.totalCompletions < 3) return null;

  const cats = [...new Set(CHALLENGES.map(c => c.cat))];
  let worstCat = null;
  let worstDays = -1;

  for (const cat of cats) {
    const idsInCat = CHALLENGES.filter(c => c.cat === cat).map(c => c.id);
    const timestamps = idsInCat.map(id => lastCompleted[id]).filter(Boolean);
    if (timestamps.length === 0) continue; // jamais fait du tout, on ne harcèle pas dès le début
    const mostRecent = Math.max(...timestamps);
    const daysSince = (Date.now() - mostRecent) / 86400000;
    if (daysSince > worstDays) {
      worstDays = daysSince;
      worstCat = cat;
    }
  }

  if (!worstCat || worstDays < 3) return null;

  const days = Math.floor(worstDays);
  return `Tu n'as pas fait <strong>${worstCat}</strong> depuis ${days} jour${days > 1 ? 's' : ''}`;
}

function computeStreak() {
  let streak = 0;
  for (let i = 0; i <= 6; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const k = dateKey(d);
    if (weekData[k]) {
      streak++;
    } else {
      if (i === 0) continue; // today not done yet doesn't break streak display
      break;
    }
  }
  return streak;
}

async function startApp() {
  if (showProfileOnboarding || showOnboarding) {
    // Un onboarding est déjà affiché et en cours de saisie : on ne le relance pas,
    // au cas où startApp() serait appelée une seconde fois (double événement d'auth par ex.)
    return;
  }
  const hasProfile = await loadProfile();
  if (!hasProfile) {
    profileStep = 0;
    profileDraft = { age: null, sex: null, heightCm: null, weightKg: null, level: null };
    showProfileOnboarding = true;
    render();
    return;
  }
  await proceedAfterProfile();
}

async function proceedAfterProfile() {
  await loadChallenges();
  if (showOnboarding) {
    onboardingSelection = new Set(CHALLENGE_LIBRARY.filter(c => c.isDefault).map(c => c.id));
    render();
    return;
  }
  await continueStartApp();
}

async function continueStartApp() {
  await loadWeights();
  await loadLastCompleted();
  await loadStats();
  await loadBadges();
  await loadDailyActivity();
  await loadState();
}

function personalizeChallengeCopy(c) {
  const target = computeStandardTarget(c, userProfile);
  return { ...c, target, hardcoreTarget: target * 2 };
}

async function finishOnboarding() {
  if (onboardingSelection.size === 0) {
    alert('Sélectionne au moins un défi pour commencer !');
    return;
  }
  CHALLENGES = CHALLENGE_LIBRARY
    .filter(c => onboardingSelection.has(c.id))
    .map(c => personalizeChallengeCopy(c));
  await saveChallenges();
  showOnboarding = false;
  await continueStartApp();
  render(true);
}

function toggleOnboardingChallenge(id) {
  if (onboardingSelection.has(id)) onboardingSelection.delete(id);
  else onboardingSelection.add(id);
  render();
}

// Micro-interaction : légère vibration sur chaque tap d'élément interactif
document.addEventListener('click', (e) => {
  const target = e.target.closest('button, .picker-item, .manage-item, .qa-btn, .timer-btn');
  if (target && navigator.vibrate) {
    navigator.vibrate(8);
  }
}, true);

initPullToRefresh();

</script>
