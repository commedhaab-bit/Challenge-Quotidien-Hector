async function submitFriendSearch() {
  const query = friendSearchQuery;
  if (query.length < 3) return;
  friendSearchResult = 'searching';
  render();
  try {
    const claimDoc = await usernamesCollRef().doc(query).get();
    if (!claimDoc.exists) { friendSearchResult = 'not-found'; render(); return; }
    const targetUid = claimDoc.data().uid;
    if (targetUid === currentUser.uid) { friendSearchResult = 'self'; render(); return; }
    const profile = await fetchPublicProfile(targetUid);
    if (!profile) { friendSearchResult = 'not-found'; render(); return; }
    let relation = 'none';
    if (myFriends.some(f => f.uid === targetUid)) relation = 'friend';
    else if (outgoingFriendRequestUids.has(targetUid)) relation = 'request-sent';
    else if (incomingFriendRequests.some(r => r.fromUid === targetUid)) relation = 'request-received';
    friendSearchResult = { uid: targetUid, displayName: profile.displayName, photoURL: profile.photoURL, relation };
  } catch (e) {
    reportSaveError('friend search failed', e);
    friendSearchResult = null;
  }
  render();
}

async function sendFriendRequest(targetUid) {
  try {
    await db.collection('friendRequests').doc(friendRequestId(currentUser.uid, targetUid)).set({
      fromUid: currentUser.uid, toUid: targetUid, at: Date.now(),
    });
    await notificationsCollRef(targetUid).doc().set({
      type: 'friend_request',
      fromUid: currentUser.uid,
      fromName: formatDisplayName(currentUser.displayName),
      read: false,
      createdAt: Date.now(),
    });
    outgoingFriendRequestUids.add(targetUid);
    if (friendSearchResult && typeof friendSearchResult === 'object' && friendSearchResult.uid === targetUid) {
      friendSearchResult.relation = 'request-sent';
    }
    if (navigator.vibrate) navigator.vibrate(10);
    render();
  } catch (e) {
    reportSaveError('send friend request failed', e);
  }
}

async function acceptFriendRequest(fromUid) {
  const pairId = friendshipPairId(fromUid, currentUser.uid);
  const [uidA, uidB] = [fromUid, currentUser.uid].sort();
  try {
    const batch = db.batch();
    batch.set(db.collection('friendships').doc(pairId), { uidA, uidB, since: Date.now() });
    batch.delete(db.collection('friendRequests').doc(friendRequestId(fromUid, currentUser.uid)));
    await batch.commit();
    if (navigator.vibrate) navigator.vibrate(10);
    if (friendSearchResult && typeof friendSearchResult === 'object' && friendSearchResult.uid === fromUid) {
      friendSearchResult.relation = 'friend';
    }
    await refreshFriendsData();
  } catch (e) {
    reportSaveError('accept friend request failed', e);
  }
}

async function declineFriendRequest(fromUid) {
  try {
    await db.collection('friendRequests').doc(friendRequestId(fromUid, currentUser.uid)).delete();
    await refreshFriendsData();
  } catch (e) {
    reportSaveError('decline friend request failed', e);

}

// ==== COMMUNAUTÉ : JAUGE COLLECTIVE ("BOSS BATTLE") ====
// Contrairement au modèle du plan initial, le document partagé ne stocke QUE
// currentProgress : targetChallengeId/targetAmount sont toujours re-dérivés via
// getWeeklyBossBattleTarget() (pur, déterministe) — élimine tout risque de course à
// l'initialisation du document ("qui écrit le 1er la cible cette semaine ?").
let communityBossBattleProgress = 0;
let communityBossBattleUnsub = null;

function bossBattleDocRef(weekStartStr = mondayOfWeek(new Date())) {
  return db.collection('community').doc('bossBattle_' + weekStartStr);
}

// Abonnement temps réel (comme le compteur du défi du jour) : appelé une seule fois
// au démarrage. Détecte le franchissement de la cible EN DIRECT (comparaison avec la
// valeur précédemment en mémoire, jamais relue depuis un stockage persistant) : ne se
// déclenche donc qu'une fois par session pour les clients ouverts au moment exact du
// franchissement, jamais en rouvrant l'app après coup sur une cible déjà atteinte.
function startBossBattleListener() {
  if (communityBossBattleUnsub) communityBossBattleUnsub();
  const weekStart = mondayOfWeek(new Date());
  const target = getWeeklyBossBattleTarget(weekStart);
  communityBossBattleUnsub = bossBattleDocRef(weekStart).onSnapshot((snap) => {
    const previous = communityBossBattleProgress;
    const next = snap.exists ? (snap.data().currentProgress || 0) : 0;
    communityBossBattleProgress = next;
    if (target && previous < target.targetAmount && next >= target.targetAmount) {
      handleBossBattleVictory(weekStart, target, next);
    }
    render();
  });
}

// Fil des ~20 dernières contributions individuelles (temps réel), pour le FOMO en
// direct sur l'écran Communauté ("Untel vient d'ajouter X") — distinct de
// dailyContributors (agrégat par personne/par jour, sert uniquement au badge
// Contributeur du jour). Abonnement unique au démarrage, comme les autres listeners
// communautaires.
let communityRecentContributions = [];
let communityContributionsUnsub = null;

function startRecentContributionsListener() {
  if (communityContributionsUnsub) communityContributionsUnsub();
  communityContributionsUnsub = bossBattleDocRef().collection('contributions')
    .orderBy('at', 'desc').limit(20).onSnapshot((snap) => {
      // { id: d.id, ...d.data() } (pas juste d.data()) : l'id du document est
      // nécessaire pour cibler les kudos sur une contribution précise.
      communityRecentContributions = snap.docs.map(d => ({ id: d.id, ...d.data() }));

async function handleBossBattleVictory(weekStart, target, finalProgress) {
  const challenge = CHALLENGE_LIBRARY.find(c => c.id === target.targetChallengeId);
  if (navigator.vibrate) navigator.vibrate([60, 40, 60, 40, 140]);
  fireConfetti();
  playSuccessSound();
  enqueuePopup({
    epic: true,
    icon: '🏆',
    title: 'Objectif communautaire atteint !',
    subtitle: `La communauté a validé ${finalProgress.toLocaleString('fr-FR')} ${challenge ? challenge.name.toLowerCase() : ''} cette semaine !`,
  });
  try {
    // "create-only" cote client (en plus de la regle Firestore equivalente) : si 2
    // clients detectent le franchissement quasi simultanement (2 utilisateurs actifs
    // au meme instant), un seul doit ecrire l'archive definitive.
    // "create-only" cote client (en plus de la regle Firestore equivalente) : si 2
    // clients detectent le franchissement quasi simultanement (2 utilisateurs actifs
    // au meme instant), un seul doit ecrire l'archive definitive.
    const archiveRef = db.collection('bossBattleArchive').doc(weekStart);
    const existing = await archiveRef.get();
    if (!existing.exists) {
      await archiveRef.set({
        targetChallengeId: target.targetChallengeId,
        targetAmount: target.targetAmount,
        finalProgress,
        completedAt: Date.now(),
      });
    }
  } catch (e) {
    reportSaveError('boss battle archive failed', e);
  }
}

// Appelée depuis addSet(), TÔT (pas seulement à la complétion du défi — chaque série
// loggée compte pour la jauge collective) si le défi en cours est la cible de la
// semaine. Incrémente à la fois le compteur partagé ET l'agrégat "par jour/par
// utilisateur" (dailyContributors), qui sert uniquement au badge Contributeur du jour.
async function registerBossBattleContributionIfNeeded(challengeId, amount) {
  const weekStart = mondayOfWeek(new Date());
  const target = getWeeklyBossBattleTarget(weekStart);
  if (!target || target.targetChallengeId !== challengeId) return;
  try {
    await bossBattleDocRef(weekStart).set(
      { currentProgress: firebase.firestore.FieldValue.increment(amount) },
      { merge: true }
    );
    await bossBattleDocRef(weekStart).collection('dailyContributors').doc(todayKey + '_' + currentUser.uid).set(
      { uid: currentUser.uid, displayName: formatDisplayName(currentUser.displayName), date: todayKey, amount: firebase.firestore.FieldValue.increment(amount) },
      { merge: true }
    );
    // Fil des contributions individuelles (contrairement à dailyContributors, un
    // document PAR évènement, jamais fusionné) : sert uniquement au flux temps réel
    // "Untel vient d'ajouter X" affiché sur l'écran Communauté, pour le FOMO en direct.
    await bossBattleDocRef(weekStart).collection('contributions').add({
      uid: currentUser.uid,
      displayName: formatDisplayName(currentUser.displayName),
      amount,
      at: Date.now(),
      kudosCount: 0,
    });
  } catch (e) {
    reportSaveError('boss battle contribution failed', e);
  }
}

// Appelé une fois au chargement de l'app (après loadState(), donc todayKey connu) :
// recharge le bouclier hebdomadaire si besoin, puis vérifie si un ou plusieurs jours
// ont été manqués depuis la dernière validation.
async function evaluateStreakOnLoad() {
  const wk = mondayOfWeek(new Date());
  if (lastShieldResetWeek !== wk) {
    hasShield = true;
    lastShieldResetWeek = wk;
  }

  let shieldTriggered = false;
  if (streakCount > 0 && lastCompletedDate && lastCompletedDate !== todayKey) {
    const gap = daysBetween(lastCompletedDate, todayKey);
    if (gap >= 2) {
      if (hasShield) {
        hasShield = false;
        shieldTriggered = true;
      } else {
        streakCount = 0;
      }
    }
  }

  await saveStreakData();

  if (shieldTriggered) {
    enqueuePopup({
      icon: '🛡️',
      title: 'Bouclier activé !',
      subtitle: "Ton bouclier de pause t'a sauvé la série ! 🛡️ Pense à réaliser ton défi aujourd'hui.",
    });
  }
}

// Appelé lors de la toute première validation de défi de la journée (dailyActivity
// passait de 0 à 1). Le cas "jour manqué" est déjà géré par evaluateStreakOnLoad().
async function registerDailyStreak() {
  streakCount += 1;
  lastCompletedDate = todayKey;
  await saveStreakData();
  setTimeout(() => {
    enqueuePopup({
      icon: '🔥',
      title: '+1 Jour de série !',
      big: streakCount,
      subtitle: `${streakCount} jour${streakCount > 1 ? 's' : ''} d'affilée ! Continue comme ça 💪`,
    });
  }, 900);
}

      ? "Aucune série en cours 🔥. Valide un défi aujourd'hui pour allumer la flamme !"
      : "Félicitations, tu maintiens ta série !",
    badgeLine: shieldBadge,
    closable: true,
  });
}

// Détail d'une journée du calendrier mensuel (Journal) : liste des défis réalisés ce
// jour-là. Le jour cliqué peut être hors de la fenêtre de 28 jours de historyEntries
// (mois de 31 jours), donc on relit son document Firestore à la demande plutôt que
// de préchager tous les jours du mois d'un coup.
async function showDayDetailModal(dayKeyStr) {
  const [y, m, d] = dayKeyStr.split('-').map(Number);
  const label = formatDateLabel(new Date(y, m - 1, d));
  let entries = [];
  try {
    const res = await dbGet('day:' + dayKeyStr);
    const s = JSON.parse(res.value);
    if (s.challenges) {
      for (const [cid, entry] of Object.entries(s.challenges)) {
        if (!entry.sets || entry.sets.length === 0) continue;
        const c = CHALLENGES.find(x => x.id === Number(cid));
        entries.push({
          name: c ? c.name : 'Défi supprimé',
          total: entry.sets.reduce((a, b) => a + b, 0),
          target: entry.targetOverride || (c ? c.target : 0),
          unit: c ? c.unit : 'reps',
          done: !!entry.done,
        });
      }
    }
  } catch (e) {
    entries = [];
  }
  const listHtml = entries.length === 0
    ? `<div class="history-empty">Aucun défi validé ce jour</div>`
    : entries.map(e => `
        <div class="history-entry">
          <div class="hname">${e.name}</div>
          <div class="hprogress${e.done ? ' done' : ''}">${e.total}/${e.target}${e.unit === 'sec' ? ' sec' : ''}${e.done ? ' ✓' : ''}</div>
        </div>
      `).join('');
  enqueuePopup({
    // 🗓️ (et non 📅) : le dessin Apple de l'emoji "tear-off calendar" grave en dur
    // "17 JUL" (illustration historique d'iCal) et faisait croire a un bug de date
    // bloquee au 17 juillet des qu'il apparaissait a cote de la date reellement
    // selectionnee.
    icon: '🗓️',
    title: label,
    listHtml,
    closable: true,
    btnLabel: 'Fermer',
  });
}

// ==== POPUPS PLEIN ÉCRAN STYLE DUOLINGO ====
// Un seul moteur de popup pour tous les évènements de gamification (série, bouclier,
// fin de défi/Hardcore avec cartes XP/trophée, level up, nouveau titre) : ajouté
// directement au DOM, comme showToast()/fireConfetti(), indépendant du cycle render().
let popupQueue = [];
let popupOpen = false; // état suivi explicitement (pas de fiabilité à attendre d'un getElementById sur un id qui vient d'être retiré du DOM selon les moteurs)
let currentPopupHtml = ''; // dernier contenu affiché (introspection/tests)

function enqueuePopup(opts) {
  popupQueue.push(opts);
  if (!popupOpen) drainPopupQueue();
}

function buildPopupInnerHtml(next) {
  const chips = [];
  if (next.xp) chips.push(`<div class="popup-chip xp-chip">⚡ +${next.xp} XP</div>`);
  const progressHtml = next.progressLabel ? `
    <div class="popup-progress-track"><div class="popup-progress-fill" style="width:${next.progressPct}%"></div></div>
    <div class="popup-progress-label">${next.progressLabel}</div>
  ` : '';
  return `
    <div class="app-popup-card${next.epic ? ' epic' : ''}">
      ${next.closable ? `<button class="app-popup-close-x" id="appPopupCloseX" aria-label="Fermer">✕</button>` : ''}
      <div class="app-popup-icon${next.locked ? ' locked' : ''}">${next.icon}</div>
      <div class="app-popup-title">${next.title}</div>
      ${next.big !== undefined ? `<div class="app-popup-big${next.bigHighlight ? ' big-highlight' : ''}">${next.big}</div>` : ''}
      ${next.bigLabel ? `<div class="app-popup-big-label">${next.bigLabel}</div>` : ''}
      ${next.subtitle ? `<div class="app-popup-sub">${next.subtitle}</div>` : ''}
      ${next.badgeLine || ''}
      ${next.listHtml ? `<div class="popup-list">${next.listHtml}</div>` : ''}
      ${progressHtml}
      ${chips.length ? `<div class="app-popup-chips">${chips.join('')}</div>` : ''}
      <button class="app-popup-btn" id="appPopupCloseBtn">${next.btnLabel || 'Continuer'}</button>
    </div>
  `;
}

function drainPopupQueue() {
  const next = popupQueue.shift();
  if (!next) { popupOpen = false; currentPopupHtml = ''; return; }
  popupOpen = true;
  if (next.variant === 'title' || next.variant === 'trophy') fireConfetti('title');
  const el = document.createElement('div');
  el.id = 'appPopup';
  el.className = 'app-popup-overlay';
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.innerHTML = buildPopupInnerHtml(next);
  currentPopupHtml = el.innerHTML;
  document.body.appendChild(el);
  document.getElementById('appPopupCloseBtn').onclick = () => {
    el.remove();
    drainPopupQueue();
  };
  const closeX = document.getElementById('appPopupCloseX');
  if (closeX) {
    closeX.onclick = () => {
      el.remove();
      drainPopupQueue();
    };
  }
}

// Modale de confirmation stylée (Annuler/Confirmer), à la place des confirm() natifs
// du navigateur (moches, non personnalisables). Volontairement INDÉPENDANTE de la
// file enqueuePopup/drainPopupQueue (qui reste single-bouton, fire-and-forget, comme
// partout ailleurs dans l'appli) : ici on a besoin d'attendre une vraie décision de
// l'utilisateur avant de continuer, donc on retourne une Promise<boolean> — chose que
// la file générique ne permet pas. Réutilise le même habillage visuel
// (.app-popup-overlay/.app-popup-card) pour rester cohérent avec le reste de l'appli.
let currentConfirmModalHtml = ''; // dernier contenu affiché (introspection/tests, même principe que currentPopupHtml)
let currentConfirmModalEl = null; // dernier élément popup créé (introspection/tests, pour vérifier la portée de querySelector)
function confirmModal({ icon = '⚠️', title = '', subtitle = '', confirmLabel = 'Confirmer', cancelLabel = 'Annuler', danger = false } = {}) {
  return new Promise((resolve) => {
    const el = document.createElement('div');
    el.className = 'app-popup-overlay';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    el.innerHTML = `
      <div class="app-popup-card">
        <div class="app-popup-icon">${icon}</div>
        ${title ? `<div class="app-popup-title">${title}</div>` : ''}
        ${subtitle ? `<div class="app-popup-sub">${subtitle}</div>` : ''}
        <div class="app-popup-actions">
          <button class="app-popup-btn-cancel" id="confirmModalCancelBtn">${cancelLabel}</button>
          <button class="app-popup-btn${danger ? ' danger' : ''}" id="confirmModalConfirmBtn">${confirmLabel}</button>
        </div>
      </div>
    `;
    currentConfirmModalHtml = el.innerHTML;
    currentConfirmModalEl = el;
    document.body.appendChild(el);
    const finish = (result) => { el.remove(); resolve(result); };
    // Recherche SCOPÉE à ce popup précis (el.querySelector), pas document.getElementById()
    // (global) : confirmModal() n'a, contrairement à drainPopupQueue(), AUCUN garde-fou
    // d'instance unique (pas de "popupOpen") — deux appels concurrents (ex: terminer 2
    // défis différents chacun avec 3 records d'affilée, à quelques secondes d'écart,
    // chacun programmant son propre setTimeout(1400ms)) créent deux <div id="confirmModal...">
    // avec les MÊMES id. document.getElementById() aurait alors pu se lier au premier
    // popup (déjà fermé ou caché derrière), laissant les boutons du second (celui
    // réellement visible/cliqué par l'utilisateur) totalement inertes.
    el.querySelector('#confirmModalCancelBtn').onclick = () => finish(false);
    el.querySelector('#confirmModalConfirmBtn').onclick = () => finish(true);
  });
}

// Une popup épique dédiée par trophée fraîchement débloqué (icône animée, effets
// lumineux dorés, pluie de confettis) — distincte de la popup de complétion du défi.

// Petites icônes (vert néon via currentColor) remplaçant les mots "Chrono"/"Répétitions"

// Détecte un changement de niveau (et, le cas échéant, de titre) entre deux mesures

function enqueueLevelPopups(levelBefore, levelAfter) {
  if (levelAfter <= levelBefore) return;

// ==== XP, NIVEAUX & TITRES D'ATHLÈTE ====
let xpTotal = 0;
// XP de la semaine calendaire en cours (classement "Hebdomadaire", reset le lundi) —
// champ SÉPARÉ de xpTotal (jamais fusionné dedans) pour ne rien changer au modèle
// existant : `xpWeekStart` (lundi de la semaine du dernier ajout) suit exactement le
// même mécanisme que `lastShieldResetWeek` (mondayOfWeek() comparé à chaque écriture).

let xpWeekStart = null;

let leaderboardOptOut = false;

async function loadXp() {

// Écrit (merge) la ligne publique et minimale de classement de l'utilisateur — jamais
// le document appData complet (profil/poids restent privés). No-op silencieux si
// l'utilisateur a désactivé sa participation.
async function syncLeaderboardEntry() {
  if (leaderboardOptOut || !currentUser) return;

    catch (e) { reportSaveError('leaderboard opt-out delete failed', e); }

function leaderboardFieldForView(view) {
  if (view === 'streaks') return 'streakCount';
  if (view === 'weekly') return 'xpWeekly';
  return 'xpTotal';
}

// Base de la requête classement pour une vue donnée : la vue "Hebdomadaire" est en
// plus filtrée sur la semaine calendaire en cours (xpWeekStart), sinon une entrée
// jamais rafraîchie depuis une semaine précédente resterait affichée à tort.
function leaderboardBaseQuery(view) {
  let q = db.collection('leaderboard');
  if (view === 'weekly') q = q.where('xpWeekStart', '==', mondayOfWeek(new Date()));
  return q;
}

async function fetchLeaderboardTop(view, n = 20) {
  const field = leaderboardFieldForView(view);
  const snap = await leaderboardBaseQuery(view).orderBy(field, 'desc').limit(n).get();
  return snap.docs.map(d => ({ uid: d.id, ...d.data() }));
}

// Rang exact (via count(), sans jamais lire tout le classement) + les 2 voisins juste
// au-dessus et juste en-dessous de l'utilisateur — pas seulement le top N, pour que
// n'importe qui (même loin du sommet) se voie situé dans le classement.
// Calcule le rang ET les voisins directs à partir d'UNE SEULE lecture ordonnée
// complète (pas de requête d'agrégation count()) : `.count()` s'est révélé absent du
// SDK Firestore compat réellement chargé ici (10.13.0) malgré la documentation
// (TypeError "count is not a function" observé en production) — remplacé par un calcul
// de position côté client, plus simple et qui réutilise EXACTEMENT la même requête/le
// même index composite que fetchLeaderboardTop() (une seule vue "Hebdo" à indexer, pas
// deux). Limite assumée : le coût (nombre de lectures) grandit avec la taille totale
// du classement, pas seulement le nombre affiché — acceptable pour une communauté de
// taille modeste ; à revoir si le classement grossit beaucoup.
async function fetchMyRankAndNeighbors(view) {
  const field = leaderboardFieldForView(view);
  const snap = await leaderboardBaseQuery(view).orderBy(field, 'desc').get();
  const all = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
  let myIdx = all.findIndex(e => e.uid === currentUser.uid);
  if (myIdx === -1) {
    const myDoc = await db.collection('leaderboard').doc(currentUser.uid).get();
    const myValue = (myDoc.exists && myDoc.data()[field]) || 0;
    const me = myDoc.exists
      ? { uid: currentUser.uid, ...myDoc.data() }
      : { uid: currentUser.uid, displayName: formatDisplayName(currentUser.displayName), [field]: myValue };
    myIdx = all.findIndex(e => (e[field] || 0) < myValue);
    if (myIdx === -1) myIdx = all.length;
    all.splice(myIdx, 0, me);
  }
  const rank = myIdx + 1;
  const neighbors = all.slice(Math.max(0, myIdx - 2), Math.min(all.length, myIdx + 3));
  return { rank, neighbors };
}

// Ne déclenche aucune popup elle-même : renvoie juste les niveaux avant/après pour
// laisser l'appelant décider de l'ordre d'affichage (ex: popup de complétion d'abord,
// puis éventuellement level up / nouveau titre).
async function awardXp(amount) {
  const levelBefore = computeLevel(xpTotal);
  xpTotal += amount;
  const wk = mondayOfWeek(new Date());
  if (xpWeekStart !== wk) { xpWeekly = 0; xpWeekStart = wk; }
  xpWeekly += amount;
  await saveXp();
  await saveXpWeekly();
  await syncLeaderboardEntry();
  const levelAfter = computeLevel(xpTotal);
  return { levelBefore, levelAfter };
}

// Seuils d'XP par niveau, en dur et arrondis (demande explicite : des paliers
// "propres" comme 150/350/700/1200, pas une formule qui retomberait sur des
// nombres quelconques). Calibrés sur le gain réel d'un défi Hardcore (~150 à
// 225 XP selon l'exercice, cf. xpForChallenge + HARDCORE_XP_BONUS) pour que 2
// défis Hardcore amènent au plus au niveau 2, ou tout début de niveau 3 —
// avant, l'ancienne courbe faisait grimper à un niveau 4 dès 2 défis.
// Au-delà de la table, la progression continue avec le même facteur de
// croissance que ses derniers paliers (cf. xpForLevel).
const XP_LEVEL_THRESHOLDS = [
  0, 150, 350, 700, 1200, 1750, 2400, 3100, 3900, 4800,
  5800, 6900, 8100, 9500, 11000, 12750, 14750, 17000, 19500, 22250,
  25250, 28750, 32500, 36750, 41500, 47000, 53000, 59750, 67250, 75750,
  85250, 96000, 108000, 121250, 136250, 153000, 171750, 192750, 216250, 242750,
  272250, 305250, 342250, 383750, 430250, 482250, 540500, 605750,
];
const XP_LEVEL_TABLE_GROWTH = 1.12; // croissance des paliers au-dela de la table ci-dessus
function xpForLevel(n) {
  if (n <= 1) return 0;
  if (n <= XP_LEVEL_THRESHOLDS.length) return XP_LEVEL_THRESHOLDS[n - 1];
  const lastIndex = XP_LEVEL_THRESHOLDS.length - 1;
  const lastIncrement = XP_LEVEL_THRESHOLDS[lastIndex] - XP_LEVEL_THRESHOLDS[lastIndex - 1];
  const extra = n - XP_LEVEL_THRESHOLDS.length;
  const growthSum = lastIncrement * XP_LEVEL_TABLE_GROWTH * (Math.pow(XP_LEVEL_TABLE_GROWTH, extra) - 1) / (XP_LEVEL_TABLE_GROWTH - 1);
  return Math.round(XP_LEVEL_THRESHOLDS[lastIndex] + growthSum);
}
/** Niveau atteint pour un total d'XP donné, en cherchant le plus haut seuil (`xpForLevel`) franchi. */
function computeLevel(xp) {
  let level = 1;
  while (xpForLevel(level + 1) <= xp) level++;
  return level;
}
function xpProgress(xp) {
  const level = computeLevel(xp);
  const currentThreshold = xpForLevel(level);
  const nextThreshold = xpForLevel(level + 1);
  return { level, xpIntoLevel: xp - currentThreshold, xpNeeded: nextThreshold - currentThreshold };
}

// Titres d'athlète, du niveau 1 au niveau max — source unique utilisée pour le
// titre courant (athleteTitle) ET pour la carte "Parcours de niveau" (roadmap).
const ATHLETE_TITLE_TIERS = [
  { title: 'Recrue 🥉', maxLevel: 5 },
  { title: 'Initié 🎖️', maxLevel: 10 },
  { title: 'Motivé 🥈', maxLevel: 15 },
  { title: 'Régulier 📅', maxLevel: 20 },
  { title: 'Athlète 🥇', maxLevel: 26 },
  { title: 'Guerrier ⚔️', maxLevel: 32 },
  { title: 'Expert ⚡', maxLevel: 38 },
  { title: 'Titan 🏆', maxLevel: 43 },
  { title: 'Demi-Dieu 🌌', maxLevel: 47 },
  { title: 'Légende Immortelle 👑', maxLevel: Infinity },
];
function athleteTitle(level) {
  return ATHLETE_TITLE_TIERS.find(t => level <= t.maxLevel).title;
}
// 50 XP de base + bonus selon le volume (reps/sec) et, pour les haltères, la charge.
function xpForChallenge(c, total) {
  let bonus = c.unit === 'sec' ? Math.round(total / 5) : Math.round(total / 2);
  if (c.cat === 'Haltères') {
    bonus += Math.round(weights[c.id] ?? 8);
  }
  return 50 + Math.max(0, bonus);
}
const HARDCORE_XP_BONUS = 75;

// ==== COACH VOCAL (Web Speech API) ====
let voiceCoachEnabled = true;

async function loadVoiceCoachEnabled() {
  try { const res = await dbGet('voiceCoachEnabled'); voiceCoachEnabled = res.value === 'true'; }
  catch (e) { voiceCoachEnabled = true; } // activé par défaut
}

  await saveAppField('voiceCoachEnabled', voiceCoachEnabled);
}
async function toggleVoiceCoach() {
  voiceCoachEnabled = !voiceCoachEnabled;
  if (navigator.vibrate) navigator.vibrate(10);
  if (!voiceCoachEnabled && window.speechSynthesis) window.speechSynthesis.cancel();
  await saveVoiceCoachEnabled();
  render();
}

// cancel() avant chaque prise de parole pour éviter les retards/empilements audio ;
// tolère l'absence de synthèse vocale (navigateur non compatible ou bloquée).
// `onEnd`, si fourni, se déclenche une fois la phrase RÉELLEMENT terminée (callback
// natif SpeechSynthesisUtterance.onend), pour enchaîner un son/décompte sans jamais
// couper l'annonce en cours (cf. le décompte du mode Hardcore). Un filet de sécurité
// (setTimeout) évite de rester bloqué si le navigateur ne déclenche jamais onend.
function speak(text, onEnd) {
  if (!voiceCoachEnabled) {
    if (onEnd) onEnd();
    return;
  }
  if (typeof window === 'undefined' || !window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') {
    if (onEnd) onEnd();
    return;
  }
  try {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'fr-FR';
    if (onEnd) {
      let called = false;
      const finish = () => { if (!called) { called = true; onEnd(); } };
      utterance.onend = finish;
      utterance.onerror = finish;
      setTimeout(finish, 4000); // filet de securite (bug navigateur : onend jamais declenche)
    }
    window.speechSynthesis.speak(utterance);
  } catch (e) {
    console.error('Coach vocal indisponible :', e);
    if (onEnd) onEnd();
  }
}

function formatRelative(ms) {
  if (!ms) return null;
  const diff = Date.now() - ms;
  const min = diff / 60000;
  if (min < 1) return "à l'instant";
  if (min < 60) return `il y a ${Math.round(min)}min`;
  const hrs = diff / 3600000;
  if (hrs < 24) return `il y a ${Math.round(hrs)}h`;
  const days = diff / 86400000;
  return `il y a ${Math.round(days)}j`;
}

 * débloqués par cet appel (pour piloter les popups trophée), sans persister —
 * l'appelant doit encore appeler `saveBadges()`.

function checkNewBadges() {
  const freshlyUnlocked = [];
  for (const b of BADGE_DEFS) {
    if (!badges.unlocked.includes(b.id) && b.check()) {

function showToast(html, duration = 2600) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    el.setAttribute('aria-live', 'polite'); // annonce le toast aux lecteurs d ecran sans voler le focus
    document.body.appendChild(el);
  }
  el.innerHTML = html;
  el.classList.remove('show');
  void el.offsetWidth; // force reflow pour rejouer l'anim si déjà visible
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), duration);
}

function fireConfetti(variant) {
  const colors = variant === 'hardcore'
    ? ['#ff6b35', '#ef5350', '#ffb347', '#ff9d5c', '#eef2ef']
    : variant === 'title'
    ? ['#ffd700', '#fff2b0', '#39e97a', '#eaffef', '#ffb347']
    : ['#39e97a', '#5fbf7a', '#eaffef', '#1f6b3e', '#eef2ef'];
  const canvas = document.createElement('canvas');
  canvas.className = 'confetti-canvas';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const particles = Array.from({ length: 70 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height * 0.3,
    r: 3 + Math.random() * 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    vx: (Math.random() - 0.5) * 3,
    vy: 2 + Math.random() * 3,
    rot: Math.random() * 360,
    vrot: (Math.random() - 0.5) * 10,
  }));
  let frame = 0;
  function tick() {
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rot += p.vrot;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r, -p.r * 0.6, p.r * 2, p.r * 1.2);
      ctx.restore();
    }
    if (frame < 110) {
      requestAnimationFrame(tick);
    } else {
      canvas.remove();
    }
  }
  tick();
}

function playSuccessSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const notes = [523.25, 659.25, 783.99]; // do-mi-sol
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const start = ctx.currentTime + i * 0.09;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
      osc.start(start);
      osc.stop(start + 0.4);
    });
  } catch (e) { /* audio non disponible, tant pis */ }
}

function getLifetimeSummary() {
  let totalReps = 0, totalSeconds = 0;
  const catVolume = {};
  for (const c of CHALLENGES) {
    const s = stats[c.id];
    if (!s) continue;
    if (c.unit === 'reps') totalReps += s.lifetimeTotal;
    else totalSeconds += s.lifetimeTotal;
    catVolume[c.cat] = (catVolume[c.cat] || 0) + s.lifetimeTotal;
  }
  let favCat = null, favVal = -1;
  for (const [cat, val] of Object.entries(catVolume)) {
    if (val > favVal) { favVal = val; favCat = cat; }
  }
  return { totalReps, totalSeconds, favCat };
}

function formatTimer(totalSec) {
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${pad(s)}`;
}

// Double anneau concentrique : intérieur (vert néon) = phase normale, extérieur
// (feu) = phase Hardcore, quasiment collé au premier (~1px d'écart visuel une
// fois les demi-épaisseurs de trait prises en compte). Toujours calculés
// ensemble, à partir du total cumulé (+ l'écoulé de la session en cours si elle tourne).
const TIMER_RING_INNER_RADIUS = 78;
const TIMER_RING_OUTER_RADIUS = 88;
const TIMER_RING_INNER_CIRCUMFERENCE = 2 * Math.PI * TIMER_RING_INNER_RADIUS;
const TIMER_RING_OUTER_CIRCUMFERENCE = 2 * Math.PI * TIMER_RING_OUTER_RADIUS;

function computeTimerRingPct(projectedTotal, target, hcTarget) {
  const normalPct = target > 0 ? Math.min(1, projectedTotal / target) : 0;
  const hcRange = hcTarget - target;
  const hcProgress = Math.max(0, projectedTotal - target);
  const hardcorePct = hcRange > 0 ? Math.min(1, hcProgress / hcRange) : 0;
  return { normalPct, hardcorePct };
}

function renderDoubleTimerRingSVG(normalPct, hardcorePct, sizePx) {
  const nClamped = Math.min(1, Math.max(0, normalPct));
  const hClamped = Math.min(1, Math.max(0, hardcorePct));
  const nOffset = TIMER_RING_INNER_CIRCUMFERENCE * (1 - nClamped);
  const hOffset = TIMER_RING_OUTER_CIRCUMFERENCE * (1 - hClamped);
  const size = sizePx || 220;
  return `
    <svg class="timer-ring" viewBox="0 0 220 220" width="${size}" height="${size}">
      <circle class="timer-ring-bg-outer" cx="110" cy="110" r="${TIMER_RING_OUTER_RADIUS}"></circle>
      <circle class="timer-ring-bg-inner" cx="110" cy="110" r="${TIMER_RING_INNER_RADIUS}"></circle>
      <circle class="timer-ring-fill-hardcore${hClamped >= 1 ? ' complete' : ''}" id="timerRingHardcoreFill"
        cx="110" cy="110" r="${TIMER_RING_OUTER_RADIUS}"
        style="stroke-dasharray:${TIMER_RING_OUTER_CIRCUMFERENCE}; stroke-dashoffset:${hOffset};"></circle>
      <circle class="timer-ring-fill${nClamped >= 1 ? ' complete' : ''}" id="timerRingFill"
        cx="110" cy="110" r="${TIMER_RING_INNER_RADIUS}"
        style="stroke-dasharray:${TIMER_RING_INNER_CIRCUMFERENCE}; stroke-dashoffset:${nOffset};"></circle>
    </svg>
  `;
}

// Met à jour les deux anneaux déjà présents dans le DOM (appelé à chaque tick, sans re-render complet)
function updateTimerRingDOM(elapsedSec) {
  if (!currentChallengeId) return;
  const target = getTarget();
  const hcTarget = getHardcoreTarget(getChallenge());
  const total = getTotal();
  const { normalPct, hardcorePct } = computeTimerRingPct(total + elapsedSec, target, hcTarget);

  const ringInner = document.getElementById('timerRingFill');
  if (ringInner) {
    ringInner.style.strokeDashoffset = String(TIMER_RING_INNER_CIRCUMFERENCE * (1 - normalPct));
    ringInner.classList.toggle('complete', normalPct >= 1);
  }
  const ringOuter = document.getElementById('timerRingHardcoreFill');
  if (ringOuter) {
    ringOuter.style.strokeDashoffset = String(TIMER_RING_OUTER_CIRCUMFERENCE * (1 - hardcorePct));
    ringOuter.classList.toggle('complete', hardcorePct >= 1);
  }
}

// Échappe une chaîne pour une insertion sûre dans du HTML (contenu ou attribut
// délimité par des guillemets doubles) : noms/catégories de défis personnalisés et
// nom de compte Google sont du texte libre saisi par l'utilisateur, jamais fiable
// tel quel dans un template literal HTML (sinon injection possible via <, >, ", &).
function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Échappe une chaîne pour une insertion sûre à l'intérieur d'une chaîne JS à guillemets
// simples, elle-même dans un attribut HTML à guillemets doubles (ex: onclick="fn('...')") :
// il faut neutraliser à la fois le guillemet simple (fin de la chaîne JS) et le double
// (fin de l'attribut HTML).
function escapeJsAttr(str) {
  return String(str ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// Anonymise un nom complet en "Prénom N." (ex: "Jean Dupont" -> "Jean D.", "Sarah" ->
// "Sarah" inchangé, "Alexandre Martin Dupont" -> "Alexandre D." — seule l'initiale du
// DERNIER mot est gardée, pas des mots intermédiaires). Appliquée à l'ÉCRITURE (avant
// même que le nom n'atteigne Firestore, dans syncLeaderboardEntry()/
// registerBossBattleContributionIfNeeded()) — pas seulement à l'affichage — pour que le
// nom complet ne soit JAMAIS stocké dans les collections communautaires partagées,
// lisibles par n'importe quel autre utilisateur authentifié. Idempotente (appliquer
// deux fois ne change rien : "Jean D." redonne "Jean D."), donc sans risque de
// ré-appliquer aussi à l'affichage en filet de sécurité sur d'éventuelles données déjà
// écrites avant ce correctif.
function formatDisplayName(fullName) {
  const trimmed = String(fullName ?? '').trim().replace(/\s+/g, ' ');
  if (!trimmed) return 'Athlète';
  const parts = trimmed.split(' ');
  if (parts.length === 1) return parts[0];
  const lastInitial = parts[parts.length - 1].charAt(0).toUpperCase();
  return `${parts[0]} ${lastInitial}.`;
}

// (script classique chargé avant celui-ci, voir <head>) — restent des globaux,

// getExercisePictogramKey() vivent désormais dans exercise-pictograms.js /
// exercise-data.js (scripts classiques chargés avant celui-ci, voir <head>) —

function renderExercisePicto(c) {
  const key = getExercisePictogramKey(c);
  const svg = EXERCISE_PICTOGRAMS[key] || EXERCISE_PICTOGRAMS.generic;
  if (PICTOGRAM_ASSET_MISSING.has(key)) {

    // rend directement le SVG, sans requête réseau vouée à un 404 garanti (et sans
    // effet de chargement puisqu'il n'y a rien à attendre).
    return `<div class="exercise-picto loaded"><div class="exercise-picto-fallback" style="display:flex;">${svg}</div></div>`;
  }
  // Essaie d'abord le WebP (généré par generate-webp-assets.py, bien plus léger),
  // puis le PNG si absent, puis le pictogramme SVG dessiné à la main en dernier
  // recours — aucune modification de code nécessaire au fur et à mesure que les
  // images arrivent. width/height fixes : cohérent avec le conteneur (déjà de
  // taille fixe) et évite tout redimensionnement implicite pendant le décodage.
  // La classe .loaded (posée par onload OU par le dernier repli onerror, quel que
  // soit le chemin emprunté) fait disparaître le skeleton "shimmer" et fait
  // apparaître l'image en fondu, pour ne jamais montrer de pop-in brut.
  return `
    <div class="exercise-picto">
      <img src="exercices/${key}-static.webp" alt="${escapeHtml(c.name)}" loading="lazy" decoding="async" width="64" height="64"
           onload="this.classList.add('loaded'); this.parentElement.classList.add('loaded');"
           onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='exercices/${key}-static.png';}else{this.style.display='none'; this.nextElementSibling.style.display='flex'; this.parentElement.classList.add('loaded');}">
      <div class="exercise-picto-fallback">${svg}</div>
    </div>
  `;
}

// Phrase claire pour les exercices unilatéraux (haltère tenu à un seul bras).
// Ne retourne rien si l'exercice n'est pas concerné.
function armModeSentence(target, unit, armMode) {
  if (armMode !== 'perArm') return '';
  const u = unit === 'sec' ? 'sec' : 'reps';
  return `Chaque bras doit faire ${target} ${u}.`;
}

// ==== WAKE LOCK (empêche l'écran de s'éteindre pendant un chrono) ====
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {
    console.error('Wake Lock non disponible :', e);
  }
}

async function releaseWakeLock() {
  if (wakeLock) {
    try { await wakeLock.release(); } catch (e) { /* déjà relâché */ }
    wakeLock = null;
  }
}

// Le Wake Lock est automatiquement relâché par le système quand l'onglet passe
// en arrière-plan (écran verrouillé, changement d'appli...). On le redemande
// dès que l'app redevient visible, tant que le chrono tourne toujours.
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && timerRunning && !wakeLock) {
    await requestWakeLock();
  }
});

function clearTimerState() {
  if (timerIntervalId) clearInterval(timerIntervalId);
  timerIntervalId = null;
  timerRunning = false;
  timerStartMs = null;
  lastBeepSecond = 0;
  lastVoiceCueSecond = null;
  clearPrepCountdown();
  releaseWakeLock();
}

// ==== COMPTE À REBOURS (3... 2... 1...) ====
// Deux modes, partageant le même overlay/décompte :
// - 'start' (défaut) : décompte de préparation classique avant le tout premier
//   démarrage, se termine par "C'est parti !".
// - 'hardcore' : au passage en mode Hardcore, annonce d'abord "Mode Hardcore
//   enclenché !", puis (une fois la phrase terminée) le même décompte 3-2-1,
//   sans "C'est parti !" à la fin.
// Overlay ajouté directement au DOM (comme showToast()), indépendant du cycle render().
let prepCountdownValue = null;
let prepCountdownTimeoutId = null;
let prepCountdownMode = 'start';

// mode :
// - 'start' (défaut) : décompte de préparation classique, se termine par "C'est parti !".
// - 'hardcore-first' : tout premier lancement du Hardcore après l'objectif normal ->
//   annonce "Mode Hardcore enclenché !" puis décompte. Cette annonce ne doit se
//   produire qu'une seule fois (cf. entry.hardcoreAnnounced dans toggleTimer()).
// - 'hardcore-repeat' : reprises suivantes du Hardcore -> décompte immédiat, sans
//   ré-annoncer la phrase (déjà entendue), ni dire "C'est parti !" à la fin.
function beginPrepCountdown(mode) {
  unlockTimerAudio(); // dans le geste utilisateur du clic, pour débloquer l'audio (Safari/iOS)
  clearPrepCountdown();
  prepCountdownMode = mode || 'start';
  prepCountdownValue = 3;
  if (prepCountdownMode === 'hardcore-first') {
    // attend la fin REELLE de l'annonce (callback onend de SpeechSynthesis) avant
    // d'entamer le decompte audible, plutot qu'un delai fixe devine (speak() annule
    // sinon l'utterance en cours si on enchaine trop tot -> phrase coupee mi-mot).
    speak('Mode Hardcore enclenché !', () => {
      if (prepCountdownValue === null) return; // decompte annule entretemps (clearPrepCountdown)
      renderPrepCountdownOverlay();
      speak('3');
      prepCountdownTimeoutId = setTimeout(prepCountdownTick, 1000);
    });
  } else {
    renderPrepCountdownOverlay();
    speak('3');
    prepCountdownTimeoutId = setTimeout(prepCountdownTick, 1000);
  }
}

function prepCountdownTick() {
  if (prepCountdownValue === null) return;
  prepCountdownValue -= 1;
  if (prepCountdownValue > 0) {
    renderPrepCountdownOverlay();
    speak(String(prepCountdownValue));
    prepCountdownTimeoutId = setTimeout(prepCountdownTick, 1000);
  } else {
    clearPrepCountdown();
    if (prepCountdownMode === 'start') speak("C'est parti !");
    startTimer();
  }
}

function clearPrepCountdown() {
  if (prepCountdownTimeoutId) clearTimeout(prepCountdownTimeoutId);
  prepCountdownTimeoutId = null;
  prepCountdownValue = null;
  prepCountdownMode = 'start';
  if (typeof window !== 'undefined' && window.speechSynthesis) window.speechSynthesis.cancel();
  const el = document.getElementById('prepCountdownOverlay');
  if (el) el.remove();
}

function renderPrepCountdownOverlay() {
  let el = document.getElementById('prepCountdownOverlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'prepCountdownOverlay';
    el.className = 'prep-countdown-overlay';
    document.body.appendChild(el);
  }
  el.innerHTML = `<div class="prep-countdown-number">${prepCountdownValue}</div>`;
}

let lastVoiceCueSecond = null;

// Annonce vocale à l'approche de l'objectif NORMAL (chronos en secondes uniquement) :
// "3... 2... 1..." puis "Défi terminé ! Bravo !" une fois l'objectif atteint. Ne
// concerne que la phase normale : une fois entry.done, la phase Hardcore n'a pas
// de décompte (cf. tickTimer/toggleTimer pour ses propres annonces).
function announceTimerVoiceCues(elapsed) {
  if (!voiceCoachEnabled || !currentChallengeId) return;
  const c = getChallenge();
  if (!c || c.unit !== 'sec') return;
  const entry = getEntry(currentChallengeId);
  if (entry.done) return;
  const target = getTarget();
  if (!target) return;
  const remaining = target - (getTotal() + elapsed);
  if (remaining <= 3 && remaining >= 1 && remaining !== lastVoiceCueSecond) {
    lastVoiceCueSecond = remaining;
    speak(String(remaining));
  } else if (remaining <= 0 && lastVoiceCueSecond !== 0) {
    lastVoiceCueSecond = 0;
    speak('Défi terminé ! Bravo !');
  }
}

function startTimer() {
  timerRunning = true;
  timerStartMs = Date.now();
  lastBeepSecond = 0;
  lastVoiceCueSecond = null;
  unlockTimerAudio();
  timerIntervalId = setInterval(tickTimer, 250);
  requestWakeLock();
  render();
}

// Clic sur le disque du chrono (anneau entier cliquable) : bascule Play/Valider.
// - Pas encore d'objectif normal atteint -> décompte de préparation (3-2-1) puis démarrage.
// - Objectif normal déjà atteint (Hardcore pas encore réussi) -> décompte (3-2-1) avant
//   le démarrage réel ; l'annonce "Mode Hardcore enclenché !" ne se produit qu'au tout
//   premier lancement (cf. entry.hardcoreAnnounced), jamais sur les reprises suivantes.
// - Hardcore déjà réussi -> plus rien à démarrer.
function toggleTimer() {
  if (timerRunning) {
    stopTimer();
    return;
  }
  if (!currentChallengeId) return;
  const entry = getEntry(currentChallengeId);
  if (entry.hardcoreDone) return;
  if (entry.done) {
    if (!entry.hardcoreAnnounced) {
      entry.hardcoreAnnounced = true;
      saveState();
      beginPrepCountdown('hardcore-first');
    } else {
      beginPrepCountdown('hardcore-repeat');
    }
  } else {
    beginPrepCountdown();
  }
}

// À chaque tick : met à jour l'affichage, puis détecte le franchissement de
// l'objectif normal ou Hardcore pour arrêter automatiquement le chrono (plus besoin
// d'un bouton Stop manuel) et déclencher l'annonce vocale correspondante.
function tickTimer() {
  const elapsed = Math.floor((Date.now() - timerStartMs) / 1000);
  const entry = getEntry(currentChallengeId);
  const target = getTarget();
  const hcTarget = getHardcoreTarget(getChallenge());
  const projected = getTotal() + elapsed;

  // Le nombre affiché ne montre QUE le temps écoulé de la série en cours (repart
  // toujours de 0:00 à chaque démarrage) ; les anneaux, eux, restent cumulatifs
  // (progression globale vers l'objectif du jour) — deux informations distinctes.
  const el = document.getElementById('timerDisplay');
  if (el) el.textContent = formatTimer(elapsed);
  updateTimerRingDOM(elapsed);

  if (elapsed > 0 && elapsed % 30 === 0 && elapsed !== lastBeepSecond) {
    lastBeepSecond = elapsed;
    playTimerBeep();
  }

  announceTimerVoiceCues(elapsed);

  if (!entry.done && projected >= target) {
    stopTimer(elapsed); // arrêt automatique : "Défi terminé !" déjà annoncé ci-dessus, les popups XP/trophée suivent via addSet()
  } else if (entry.done && !entry.hardcoreDone && projected >= hcTarget) {
    if (voiceCoachEnabled) speak('Mode Hardcore réussi ! Un vrai Titan !');
    stopTimer(elapsed); // arrêt définitif
  }
}

// `precomputedElapsed` évite un léger écart d'arrondi quand stopTimer() est appelé
// depuis tickTimer() (arrêt automatique) plutôt que depuis un clic manuel (pause).
async function stopTimer(precomputedElapsed) {
  const elapsed = precomputedElapsed !== undefined ? precomputedElapsed : Math.round((Date.now() - timerStartMs) / 1000);
  clearTimerState();
  if (elapsed > 0) {
    await addSet(elapsed);
  } else {
    render();
  }
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

function formatDateLabel(d) {
  const days = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months = ['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}

let currentChallengeId = null;

function emptyDayState() {
  return { challenges: {} };
}

function emptyChallengeEntry() {
  return { sets: [], targetOverride: null, done: false, hardcoreDone: false, hardcoreAnnounced: false };
}

function getEntry(id) {
  if (!state.challenges[id]) {
    state.challenges[id] = emptyChallengeEntry();
  }
  if (state.challenges[id].hardcoreDone === undefined) {
    state.challenges[id].hardcoreDone = false; // migration
  }
  if (state.challenges[id].hardcoreAnnounced === undefined) {
    state.challenges[id].hardcoreAnnounced = false; // migration
  }
  return state.challenges[id];
}

/**
 * Charge la progression du jour (`day:{todayKey}`) dans `state`, recalcule
 * `todayKey`/`weekData`. Notifie `dayStateStore` à la fin — combiné au signal de
 * `loadActiveToday()`, c'est ce qui déclenche le premier vrai rendu de l'app
 * (voir `createStore`, Batch 6) plutôt qu'un `render()` manuel non coordonné.
 */
async function loadState() {
  const today = new Date();
  todayKey = dateKey(today);
  try {
    const res = await dbGet('day:' + todayKey);
    state = JSON.parse(res.value);
    if (!state.challenges) state = emptyDayState(); // migration depuis l'ancien format
  } catch (e) {
    state = emptyDayState();
  }
  // Pastilles de la semaine calendaire (Lundi -> Dimanche) : calculées à partir de
  // dailyActivity (déjà chargé en parallèle), au lieu d'appels Firestore séquentiels
  // supplémentaires (un par jour).
  weekData = {};
  for (const d of getCalendarWeekDates(today)) {
    const k = dateKey(d);
    weekData[k] = (dailyActivity[k] || 0) > 0;
  }
  render();
  dayStateStore.set({ ...dayStateStore.get(), stateLoaded: true });
}

async function saveState() {
  try {
    await dbSet('day:' + todayKey, JSON.stringify(state));
  } catch (e) {
    reportSaveError('save state failed', e);
  }
}

function getChallenge() {
  return resolveChallenge(CHALLENGES.find(c => c.id === currentChallengeId));
}

function getTarget() {
  const c = getChallenge();
  const entry = getEntry(currentChallengeId);
  return entry.targetOverride || (c ? c.target : 0);
}

function getHardcoreTarget(c) {
  if (!c) return 0;
  const base = c.hardcoreTarget || c.target * 2;
  return Math.max(base, c.target + 1);
}

function getTotal() {
  const entry = getEntry(currentChallengeId);
  return entry.sets.reduce((a,b) => a+b, 0);
}

async function pickChallenge(id) {
  clearTimerState();
  currentChallengeId = id;
  getEntry(id); // s'assure qu'une entrée existe (reprend celle du jour si déjà commencée)
  pushNavState();
  render(true);
}

async function addSet(amount) {
  if (amount <= 0) return;
  const entry = getEntry(currentChallengeId);
  entry.sets.push(amount);
  await registerBossBattleContributionIfNeeded(currentChallengeId, amount); // chaque serie compte, pas seulement la complétion du défi
  const total = getTotal();
  const target = getTarget();
  const willComplete = total >= target && !entry.done;

  // Records & totaux à vie
  if (!stats[currentChallengeId]) {
    stats[currentChallengeId] = { lifetimeTotal: 0, bestDay: { total: 0, date: null }, recordStreak: 0 };
  }
  const s = stats[currentChallengeId];
  if (s.recordStreak === undefined) s.recordStreak = 0;
  s.lifetimeTotal += amount;
  let newRecord = false;
  if (total > s.bestDay.total) {
    s.bestDay = { total, date: todayKey };
    newRecord = true;
  }

  if (willComplete) {
    s.recordStreak = newRecord ? s.recordStreak + 1 : 0;
  }
  await saveStats();

  if (willComplete) {
    entry.done = true;
    weekData[todayKey] = true;
    lastCompleted[currentChallengeId] = Date.now();
    await saveLastCompleted();
    await registerCommunityCompletionIfNeeded(currentChallengeId);
    await registerActivityFeedEntryIfNeeded(getChallenge(), total);

    const isFirstCompletionOfDay = !dailyActivity[todayKey];
    dailyActivity[todayKey] = (dailyActivity[todayKey] || 0) + 1;
    await saveDailyActivity();

    badges.totalCompletions += 1;
    const freshBadges = checkNewBadges();
    await saveBadges();

    const completedChallenge = getChallenge();
    const xpGained = xpForChallenge(completedChallenge, total);
    const trophyXp = freshBadges.reduce((sum, b) => sum + (b.xp || 0), 0);
    const { levelBefore, levelAfter } = await awardXp(xpGained + trophyXp);
    if (isFirstCompletionOfDay) await registerDailyStreak();

    if (navigator.vibrate) navigator.vibrate([45, 35, 45, 35, 90]);
    fireConfetti();
    playSuccessSound();

    enqueuePopup({
      icon: newRecord ? '🏆' : '✅',
      title: newRecord ? 'Nouveau record !' : 'Défi complété !',
      subtitle: `${completedChallenge.name} — ${total} ${completedChallenge.unit === 'sec' ? 'sec' : 'reps'}`,
      xp: xpGained,
    });
    enqueueTrophyPopups(freshBadges);
    enqueueLevelPopups(levelBefore, levelAfter);

    // Progression automatique : 3 records consécutifs -> proposer d'augmenter l'objectif par défaut
    if (s.recordStreak >= 3) {
      const c = getChallenge();
      const suggestedTarget = Math.ceil((total * 1.15) / 5) * 5;
      setTimeout(async () => {
        const accept = await confirmModal({
          icon: '🚀',
          title: 'Nouveau record 3 fois de suite !',
          subtitle: `Veux-tu augmenter l'objectif par défaut de "${escapeHtml(c.name)}" de ${formatTargetLabel(c.target, c.unit)} à ${formatTargetLabel(suggestedTarget, c.unit)} ?`,
          confirmLabel: 'Augmenter l\'objectif',
          cancelLabel: 'Pas maintenant',
        });
        if (accept) {
          if (c.isCustom) {
            const custom = customChallenges.find(x => x.id === c.id);
            if (custom) custom.target = suggestedTarget;
            rebuildChallenges();
            await saveCustomChallenges();
          } else {
            manualTargetOverrides[c.id] = suggestedTarget;
            await saveManualTargetOverrides();
          }
          showToast(`🎯 Objectif mis à jour : ${formatTargetLabel(suggestedTarget, c.unit)}`);
        }
        s.recordStreak = 0;
        await saveStats();
      }, 1400);
    }
  }

  // Mode Hardcore : détection indépendante de la complétion normale
  const cForHardcore = getChallenge();
  const hcTarget = getHardcoreTarget(cForHardcore);
  const willCompleteHardcore = total >= hcTarget && !entry.hardcoreDone;
  if (willCompleteHardcore) {
    entry.hardcoreDone = true;
    badges.totalHardcore += 1;
    const freshHardcoreBadges = checkNewBadges();
    await saveBadges();
    const hcTrophyXp = freshHardcoreBadges.reduce((sum, b) => sum + (b.xp || 0), 0);
    const { levelBefore: hcLevelBefore, levelAfter: hcLevelAfter } = await awardXp(HARDCORE_XP_BONUS + hcTrophyXp);

    if (navigator.vibrate) navigator.vibrate([60, 40, 60, 40, 60, 40, 140]);
    fireConfetti('hardcore');
    playSuccessSound();

    enqueuePopup({
      epic: true,
      icon: '🔥',
      title: 'MODE HARDCORE complété !',
      subtitle: `${cForHardcore.name} — ${Math.min(total, hcTarget)} / ${hcTarget} ${cForHardcore.unit === 'sec' ? 'sec' : 'reps'}`,
      xp: HARDCORE_XP_BONUS,
    });
    enqueueTrophyPopups(freshHardcoreBadges);
    enqueueLevelPopups(hcLevelBefore, hcLevelAfter);
  }

  await saveState();
  render();
}

async function undoLast() {
  const entry = getEntry(currentChallengeId);
  const popped = entry.sets.pop();
  const total = getTotal();

  if (popped && stats[currentChallengeId]) {
    const s = stats[currentChallengeId];
    s.lifetimeTotal = Math.max(0, s.lifetimeTotal - popped);
    if (s.bestDay.date === todayKey) s.bestDay.total = total;
    await saveStats();
  }

  if (total < getTarget()) {
    entry.done = false;
    weekData[todayKey] = Object.values(state.challenges).some(e => e.done);
  }
  await saveState();
  render();
}

async function editTarget() {
  const c = getChallenge();
  const entry = getEntry(currentChallengeId);
  const current = getTarget();
  const input = prompt(`Objectif du jour (${c.unit === 'sec' ? 'secondes' : 'répétitions'}) :`, current);
  if (input === null) return;
  const val = parseInt(input, 10);
  if (isNaN(val) || val <= 0) return;
  entry.targetOverride = val;
  const total = getTotal();
  entry.done = total >= val;
  await saveState();
  render();
}

function customAddSubmit() {
  const input = document.getElementById('customAddInput');
  const val = parseInt(input.value, 10);
  if (!isNaN(val) && val > 0) {
    addSet(val);
    input.value = '';
  }
}

function applyContent(app, html, animate, afterRender) {
  if (animate) {
    app.classList.add('fade-out');
    setTimeout(() => {
      app.innerHTML = html;
      app.classList.remove('fade-out');
      if (afterRender) afterRender();
    }, 140);
  } else {
    app.innerHTML = html;
    if (afterRender) afterRender();
  }
}

function render(animate) {
  const app = document.getElementById('app');
  const today = new Date();

  if (showProfileOnboarding) {
    applyContent(app, renderProfileOnboardingScreen(), animate, initWheelPickers);
    return;
  }

  if (onboardingTransitionPhase) {
    applyContent(app, renderOnboardingTransitionScreen(), animate);
    return;
  }

  if (usernameSetupMode) {
    // Même filet de restauration du focus/curseur que le champ de recherche Défis
    // (updateUsernameDraft() appelle render() à chaque frappe pour la vérif de
    // disponibilité en direct) : sans ça, un seul caractère taperait à la fois.
    const usernameEl = document.activeElement;
    const usernameWasFocused = !!(usernameEl && usernameEl.id === 'usernameSetupInput');
    const usernameCaret = usernameWasFocused ? usernameEl.selectionStart : null;
    applyContent(app, renderUsernameSetupScreen(), animate, () => {
      if (!usernameWasFocused) return;
      const input = document.getElementById('usernameSetupInput');
      if (!input) return;
      input.focus();
      if (usernameCaret !== null && input.setSelectionRange) input.setSelectionRange(usernameCaret, usernameCaret);
    });
    return;
  }

  if (friendsScreenOpen) {
    // Même filet de restauration du focus/curseur (voir usernameSetupMode ci-dessus) :
    // updateFriendSearchQuery() appelle render() à chaque frappe.
    const friendEl = document.activeElement;
    const friendWasFocused = !!(friendEl && friendEl.id === 'friendSearchInput');
    const friendCaret = friendWasFocused ? friendEl.selectionStart : null;
    applyContent(app, renderFriendsScreen(), animate, () => {
      if (!friendWasFocused) return;
      const input = document.getElementById('friendSearchInput');
      if (!input) return;
      input.focus();
      if (friendCaret !== null && input.setSelectionRange) input.setSelectionRange(friendCaret, friendCaret);
    });
    return;
  }

  if (activeTab === 'history') {
    applyContent(app, renderHistoryScreen() + renderTabBar() + renderGuidedTourOverlay(), animate);
    return;
  }

  if (activeTab === 'library') {
    // applyContent() remplace tout le innerHTML de #app à chaque frappe dans le champ
    // de recherche (updateLibrarySearch() appelle render() sur chaque oninput) : sans
    // ce filet, le nouvel <input> (même valeur affichée) ne recevrait jamais le focus
    // du navigateur, et l'utilisateur ne pourrait taper qu'un seul caractère à la fois.
    const searchEl = document.activeElement;
    const searchWasFocused = !!(searchEl && searchEl.id === 'librarySearchInput');
    const searchCaret = searchWasFocused ? searchEl.selectionStart : null;
    applyContent(app, renderLibraryScreen() + renderTabBar() + renderGuidedTourOverlay(), animate, () => {
      if (!searchWasFocused) return;
      const input = document.getElementById('librarySearchInput');
      if (!input) return;
      input.focus();
      if (searchCaret !== null && input.setSelectionRange) input.setSelectionRange(searchCaret, searchCaret);
    });
    return;
  }

  if (activeTab === 'account') {
    applyContent(app, renderAccountTabScreen() + renderTabBar() + renderGuidedTourOverlay(), animate);
    return;
  }

  if (activeTab === 'community') {
    applyContent(app, renderCommunityScreen() + renderTabBar() + renderGuidedTourOverlay(), animate);
    return;
  }

  let html = '';

  if (!currentChallengeId) {
    html += `
      <div class="header">
        <div class="date">${formatDateLabel(today)}</div>
        <button class="streak" onclick="showStreakInfoModal()">🔥 ${computeStreak()} j${hasShield ? ' 🛡️' : ''}</button>
      </div>
      <h1 class="title">Défi du jour</h1>
    `;
    // Défis BRUTS (non résolus) : renderChallengeCard() appelle déjà resolveChallenge()
    // en interne. Les pré-résoudre ici aussi provoquait une DOUBLE application des
    // coefficients de profil (niveau/âge/sexe/IMC) sur l'écran d'accueil UNIQUEMENT
    // (le mode 'library' passe déjà des défis bruts) : l'objectif y apparaissait donc
    // plus élevé que sur la fiche détail/l'onglet Défis pour le MÊME défi, sans qu'aucun
    // objectif n'ait pourtant été modifié manuellement (bug de prod signalé : 120 vs 110
    // sur Pompes).
    const activeChallenges = CHALLENGES.filter(c => activeToday.has(c.id));
    if (activeChallenges.length === 0) {
      html += renderCommunityHeroBanner();
    } else {
    html += `<div class="today-content-flex">`;
    const suggestion = getSuggestion();
    if (suggestion) {
      html += `
        <div class="suggestion-banner">
          <div class="suggestion-icon">💡</div>
          <div class="suggestion-text">${suggestion}</div>
        </div>
      `;
    }
    const cats = [...new Set(activeChallenges.map(c => c.cat))];
    let todayCardIndex = 0; // continu sur toute la liste (pas remis a zero par categorie), pour un seul enchainement visuel
    for (const cat of cats) {
      html += `<div class="section-label">${escapeHtml(cat)}</div><div class="picker-grid">`;
      for (const c of activeChallenges.filter(x => x.cat === cat)) {
        html += renderChallengeCard(c, 'today', todayCardIndex++);
      }
      html += `</div>`;
    }
    html += `<div class="home-trophies-slot">${renderBadgesStrip()}</div>`;
    html += `</div>`;
    }
  } else {
    const c = getChallenge();
    const entry = getEntry(currentChallengeId);
    const total = getTotal();
    const target = getTarget();
    const pct = Math.min(100, Math.round((total/target)*100));
    const unitLabel = c.unit === 'sec' ? 'sec' : 'reps';
    const quicks = QUICK_ADD[c.unit];
    const heroKey = getExercisePictogramKey(c);
    // WebP d'abord (bien plus léger que l'APNG source), repli PNG puis suppression
    // silencieuse si aucun des deux n'existe ; aucune requête réseau du tout pour les
    // clés connues comme n'ayant aucune image (PICTOGRAM_ASSET_MISSING).
    const heroImgHtml = PICTOGRAM_ASSET_MISSING.has(heroKey) ? '' : `
        <img class="exercise-hero-apng" src="exercices/${heroKey}.webp" alt="Démonstration : ${escapeHtml(c.name)}" decoding="async" loading="eager"
             onload="this.classList.add('loaded');"
             onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='exercices/${heroKey}.png';}else{this.remove();}">
    `;

    html += `
      <button class="nav-back-btn floating" onclick="history.back()" aria-label="Retour">‹</button>
      <div class="active-card${entry.done ? ' hardcore-engaged' : ''}">
        ${heroImgHtml}
        <div class="active-name">${escapeHtml(c.name)}</div>

        ${c.cat === 'Haltères' ? `
          <div class="weight-row">
            <div class="weight-pill">
              🏋️ ${weights[c.id] ?? 8} kg
              <button onclick="editWeight()" aria-label="Modifier le poids">✏️</button>
            </div>
          </div>
          ${armModeSentence(target, c.unit, c.armMode) ? `<div class="arm-mode-sentence"><span class="arm-mode-sentence-icon">💪</span><span>${armModeSentence(target, c.unit, c.armMode)}</span></div>` : ''}
        ` : ''}

        <div class="stats-row">
          <div class="stat-chip">🏆 Record : ${stats[c.id] ? stats[c.id].bestDay.total : 0}${unitLabel === 'sec' ? 's' : ''}</div>
          <div class="stat-chip">Σ ${(stats[c.id] ? stats[c.id].lifetimeTotal : 0).toLocaleString('fr-FR')} à vie</div>
        </div>

        ${!entry.done ? `
          <div class="progress-row">
            <div class="progress-numbers">
              <span class="progress-current">${total}</span><span class="progress-target"> / ${target}</span>
              <span class="progress-unit"> ${c.unit === 'sec' ? 'SEC' : 'reps'}</span>
              ${c.unit === 'sec' ? `<span class="progress-readable-inline">(${formatSecToReadable(target)})</span>` : ''}
              <button class="target-edit" onclick="editTarget()" aria-label="Modifier l'objectif">✏️</button>
            </div>
            <div class="progress-pct">${pct}%</div>
          </div>

          <div class="bar-track">
            <div class="bar-fill" style="width:${pct}%"></div>
          </div>
        ` : `
          <div class="normal-objective-recap">✓ Objectif normal : ${formatTargetLabel(target, c.unit)} — terminé</div>
        `}

        ${(() => {
          const hcTarget = getHardcoreTarget(c);
          const hcRange = hcTarget - target;
          const hcProgress = Math.max(0, total - target);
          const hcPct = Math.min(100, Math.round((hcProgress / hcRange) * 100));
          if (!entry.done) {
            return `
              <div class="hardcore-locked">🔒 Mode Hardcore débloqué à ${target} ${unitLabel} — objectif ${hcTarget} ${unitLabel}</div>
            `;
          }
          // Une fois l'objectif normal atteint, l'effort en cours concerne le Hardcore :
          // ce compteur devient le principal (grand, couleur Hardcore), l'objectif
          // normal ci-dessus repasse au second plan (petite mention discrète).
          const hcCurrent = Math.min(total, hcTarget);
          return `
            <div class="hardcore-tag">🔥 Mode Hardcore</div>
            <div class="progress-row hardcore-primary">
              <div class="progress-numbers">
                <span class="progress-current">${hcCurrent}</span><span class="progress-target"> / ${hcTarget}</span>
                <span class="progress-unit"> ${unitLabel === 'sec' ? 'SEC' : 'reps'}</span>
                ${unitLabel === 'sec' ? `<span class="progress-readable-inline">(${formatSecToReadable(hcTarget)})</span>` : ''}
              </div>
              <div class="progress-pct">${hcPct}%</div>
            </div>
            <div class="bar-track hardcore-track">
              <div class="bar-fill hardcore-fill${entry.hardcoreDone ? ' complete' : ''}" style="width:${hcPct}%"></div>
            </div>
            ${entry.hardcoreDone ? `<div class="hardcore-banner">🔥 MODE HARDCORE complété !</div>` : ''}
          `;
        })()}

        ${c.unit === 'sec' ? (() => {
          const hcT = getHardcoreTarget(c);
          const elapsedNow = timerRunning ? Math.floor((Date.now() - timerStartMs) / 1000) : 0;
          const projected = total + elapsedNow;
          const { normalPct, hardcorePct } = computeTimerRingPct(projected, target, hcT);
          return `
            <div class="timer-box">
              <div class="add-label">Chronométrer une série</div>
              <div class="timer-ring-wrap${entry.hardcoreDone ? ' done' : ''}" onclick="toggleTimer()">
                ${renderDoubleTimerRingSVG(normalPct, hardcorePct, 220)}
                <div class="timer-ring-center">
                  <div class="timer-display${timerRunning ? ' running' : ''}" id="timerDisplay">${formatTimer(elapsedNow)}</div>
                  ${entry.hardcoreDone
                    ? `<div class="timer-play-icon done">✓</div>`
                    : `<div class="timer-play-icon${timerRunning ? ' confirm' : ''}">${timerRunning ? '✓' : '▶'}</div>`
                  }
                </div>
              </div>
            </div>
          `;
        })() : `
          <div class="add-label">Ajouter une série</div>
          <div class="quick-add-grid">
            ${quicks.map(q => `<button class="qa-btn" onclick="addSet(${q})">+${q}</button>`).join('')}
          </div>
        `}
        <div class="custom-add-row">
          <input type="number" id="customAddInput" placeholder="Nombre personnalisé" inputmode="numeric">
          <button class="custom-add-btn" onclick="customAddSubmit()">Ajouter</button>
        </div>

        ${entry.sets.length > 0 ? `
          <div class="undo-row">
            <button class="undo-btn" onclick="undoLast()">Annuler la dernière série (${entry.sets[entry.sets.length-1]})</button>
          </div>
        ` : ''}

        ${entry.done ? `<div class="done-banner">✓ Défi complété aujourd'hui</div>` : ''}
      </div>
    `;
  }

  // week strip — semaine calendaire Lundi -> Dimanche, numéro du jour dans le cercle
  // (remplacé par ✓ une fois le jour validé).
  html += `<div class="week-strip">`;
  for (const d of getCalendarWeekDates(new Date())) {
    const k = dateKey(d);
    const isToday = k === todayKey;
    const done = weekData[k];
    html += `
      <div class="week-day">
        <div class="dow">${DOW_LABELS[d.getDay()]}</div>
        <div class="week-dot${done ? ' done' : ''}${isToday ? ' today' : ''}">${done ? '✓' : d.getDate()}</div>
      </div>
    `;
  }
  html += `</div>`;
  html += renderTabBar();
  html += renderGuidedTourOverlay();

  applyContent(app, html, animate, () => {
    const input = document.getElementById('customAddInput');
    if (input) {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') customAddSubmit();
      });
    }
  });
}

/** Charge les 28 derniers jours d'historique (documents `day:{key}`), en parallèle. */
async function loadHistoryEntries() {
  const DAYS_BACK = 28;
  const dayInfos = [];
  for (let i = 0; i < DAYS_BACK; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    dayInfos.push({ d, k: dateKey(d) });
  }
  // Lectures Firestore toujours en parallèle (règle du projet) : ce sont 28 documents
  // indépendants, aucune dépendance entre eux ne justifie de les lire en séquentiel
  // (jusqu'à 28 aller-retours réseau l'un après l'autre à chaque ouverture du Journal).
  const results = await Promise.all(dayInfos.map(({ k }) =>
    dbGet('day:' + k).then(res => JSON.parse(res.value)).catch(() => null)
  ));
  const entries = [];
  results.forEach((s, idx) => {
    if (!s || !s.challenges) return;
    const { d, k } = dayInfos[idx];
    for (const [cid, entry] of Object.entries(s.challenges)) {
      if (entry.sets && entry.sets.length === 0) continue;
      const c = CHALLENGES.find(x => x.id === Number(cid));
      entries.push({
        key: k,
        date: d,
        challengeName: c ? c.name : 'Défi supprimé',
        cat: c ? c.cat : '',
        total: entry.sets ? entry.sets.reduce((a,b)=>a+b,0) : 0,
        target: entry.targetOverride || (c ? c.target : 0),
        unit: c ? c.unit : 'reps',
        done: !!entry.done,
      });
    }
  });
  historyEntries = entries;
}

// Hero Banner communautaire : remplace l'ancien état vide générique quand aucun défi
// n'est encore sélectionné aujourd'hui (accompagnement "sans effort de choix" + FOMO).
// Repli sur renderTodayEmptyState() si les défis communautaires ne se résolvent pas
// (bibliothèque vide) — ne doit jamais laisser un écran cassé.
function renderCommunityHeroBanner() {
  const { challenge1, challenge2 } = getDailyCommunityChallenges();
  if (!challenge1 || !challenge2) return renderTodayEmptyState();
  // Même format de carte que l'onglet Défis (.picker-item : nom à gauche, reps/poids
  // à droite) plutôt qu'une mise en page dédiée — cohérence visuelle demandée entre les
  // 2 écrans pour le même genre d'information. `no-anim` : ces cartes se re-rendent à
  // chaque mise à jour temps réel de communityDailyCounts (onSnapshot), l'entrée en
  // cascade de .picker-item rejouerait donc en boucle sans cette classe.
  const cards = [challenge1, challenge2].map((c) => {
    const resolved = resolveChallenge(c);
    const targetLabel = resolved.unit === 'sec' ? formatSecToReadable(resolved.target) : resolved.target + ' reps';
    const weightKg = weights[c.id] ?? computeStandardWeight(c, userProfile) ?? 8;
    const weightBelow = c.cat === 'Haltères' ? `<div class="goal-weight">🏋️ ${weightKg}kg</div>` : '';
    return `
      <div class="picker-item no-anim">
        ${renderExercisePicto(c)}
        <div class="picker-item-body">
          <span class="name">${escapeHtml(c.name)}</span>
        </div>
        <div class="goal">
          ${targetLabel}
          ${weightBelow}
        </div>
      </div>
    `;
  }).join('');
  // Un seul compteur de participation en haut de la carte (pas répété sous chaque
  // exercice avec des chiffres différents) : "participants" compte les membres qui ont
  // cliqué sur "Relever le défi", indépendamment du fait qu'ils aient ensuite terminé
  // les 2 exercices — voir registerCommunityParticipantIfNeeded().
  const participants = communityDailyCounts.participants;
  return `
    <div class="community-hero-banner">
      <div class="community-hero-header">
        <span class="community-hero-badge">🌍 Défi communautaire du jour</span>
        <span class="community-hero-timer">⏳ Encore ${hoursRemainingToday()}h</span>
      </div>
      <div class="community-hero-proof">🔥 ${participants} membre${participants === 1 ? '' : 's'} ${participants === 1 ? 'a' : 'ont'} relevé ce défi aujourd'hui</div>
      <div class="community-hero-list">${cards}</div>
      <button class="community-hero-accept-all-btn" onclick="acceptAllCommunityChallenges()">Relever le défi communautaire du jour</button>
      <button class="community-hero-choose-btn" onclick="switchTab('library')">Choisir mon propre défi</button>
    </div>
  `;
}

// Toujours le module "Prochains trophées à portée de main" (2-3 trophées VERROUILLÉS
// les plus proches d'être débloqués), qu'il y ait 0 ou N trophées déjà débloqués :
// la version précédente ne remplaçait que la branche "0 débloqué", donc dès le premier
// trophée obtenu l'ancienne bande des trophées déjà réussis réapparaissait sans jamais
// montrer le teaser. Les trophées déjà débloqués restent consultables dans l'onglet Profil.
function renderBadgesStrip() {
  const locked = BADGE_DEFS.filter(b => !badges.unlocked.includes(b.id));
  if (locked.length === 0) {
    return `
      <div class="section-label">Trophées</div>
      <div class="badges-empty">Tous les trophées sont débloqués — bravo, légende ! 🏆</div>
    `;
  }
  const closest = locked
    .map(b => {
      const p = b.progress();
      const pct = p.target > 0 ? Math.min(100, (p.current / p.target) * 100) : 0;
      return { b, pct };
    })
    .sort((a, z) => z.pct - a.pct)
    .slice(0, 3);
  return `
    <div class="section-label">Prochains trophées à portée de main</div>
    <div class="next-trophies-grid">
      ${closest.map(({ b, pct }) => `
        <div class="next-trophy-card" onclick="showTrophyDetailModal('${b.id}')">
          <div class="next-trophy-icon">${b.icon}</div>
          <div class="next-trophy-body">
            <div class="next-trophy-name">${b.label}</div>
            <div class="next-trophy-track"><div class="next-trophy-fill" style="width:${Math.round(pct)}%"></div></div>
          </div>
          <div class="next-trophy-pct">${Math.round(pct)}%</div>
        </div>
      `).join('')}
    </div>
  `;
}

// Carte d'exercice partagée entre l'accueil ("today", clic = ouvrir la fiche) et
// l'onglet Défis ("library", clic = activer/désactiver pour aujourd'hui). Même
// structure/CSS (.picker-item) des deux côtés ; seules différences : la colonne de
// droite (statut du jour vs pastille "Actif"), le poids affiché pour les défis
// haltères en mode bibliothèque, et les actions éditer/supprimer réservées aux
// défis personnalisés.
function renderChallengeCard(c, mode, index, animate = true) {
  const resolved = resolveChallenge(c);
  const isActive = activeToday.has(c.id);
  const weightKg = weights[c.id] ?? computeStandardWeight(c, userProfile) ?? 8;
  // Poids affiché sous les reps, sur sa propre ligne, identique sur Défis et Aujourd'hui
  // (jamais "à côté" des reps).
  const weightBelow = c.cat === 'Haltères' ? `<div class="goal-weight">🏋️ ${weightKg}kg</div>` : '';

  // Objectif AFFICHÉ (utilisé aussi bien pour le libellé "goal" que pour le calcul de
  // progression ci-dessous) : priorité à l'objectif du jour (`entry.targetOverride`,
  // modifiable via le crayon ✏️ sur la fiche détail via editTarget()) sur l'objectif
  // standard résolu (`resolved.target`). Avant ce correctif, seule la ligne "En cours"
  // ci-dessous en tenait compte : le libellé "goal", lui, affichait TOUJOURS
  // `resolved.target`, ce qui désynchronisait visiblement la carte d'accueil (objectif
  // standard) de la fiche détail (objectif du jour réellement utilisé par getTarget()).
  const todayEntry = mode !== 'library' ? state.challenges[c.id] : null;
  const displayTarget = (todayEntry && todayEntry.targetOverride) || resolved.target;

  let rightHtml;
  if (mode === 'library') {
    rightHtml = '';
  } else {
    const rel = formatRelative(lastCompleted[c.id]);
    rightHtml = '';
    if (todayEntry && todayEntry.hardcoreDone) {
      rightHtml = `<div class="last-done status-hardcore">🔥 Hardcore complété</div>`;
    } else if (todayEntry && todayEntry.done) {
      rightHtml = `<div class="last-done status-done">✓ Terminé aujourd'hui</div>`;
    } else if (todayEntry && todayEntry.sets.length > 0) {
      const t = todayEntry.sets.reduce((a,b)=>a+b,0);
      rightHtml = `<div class="last-done status-progress">● En cours — ${t}/${displayTarget}</div>`;
    } else if (rel) {
      rightHtml = `<div class="last-done">${rel}</div>`;
    }
  }

  const onclick = mode === 'library' ? `toggleActiveToday(${c.id})` : `pickChallenge(${c.id})`;
  // Contrôle d'activation explicite (bouton visible), en plus du clic sur la ligne :
  // l'état actif/inactif doit être identifiable sans avoir à deviner que la ligne est cliquable.
  const activateBtn = mode === 'library'
    ? `<button class="activate-toggle-btn${isActive ? ' active' : ''}" onclick="event.stopPropagation(); toggleActiveToday(${c.id})">${isActive ? '✓ Actif' : '+ Activer'}</button>`
    : '';

  // Entrée en cascade (léger décalage par carte), plafonné pour ne jamais laisser une
  // longue liste avec un délai interminable sur les dernières cartes ; absent si
  // index n'est pas fourni (repli sans délai, jamais d'animation cassée). `animate`
  // (par défaut true, comme avant) permet à renderLibraryScreen() de désactiver
  // l'animation quand un accordéon déjà ouvert se contente de re-render suite à un
  // toggle d'activation — seule une NOUVELLE ouverture de menu déroulant doit animer.
  const delayStyle = index !== undefined ? ` style="animation-delay:${Math.min(index, 8) * 40}ms"` : '';

  // Ruban + compteur "défi communautaire du jour" : garde le FOMO vivant même une

  // le(s) défi(s) du jour communautaires pendant qu'il parcourt le catalogue.
  const communitySlot = getCommunityDailySlot(c.id);
  const communityCount = communitySlot === 1 ? communityDailyCounts.completions1 : communitySlot === 2 ? communityDailyCounts.completions2 : 0;
  const communityRibbon = communitySlot
    ? `<span class="community-card-ribbon" title="Défi communautaire du jour — ${communityCount} validé(s) aujourd'hui">🌍 ${communityCount}</span>`
    : '';

  return `
    <div class="picker-item${noAnimClass}"${delayStyle} onclick="${onclick}">
      ${renderExercisePicto(c)}
      <div class="picker-item-body">
        <span class="name">${escapeHtml(c.name)}</span>

}

function renderLibraryScreen() {
  if (editingChallengeId !== null) {

    <div class="library-header-row">

        <div class="subtitle">Active les défis que tu veux faire aujourd'hui</div>
      </div>
