<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Défi du Jour</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Défi du Jour">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<!-- Firebase (gratuit, plan Spark) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  @font-face {
    font-family: 'system-condensed';
    src: local('Arial Narrow');
  }

  :root {
    --bg: #0a0d0b;
    --bg-raised: #121613;
    --bg-card: #171c18;
    --chalk: #eef2ef;
    --chalk-dim: #8a958e;
    --accent: #39e97a;
    --accent-soft: #1f6b3e;
    --accent-dim: #235c39;
    --accent-glow: rgba(57, 233, 122, 0.35);
    --line: #212a23;
    --good: #5fbf7a;
    --danger: #ef5350;
    --hardcore: #ff6b35;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--chalk);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    overscroll-behavior-y: contain;
  }

  body {
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.03), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(255,255,255,0.02), transparent 50%);
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 18px 100px;
    min-height: 100vh;
    opacity: 1;
    transition: opacity 0.14s ease;
  }
  .app.fade-out {
    opacity: 0;
  }

  /* BARRE DE NAVIGATION PERSISTANTE (bas d'écran) */
  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    background: var(--bg-raised);
    border-top: 1px solid var(--line);
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
    z-index: 500;
  }
  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: none;
    border: none;
    color: var(--chalk-dim);
    font-size: 10.5px;
    font-weight: 700;
    padding: 6px 2px;
    cursor: pointer;
    border-radius: 12px;
    transition: color 0.15s ease;
  }
  .tab-btn:active {
    background: var(--bg-card);
    transform: scale(0.96);
  }
  .tab-icon {
    font-size: 21px;
    line-height: 1;
    transition: transform 0.15s ease;
  }
  .tab-btn.active {
    color: var(--accent);
  }
  .tab-btn.active .tab-icon {
    transform: scale(1.12);
    filter: drop-shadow(0 0 6px var(--accent-glow));
  }
  .tab-label {
    letter-spacing: 0.01em;
  }

  /* HEADER */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 22px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .header .date {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    font-weight: 600;
  }
  .header .streak {
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .header .streak:active { background: var(--bg-raised); transform: scale(0.95); }

  /* HISTORY SCREEN */
  .history-back {
    background: none;
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    margin-bottom: 18px;
  }
  .history-back:active { background: var(--bg-raised); transform: scale(0.95); }

  .share-stats-btn {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, var(--accent-dim), var(--accent));
    color: #0a0d0b;
    border: none;
    font-weight: 800;
    font-size: 14.5px;
    padding: 14px;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 24px;
  }
  .share-stats-btn:active { transform: scale(0.98); }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 26px;
  }
  .cal-dow {
    text-align: center;
    font-size: 10px;
    color: var(--chalk-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
  }
  .cal-cell {
    aspect-ratio: 1;
    border-radius: 7px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--chalk-dim);
    position: relative;
  }
  .cal-cell.done {
    background: var(--good);
    border-color: var(--good);
    color: #0a0d0b;
    font-weight: 800;
  }
  .cal-cell.today {
    border-color: var(--accent);
    border-width: 2px;
  }
  .cal-cell.empty {
    background: none;
    border: none;
  }

  .history-list-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--chalk-dim);
    font-weight: 700;
    margin: 0 0 10px;
  }
  .history-entry {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .history-entry .hdate {
    font-size: 11px;
    color: var(--chalk-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }
  .history-entry .hname {
    font-size: 14.5px;
    font-weight: 700;
  }
  .history-entry .hprogress {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--chalk-dim);
    white-space: nowrap;
    margin-left: 10px;
  }
  .history-entry .hprogress.done {
    color: var(--good);
    font-weight: 700;
  }
  .history-empty {
    text-align: center;
    color: var(--chalk-dim);
    padding: 30px 0;
    font-size: 14px;
  }

  /* WEEKLY CHART */
  .chart-wrap {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    height: 120px;
    margin-bottom: 26px;
    gap: 6px;
  }
  .chart-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    justify-content: flex-end;
  }
  .chart-bar-track {
    width: 100%;
    max-width: 26px;
    height: 80px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .chart-bar {
    width: 100%;
    background: var(--accent-dim);
    border-radius: 4px 4px 0 0;
    transition: height 0.3s ease;
  }
  .chart-bar.today { background: var(--accent); }
  .chart-val {
    font-size: 10px;
    color: var(--chalk-dim);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
    height: 12px;
  }
  .chart-dow {
    font-size: 10px;
    color: var(--chalk-dim);
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* HEATMAP */
  .heatmap-scroll {
    overflow-x: auto;
    margin-bottom: 8px;
    padding-bottom: 4px;
  }
  .heatmap-grid {
    display: grid;
    grid-template-rows: repeat(7, 12px);
    grid-auto-flow: column;
    grid-auto-columns: 12px;
    gap: 3px;
    width: max-content;
  }
  .heat-cell {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    background: var(--bg-card);
    border: 1px solid var(--line);
  }
  .heat-cell.lvl1 { background: #1a2e20; border-color: #1a2e20; }
  .heat-cell.lvl2 { background: var(--accent-dim); border-color: var(--accent-dim); }
  .heat-cell.lvl3 { background: var(--accent); border-color: var(--accent); }
  .heat-cell.future { visibility: hidden; }
  .heat-legend {
    display: flex;
    align-items: center;
    gap: 4px;
    justify-content: flex-end;
    font-size: 10px;
    color: var(--chalk-dim);
    margin-bottom: 26px;
  }
  .heat-legend .heat-cell { width: 10px; height: 10px; }

  /* TROPHY GRID (history screen, locked + unlocked) */
  .trophy-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 26px;
  }
  .trophy-item {
    background: var(--bg-card);
    border: 1px solid var(--accent-dim);
    border-radius: 12px;
    padding: 12px 4px;
    text-align: center;
  }
  .trophy-item.locked {
    border-color: var(--line);
    opacity: 0.5;
  }

  /* ACCOUNT SECTION */
  .account-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 30px;
  }
  .account-info {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .account-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--line);
  }
  .account-avatar-fallback {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--accent-dim);
    color: #0a0d0b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 18px;
  }
  .account-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--chalk);
  }
  .account-email {
    font-size: 12.5px;
    color: var(--chalk-dim);
    margin-top: 1px;
  }
  .signout-btn {
    display: block;
    width: 100%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--chalk);
    font-weight: 700;
    font-size: 14px;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .signout-btn:active { transform: scale(0.98); }
  .delete-account-btn {
    display: block;
    width: 100%;
    background: none;
    border: 1px solid var(--danger);
    color: var(--danger);
    font-weight: 700;
    font-size: 13px;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
  }
  .delete-account-btn:active { background: rgba(217, 99, 79, 0.1); transform: scale(0.98); }

  /* MANAGE LINK + BADGES STRIP */
  .badges-empty {
    color: var(--chalk-dim);
    font-size: 13px;
    text-align: center;
    padding: 16px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .badges-strip {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .badge-chip {
    flex: 0 0 auto;
    width: 76px;
    background: var(--bg-card);
    border: 1px solid var(--accent-dim);
    border-radius: 12px;
    padding: 12px 6px;
    text-align: center;
  }
  .badge-icon { font-size: 26px; margin-bottom: 4px; }
  .badge-label {
    font-size: 9.5px;
    color: var(--chalk-dim);
    line-height: 1.2;
  }

  /* DÉFIS (ex-Bibliothèque) — en-tête + bouton compact d'ajout */
  .library-header-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .add-custom-fab {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--bg-card);
    border: 1.5px solid var(--accent-dim);
    color: var(--accent);
    font-size: 20px;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .add-custom-fab:active { transform: scale(0.94); background: var(--bg-raised); }

  /* PROFILE ONBOARDING (coach virtuel) */
  .profile-onboarding {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 2000;
    display: flex;
    flex-direction: column;
    padding: 20px 22px 32px;
  }
  .pf-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .pf-header > div:empty {
    width: 34px;
  }
  .pf-back {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    font-size: 18px;
    cursor: pointer;
  }
  .pf-back:active { transform: scale(0.92); }
  .pf-progress {
    display: flex;
    gap: 6px;
  }
  .pf-dot {
    width: 22px;
    height: 4px;
    border-radius: 3px;
    background: var(--line);
  }
  .pf-dot.active { background: var(--accent); }
  .pf-dot.done { background: var(--accent-dim); }

  .pf-step {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    max-width: 420px;
    margin: 0 auto;
    width: 100%;
  }
  .pf-emoji { font-size: 46px; margin-bottom: 14px; }
  .pf-question {
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 20px;
    line-height: 1.2;
  }
  .pf-subtitle {
    font-size: 13.5px;
    color: var(--chalk-dim);
    line-height: 1.5;
    margin: -10px 0 22px;
  }
  .pf-number-input {
    width: 100%;
    background: var(--bg-card);
    border: 1.5px solid var(--line);
    color: var(--chalk);
    font-size: 32px;
    font-weight: 800;
    text-align: center;
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 20px;
    font-variant-numeric: tabular-nums;
  }
  .pf-number-input:focus { outline: none; border-color: var(--accent); }
  .pf-number-input.small { font-size: 24px; padding: 14px; margin-bottom: 0; }

  .pf-two-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    margin-bottom: 22px;
  }
  .pf-input-group label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--chalk-dim);
    font-weight: 700;
    margin-bottom: 8px;
  }

  .pf-next-btn {
    width: 100%;
    background: var(--accent);
    color: #0a0d0b;
    border: none;
    font-weight: 800;
    font-size: 16px;
    padding: 16px;
    border-radius: 14px;
    cursor: pointer;
  }
  .pf-next-btn:active { transform: scale(0.97); }

  .pf-choice-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  .pf-choice {
    background: var(--bg-card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, transform 0.1s;
  }
  .pf-choice:active { transform: scale(0.98); }
  .pf-choice.selected {
    border-color: var(--accent);
    background: rgba(242, 193, 78, 0.08);
  }
  .pf-choice-emoji { font-size: 26px; }
  .pf-choice-label { font-size: 15px; font-weight: 700; }

  .pf-level-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  .pf-level-card {
    background: var(--bg-card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }
  .pf-level-card:active { transform: scale(0.98); }
  .pf-level-card.selected {
    border-color: var(--accent);
    background: rgba(242, 193, 78, 0.08);
  }
  .pf-level-title { font-size: 16px; font-weight: 800; margin-bottom: 3px; }
  .pf-level-desc { font-size: 12.5px; color: var(--chalk-dim); }

  /* ÉCRAN DE BIENVENUE (intro coach virtuel) */
  .pf-step-welcome { justify-content: center; }
  .pf-welcome-badge {
    width: 76px;
    height: 76px;
    border-radius: 22px;
    background: linear-gradient(145deg, var(--accent), var(--accent-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin: 0 auto 22px;
    box-shadow: 0 10px 30px rgba(242, 193, 78, 0.25);
  }
  .pf-welcome-title {
    font-size: 28px;
    font-weight: 900;
    line-height: 1.25;
    margin: 0 0 16px;
  }
  .pf-brand {
    color: var(--accent);
  }
  .pf-welcome-desc {
    font-size: 14.5px;
    color: var(--chalk-dim);
    line-height: 1.6;
    margin-bottom: 26px;
  }
  .pf-algo-callout {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    background: linear-gradient(135deg, rgba(57,233,122,0.10), rgba(57,233,122,0.03));
    border: 1px solid var(--accent-dim);
    border-radius: 16px;
    padding: 18px;
    text-align: left;
    margin-bottom: 28px;
  }
  .pf-algo-icon {
    font-size: 28px;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 8px rgba(57,233,122,0.3));
  }
  .pf-algo-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 5px;
  }
  .pf-algo-desc {
    font-size: 13px;
    color: var(--chalk);
    line-height: 1.5;
  }

  .save-challenge-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .manage-actions { display: flex; gap: 6px; }
  .icon-btn {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    padding: 7px 9px;
    cursor: pointer;
  }
  .icon-btn.danger { border-color: var(--danger); }
  .icon-btn:active { transform: scale(0.94); }

  /* BIBLIOTHÈQUE — accordéons par catégorie */
  .accordion { margin-bottom: 10px; }
  .accordion-header {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    color: var(--chalk);
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
  }
  .accordion-header:active { transform: scale(0.99); }
  .accordion-chevron {
    display: inline-block;
    color: var(--accent);
    font-size: 19px;
    flex-shrink: 0;
    transition: transform 0.18s ease;
  }
  .accordion.open .accordion-chevron { transform: rotate(90deg); }
  .accordion-title { flex: 1; }
  .accordion-count {
    font-size: 11px;
    font-weight: 700;
    color: var(--chalk-dim);
    background: var(--bg-raised);
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .accordion-count.has-active {
    color: #9dff00;
    background: rgba(157, 255, 0, 0.12);
  }
  .accordion-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px 2px 4px;
  }

  /* DÉFIS — pastille "Actif" (seule différence visuelle avec la carte d'accueil) */
  .active-pill {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #0a0d0b;
    background: #9dff00;
    padding: 3px 8px;
    border-radius: 999px;
    box-shadow: 0 0 8px rgba(157, 255, 0, 0.55);
    white-space: nowrap;
    margin-top: 4px;
  }

  /* AUJOURD'HUI — écran vide (aucun défi actif) */
  .today-empty-state {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px 26px;
    text-align: center;
    margin-top: 12px;
  }
  .today-empty-icon { font-size: 44px; margin-bottom: 14px; }
  .today-empty-title { font-size: 17px; font-weight: 800; margin-bottom: 8px; }
  .today-empty-text {

  .form-field { margin-bottom: 16px; }

    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--chalk-dim);
    font-weight: 700;
    margin-bottom: 6px;

  .field-hint {
    text-transform: none;

    font-weight: 500;

  .form-field input, .form-field select {

    background: var(--bg-raised);

  .save-challenge-btn {

    font-weight: 800;
    font-size: 15px;
    padding: 14px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: 0 4px 20px var(--accent-glow);
  }
  .save-challenge-btn:active { transform: scale(0.98); }

  /* LOGIN SCREEN */
  .login-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  .login-screen .emoji { font-size: 48px; margin-bottom: 18px; }
  .login-screen h1 {
    font-size: 30px;
    font-weight: 900;
    text-transform: uppercase;
    margin: 0 0 8px;
  }
  .login-screen p {
    color: var(--chalk-dim);
    font-size: 14px;
    margin: 0 0 28px;
    max-width: 300px;
  }
  .google-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--chalk);
    color: #0a0d0b;
    border: none;
    font-size: 15px;
    font-weight: 700;
    padding: 14px 24px;
    border-radius: 12px;

  .login-error {
    margin-top: 16px;
    color: var(--danger);
    font-size: 13px;
    max-width: 300px;
  }

  h1.title {
    font-family: 'Arial Narrow', system-condensed, sans-serif;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    margin: 0 0 4px;
    line-height: 0.95;
  }
  .subtitle {
    color: var(--chalk-dim);
    font-size: 14px;
    margin-bottom: 26px;
  }

  /* PICKER (no challenge chosen yet) */
  .picker-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .picker-item {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 2px 16px;
    display: flex;
    gap: 12px;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s, box-shadow 0.15s;
  }
  .picker-item:active { transform: scale(0.98); }
  .picker-item:hover { border-color: var(--accent-dim); }

  .picker-item-body {
    flex: 1;
    min-width: 0;
  }

  .exercise-picto {
    flex-shrink: 0;
    align-self: stretch;
    width: 64px;
    min-height: 64px;
    border-radius: 12px;
    background: var(--bg-card);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    overflow: hidden;
    position: relative;
  }
  .exercise-picto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .exercise-picto svg {
    width: 34px;
    height: 34px;
  }
  .exercise-picto-fallback {
    display: none;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }

  .exercise-hero-apng {
    display: block;
    width: 100%;
    max-height: 220px;
    object-fit: contain;
    border-radius: 14px;
    background: var(--bg-card);
    margin-bottom: 10px;
  }
  .picker-item .name {
    font-size: 15.5px;
    font-weight: 600;
  }
  .picker-item .cat {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    font-weight: 700;
    display: block;
    margin-bottom: 2px;
  }
  .picker-item .goal {
    font-size: 13px;
    color: var(--chalk-dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    margin-left: 12px;
    text-align: right;
  }
  .last-done {
    font-size: 10.5px;
    color: var(--accent);
    font-weight: 700;
    margin-top: 3px;
    text-transform: none;
    letter-spacing: 0;
  }
  .last-done.status-progress {
    color: var(--accent);
  }
  .last-done.status-done {
    color: var(--good);
  }
  .last-done.status-hardcore {
    color: #ff6b35;
    font-weight: 800;
  }

  .suggestion-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(242, 193, 78, 0.1);
    border: 1px solid var(--accent-dim);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 18px;
  }
  .suggestion-icon { font-size: 18px; flex-shrink: 0; }
  .suggestion-text {
    font-size: 13px;
    color: var(--chalk);
    line-height: 1.35;
  }
  .suggestion-text strong { color: var(--accent); }
  .picker-item.done {
    opacity: 0.45;
  }
  .picker-item.done .name::after {
    content: " ✓";
    color: var(--good);
  }

  /* SECTION LABELS in picker */
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--chalk-dim);
    margin: 20px 0 8px;
    font-weight: 700;
  }
  .section-label:first-child { margin-top: 0; }

  /* ACTIVE CHALLENGE VIEW */
  .active-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 6px 20px 20px;
    position: relative;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
  }
  .active-cat {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .weight-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: -8px 0 18px;
    flex-wrap: wrap;
  }
  .weight-pill {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .weight-pill button {
    background: none;
    border: none;
    color: var(--chalk-dim);
    text-decoration: underline;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
  }
  .arm-mode-sentence {
    background: rgba(255, 107, 53, 0.1);
    border: 1px solid #6b3420;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12.5px;
    font-weight: 700;
    color: #ff8c5c;
    margin: -6px 0 18px;
  }
  .stats-row {
    display: flex;
    gap: 8px;
    margin: -6px 0 18px;
    flex-wrap: wrap;
  }
  .stat-chip {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 700;
    color: var(--chalk-dim);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 20px);
    background: var(--chalk);
    color: #0a0d0b;
    font-weight: 800;
    font-size: 14px;
    padding: 14px 22px;
    border-radius: 30px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 999;
    max-width: 88vw;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .confetti-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 998;
  }

  /* PULL TO REFRESH */
  .ptr-indicator {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) translateY(0px);
    opacity: 0;
    width: 40px;
    height: 40px;
    background: var(--bg-card);
    border: 1px solid var(--accent-dim);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 997;
    transition: opacity 0.2s ease;
    pointer-events: none;
  }
  .ptr-spinner {
    font-size: 18px;
    color: var(--chalk-dim);
    transition: transform 0.15s ease, color 0.15s ease;
  }
  .ptr-indicator.ready .ptr-spinner {
    color: var(--accent);
    transform: rotate(180deg);
  }
  .ptr-indicator.spinning .ptr-spinner {
    animation: ptr-spin 0.7s linear infinite;
  }
  @keyframes ptr-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .active-name {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 18px;
  }
  /* PROGRESS */
  .progress-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .progress-numbers {
    font-variant-numeric: tabular-nums;
  }
  .progress-current {
    font-size: 40px;
    font-weight: 900;
    color: var(--accent);
  }
  .progress-target {
    font-size: 18px;
    color: var(--chalk-dim);
    font-weight: 600;
  }
  .progress-unit {
    font-size: 13px;
    color: var(--chalk-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .progress-pct {
    font-size: 15px;
    font-weight: 700;
    color: var(--chalk-dim);
  }

  .progress-readable-inline {
    font-size: 13px;
    font-weight: 600;
    color: var(--chalk-dim);
    font-variant-numeric: tabular-nums;
    margin-left: 2px;
  }

  .bar-track {
    height: 10px;
    background: var(--bg);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 20px;
    border: 1px solid var(--line);
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    border-radius: 6px 0 0 6px;
    transition: width 0.35s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .bar-fill.complete {
    background: linear-gradient(90deg, #3f8f5c, var(--good));
  }

  /* HARDCORE MODE */
  .hardcore-locked {
    font-size: 12px;
    color: var(--chalk-dim);
    text-align: center;
    padding: 10px;
    background: var(--bg-raised);
    border: 1px dashed var(--line);
    border-radius: 10px;
    margin-bottom: 20px;
  }
  .hardcore-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .hardcore-label {
    font-size: 13px;
    font-weight: 800;
    color: #ff6b35;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .hardcore-nums {
    font-size: 12px;
    font-weight: 600;
    color: var(--chalk-dim);
    text-transform: none;
    letter-spacing: 0;
    margin-left: 8px;
  }
  .hardcore-pct {
    font-size: 13px;
    font-weight: 700;
    color: #ff6b35;
  }
  .hardcore-track {
    border-color: #6b3420;
  }
  .hardcore-fill {
    background: linear-gradient(90deg, #b8451f, #ff6b35);
  }
  .hardcore-fill.complete {
    background: linear-gradient(90deg, #ff6b35, #ffb347);
  }
  .hardcore-banner {
    text-align: center;
    padding: 14px;
    background: rgba(255, 107, 53, 0.12);
    border: 1px solid #ff6b35;
    border-radius: 12px;
    color: #ff8c5c;
    font-weight: 800;
    font-size: 14px;
    margin-bottom: 16px;
  }

  /* TALLY MARKS */
  .tally-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-bottom: 22px;
    min-height: 24px;
  }
  .tally-group {
    display: flex;
    align-items: flex-end;
    margin-right: 8px;
    height: 22px;
  }
  .tally-mark {
    width: 3px;
    height: 20px;
    background: var(--chalk-dim);
    margin-right: 3px;
    border-radius: 1px;
  }
  .tally-mark.strike {
    position: relative;
    margin-right: 6px;
  }
  .tally-mark.strike::after {
    content: '';
    position: absolute;
    left: -14px;
    top: 9px;
    width: 20px;
    height: 3px;
    background: var(--accent);
    transform: rotate(-35deg);
    border-radius: 1px;
  }

  /* QUICK ADD BUTTONS */
  .add-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--chalk-dim);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .quick-add-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(58px, 1fr));
    gap: 8px;
    margin-bottom: 12px;
  }
  .qa-btn {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--chalk);
    font-size: 15px;
    font-weight: 700;
    padding: 14px 4px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.08s, background 0.1s;
  }
  .qa-btn:active {
    transform: scale(0.94);
    background: var(--accent-dim);
  }

  /* TIMER */
  .timer-box {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 24px 20px;
    text-align: center;
    margin-bottom: 12px;
  }

  /* ANNEAU DE PROGRESSION CIRCULAIRE — élément visuel central du chrono */
  .timer-ring-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
  }
  .timer-ring {
    transform: rotate(-90deg);
    overflow: visible;
  }
  .timer-ring-bg {
    fill: none;
    stroke: var(--bg);
    stroke-width: 10;
  }
  .timer-ring-fill {
    fill: none;
    stroke: var(--accent);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.25s linear, stroke 0.25s ease;
    filter: drop-shadow(0 0 8px var(--accent-glow));
  }
  .timer-ring-fill.complete {
    stroke: var(--good);
    filter: drop-shadow(0 0 12px var(--accent-glow));
  }
  .timer-ring-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .timer-ring-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
    font-weight: 800;
    margin-top: 4px;
  }

  .timer-display {
    font-size: 40px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    color: var(--chalk);
    line-height: 1;
  }
  .timer-display.running {
    color: var(--accent);
    text-shadow: 0 0 18px var(--accent-glow);
  }
  .timer-btn {
    border: none;
    font-weight: 800;
    font-size: 16px;
    padding: 14px 0;
    border-radius: 12px;
    cursor: pointer;
    width: 100%;
    transition: transform 0.08s;
  }
  .timer-btn:active { transform: scale(0.97); }
  .timer-btn.start {
    background: var(--accent);
    color: #0a0d0b;
    box-shadow: 0 4px 20px var(--accent-glow);
  }
  .timer-btn.stop {
    background: var(--danger);
    color: #fff8f0;
  }
  .timer-hint {
    font-size: 12px;
    color: var(--chalk-dim);
    margin-top: 10px;
  }
  .focus-btn {
    display: block;
    width: 100%;
    background: none;
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    font-size: 13px;
    font-weight: 600;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
  }
  .focus-btn:active { background: var(--bg-raised); transform: scale(0.98); }

  /* FOCUS FULLSCREEN MODE */
  .focus-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 24px;
  }
  .focus-exit {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    font-size: 18px;
    cursor: pointer;
  }
  .focus-exit:active { transform: scale(0.92); }
  .focus-name {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 18px;
  }
  .focus-ring-wrap {
    margin: 0 auto 32px;
  }
  .focus-timer {
    font-size: 56px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    line-height: 1;
    text-shadow: 0 0 24px var(--accent-glow);
  }
  .focus-target {
    font-size: 14px;
    color: var(--chalk-dim);
    margin-bottom: 40px;
  }
  .focus-stop-btn {
    background: var(--danger);
    color: #fff8f0;
    border: none;
    font-weight: 800;
    font-size: 16px;
    padding: 16px 32px;
    border-radius: 14px;
    cursor: pointer;
  }
  .focus-stop-btn:active { transform: scale(0.96); }
  .or-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--chalk-dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 4px 0 12px;
  }
  .or-divider::before, .or-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .custom-add-row {
    display: flex;
    gap: 8px;
  }
  .custom-add-row input {
    flex: 1;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--chalk);
    font-size: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    font-variant-numeric: tabular-nums;
  }
  .custom-add-row input:focus { outline: 1px solid var(--accent); }
  .custom-add-btn {
    background: var(--accent);
    color: #0a0d0b;
    border: none;
    font-weight: 800;
    font-size: 14px;
    padding: 0 18px;
    border-radius: 10px;
    cursor: pointer;
  }
  .custom-add-btn:active { transform: scale(0.96); }

  .undo-row {
    text-align: center;
    margin-top: 14px;
  }
  .undo-btn {
    background: none;
    border: none;
    color: var(--chalk-dim);
    font-size: 12.5px;
    text-decoration: underline;
    cursor: pointer;
    padding: 6px;
  }

  .done-banner {
    text-align: center;
    padding: 16px;
    background: rgba(127, 176, 105, 0.12);
    border: 1px solid var(--good);
    border-radius: 12px;
    color: var(--good);
    font-weight: 700;
    font-size: 15px;
    margin-top: 16px;
  }

  /* TARGET EDIT */
  .target-edit {
    font-size: 12px;
    color: var(--chalk-dim);
    text-decoration: underline;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    margin-left: 8px;
  }

  /* WEEK STRIP */
  .week-strip {
    display: flex;
    justify-content: space-between;
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .week-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex: 1;
  }
  .week-day .dow {
    font-size: 10px;
    text-transform: uppercase;
    color: var(--chalk-dim);
    letter-spacing: 0.05em;
  }

async function deleteMyAccount() {
  if (!currentUser) return;

  const step1 = confirm(
    '⚠️ ATTENTION\n\nCeci va supprimer DÉFINITIVEMENT toutes tes données : défis, historique, statistiques, records et trophées.\n\nCette action est irréversible. Continuer ?'
  );
  if (!step1) return;

  const step2 = confirm(
    'Es-tu vraiment certain ? Il n\'y aura aucun moyen de récupérer ces données ensuite.'
  );
  if (!step2) return;

  try {
    const uid = currentUser.uid;

    // Supprime tous les documents de données de l'utilisateur (kv store)
    const snap = await db.collection('users').doc(uid).collection('kv').get();
    const batch = db.batch();
    snap.forEach(doc => batch.delete(doc.ref));
    await batch.commit();

    // Tente de supprimer le compte Google Auth lui-même
    try {
      await currentUser.delete();
    } catch (e) {
      if (e.code === 'auth/requires-recent-login') {
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await currentUser.reauthenticateWithPopup(provider);
          await currentUser.delete();
        } catch (e2) {
          console.error('Suppression du compte Auth impossible (données déjà effacées) :', e2);
        }
      } else {
        console.error('Suppression du compte Auth impossible (données déjà effacées) :', e);
      }
    }

    alert('Ton compte et toutes tes données ont été supprimés.');
    await auth.signOut();
  } catch (e) {
    alert('Une erreur est survenue pendant la suppression : ' + e.message);
  }
}

// ==== MOTEUR DE PERSONNALISATION (coach virtuel) ====
// Objectif Final = Objectif Standard × Coef(Niveau) × Coef(Âge) × Coef(Sexe) × Coef(IMC)
// Poids Final    = Poids Standard    × Coef(Niveau) × Coef(Âge) × Coef(Sexe, haltères)
//
// Les "Objectifs Standards" ci-dessus (target/hardcoreTarget/standardWeightKg) sont calibrés
// pour un homme de 30 ans, niveau intermédiaire, IMC normal — volontairement exigeants.
// Sources de calibration (normes ACSM/CSEP pompes) : écart hommes/femmes ~2x en max sur
// un set, écart d'environ -10 à -15% par décennie après 40 ans.

const COEF_LEVEL = {
  debutant: 0.6,      // remise en forme
  intermediaire: 1.0, // 2 séances de sport / semaine (référence)
  avance: 1.2,         // 3+ séances de sport / semaine
};

function getAgeCoef(age) {
  if (age < 30) return 1.0;
  if (age < 40) return 1.0;   // tranche de référence (30 ans)
  if (age < 50) return 0.88;
  if (age < 60) return 0.75;
  if (age < 70) return 0.60;
  return 0.45;
}

function getBmi(heightCm, weightKg) {
  if (!heightCm || !weightKg) return 22; // valeur neutre par défaut
  const heightM = heightCm / 100;
  return weightKg / (heightM * heightM);
}

// Coefficient IMC "brut" (avant pondération par l'impact spécifique à l'exercice)
function getBmiCoefRaw(bmi) {
  if (bmi < 18.5) return 0.9;   // maigreur : masse musculaire souvent moindre
  if (bmi < 25)   return 1.0;   // corpulence normale (référence)
  if (bmi < 30)   return 0.90;  // surpoids : souvent en partie musculaire chez les pratiquants réguliers, malus modéré
  return 0.70;                  // obésité : impact plus marqué sur les mouvements au poids du corps
}

// Coefficient sexe appliqué aux répétitions/secondes, dépend de la catégorie du défi
function getSexRepsCoef(sex, cat) {
  if (sex !== 'femme') return 1.0;
  if (cat === 'Haut du corps') return 0.65; // écart le plus marqué, cohérent avec les normes ACSM pompes
  return 1.0; // Gainage/Core et Bas du corps : pas de malus (endurance/mobilité comparables)
}

// Coefficient sexe appliqué au poids d'haltère suggéré (mouvements du haut du corps)
function getSexWeightCoef(sex) {
  if (sex === 'femme') return 0.6;
  if (sex === 'autre') return 0.8; // valeur neutre intermédiaire
  return 1.0;
}

function computeStandardTarget(c, profile) {
  if (!profile) return c.target;
  const levelCoef = COEF_LEVEL[profile.level] ?? 1;
  const ageCoef = getAgeCoef(profile.age);
  const bmi = getBmi(profile.heightCm, profile.weightKg);
  const bmiRaw = getBmiCoefRaw(bmi);
  const impact = c.bmiImpact ?? 0;
  const bmiEffective = 1 + (bmiRaw - 1) * impact; // pondère l'effet IMC selon l'exercice
  const sexCoef = getSexRepsCoef(profile.sex, c.cat);
  const raw = c.target * levelCoef * ageCoef * sexCoef * bmiEffective;
  const stepped = Math.round(raw / 5) * 5;
  return Math.max(c.unit === 'sec' ? 15 : 10, stepped);
}

function computeStandardWeight(c, profile) {
  if (c.cat !== 'Haltères' || !c.standardWeightKg) return null;
  if (!profile) return Math.round(c.standardWeightKg);
  const levelCoef = COEF_LEVEL[profile.level] ?? 1;
  const ageCoef = getAgeCoef(profile.age);
  const sexCoef = getSexWeightCoef(profile.sex);
  const raw = c.standardWeightKg * levelCoef * ageCoef * sexCoef;
  return Math.max(1, Math.round(raw)); // toujours un nombre entier de kg
}

function profileNext() {
  if (profileStep === 0) {
    // Écran de bienvenue : rien à valider, on passe simplement à la suite
  } else if (profileStep === 1) {
    const input = document.getElementById('pfAge');
    const val = parseInt(input?.value, 10);
    if (isNaN(val) || val < 12 || val > 100) {
      alert("Merci d'indiquer un âge valide (12 à 100 ans).");
      return;
    }
    profileDraft.age = val;
  } else if (profileStep === 2) {
    if (!profileDraft.sex) {
      alert('Merci de sélectionner une option.');
      return;
    }
  } else if (profileStep === 3) {
    const hInput = document.getElementById('pfHeight');
    const wInput = document.getElementById('pfWeight');
    const h = parseInt(hInput?.value, 10);
    const w = parseFloat(wInput?.value);
    if (isNaN(h) || h < 100 || h > 250) {
      alert('Merci d\'indiquer une taille valide (100 à 250 cm).');
      return;
    }
    if (isNaN(w) || w < 30 || w > 300) {
      alert('Merci d\'indiquer un poids valide (30 à 300 kg).');
      return;
    }
    profileDraft.heightCm = h;
    profileDraft.weightKg = w;
  } else if (profileStep === 4) {
    if (!profileDraft.level) {
      alert('Merci de sélectionner ton niveau.');
      return;
    }
    finishProfileOnboarding();
    return;
  }
  profileStep++;
  render(true);
}

function profilePrev() {
  if (profileStep > 0) {
    profileStep--;
    render(true);
  }

    // ET les défis personnalisés, en une seule liste permanente.
    try {
      const res = await dbGet('userChallenges');
      const saved = JSON.parse(res.value);
      if (Array.isArray(saved)) {
        const libraryIds = new Set(CHALLENGE_LIBRARY.map(x => x.id));
        customChallenges = saved.filter(x => !libraryIds.has(x.id)).map(x => ({ ...x, isCustom: true }));
        // Ancienne liste = active en permanence -> on la reprend une seule fois comme
        // sélection d'aujourd'hui, pour ne pas laisser l'utilisateur avec un accueil vide.
        migratedLegacyActiveIds = saved.map(x => x.id);
        await saveCustomChallenges();
      } else {
        customChallenges = [];
      }
    } catch (e2) {
      customChallenges = [];
    }
  }
  rebuildChallenges();
}

// Objectif/hardcore réellement affichés pour un défi : ceux saisis tels quels pour
// un défi personnalisé, ou l'objectif standard personnalisé (profil) éventuellement
// ajusté manuellement (ex: après 3 records de suite) pour un défi de la bibliothèque.
function resolveChallenge(c) {
  if (!c) return c;
  if (c.isCustom) return c;
  const target = manualTargetOverrides[c.id] ?? computeStandardTarget(c, userProfile);
  return { ...c, target, hardcoreTarget: target * 2 };
}

// Chaque écran/overlay ouvert pousse une entrée d'historique. Le bouton retour

// Bascule vers un autre onglet de la barre de navigation. Chaque onglet repart

function switchTab(tab) {
  if (tab === activeTab) return;
  if (activeTab === 'today') {
    clearTimerState();
    currentChallengeId = null;
  } else if (activeTab === 'library') {
    editingChallengeId = null;
  }
  if (navigator.vibrate) navigator.vibrate(8);
  activeTab = tab;
  if (tab === 'history') {
    historyLoading = true;
  }
  render(true);
  if (tab === 'history') {
    loadHistoryEntries().then(() => {
      historyLoading = false;
      render();
    });
  }
}

async function submitChallengeForm() {
  const name = document.getElementById('cfName').value.trim();
  const cat = document.getElementById('cfCat').value.trim();
  const target = parseInt(document.getElementById('cfTarget').value, 10);
  const unit = document.getElementById('cfUnit').value;
  const hcRaw = document.getElementById('cfHardcore').value;
  const hardcoreTarget = hcRaw.trim() === '' ? target * 2 : parseInt(hcRaw, 10);

  if (!name || !cat || isNaN(target) || target <= 0) {
    alert('Merci de remplir tous les champs correctement.');
    return;
  }
  if (isNaN(hardcoreTarget) || hardcoreTarget <= target) {
    alert("L'objectif hardcore doit être supérieur à l'objectif normal.");

    customChallenges.push({ id: getNextChallengeId(), cat, name, target, unit, hardcoreTarget, isCustom: true });

  await saveCustomChallenges();
  history.back(); // referme le formulaire (editingChallengeId) via goBackOneLevel, retour à la bibliothèque

function formatRelative(ms) {
  if (!ms) return null;
  const diff = Date.now() - ms;
  const min = diff / 60000;
  if (min < 1) return "à l'instant";
  if (min < 60) return `il y a ${Math.round(min)}min`;
  const hrs = diff / 3600000;
  if (hrs < 24) return `il y a ${Math.round(hrs)}h`;
  const days = diff / 86400000;
  return `il y a ${Math.round(days)}j`;
}

function fireConfetti(variant) {
  const colors = variant === 'hardcore'
    ? ['#ff6b35', '#ef5350', '#ffb347', '#ff9d5c', '#eef2ef']
    : ['#39e97a', '#5fbf7a', '#eaffef', '#1f6b3e', '#eef2ef'];
  const canvas = document.createElement('canvas');
  canvas.className = 'confetti-canvas';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const particles = Array.from({ length: 70 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height * 0.3,
    r: 3 + Math.random() * 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    vx: (Math.random() - 0.5) * 3,
    vy: 2 + Math.random() * 3,
    rot: Math.random() * 360,
    vrot: (Math.random() - 0.5) * 10,
  }));
  let frame = 0;
  function tick() {
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rot += p.vrot;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r, -p.r * 0.6, p.r * 2, p.r * 1.2);
      ctx.restore();
    }
    if (frame < 110) {
      requestAnimationFrame(tick);
    } else {
      canvas.remove();
    }
  }
  tick();
}

function playSuccessSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const notes = [523.25, 659.25, 783.99]; // do-mi-sol
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const start = ctx.currentTime + i * 0.09;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
      osc.start(start);
      osc.stop(start + 0.4);
    });
  } catch (e) { /* audio non disponible, tant pis */ }
}

function getLifetimeSummary() {
  let totalReps = 0, totalSeconds = 0;
  const catVolume = {};
  for (const c of CHALLENGES) {
    const s = stats[c.id];
    if (!s) continue;
    if (c.unit === 'reps') totalReps += s.lifetimeTotal;
    else totalSeconds += s.lifetimeTotal;
    catVolume[c.cat] = (catVolume[c.cat] || 0) + s.lifetimeTotal;
  }
  let favCat = null, favVal = -1;
  for (const [cat, val] of Object.entries(catVolume)) {
    if (val > favVal) { favVal = val; favCat = cat; }
  }
  return { totalReps, totalSeconds, favCat };
}

  ctx.strokeStyle = 'rgba(238,242,239,0.12)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(64, 250); ctx.lineTo(W - 64, 250); ctx.stroke();

  function drawStat(y, label, value, color) {
    ctx.fillStyle = color || '#39e97a';
    ctx.font = '900 92px sans-serif';
    ctx.fillText(value, 64, y);
    ctx.fillStyle = '#8a958e';
    ctx.font = '600 27px sans-serif';

    ctx.fillStyle = '#5fbf7a';
    ctx.font = '700 30px sans-serif';
    ctx.fillText(`💪 Catégorie favorite : ${summary.favCat}`, 64, y + 10);

  ctx.fillStyle = '#eef2ef';
  ctx.font = '600 26px sans-serif';
  ctx.fillText(`🏆 ${unlockedCount}/${BADGE_DEFS.length} trophées débloqués`, 64, H - 70);

  canvas.toBlob(async (blob) => {
    if (!blob) return;
    const file = new File([blob], 'mes-stats-defi-du-jour.png', { type: 'image/png' });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'Mes stats — Défi du Jour' });

    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mes-stats-defi-du-jour.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }, 'image/png');
}

function formatTimer(totalSec) {
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${pad(s)}`;
}

const TIMER_RING_RADIUS = 90;
const TIMER_RING_CIRCUMFERENCE = 2 * Math.PI * TIMER_RING_RADIUS;

// Anneau de progression circulaire vert néon autour du chrono. `pct` de 0 à 1.
function renderTimerRingSVG(pct, sizePx) {
  const clamped = Math.min(1, Math.max(0, pct));
  const offset = TIMER_RING_CIRCUMFERENCE * (1 - clamped);
  const size = sizePx || 180;
  return `
    <svg class="timer-ring" viewBox="0 0 200 200" width="${size}" height="${size}">
      <circle class="timer-ring-bg" cx="100" cy="100" r="${TIMER_RING_RADIUS}"></circle>
      <circle class="timer-ring-fill${clamped >= 1 ? ' complete' : ''}" id="timerRingFill"
        cx="100" cy="100" r="${TIMER_RING_RADIUS}"
        style="stroke-dasharray:${TIMER_RING_CIRCUMFERENCE}; stroke-dashoffset:${offset};"></circle>
    </svg>
  `;
}

// Met à jour l'anneau déjà présent dans le DOM (appelé à chaque tick, sans re-render complet)
function updateTimerRingDOM(elapsedSec) {
  const ring = document.getElementById('timerRingFill');
  if (!ring || !currentChallengeId) return;
  const target = getTarget();
  const total = getTotal();
  const pct = target > 0 ? Math.min(1, (total + elapsedSec) / target) : 0;
  const offset = TIMER_RING_CIRCUMFERENCE * (1 - pct);
  ring.style.strokeDashoffset = String(offset);
  ring.classList.toggle('complete', pct >= 1);
}

function formatSecToReadable(totalSec) {
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  if (m === 0) return `${s} s`;
  if (s === 0) return `${m} min`;
  return `${m} min ${s} s`;
}

// Affichage complet d'une valeur cible selon son unité, ex: "335 SEC (5 min 35 s)" ou "100 reps"
function formatTargetLabel(value, unit) {
  if (unit === 'sec') {
    return `${value} SEC (${formatSecToReadable(value)})`;
  }
  return `${value} reps`;
}

function getExercisePictogramKey(c) {
  // 1) Correspondance exacte par nom (tous les défis de la bibliothèque)
  if (EXERCISE_ICON_BY_NAME[c.name]) return EXERCISE_ICON_BY_NAME[c.name];
  // 2) Repli par mots-clés pour les défis personnalisés créés par l'utilisateur
  const name = (c.name || '').toLowerCase();
  const cat = (c.cat || '').toLowerCase();
  if (cat === 'haltères') return 'dumbbell_generic';
  if (name.includes('pompe') || name.includes('push-up') || name.includes('push up') || name.includes('pike') || name.includes('dip')) return 'pompes';
  if (name.includes('squat') || name.includes('fente') || name.includes('pistol') || name.includes('mollet') || name.includes('pont') || name.includes('bridge') || name.includes('step')) return 'squats';
  if (name.includes('planche') || name.includes('gainage') || name.includes('hollow') || name.includes('wall sit') || name.includes('chaise') || name.includes('superman')) return 'planche';
  if (name.includes('crunch') || name.includes('abdo') || name.includes('v-up') || name.includes('bicycle') || name.includes('leg raise') || name.includes('dead bug') || name.includes('twist') || name.includes('sit-up')) return 'crunchs';
  if (name.includes('course') || name.includes('running') || name.includes('sprint') || name.includes('corde') || name.includes('jumping') || name.includes('burpee') || name.includes('high knee') || name.includes('mountain climber') || name.includes('sauté')) return 'mountain_climbers';
  return 'generic';
}


function renderExercisePicto(c) {
  const key = getExercisePictogramKey(c);
  const svg = EXERCISE_PICTOGRAMS[key] || EXERCISE_PICTOGRAMS.generic;
  // Essaie d'abord l'image statique extraite (exercices/{key}-static.png), générée
  // à partir de la première image du PNG animé fourni. Si le fichier n'existe pas
  // encore (404), bascule automatiquement sur le pictogramme SVG dessiné à la main —
  // aucune modification de code nécessaire au fur et à mesure que les images arrivent.
  return `
    <div class="exercise-picto">
      <img src="exercices/${key}-static.png" alt="${c.name}" loading="lazy"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="exercise-picto-fallback">${svg}</div>
    </div>
  `;
}

// Phrase claire pour les exercices unilatéraux (haltère tenu à un seul bras).
// Ne retourne rien si l'exercice n'est pas concerné.
function armModeSentence(target, unit, armMode) {
  if (armMode !== 'perArm') return '';
  const u = unit === 'sec' ? 'sec' : 'reps';
  return `Chaque bras doit faire ${target} ${u}.`;
}

// ==== WAKE LOCK (empêche l'écran de s'éteindre pendant un chrono) ====
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {
    console.error('Wake Lock non disponible :', e);
  }
}

async function releaseWakeLock() {
  if (wakeLock) {
    try { await wakeLock.release(); } catch (e) { /* déjà relâché */ }
    wakeLock = null;
  }
}

// Le Wake Lock est automatiquement relâché par le système quand l'onglet passe
// en arrière-plan (écran verrouillé, changement d'appli...). On le redemande
// dès que l'app redevient visible, tant que le chrono tourne toujours.
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && timerRunning && !wakeLock) {
    await requestWakeLock();
  }
});

function clearTimerState() {
  if (timerIntervalId) clearInterval(timerIntervalId);
  timerIntervalId = null;
  timerRunning = false;
  timerStartMs = null;
  lastBeepSecond = 0;
  releaseWakeLock();
}

function startTimer() {
  timerRunning = true;
  timerStartMs = Date.now();
  lastBeepSecond = 0;
  unlockTimerAudio();
  timerIntervalId = setInterval(tickTimer, 250);
  requestWakeLock();
  render();
}

function enterFocusMode() {
  focusMode = true;
  if (navigator.vibrate) navigator.vibrate(10);
  pushNavState();
  render(true);
}

function exitFocusMode() {
  history.back();
}

function tickTimer() {
  const elapsed = Math.floor((Date.now() - timerStartMs) / 1000);
  const el = document.getElementById('timerDisplay');
  if (el) el.textContent = formatTimer(elapsed);
  updateTimerRingDOM(elapsed);
  if (elapsed > 0 && elapsed % 30 === 0 && elapsed !== lastBeepSecond) {
    lastBeepSecond = elapsed;
    playTimerBeep();
  }
}

async function stopTimer() {
  const elapsed = Math.round((Date.now() - timerStartMs) / 1000);
  clearTimerState();
  const wasFocus = focusMode;
  if (elapsed > 0) {
    await addSet(elapsed);
  }
  if (wasFocus) {
    history.back(); // ferme le mode focus via goBackOneLevel, reste cohérent avec la pile de navigation
  } else if (elapsed <= 0) {
    render();
  }
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

function formatDateLabel(d) {
  const days = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months = ['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}

let currentChallengeId = null;

function emptyDayState() {
  return { challenges: {} };
}

function emptyChallengeEntry() {
  return { sets: [], targetOverride: null, done: false, hardcoreDone: false };
}

function getEntry(id) {
  if (!state.challenges[id]) {
    state.challenges[id] = emptyChallengeEntry();
  }
  if (state.challenges[id].hardcoreDone === undefined) {
    state.challenges[id].hardcoreDone = false; // migration
  }
  return state.challenges[id];
}

async function loadState() {
  const today = new Date();
  todayKey = dateKey(today);
  try {
    const res = await dbGet('day:' + todayKey);
    state = JSON.parse(res.value);
    if (!state.challenges) state = emptyDayState(); // migration depuis l'ancien format
  } catch (e) {
    state = emptyDayState();
  }
  // Pastilles des 7 derniers jours : calculées à partir de dailyActivity (déjà chargé en
  // parallèle), au lieu de 7 appels Firestore séquentiels supplémentaires (un par jour).
  weekData = {};
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const k = dateKey(d);
    weekData[k] = (dailyActivity[k] || 0) > 0;
  }
  render();
}

async function saveState() {
  try {
    await dbSet('day:' + todayKey, JSON.stringify(state));
  } catch (e) {
    console.error('save failed', e);
  }
}

function getChallenge() {
  return resolveChallenge(CHALLENGES.find(c => c.id === currentChallengeId));
}

function getTarget() {
  const c = getChallenge();
  const entry = getEntry(currentChallengeId);
  return entry.targetOverride || (c ? c.target : 0);
}

function getHardcoreTarget(c) {
  if (!c) return 0;
  const base = c.hardcoreTarget || c.target * 2;
  return Math.max(base, c.target + 1);
}

function getTotal() {
  const entry = getEntry(currentChallengeId);
  return entry.sets.reduce((a,b) => a+b, 0);
}

async function pickChallenge(id) {
  clearTimerState();
  currentChallengeId = id;
  getEntry(id); // s'assure qu'une entrée existe (reprend celle du jour si déjà commencée)
  pushNavState();
  render(true);
}

async function addSet(amount) {
  if (amount <= 0) return;
  const entry = getEntry(currentChallengeId);
  entry.sets.push(amount);
  const total = getTotal();
  const target = getTarget();
  const willComplete = total >= target && !entry.done;

  // Records & totaux à vie
  if (!stats[currentChallengeId]) {
    stats[currentChallengeId] = { lifetimeTotal: 0, bestDay: { total: 0, date: null }, recordStreak: 0 };
  }
  const s = stats[currentChallengeId];
  if (s.recordStreak === undefined) s.recordStreak = 0;
  s.lifetimeTotal += amount;
  let newRecord = false;
  if (total > s.bestDay.total) {
    s.bestDay = { total, date: todayKey };
    newRecord = true;
  }

  if (willComplete) {
    s.recordStreak = newRecord ? s.recordStreak + 1 : 0;
  }
  await saveStats();

  if (willComplete) {
    entry.done = true;
    weekData[todayKey] = true;
    lastCompleted[currentChallengeId] = Date.now();
    await saveLastCompleted();

    dailyActivity[todayKey] = (dailyActivity[todayKey] || 0) + 1;
    await saveDailyActivity();

    badges.totalCompletions += 1;
    const freshBadges = checkNewBadges();
    await saveBadges();

    if (navigator.vibrate) navigator.vibrate([45, 35, 45, 35, 90]);
    fireConfetti();
    playSuccessSound();

    if (freshBadges.length > 0) {
      const b = freshBadges[0];
      setTimeout(() => showToast(`${b.icon} Trophée débloqué — ${b.label}`, 3200), 500);
    } else {
      showToast(`✓ Défi complété${newRecord ? ' — nouveau record ! 🏆' : ' !'}`);
    }

    // Progression automatique : 3 records consécutifs -> proposer d'augmenter l'objectif par défaut
    if (s.recordStreak >= 3) {
      const c = getChallenge();
      const suggestedTarget = Math.ceil((total * 1.15) / 5) * 5;
      setTimeout(async () => {
        const accept = confirm(
          `🚀 Tu bats ton record 3 fois de suite sur "${c.name}" !\n\nVeux-tu augmenter l'objectif par défaut de ${formatTargetLabel(c.target, c.unit)} à ${formatTargetLabel(suggestedTarget, c.unit)} ?`
        );
        if (accept) {
          if (c.isCustom) {
            const custom = customChallenges.find(x => x.id === c.id);
            if (custom) custom.target = suggestedTarget;
            rebuildChallenges();
            await saveCustomChallenges();
          } else {
            manualTargetOverrides[c.id] = suggestedTarget;
            await saveManualTargetOverrides();
          }
          showToast(`🎯 Objectif mis à jour : ${formatTargetLabel(suggestedTarget, c.unit)}`);
        }
        s.recordStreak = 0;
        await saveStats();
      }, 1400);
    }
  }

  // Mode Hardcore : détection indépendante de la complétion normale
  const cForHardcore = getChallenge();
  const hcTarget = getHardcoreTarget(cForHardcore);
  const willCompleteHardcore = total >= hcTarget && !entry.hardcoreDone;
  if (willCompleteHardcore) {
    entry.hardcoreDone = true;
    badges.totalHardcore += 1;
    const freshHardcoreBadges = checkNewBadges();
    await saveBadges();

    if (navigator.vibrate) navigator.vibrate([60, 40, 60, 40, 60, 40, 140]);
    fireConfetti('hardcore');
    playSuccessSound();

    setTimeout(() => {
      if (freshHardcoreBadges.length > 0) {
        const b = freshHardcoreBadges[0];
        showToast(`${b.icon} Trophée débloqué — ${b.label}`, 3200);
      } else {
        showToast('🔥 MODE HARDCORE complété !', 3000);
      }
    }, willComplete ? 900 : 400);
  }

  await saveState();
  render();
}

async function undoLast() {
  const entry = getEntry(currentChallengeId);
  const popped = entry.sets.pop();
  const total = getTotal();

  if (popped && stats[currentChallengeId]) {
    const s = stats[currentChallengeId];
    s.lifetimeTotal = Math.max(0, s.lifetimeTotal - popped);
    if (s.bestDay.date === todayKey) s.bestDay.total = total;
    await saveStats();
  }

  if (total < getTarget()) {
    entry.done = false;
    weekData[todayKey] = Object.values(state.challenges).some(e => e.done);
  }
  await saveState();
  render();
}

async function editTarget() {
  const c = getChallenge();
  const entry = getEntry(currentChallengeId);
  const current = getTarget();
  const input = prompt(`Objectif du jour (${c.unit === 'sec' ? 'secondes' : 'répétitions'}) :`, current);
  if (input === null) return;
  const val = parseInt(input, 10);
  if (isNaN(val) || val <= 0) return;
  entry.targetOverride = val;
  const total = getTotal();
  entry.done = total >= val;
  await saveState();
  render();
}

function customAddSubmit() {
  const input = document.getElementById('customAddInput');
  const val = parseInt(input.value, 10);
  if (!isNaN(val) && val > 0) {
    addSet(val);
    input.value = '';
  }
}

function renderFocusScreen() {
  const c = getChallenge();
  const entry = getEntry(currentChallengeId);
  const target = getTarget();
  const total = getTotal();
  const elapsed = timerStartMs ? Math.floor((Date.now() - timerStartMs) / 1000) : 0;
  const pct = target > 0 ? (total + elapsed) / target : 0;
  return `
    <div class="focus-screen">
      <button class="focus-exit" onclick="exitFocusMode()">✕</button>
      <div class="focus-name">${c.name}</div>
      <div class="timer-ring-wrap focus-ring-wrap">
        ${renderTimerRingSVG(pct, 280)}
        <div class="timer-ring-center">
          <div class="focus-timer" id="timerDisplay">${formatTimer(elapsed)}</div>
        </div>
      </div>
      <div class="focus-target">Objectif : ${formatTargetLabel(target, 'sec')}</div>
      <button class="focus-stop-btn" onclick="stopTimer()">⏹ Terminer la série</button>
    </div>
  `;
}

function renderTally(total, target, unit) {
  // represent progress in tally groups of 5, scaled so it doesn't explode for "sec" units
  const scale = unit === 'sec' ? Math.max(1, Math.round(target / 40)) : 1;
  const marks = Math.min(60, Math.round(total / scale));
  let html = '';
  const groups = Math.ceil(marks / 5) || 0;
  for (let g = 0; g < groups; g++) {
    html += '<div class="tally-group">';
    const inGroup = Math.min(5, marks - g*5);
    for (let i = 0; i < inGroup; i++) {
      const isStrike = i === 4;
      html += `<div class="tally-mark${isStrike ? ' strike' : ''}"></div>`;
    }
    html += '</div>';
  }
  return html;
}

function applyContent(app, html, animate, afterRender) {
  if (animate) {
    app.classList.add('fade-out');
    setTimeout(() => {
      app.innerHTML = html;
      app.classList.remove('fade-out');
      if (afterRender) afterRender();
    }, 140);
  } else {
    app.innerHTML = html;
    if (afterRender) afterRender();
  }
}

function render(animate) {
  const app = document.getElementById('app');
  const today = new Date();

  if (showProfileOnboarding) {
    applyContent(app, renderProfileOnboardingScreen(), animate);
    return;
  }

  if (activeTab === 'history') {
    applyContent(app, renderHistoryScreen() + renderTabBar(), animate);
    return;
  }

  if (activeTab === 'library') {
    applyContent(app, renderLibraryScreen() + renderTabBar(), animate);
    return;
  }

  if (activeTab === 'account') {
    applyContent(app, renderAccountTabScreen() + renderTabBar(), animate);
    return;
  }

  if (focusMode && timerRunning && currentChallengeId) {
    applyContent(app, renderFocusScreen(), animate, () => {
      const el = document.getElementById('timerDisplay');
      const elapsed = Math.floor((Date.now()-timerStartMs)/1000);
      if (el && timerRunning) el.textContent = formatTimer(elapsed);

        ${(() => {

          if (!entry.done) {

        ${c.unit === 'sec' ? `

async function loadHistoryEntries() {
  const DAYS_BACK = 28;
  const entries = [];
  for (let i = 0; i < DAYS_BACK; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const k = dateKey(d);
    try {
      const res = await dbGet('day:' + k);
      const s = JSON.parse(res.value);
      if (s.challenges) {
        for (const [cid, entry] of Object.entries(s.challenges)) {
          if (entry.sets && entry.sets.length === 0) continue;
          const c = CHALLENGES.find(x => x.id === Number(cid));
          entries.push({
            key: k,
            date: d,
            challengeName: c ? c.name : 'Défi supprimé',
            cat: c ? c.cat : '',
            total: entry.sets ? entry.sets.reduce((a,b)=>a+b,0) : 0,
            target: entry.targetOverride || (c ? c.target : 0),
            unit: c ? c.unit : 'reps',
            done: !!entry.done,
          });
        }
      }
    } catch (e) {
      // no entry for this day
    }
  }
  historyEntries = entries;
}

// Carte d'exercice partagée entre l'accueil ("today", clic = ouvrir la fiche) et
// l'onglet Défis ("library", clic = activer/désactiver pour aujourd'hui). Même
// structure/CSS (.picker-item) des deux côtés ; seules différences : la colonne de
// droite (statut du jour vs pastille "Actif"), le poids affiché pour les défis
// haltères en mode bibliothèque, et les actions éditer/supprimer réservées aux
// défis personnalisés.
function renderChallengeCard(c, mode) {
  const resolved = resolveChallenge(c);
  const isActive = activeToday.has(c.id);
  const weightHint = (mode === 'library' && c.cat === 'Haltères')
    ? ` · 🏋️ ${weights[c.id] ?? computeStandardWeight(c, userProfile) ?? 8}kg`
    : '';

  let rightHtml;
  if (mode === 'library') {
    rightHtml = isActive ? `<div class="active-pill">✓ Actif</div>` : '';
  } else {
    const todayEntry = state.challenges[c.id];
    const rel = formatRelative(lastCompleted[c.id]);
    rightHtml = '';
    if (todayEntry && todayEntry.hardcoreDone) {
      rightHtml = `<div class="last-done status-hardcore">🔥 Hardcore complété</div>`;
    } else if (todayEntry && todayEntry.done) {
      rightHtml = `<div class="last-done status-done">✓ Terminé aujourd'hui</div>`;
    } else if (todayEntry && todayEntry.sets.length > 0) {
      const t = todayEntry.sets.reduce((a,b)=>a+b,0);
      const tgt = todayEntry.targetOverride || resolved.target;
      rightHtml = `<div class="last-done status-progress">● En cours — ${t}/${tgt}</div>`;
    } else if (rel) {
      rightHtml = `<div class="last-done">${rel}</div>`;
    }
  }

  const onclick = mode === 'library' ? `toggleActiveToday(${c.id})` : `pickChallenge(${c.id})`;

  return `
    <div class="picker-item" onclick="${onclick}">
      ${renderExercisePicto(c)}
      <div class="picker-item-body">
        <span class="cat">${resolved.unit === 'sec' ? 'Chrono' : 'Répétitions'}</span>
        <span class="name">${c.name}</span>
      </div>
      <div class="goal">
        ${resolved.unit === 'sec' ? formatTargetLabel(resolved.target, resolved.unit) : resolved.target + ' reps'}${weightHint}
        ${rightHtml}
      </div>
      ${mode === 'library' && c.isCustom ? `
        <div class="manage-actions">
          <button class="icon-btn" onclick="event.stopPropagation(); openEditChallengeForm(${c.id})">✏️</button>
          <button class="icon-btn danger" onclick="event.stopPropagation(); deleteChallenge(${c.id})">🗑️</button>
        </div>
      ` : ''}
    </div>
  `;
}

function renderWeeklyChart() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  const totals = days.map(d => {
    const k = dateKey(d);
    return historyEntries.filter(e => e.key === k).reduce((sum, e) => sum + e.total, 0);
  });
  const max = Math.max(1, ...totals);

  let bars = '';
  days.forEach((d, i) => {
    const h = Math.round((totals[i] / max) * 100);
    const isToday = dateKey(d) === todayKey;
    bars += `
      <div class="chart-col">
        <div class="chart-bar-track">
          <div class="chart-bar${isToday ? ' today' : ''}" style="height:${Math.max(h, totals[i] > 0 ? 6 : 0)}%"></div>
        </div>
        <div class="chart-val">${totals[i] || ''}</div>
        <div class="chart-dow">${DOW_LABELS[d.getDay()]}</div>
      </div>
    `;
  });

  return `
    <div class="section-label">Volume des 7 derniers jours</div>
    <div class="chart-wrap">${bars}</div>
  `;
}

function renderHeatmap() {
  const WEEKS = 26; // ~6 mois, plus lisible sur mobile qu'une année complète
  const totalDays = WEEKS * 7;
  const days = [];
  for (let i = totalDays - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  // aligner sur Lundi pour la première colonne
  while ((days[0].getDay() + 6) % 7 !== 0) {
    const d = new Date(days[0]);
    d.setDate(d.getDate() - 1);
    days.unshift(d);
  }

  function levelFor(count) {
    if (!count) return 0;
    if (count === 1) return 1;
    if (count <= 2) return 2;
    return 3;
  }

  let cells = '';
  for (const d of days) {
    const k = dateKey(d);
    const count = dailyActivity[k] || 0;
    const lvl = levelFor(count);
    const isFuture = d > new Date();
    cells += `<div class="heat-cell lvl${lvl}${isFuture ? ' future' : ''}" title="${k} — ${count} défi(s)"></div>`;
  }

  return `
    <div class="section-label">Activité (6 derniers mois)</div>
    <div class="heatmap-scroll">
      <div class="heatmap-grid">${cells}</div>
    </div>
    <div class="heat-legend">
      <span>Moins</span>
      <div class="heat-cell lvl0"></div>
      <div class="heat-cell lvl1"></div>
      <div class="heat-cell lvl2"></div>
      <div class="heat-cell lvl3"></div>
      <span>Plus</span>
    </div>
  `;
}

function renderTrophiesGrid() {
  return `
    <div class="section-label">Trophées (${badges.unlocked.length}/${BADGE_DEFS.length})</div>
    <div class="trophy-grid">
      ${BADGE_DEFS.map(b => {
        const unlocked = badges.unlocked.includes(b.id);
        return `
          <div class="trophy-item${unlocked ? '' : ' locked'}">
            <div class="badge-icon">${unlocked ? b.icon : '🔒'}</div>
            <div class="badge-label">${b.label}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderHistoryScreen() {
  const today = new Date();
  const cells = [];
  const DAYS_BACK = 28;
  // build calendar: oldest first, pad to full weeks starting Monday
  const days = [];
  for (let i = DAYS_BACK - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  const firstDow = (days[0].getDay() + 6) % 7; // Monday=0
  let calHtml = `<div class="cal-grid">`;
  ['L','M','M','J','V','S','D'].forEach(l => calHtml += `<div class="cal-dow">${l}</div>`);
  for (let i = 0; i < firstDow; i++) calHtml += `<div class="cal-cell empty"></div>`;
  for (const d of days) {
    const k = dateKey(d);
    const dayEntries = historyEntries.filter(e => e.key === k);
    const isToday = k === todayKey;
    const done = dayEntries.some(e => e.done);
    calHtml += `<div class="cal-cell${done ? ' done' : ''}${isToday ? ' today' : ''}">${done ? '✓' : d.getDate()}</div>`;
  }
  calHtml += `</div>`;

  let listHtml = `<div class="history-list-label">Défis effectués</div>`;
  const withChallenge = historyEntries.filter(e => e.challengeName);
  if (historyLoading) {
    listHtml += `<div class="history-empty">Chargement…</div>`;
  } else if (withChallenge.length === 0) {
    listHtml += `<div class="history-empty">Pas encore d'historique</div>`;
  } else {
    for (const e of withChallenge) {
      const label = e.key === todayKey ? "Aujourd'hui" : formatDateLabel(e.date);
      listHtml += `
        <div class="history-entry">
          <div>
            <div class="hdate">${label}</div>
            <div class="hname">${e.challengeName}</div>
          </div>
          <div class="hprogress${e.done ? ' done' : ''}">${e.total}/${e.target} ${e.unit === 'sec' ? 'sec' : ''}${e.done ? ' ✓' : ''}</div>
        </div>
      `;
    }
  }

  return `
    <h1 class="title">Historique</h1>
    <div class="subtitle">Ta progression dans le temps</div>
    <button class="share-stats-btn" onclick="shareStatsImage()">📤 Partager mes stats</button>
    ${renderWeeklyChart()}
    ${renderHeatmap()}
    <div class="section-label">Calendrier du mois</div>
    ${calHtml}
    ${listHtml}
  `;
}

function renderAccountSection() {
  const name = currentUser?.displayName || 'Compte';
  const email = currentUser?.email || '';
  const photo = currentUser?.photoURL || '';
  return `
    <div class="section-label">Compte</div>
    <div class="account-card">
      <div class="account-info">
        ${photo ? `<img src="${photo}" class="account-avatar" referrerpolicy="no-referrer">` : `<div class="account-avatar-fallback">${name.charAt(0).toUpperCase()}</div>`}
        <div>

function renderAccountTabScreen() {

// Barre de navigation persistante en bas de l'écran (masquée pendant les
