// ==== KUDOS 👏 ====
// 2 formes selon ce qui est "kudos-able" :
// - Événementiel (fil d'activité + contributions Boss Battle) : 1 kudos PERMANENT par
//   votant et par événement (comme Strava sur une activité), retrait possible (2e tap
//   = retire). `giveKudosToEvent(docRef)`/`removeKudosFromEvent(docRef)` sont
//   génériques, réutilisées sur les 2 surfaces plutôt que dupliquées : les 2 collections
//   ont EXACTEMENT la même forme (kudosCount sur le doc parent + sous-collection
//   kudosBy/{voterUid}).
// - Personne (classement) : 1 kudos par JOUR et par cible (kudosGiven/{jour}_{votant} —
//   l'ID intègre déjà la date, donc AUCUN code de reset à écrire, demain = un nouveau
//   doc), cumul affiché à vie (kudosTotal), PAS de retrait (plus simple, décision
//   assumée : moins besoin de symétrie qu'un like Strava sur un événement ponctuel).
//
// db.runTransaction() (1er vrai usage produit, mock ajouté au batch 1) : lit la preuve
// d'un kudos déjà donné, avorte SANS écrire si c'est déjà le cas, sinon écrit les 2
// documents liés atomiquement — ferme le trou qu'un simple batch() laisserait ouvert
// (2 écritures indépendantes que rien ne lie vraiment côté serveur).
//
// Suivi "ai-je déjà kudos ceci" volontairement SIMPLIFIÉ : mémorisé en mémoire
// uniquement au fil de MES propres actions cette session (myKudosGivenEventIds/
// myKudosGivenToday), jamais re-vérifié depuis Firestore à l'affichage. Un rechargement
// de page peut donc réafficher un bouton "pas encore donné" pour un kudos déjà donné
// une session précédente — SANS RISQUE de double-comptage réel : la transaction
// vérifie toujours l'état serveur avant d'écrire quoi que ce soit. Compromis assumé
// (feature sociale à faible enjeu) plutôt que de multiplier les lectures Firestore
// pour re-vérifier chaque ligne visible à chaque affichage.
let myKudosGivenEventIds = new Set();
let myKudosGivenToday = new Set();

async function giveKudosToEvent(docRef) {
  if (!currentUser) return;
  const kudosByRef = docRef.collection('kudosBy').doc(currentUser.uid);
  try {
    await db.runTransaction(async (tx) => {
      const existing = await tx.get(kudosByRef);
      if (existing.exists) return;
      const eventDoc = await tx.get(docRef);
      const current = eventDoc.exists ? (eventDoc.data().kudosCount || 0) : 0;
      const ownerUid = eventDoc.exists ? eventDoc.data().uid : null;
      tx.set(kudosByRef, { at: Date.now() });
      tx.set(docRef, { kudosCount: current + 1 }, { merge: true });
      // Notifie le propriétaire de l'événement (jamais soi-même — déjà exclu côté UI par
      // renderKudosButton(), mais on le revérifie ici côté données par prudence).
      if (ownerUid && ownerUid !== currentUser.uid) {
        tx.set(notificationsCollRef(ownerUid).doc(), {
          type: 'kudo',
          fromUid: currentUser.uid,
          fromName: formatDisplayName(currentUser.displayName),
          read: false,
          createdAt: Date.now(),
        });
      }
    });
    myKudosGivenEventIds.add(docRef.id);
    if (navigator.vibrate) navigator.vibrate(10);
    render();
  } catch (e) {
    reportSaveError('give kudos failed', e);
  }
}

async function removeKudosFromEvent(docRef) {
  if (!currentUser) return;
  const kudosByRef = docRef.collection('kudosBy').doc(currentUser.uid);
  try {
    await db.runTransaction(async (tx) => {
      const existing = await tx.get(kudosByRef);
      if (!existing.exists) return;
      const eventDoc = await tx.get(docRef);
      const current = eventDoc.exists ? (eventDoc.data().kudosCount || 0) : 0;
      tx.delete(kudosByRef);
      tx.set(docRef, { kudosCount: Math.max(0, current - 1) }, { merge: true });
    });
    myKudosGivenEventIds.delete(docRef.id);
    if (navigator.vibrate) navigator.vibrate(10);
    render();
  } catch (e) {
    reportSaveError('remove kudos failed', e);
  }
}

async function giveKudosToPerson(targetUid) {
  if (!currentUser || targetUid === currentUser.uid) return;
  const entryId = todayKey + '_' + currentUser.uid;
  const targetRef = db.collection('leaderboard').doc(targetUid);
  const givenRef = targetRef.collection('kudosGiven').doc(entryId);
  try {
    await db.runTransaction(async (tx) => {
      const existing = await tx.get(givenRef);
      if (existing.exists) return; // déjà donné aujourd'hui à cette personne
      const targetDoc = await tx.get(targetRef);
      const current = targetDoc.exists ? (targetDoc.data().kudosTotal || 0) : 0;
      tx.set(givenRef, { voterUid: currentUser.uid, date: todayKey, at: Date.now() });
      tx.set(targetRef, { kudosTotal: current + 1 }, { merge: true });
      tx.set(notificationsCollRef(targetUid).doc(), {
        type: 'kudo',
        fromUid: currentUser.uid,
        fromName: formatDisplayName(currentUser.displayName),
        read: false,
        createdAt: Date.now(),
      });
    });
    myKudosGivenToday.add(targetUid);
    if (navigator.vibrate) navigator.vibrate(10);
    render();
  } catch (e) {
    reportSaveError('give kudos to person failed', e);
  }
}

// Bouton réutilisé par le fil d'activité ET le fil de contributions Boss Battle (même
// forme de document, voir plus haut) : `docRefJsExpr` est une expression JS (chaîne),
// pas une valeur — insérée telle quelle dans l'attribut onclick, reconstruite au clic
// plutôt que sérialisée (un DocumentReference ne peut pas transiter par un attribut
// HTML). Jamais affiché sur son propre événement.
function renderKudosButton(docRefJsExpr, entryId, kudosCount, isMine) {
  if (isMine) return '';
  const alreadyGiven = myKudosGivenEventIds.has(entryId);
  const action = alreadyGiven ? 'removeKudosFromEvent' : 'giveKudosToEvent';
  return `<button class="kudos-btn${alreadyGiven ? ' given' : ''}" onclick="event.stopPropagation(); ${action}(${docRefJsExpr})">👏 ${kudosCount || 0}</button>`;
}

// ==== NOTIFICATIONS : sous-collection dédiée users/{uid}/notifications, UN SEUL
// listener au démarrage (remplace l'ancien système à listeners dispersés — 1 par
// document surveillé — qui ne géraient aucun rattrapage hors-ligne). ====
// Le nom de l'émetteur (déjà anonymisé, "Prénom N.") est stocké DIRECTEMENT dans la
// notification au moment de sa création (fromName), pas relu via fetchPublicProfile()
// à l'affichage : ça marche même si l'émetteur désactive ensuite son classement (plus
// d'anonymat forcé rétroactif), et ça évite une lecture supplémentaire par notification.
function notificationsCollRef(uid) {
  return db.collection('users').doc(uid).collection('notifications');
}

let notificationsUnsub = null;
// where('read','==',false) seul (sans orderBy dans la requête elle-même — le tri se
// fait côté client ci-dessous) : un simple filtre d'égalité est auto-indexé par
// Firestore, donc AUCUN index composite à créer pour cette fonctionnalité.
function startNotificationsListener() {
  if (notificationsUnsub) { notificationsUnsub(); notificationsUnsub = null; }
  if (!currentUser) return;
  notificationsUnsub = notificationsCollRef(currentUser.uid)
    .where('read', '==', false)
    .onSnapshot((snap) => { processUnreadNotifications(snap); });
}

/**
 * Traite un instantané de notifications non lues : rattrapage natif — celles reçues
 * hors ligne apparaissent exactement comme celles reçues en direct au prochain
 * démarrage, aucune logique de date/dernier-vu à maintenir. Marque chaque notification
 * "lue" AVANT de l'afficher (jamais de ré-affichage en cas de re-déclenchement rapide
 * du listener) ; si le marquage échoue, on n'affiche pas non plus (évite une boucle).
 * Traitées de la plus ancienne à la plus récente.
 */
async function processUnreadNotifications(snap) {
  const myUid = currentUser.uid;
  const docs = [...snap.docs].sort((a, b) => (a.data().createdAt || 0) - (b.data().createdAt || 0));
  for (const doc of docs) {
    const data = doc.data();
    try {
      await notificationsCollRef(myUid).doc(doc.id).set({ read: true }, { merge: true });
    } catch (e) {
      reportSaveError('mark notification read failed', e);
      continue;
    }
    if (data.type === 'kudo') {
      enqueuePopup({
        icon: '👏',
        title: t('popups.notifications.kudoTitle'),
        subtitle: t('popups.notifications.kudoSubtitle', { name: data.fromName }),
        btnLabel: t('popups.notifications.kudoBtn'),
      });
    } else if (data.type === 'friend_request') {
      const accepted = await confirmModal({
        icon: '🤝',
        title: t('popups.notifications.friendRequestTitle'),
        subtitle: t('popups.notifications.friendRequestSubtitle', { name: data.fromName }),
        confirmLabel: t('popups.notifications.friendRequestAccept'),
        cancelLabel: t('popups.notifications.friendRequestLater'),
      });
      if (accepted) {
        await acceptFriendRequest(data.fromUid);
      }
    } else if (data.type === 'group_invite') {
      const accepted = await confirmModal({
        icon: '👥',
        title: t('popups.notifications.groupInviteTitle'),
        subtitle: t('popups.notifications.groupInviteSubtitle', { name: data.fromName, group: data.groupName }),
        confirmLabel: t('popups.notifications.groupInviteAccept'),
        cancelLabel: t('popups.notifications.groupInviteLater'),
      });
      if (accepted) {
        await joinGroupById(data.groupId);
      }
    } else if (data.type === 'group_challenge_settled') {
      // winnerName (1er contributeur) : embarque par settleChallengeIfNeeded() cote
      // Cloud Function - absent uniquement sur d'anciennes notifications deja
      // ecrites avant ce champ, d'ou le repli sur le message generique. Echappees
      // ici (nom de defi/de personne = texte libre utilisateur, jamais fiable a
      // interpoler tel quel dans un innerHTML - voir enqueuePopup()/interpolate()).
      const challengeName = escapeHtml(data.challengeName || '');
      const winnerName = data.winnerName ? escapeHtml(data.winnerName) : '';
      // targetReached : embarque depuis ce changement - absent sur d'anciennes
      // notifications (repli sur le bilan neutre habituel, pas de fausse
      // celebration). Distingue une VRAIE victoire collective (objectif atteint,
      // celebration plein ecran a l'image d'un trophee/level up epique) d'un simple
      // reglement par expiration d'echeance sans objectif atteint (bilan neutre).
      if (data.targetReached) {
        enqueuePopup({
          variant: 'trophy',
          epic: true,
          icon: '🏆',
          title: t('popups.notifications.groupChallengeWonTitle'),
          big: challengeName,
          subtitle: winnerName
            ? t('popups.notifications.groupChallengeWonSubtitleWinner', { winner: winnerName })
            : t('popups.notifications.groupChallengeWonSubtitle'),
          btnLabel: t('popups.notifications.groupChallengeSettledBtn'),
        });
      } else {
        enqueuePopup({
          icon: '🏁',
          title: t('popups.notifications.groupChallengeSettledTitle'),
          subtitle: winnerName
            ? t('popups.notifications.groupChallengeSettledSubtitleWinner', { challenge: challengeName, winner: winnerName })
            : t('popups.notifications.groupChallengeSettledSubtitle', { challenge: challengeName }),
          btnLabel: t('popups.notifications.groupChallengeSettledBtn'),
        });
      }
    } else if (data.type === 'friend_request_accepted') {
      // Trou reel comble : avant ce correctif, la personne dont la demande
      // etait acceptee n'etait jamais prevenue (voir acceptFriendRequest()).
      enqueuePopup({
        icon: '🤝',
        title: t('popups.notifications.friendAcceptedTitle'),
        subtitle: t('popups.notifications.friendAcceptedSubtitle', { name: escapeHtml(data.fromName || '') }),
        btnLabel: t('common.close'),
      });
    } else if (data.type === 'group_challenge_created') {
      // Trou reel comble : avant ce correctif, les autres membres du groupe
      // n'etaient jamais prevenus qu'un nouveau defi collectif venait d'etre
      // lance (voir createGroupChallenge()).
      enqueuePopup({
        icon: '🏆',
        title: t('popups.notifications.groupChallengeCreatedTitle'),
        subtitle: t('popups.notifications.groupChallengeCreatedSubtitle', {
          name: escapeHtml(data.fromName || ''), challenge: escapeHtml(data.challengeName || ''), group: escapeHtml(data.groupName || ''),
        }),
        btnLabel: t('popups.notifications.groupChallengeSettledBtn'),
      });
    } else if (data.type === 'group_member_joined') {
      enqueuePopup({
        icon: '👋',
        title: t('popups.notifications.groupMemberJoinedTitle'),
        subtitle: t('popups.notifications.groupMemberJoinedSubtitle', { name: escapeHtml(data.fromName || ''), group: escapeHtml(data.groupName || '') }),
        btnLabel: t('common.close'),
      });
    } else if (data.type === 'group_challenge_reminder') {
      // thresholdLabel : '24h' ou '3h' (voir maybeRemindChallengeDeadline() cote
      // Cloud Function) - meme evenement, urgence croissante.
      enqueuePopup({
        icon: '⏳',
        title: data.thresholdLabel === '3h' ? t('popups.notifications.reminderTitle3h') : t('popups.notifications.reminderTitle24h'),
        subtitle: t('popups.notifications.reminderSubtitle', { challenge: escapeHtml(data.challengeName || '') }),
        btnLabel: t('common.close'),
      });
    }
  }
}

function friendRequestId(fromUid, toUid) {

// Charset sans caracteres ambigus (pas de 0/O ni 1/I) - meme souci de lisibilite
// qu'un code tape a la main (partage oral/SMS), voir usernames/{pseudo} pour la
// meme reservation create-only.
function generateGroupCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
  return code;
}

async function createGroup(name, emoji) {
  if (!name || !name.trim()) return;
  const code = generateGroupCode();
  const groupRef = db.collection('groups').doc();
  const batch = db.batch();
  batch.set(groupRef, {
    name: name.trim(), emoji: emoji || '💪', code,
    createdBy: currentUser.uid, createdAt: Date.now(), memberCount: 1,
  });
  batch.set(groupRef.collection('members').doc(currentUser.uid), {
    uid: currentUser.uid, displayName: formatDisplayName(currentUser.displayName),
    photoURL: currentUser.photoURL || '', joinedAt: Date.now(), role: 'creator',
  });
  batch.set(db.collection('groups_by_code').doc(code), { groupId: groupRef.id });
  batch.set(db.collection('users').doc(currentUser.uid).collection('myGroups').doc(groupRef.id), {
    groupId: groupRef.id, name: name.trim(), emoji: emoji || '💪', joinedAt: Date.now(),
  });
  try {
    await batch.commit();
  } catch (e) {
    reportSaveError('create group failed', e);
    return;
  }
  creatingGroupOpen = false;
  groupCreateNameInput = '';
  await refreshMyGroupsAndActiveChallenges();
  openGroupDetail(groupRef.id);
}

// Partagee par joinGroupByCode()/joinGroupById() : un membre n'ecrit jamais que SON
// PROPRE doc membre/index perso (voir les regles Firestore) - le memberCount du
// groupe est le seul champ du doc groupe qu'un client puisse modifier (increment).
async function performJoinGroup(groupId, groupMeta) {
  const groupRef = db.collection('groups').doc(groupId);
  const already = await groupRef.collection('members').doc(currentUser.uid).get();
  if (already.exists) { openGroupDetail(groupId); return; }
  // Membres existants a notifier de l'arrivee du nouveau membre (trou reel
  // comble : avant ce correctif, personne n'etait jamais prevenu) - lu AVANT
  // le batch ci-dessous, le nouveau membre lui-meme n'y figure pas encore.
  // Borne par GROUP_MEMBER_CAP (20 max), meme discipline que le reste.
  const existingMembersSnap = await groupRef.collection('members').get();
  const batch = db.batch();
  batch.set(groupRef.collection('members').doc(currentUser.uid), {
    uid: currentUser.uid, displayName: formatDisplayName(currentUser.displayName),
    photoURL: currentUser.photoURL || '', joinedAt: Date.now(), role: 'member',
  });
  batch.set(groupRef, { memberCount: firebase.firestore.FieldValue.increment(1) }, { merge: true });
  batch.set(db.collection('users').doc(currentUser.uid).collection('myGroups').doc(groupId), {
    groupId, name: groupMeta.name, emoji: groupMeta.emoji, joinedAt: Date.now(),
  });
  for (const memberDoc of existingMembersSnap.docs) {
    batch.set(db.collection('users').doc(memberDoc.id).collection('notifications').doc(), {
      type: 'group_member_joined',
      fromUid: currentUser.uid,
      fromName: formatDisplayName(currentUser.displayName),
      groupId, groupName: groupMeta.name,
      read: false, createdAt: Date.now(),
    });
  }
  await batch.commit();
  await refreshMyGroupsAndActiveChallenges();
  openGroupDetail(groupId);
}

async function joinGroupByCode(code) {
  const normalized = (code || '').trim().toUpperCase();
  if (!normalized) return;
  groupJoinError = null;
  try {
    const codeDoc = await db.collection('groups_by_code').doc(normalized).get();
    if (!codeDoc.exists) { groupJoinError = 'not-found'; render(); return; }
    const groupId = codeDoc.data().groupId;
    const groupDoc = await db.collection('groups').doc(groupId).get();
    if (!groupDoc.exists) { groupJoinError = 'not-found'; render(); return; }
    if ((groupDoc.data().memberCount || 0) >= GROUP_MEMBER_CAP) { groupJoinError = 'full'; render(); return; }
    groupJoinCodeInput = '';
    joiningGroupOpen = false;
    await performJoinGroup(groupId, groupDoc.data());
  } catch (e) {
    reportSaveError('join group by code failed', e);
  }
}

// Volontairement PAS de collection-group query / where('status','in',[...]) : les
// defis d'UN groupe sont naturellement peu nombreux, un simple orderBy(createdAt)
// borne suffit et n'exige aucun index composite (contrairement a where+orderBy sur
// des champs differents - voir l'incident dailyContributors documente dans CLAUDE.md).
async function loadGroupDetail(groupId) {
  groupDetailLoading = true;
  render();
  try {
    const groupDoc = await db.collection('groups').doc(groupId).get();
    groupDetailGroup = groupDoc.exists ? { groupId, ...groupDoc.data() } : null;
  } catch (e) {
    groupDetailGroup = null;
    console.error('group detail fetch failed', e);
  }
  try {
    const membersSnap = await db.collection('groups').doc(groupId).collection('members').get();
    groupDetailMembers = membersSnap.docs.map(d => ({ ...d.data() }));
  } catch (e) {
    groupDetailMembers = [];
    console.error('group members fetch failed', e);
  }
  try {
    const challengesSnap = await db.collection('groups').doc(groupId).collection('challenges')
      .orderBy('createdAt', 'desc').limit(5).get();
    const challenges = challengesSnap.docs.map(d => ({ challengeId: d.id, ...d.data() }));
    const relevant = challenges.find(c => c.status === 'active') || challenges.find(c => c.status === 'settled') || null;
    if (relevant) {
      if (relevant.status === 'active') await ensureMyParticipantDoc(groupId, relevant.challengeId);
      const participantsSnap = await db.collection('groups').doc(groupId).collection('challenges').doc(relevant.challengeId)
        .collection('participants').get();
      relevant.participants = participantsSnap.docs.map(d => ({ ...d.data() })).sort((a, b) => (b.totalAmount || 0) - (a.totalAmount || 0));
      if (relevant.status === 'settled') {
        const ledgerSnap = await db.collection('groups').doc(groupId).collection('ledger')
          .where('challengeId', '==', relevant.challengeId).get();
        groupDetailLedger = ledgerSnap.docs.map(d => ({ entryId: d.id, ...d.data() }));
      } else {
        groupDetailLedger = [];
      }
    } else {
      groupDetailLedger = [];
    }
    groupDetailChallenge = relevant;
  } catch (e) {
    groupDetailChallenge = null;
    groupDetailLedger = [];
    console.error('group challenge fetch failed', e);
  }
  // Ardoise Globale (Phase 3) : TOUTES les entrees ledger du groupe (pas seulement
  // celles du dernier defi, contrairement a groupDetailLedger ci-dessus) - un seul
  // champ trie (createdAt), aucun index composite necessaire. Etat d'echec
  // independant du reste (meme discipline que Top N/mon rang du classement).
  try {
    const historySnap = await db.collection('groups').doc(groupId).collection('ledger')
      .orderBy('createdAt', 'desc').limit(30).get();
    groupDetailLedgerHistory = historySnap.docs.map(d => ({ entryId: d.id, ...d.data() }));
  } catch (e) {
    groupDetailLedgerHistory = [];
    console.error('group ledger history fetch failed', e);
  }
  groupDetailLoading = false;
  render();
}

// Pure (aucune donnee supplementaire a charger : deja dans groupDetailMembers,
// rollups mis a jour par closeExpiredGroupChallenges()) - Hall of Fame a 5 titres :
// Le Mecene (le plus souvent payeur), Le Roi des Repets (volume cumule le plus
// eleve), Le Clutch Player (victoires de derniere minute), Le Fantome (volume le
// plus faible, titre "a charge" pour rire), Le Metronome (le plus regulier -
// present sur le plus de defis differents). Chaque titre n'est attribue que si au
// moins un membre a une statistique strictement positive (sinon rien a celebrer).
function computeGroupHallOfFameTitles(members) {
  if (!members || members.length === 0) return [];
  const titles = [];
  const maxBy = (field) => {
    const pool = members.filter((m) => (m[field] || 0) > 0);
    if (pool.length === 0) return null;
    return pool.reduce((a, b) => ((b[field] || 0) > (a[field] || 0) ? b : a));
  };
  const mecene = maxBy('debtsOwed');
  if (mecene) titles.push({ id: 'mecene', icon: '🍺', member: mecene });
  const roiDesRepets = maxBy('totalVolume');
  if (roiDesRepets) titles.push({ id: 'roiDesRepets', icon: '💪', member: roiDesRepets });
  const clutch = maxBy('clutchWins');
  if (clutch) titles.push({ id: 'clutchPlayer', icon: '⚡', member: clutch });
  const participated = members.filter((m) => (m.challengesParticipated || 0) > 0);
  if (participated.length > 0) {
    const fantome = participated.reduce((a, b) => ((b.totalVolume || 0) < (a.totalVolume || 0) ? b : a));
    titles.push({ id: 'fantome', icon: '👻', member: fantome });
  }
  const metronome = maxBy('challengesParticipated');
  if (metronome) titles.push({ id: 'metronome', icon: '🎯', member: metronome });
  return titles;
}

// Auto-initialise mon propre doc participant (totalAmount:0) si je n'en ai pas
// encore - chaque membre n'ecrit QUE son propre doc (voir les regles Firestore),
// donc un defi ne peut pas pre-lister tous les membres a la creation. Un membre qui
// n'a JAMAIS ouvert le detail du groupe ni contribue pendant tout le defi n'aura
// simplement aucune ligne au reglement (ni dette ni recompense) - simplification
// assumee, pas un bug.
async function ensureMyParticipantDoc(groupId, challengeId) {
  const ref = db.collection('groups').doc(groupId).collection('challenges').doc(challengeId).collection('participants').doc(currentUser.uid);
  const doc = await ref.get();
  if (doc.exists) return;
  await ref.set({
    uid: currentUser.uid, displayName: formatDisplayName(currentUser.displayName),
    photoURL: currentUser.photoURL || '', totalAmount: 0,
  });
}

async function createGroupChallenge(groupId, { name, exerciseSlug, startDate, endDate, targetTotal, stakeMode, stakeType, stakeDescription }) {
  const challengeRef = db.collection('groups').doc(groupId).collection('challenges').doc();
  const challengeName = (name || '').trim();
  try {
    await challengeRef.set({
      name: challengeName, exerciseSlug, startDate, endDate,
      targetTotal: Math.max(1, Math.round(targetTotal) || 0),
      stakeMode,
      // stakeType structure le gage ('beer' ou 'custom') au lieu de texte libre non
      // contraint - permet a l'Ardoise de regrouper/sommer proprement des gages
      // identiques (ex: "3 bieres") au lieu de fragmenter en lignes distinctes a
      // cause de simples variations de saisie (voir CLAUDE.md).
      stakeType: stakeType === 'custom' ? 'custom' : 'beer',
      stakeDescription: stakeType === 'custom' ? (stakeDescription || '').trim() : '',
      createdBy: currentUser.uid, createdAt: Date.now(), status: 'active',
    });
    await ensureMyParticipantDoc(groupId, challengeRef.id);
  } catch (e) {
    reportSaveError('create group challenge failed', e);
    return;
  }
  // Previens les AUTRES membres du groupe qu'un nouveau defi collectif vient
  // d'etre lance (trou reel comble : avant ce correctif, personne d'autre
  // n'etait jamais notifie) - meme canal que le reste (in-app + push OS via
  // sendPushOnNotificationCreate cote Cloud Function). Volontairement HORS du
  // try/catch critique ci-dessus : un echec ici ne doit jamais faire croire a
  // l'utilisateur que la creation du defi elle-meme a echoue (elle a reussi).
  const otherMembers = groupDetailMembers.filter((m) => m.uid !== currentUser.uid);
  if (otherMembers.length > 0) {
    try {
      const notifyBatch = db.batch();
      for (const m of otherMembers) {
        const notifRef = db.collection('users').doc(m.uid).collection('notifications').doc();
        notifyBatch.set(notifRef, {
          type: 'group_challenge_created',
          fromUid: currentUser.uid,
          fromName: formatDisplayName(currentUser.displayName),
          groupId, groupName: groupDetailGroup ? groupDetailGroup.name : '',
          challengeId: challengeRef.id, challengeName,
          read: false, createdAt: Date.now(),
        });
      }
      await notifyBatch.commit();
    } catch (e) {
      console.error('notify group members of new challenge failed', e);
    }
  }
  creatingGroupChallenge = false;
  await refreshMyGroupsAndActiveChallenges();
  await loadGroupDetail(groupId);
}

// Annulation par le createur d'un defi encore actif (mauvais parametrage, envie de

// Appelee depuis addSetInner() (comme registerBossBattleContributionIfNeeded()) -
// chaque serie loguee compte, pas seulement la complétion du défi. Un même exercice
// peut contribuer a PLUSIEURS défis de groupe simultanément (contrairement au Boss
// Battle, un seul defi communautaire a la fois) : incremente chacun independamment.
// Passe par la Cloud Function logGroupChallengeContribution (plutôt qu'une écriture
// Firestore directe comme avant) : plafonne exactement la contribution au restant
// de la cible (2 membres qui logguent chacun 60 sur un objectif de 100 ne verront
// JAMAIS "120/100" - le 2e ne sera crédité que de 40) et déclenche le règlement
// (Ardoise + Palmarès + popup de félicitations) INSTANTANÉMENT si la cible est
// atteinte, sans attendre le passage planifié (jusqu'à 15 min). Compromis assumé :
// nécessite une connexion réseau au moment du tap (contrairement au reste de
// l'app) - voir CLAUDE.md.
async function registerGroupChallengeContributionsIfNeeded(exerciseSlug, amount) {
  if (!exerciseSlug) return;
  const matches = myActiveGroupChallenges.filter(c => c.exerciseSlug === exerciseSlug);
  for (const m of matches) {
    try {
      await ensureMyParticipantDoc(m.groupId, m.challengeId);
      await functionsClient.httpsCallable('logGroupChallengeContribution')({
        groupId: m.groupId, challengeId: m.challengeId, amount,
      });
    } catch (e) {
      reportSaveError('group challenge contribution failed', e);
    }
  }
}

// Source d'affichage publique (avatar/nom déjà anonymisé) pour un uid quelconque :
// réutilise `leaderboard/{uid}` plutôt qu'une nouvelle collection dédiée. Effet de bord
// volontaire : un utilisateur qui a désactivé le classement (leaderboardOptOut, qui
// supprime son document leaderboard) devient de facto introuvable/non affichable ici
// aussi — l'opt-out classement vaut opt-out découverte, cohérent plutôt que 2 réglages
// de vie privée séparés à gérer.
// Cache mémoire (durée de la session, voir remise à zéro au logout plus bas) : un
// même uid peut être redemandé plusieurs fois (ami présent dans plusieurs listes,
// refreshFriendsData() rappelée après chaque action ami) — évite une relecture
// Firestore identique tant que la session reste ouverte. displayName/photoURL
// changent rarement (dérivés du profil Google), un cache de session est donc sans
// impact visible.
//
// 3e exception documentée à "pas de localStorage dans cette app" (les 2 premières :
// PWA_INSTALL_GATE_BYPASS_KEY, PREFERRED_LANGUAGE_KEY) : contrairement aux 2
// premières (préférences propres À CET APPAREIL), ceci est un cache d'un résultat
// déjà PUBLIC (comme leaderboard/{uid} lui-même) — persisté pour survivre à une
// fermeture/réouverture de la PWA (usage typique : plusieurs ouvertures brèves par
// jour), afin de ne pas rerelire le même profil ami à chaque réouverture. Best-effort
// (TTL, navigation privée tolérée) : ne cache JAMAIS les relations elles-mêmes (qui
// est ami, qui a envoyé une demande) — celles-ci restent toujours relues en direct à
// chaque démarrage (refreshFriendsData()), aucune fraîcheur perdue sur ce qui compte
// réellement (nouvelle demande d'ami, retrait...).
const PUBLIC_PROFILE_CACHE_KEY = 'publicProfileCacheV1';
const PUBLIC_PROFILE_CACHE_TTL_MS = 6 * 60 * 60 * 1000; // 6h : largement assez court pour un changement de photo/nom Google, largement assez long pour couvrir plusieurs réouvertures dans la même journée
let publicProfileCache = {};

function loadPublicProfileCacheFromStorage() {
  try {
    const raw = localStorage.getItem(PUBLIC_PROFILE_CACHE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === 'object' && parsed.entries && (Date.now() - parsed.savedAt) < PUBLIC_PROFILE_CACHE_TTL_MS) {
      publicProfileCache = parsed.entries;
    }
  } catch (e) { /* navigation privée/quota/JSON invalide : tant pis, on repart d'un cache vide */ }
}
function savePublicProfileCacheToStorage() {
  try {
    localStorage.setItem(PUBLIC_PROFILE_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), entries: publicProfileCache }));
  } catch (e) { /* navigation privée/quota : tant pis, le cache reste en mémoire pour cette session uniquement */ }
}
loadPublicProfileCacheFromStorage();

async function fetchPublicProfile(uid) {
  if (Object.prototype.hasOwnProperty.call(publicProfileCache, uid)) return publicProfileCache[uid];
  const doc = await db.collection('leaderboard').doc(uid).get();
  const result = doc.exists ? {
    displayName: formatDisplayName(doc.data().displayName),
    photoURL: doc.data().photoURL || '',
    xpTotal: doc.data().xpTotal || 0,
    streakCount: doc.data().streakCount || 0,
  } : null;
  publicProfileCache[uid] = result;
  savePublicProfileCacheToStorage();
  return result;
}

// Requête ciblée (pas de listener) pour l'activité récente d'UN ami spécifique, utilisée
// par la fiche profil (openFriendProfile()) — différent de startActivityFeedListener()
// qui fusionne l'activité de TOUS les amis en un seul flux temps réel.
async function fetchFriendRecentActivities(uid, n = 10) {
  const snap = await db.collection('activityFeed')
    .where('uid', '==', uid)
    .orderBy('at', 'desc')
    .limit(n)
    .get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

/**
 * Recharge tout ce qu'affiche l'écran Amis : mes amis (2 requêtes friendships,
 * fusionnées côté client — même principe que les paires de lectures indépendantes déjà
 * en place ailleurs dans ce projet), demandes reçues, uids des demandes déjà envoyées
 * (pour l'état du bouton de recherche). Appelée au démarrage (pour le badge de
 * notification sur le bouton "Amis") et après chaque action (envoyer/accepter/refuser/
 * retirer).
 */
async function refreshFriendsData() {
  if (!currentUser) return;
  try {
    const [snapA, snapB, incomingSnap, outgoingSnap] = await Promise.all([
      db.collection('friendships').where('uidA', '==', currentUser.uid).get(),
      db.collection('friendships').where('uidB', '==', currentUser.uid).get(),
      db.collection('friendRequests').where('toUid', '==', currentUser.uid).get(),
      db.collection('friendRequests').where('fromUid', '==', currentUser.uid).get(),
    ]);
    const friendUids = [
      ...snapA.docs.map(d => d.data().uidB),
      ...snapB.docs.map(d => d.data().uidA),
    ];
    const incomingDocs = incomingSnap.docs.map(d => d.data());
    outgoingFriendRequestUids = new Set(outgoingSnap.docs.map(d => d.data().toUid));
    const [friendProfiles, incomingProfiles] = await Promise.all([
      Promise.all(friendUids.map(uid => fetchPublicProfile(uid))),
      Promise.all(incomingDocs.map(d => fetchPublicProfile(d.fromUid))),
    ]);
    myFriends = friendUids.map((uid, i) => ({ uid, ...(friendProfiles[i] || { displayName: t('friends.unknownProfile'), photoURL: '' }) }));
    incomingFriendRequests = incomingDocs.map((d, i) => ({ fromUid: d.fromUid, at: d.at, ...(incomingProfiles[i] || { displayName: t('friends.unknownProfile'), photoURL: '' }) }));
    // Redémarre le fil d'activité à chaque changement de la liste d'amis (nouvel ami
    // ajouté/retiré change forcément le filtre where('uid','in', ...) de la requête).
    startActivityFeedListener();
    render();
  } catch (e) {
    reportSaveError('refresh friends data failed', e);
  }
}

// Filtré par la liste d'amis courante (myFriends, déjà résolue par refreshFriendsData()) :
// Firestore refuse un where(...,'in',[]) avec un tableau vide, donc on n'interroge même
// pas Firestore tant qu'aucun ami n'est ajouté — état vide explicite côté rendu.
function startActivityFeedListener() {
  if (communityActivityFeedUnsub) { communityActivityFeedUnsub(); communityActivityFeedUnsub = null; }
  // Suspendu hors de l'onglet Communauté (voir switchTab()) : appelée aussi bien au
  // démarrage (refreshFriendsData()) qu'après une action ami — dans les 2 cas, si
  // l'utilisateur n'est pas sur cet onglet (ex: démarrage normal, qui atterrit sur
  // "Aujourd'hui"), inutile d'ouvrir un listener que personne ne regarde. Rattaché
  // explicitement à la ré-entrée sur l'onglet (switchTab()).
  if (activeTab !== 'community') return;
  const friendUids = myFriends.map(f => f.uid);
  if (friendUids.length === 0) {
    communityActivityFeed = [];
    return;
  }
  // Limite Firestore : au plus 30 valeurs dans un where('in', ...) — largement
  // suffisant pour une liste d'amis personnelle, cf. discussion produit.
  communityActivityFeedUnsub = db.collection('activityFeed')
    .where('uid', 'in', friendUids.slice(0, 30))
    .orderBy('at', 'desc').limit(30)
    .onSnapshot((snap) => {
      communityActivityFeed = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    });
}

function openFriendsScreen() {
  friendsScreenOpen = true;
  friendSearchQuery = '';
  friendSearchResult = null;
  pushNavState();

}

function updateFriendSearchQuery(value) {
  friendSearchQuery = sanitizeUsernameInput(value);
  friendSearchResult = null;
  render();
}

async function submitFriendSearch() {
  const query = friendSearchQuery;
  if (query.length < 3) return;
  friendSearchResult = 'searching';
  render();
  try {
    const claimDoc = await usernamesCollRef().doc(query).get();
    if (!claimDoc.exists) { friendSearchResult = 'not-found'; render(); return; }
    const targetUid = claimDoc.data().uid;
    if (targetUid === currentUser.uid) { friendSearchResult = 'self'; render(); return; }
    const profile = await fetchPublicProfile(targetUid);
    if (!profile) { friendSearchResult = 'not-found'; render(); return; }
    let relation = 'none';
    if (myFriends.some(f => f.uid === targetUid)) relation = 'friend';
    else if (outgoingFriendRequestUids.has(targetUid)) relation = 'request-sent';
    else if (incomingFriendRequests.some(r => r.fromUid === targetUid)) relation = 'request-received';
    friendSearchResult = { uid: targetUid, displayName: profile.displayName, photoURL: profile.photoURL, relation };
  } catch (e) {
    reportSaveError('friend search failed', e);
    friendSearchResult = null;
  }
  render();
}

async function sendFriendRequest(targetUid) {
  try {
    await db.collection('friendRequests').doc(friendRequestId(currentUser.uid, targetUid)).set({
      fromUid: currentUser.uid, toUid: targetUid, at: Date.now(),
    });
    await notificationsCollRef(targetUid).doc().set({
      type: 'friend_request',
      fromUid: currentUser.uid,
      fromName: formatDisplayName(currentUser.displayName),
      read: false,
      createdAt: Date.now(),
    });
    outgoingFriendRequestUids.add(targetUid);
    if (friendSearchResult && typeof friendSearchResult === 'object' && friendSearchResult.uid === targetUid) {
      friendSearchResult.relation = 'request-sent';
    }
    if (navigator.vibrate) navigator.vibrate(10);
    render();
  } catch (e) {
    reportSaveError('send friend request failed', e);
  }
}

async function acceptFriendRequest(fromUid) {
  const pairId = friendshipPairId(fromUid, currentUser.uid);
  const [uidA, uidB] = [fromUid, currentUser.uid].sort();
  try {
    const batch = db.batch();
    batch.set(db.collection('friendships').doc(pairId), { uidA, uidB, since: Date.now() });
    batch.delete(db.collection('friendRequests').doc(friendRequestId(fromUid, currentUser.uid)));
    // Previens la personne dont la demande vient d'etre acceptee (trou reel
    // comble : avant ce correctif, elle n'etait jamais notifiee) - meme canal
    // que le reste (in-app + push OS via sendPushOnNotificationCreate).
    batch.set(db.collection('users').doc(fromUid).collection('notifications').doc(), {
      type: 'friend_request_accepted',
      fromUid: currentUser.uid,
      fromName: formatDisplayName(currentUser.displayName),
      read: false, createdAt: Date.now(),
    });
    await batch.commit();
    if (navigator.vibrate) navigator.vibrate(10);
    if (friendSearchResult && typeof friendSearchResult === 'object' && friendSearchResult.uid === fromUid) {
      friendSearchResult.relation = 'friend';
    }
    await refreshFriendsData();
  } catch (e) {
    reportSaveError('accept friend request failed', e);
  }
}

async function declineFriendRequest(fromUid) {
  try {
    await db.collection('friendRequests').doc(friendRequestId(fromUid, currentUser.uid)).delete();
    await refreshFriendsData();
  } catch (e) {
    reportSaveError('decline friend request failed', e);
  }
}

async function removeFriend(uid) {
  const confirmed = await confirmModal({
    icon: '👋',
    title: t('popups.removeFriend.title'),
    subtitle: t('popups.removeFriend.subtitle'),
    confirmLabel: t('popups.removeFriend.confirmLabel'),
    danger: true,
  });
  if (!confirmed) return;
  try {
    await db.collection('friendships').doc(friendshipPairId(uid, currentUser.uid)).delete();
    await refreshFriendsData();
  } catch (e) {
    reportSaveError('remove friend failed', e);
  }
}

// Le Top N et mes voisins (si je n'y suis pas) sont VOLONTAIREMENT indépendants (pas
// un seul Promise.all englobant) : avec Promise.all, l'échec de l'un effaçait aussi
// l'autre alors qu'il avait réussi — déjà vécu en production (top 20 vidé à tort par
// un souci isolé à la requête de voisins). Chaque échec reste cantonné à sa propre
// partie de l'écran. Mon rang n'est même pas demandé si je suis déjà visible dans le
// Top N mis en cache (aucun appel Callable supplémentaire nécessaire dans ce cas).
async function loadCommunityLeaderboard(view) {
  communityLeaderboardLoading = true;
  render();
  try {
    const cache = await fetchLeaderboardTop(view);
    // Patch ma PROPRE ligne (si présente) avec ma valeur EN MÉMOIRE, à jour : le
    // document leaderboardCache n'est rafraîchi que toutes les 15 min côté serveur
    // (aggregateLeaderboard), donc pourrait ne pas encore refléter un changement que
    // je viens de faire moi-même (ex: je viens de gagner de l'XP) — garantit que je
    // vois toujours mon propre score à jour, même si celui des autres reste à J-15min
    // (même garantie que l'ancien mécanisme 100% client, voir syncLeaderboardEntry()).
    const myUid = currentUser && currentUser.uid;
    const myFreshValue = view === 'streaks' ? streakCount : (view === 'weekly' ? xpWeekly : xpTotal);
    communityLeaderboardTop = (cache.entries || []).map((e) => (myUid && e.uid === myUid ? { ...e, value: myFreshValue } : e));
    communityLeaderboardTotalCount = cache.totalCount || 0;
  } catch (e) {
    communityLeaderboardTop = [];
    communityLeaderboardTotalCount = 0;
    console.error('leaderboard top fetch failed', e);
  }
  try {
    const meInTop = communityLeaderboardTop.some(e => e.uid === currentUser.uid);
    communityLeaderboardMyRank = meInTop ? null : await fetchMyRank(view);
  } catch (e) {
    communityLeaderboardMyRank = null;
    console.error('leaderboard rank fetch failed', e);
  }
  communityLeaderboardLoading = false;
  render();
}

function switchCommunityLeaderboardView(view) {
  if (view === communityLeaderboardView) return;
  communityLeaderboardView = view;
  loadCommunityLeaderboard(view);
}

// ==== COMMUNAUTÉ : JAUGE COLLECTIVE ("BOSS BATTLE") ====
// Contrairement au modèle du plan initial, le document partagé ne stocke QUE
// currentProgress : targetChallengeId/targetAmount sont toujours re-dérivés via
// getWeeklyBossBattleTarget() (pur, déterministe) — élimine tout risque de course à
// l'initialisation du document ("qui écrit le 1er la cible cette semaine ?").
let communityBossBattleProgress = 0;
let communityBossBattleUnsub = null;

function bossBattleDocRef(weekStartStr = mondayOfWeek(new Date())) {
  return db.collection('community').doc('bossBattle_' + weekStartStr);
}

// Abonnement temps réel (comme le compteur du défi du jour) : appelé une seule fois
// au démarrage. Détecte le franchissement de la cible EN DIRECT (comparaison avec la
// valeur précédemment en mémoire, jamais relue depuis un stockage persistant) : ne se
// déclenche donc qu'une fois par session pour les clients ouverts au moment exact du
// franchissement, jamais en rouvrant l'app après coup sur une cible déjà atteinte.
function startBossBattleListener() {
  if (communityBossBattleUnsub) communityBossBattleUnsub();
  const weekStart = mondayOfWeek(new Date());
  const target = getWeeklyBossBattleTarget(weekStart);
  communityBossBattleUnsub = bossBattleDocRef(weekStart).onSnapshot((snap) => {
    const previous = communityBossBattleProgress;
    const next = snap.exists ? (snap.data().currentProgress || 0) : 0;
    communityBossBattleProgress = next;
    if (target && previous < target.targetAmount && next >= target.targetAmount) {
      handleBossBattleVictory(weekStart, target, next);
    }
    render();
  });
}

// Fil des ~20 dernières contributions individuelles (temps réel), pour le FOMO en
// direct sur l'écran Communauté ("Untel vient d'ajouter X") — distinct de
// dailyContributors (agrégat par personne/par jour, sert uniquement au badge
// Contributeur du jour). Abonnement unique au démarrage, comme les autres listeners
// communautaires.
let communityRecentContributions = [];
let communityContributionsUnsub = null;

function startRecentContributionsListener() {
  if (communityContributionsUnsub) communityContributionsUnsub();
  communityContributionsUnsub = null;
  // Suspendu hors de l'onglet Communauté, même raisonnement que
  // startActivityFeedListener() ci-dessus (voir switchTab()).
  if (activeTab !== 'community') return;
  communityContributionsUnsub = bossBattleDocRef().collection('contributions')
    .orderBy('at', 'desc').limit(20).onSnapshot((snap) => {
      // { id: d.id, ...d.data() } (pas juste d.data()) : l'id du document est
      // nécessaire pour cibler les kudos sur une contribution précise.
      communityRecentContributions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    });
}

async function handleBossBattleVictory(weekStart, target, finalProgress) {
  const challenge = CHALLENGE_LIBRARY.find(c => c.id === target.targetChallengeId);
  if (navigator.vibrate) navigator.vibrate([60, 40, 60, 40, 140]);
  fireConfetti();
  playSuccessSound();
  enqueuePopup({
    epic: true,
    icon: '🏆',
    title: t('popups.bossBattleVictory.title'),
    subtitle: t('popups.bossBattleVictory.subtitle', { amount: finalProgress.toLocaleString(LOCALE_TO_INTL[currentLocale]), name: challenge ? challengeDisplayName(challenge).toLowerCase() : '' }),
  });
  try {
    // "create-only" cote client (en plus de la regle Firestore equivalente) : si 2
    // clients detectent le franchissement quasi simultanement (2 utilisateurs actifs
    // au meme instant), un seul doit ecrire l'archive definitive.
    // "create-only" cote client (en plus de la regle Firestore equivalente) : si 2
    // clients detectent le franchissement quasi simultanement (2 utilisateurs actifs
    // au meme instant), un seul doit ecrire l'archive definitive.
    const archiveRef = db.collection('bossBattleArchive').doc(weekStart);
    const existing = await archiveRef.get();
    if (!existing.exists) {
      await archiveRef.set({
        targetChallengeId: target.targetChallengeId,
        targetAmount: target.targetAmount,
        finalProgress,
        completedAt: Date.now(),
      });
    }
  } catch (e) {
    reportSaveError('boss battle archive failed', e);
  }
}

// Appelée depuis addSet(), TÔT (pas seulement à la complétion du défi — chaque série
// loggée compte pour la jauge collective) si le défi en cours est la cible de la
// semaine. Incrémente à la fois le compteur partagé ET l'agrégat "par jour/par
// utilisateur" (dailyContributors), qui sert uniquement au badge Contributeur du jour.
async function registerBossBattleContributionIfNeeded(challengeId, amount) {
  const weekStart = mondayOfWeek(new Date());
  const target = getWeeklyBossBattleTarget(weekStart);
  if (!target || target.targetChallengeId !== challengeId) return;
  try {
    await bossBattleDocRef(weekStart).set(
      { currentProgress: firebase.firestore.FieldValue.increment(amount) },
      { merge: true }
    );
    await bossBattleDocRef(weekStart).collection('dailyContributors').doc(todayKey + '_' + currentUser.uid).set(
      { uid: currentUser.uid, displayName: formatDisplayName(currentUser.displayName), date: todayKey, amount: firebase.firestore.FieldValue.increment(amount) },
      { merge: true }
    );
    // Fil des contributions individuelles (contrairement à dailyContributors, un
    // document PAR évènement, jamais fusionné) : sert uniquement au flux temps réel
    // "Untel vient d'ajouter X" affiché sur l'écran Communauté, pour le FOMO en direct.
    await bossBattleDocRef(weekStart).collection('contributions').add({
      uid: currentUser.uid,
      displayName: formatDisplayName(currentUser.displayName),
      amount,
      at: Date.now(),
      kudosCount: 0,
    });
  } catch (e) {
    reportSaveError('boss battle contribution failed', e);
  }
}

// Appelé une fois au chargement de l'app (après loadState(), donc todayKey connu) :
// recharge le bouclier hebdomadaire si besoin, puis vérifie si un ou plusieurs jours
// ont été manqués depuis la dernière validation.
async function evaluateStreakOnLoad() {
  const wk = mondayOfWeek(new Date());
  if (lastShieldResetWeek !== wk) {
    hasShield = true;
    lastShieldResetWeek = wk;
  }

  let shieldTriggered = false;
  if (streakCount > 0 && lastCompletedDate && lastCompletedDate !== todayKey) {
    const gap = daysBetween(lastCompletedDate, todayKey);
    if (gap >= 2) {
      if (hasShield) {
        hasShield = false;
        shieldTriggered = true;
      } else {
        streakCount = 0;
      }
    }
  }

  await saveStreakData();

  if (shieldTriggered) {
    enqueuePopup({
      icon: '🛡️',
      title: t('popups.shield.title'),
      subtitle: t('popups.shield.subtitle'),
    });
  }
}

// Appelé lors de la toute première validation de défi de la journée (dailyActivity
// passait de 0 à 1). Le cas "jour manqué" est déjà géré par evaluateStreakOnLoad().
async function registerDailyStreak() {
  streakCount += 1;
  lastCompletedDate = todayKey;
  await saveStreakData();
  setTimeout(() => {
    enqueuePopup({
      icon: '🔥',
      title: t('popups.streakPlusOne.title'),
      big: streakCount,
      subtitle: tn('popups.streakPlusOne.subtitle', streakCount),
    });
  }, 900);
}

function computeStreak() {

}

// Détail d'une journée du calendrier mensuel (Journal) : liste des défis réalisés ce
// jour-là. Le jour cliqué peut être hors de la fenêtre de 28 jours de historyEntries
// (mois de 31 jours), donc on relit son document Firestore à la demande plutôt que
// de préchager tous les jours du mois d'un coup.
async function showDayDetailModal(dayKeyStr) {
  const [y, m, d] = dayKeyStr.split('-').map(Number);
  const label = formatDateLabel(new Date(y, m - 1, d));
  let entries = [];
  try {
    const res = await dbGet('day:' + dayKeyStr);
    const s = JSON.parse(res.value);
    if (s.challenges) {
      for (const [cid, entry] of Object.entries(s.challenges)) {
        if (!entry.sets || entry.sets.length === 0) continue;
        const c = CHALLENGES.find(x => x.id === Number(cid));
        entries.push({
          name: c ? challengeDisplayName(c) : t('history.deletedChallenge'),
          total: entry.sets.reduce((a, b) => a + b, 0),
          target: entry.targetOverride || (c ? c.target : 0),
          unit: c ? c.unit : 'reps',
          done: !!entry.done,
        });
      }
    }
  } catch (e) {
    entries = [];
  }
  const listHtml = entries.length === 0
    ? `<div class="history-empty">${t('popups.dayDetail.empty')}</div>`
    : entries.map(e => `
        <div class="history-entry">
          <div class="hname">${e.name}</div>
          <div class="hprogress${e.done ? ' done' : ''}">${e.total}/${e.target}${e.unit === 'sec' ? ' ' + t('exercise.unitSecLabelLower') : ''}${e.done ? ' ✓' : ''}</div>
        </div>
      `).join('');
  enqueuePopup({
    // 🗓️ (et non 📅) : le dessin Apple de l'emoji "tear-off calendar" grave en dur
    // "17 JUL" (illustration historique d'iCal) et faisait croire a un bug de date
    // bloquee au 17 juillet des qu'il apparaissait a cote de la date reellement
    // selectionnee.
    icon: '🗓️',
    title: label,
    listHtml,
    closable: true,
    btnLabel: t('common.close'),
  });
}

// ==== POPUPS PLEIN ÉCRAN STYLE DUOLINGO ====
// Un seul moteur de popup pour tous les évènements de gamification (série, bouclier,
// fin de défi/Hardcore avec cartes XP/trophée, level up, nouveau titre) : ajouté
// directement au DOM, comme showToast()/fireConfetti(), indépendant du cycle render().
let popupQueue = [];
let popupOpen = false; // état suivi explicitement (pas de fiabilité à attendre d'un getElementById sur un id qui vient d'être retiré du DOM selon les moteurs)
let currentPopupHtml = ''; // dernier contenu affiché (introspection/tests)

function enqueuePopup(opts) {
  popupQueue.push(opts);
  if (!popupOpen) drainPopupQueue();
}

function buildPopupInnerHtml(next) {
  const chips = [];
  if (next.xp) chips.push(`<div class="popup-chip xp-chip">⚡ +${next.xp} XP</div>`);
  const progressHtml = next.progressLabel ? `
    <div class="popup-progress-track"><div class="popup-progress-fill" style="width:${next.progressPct}%"></div></div>
    <div class="popup-progress-label">${next.progressLabel}</div>
  ` : '';
  return `
    <div class="app-popup-card${next.epic ? ' epic' : ''}">
      ${next.closable ? `<button class="app-popup-close-x" id="appPopupCloseX" aria-label="${t('common.close')}">✕</button>` : ''}
      <div class="app-popup-icon${next.locked ? ' locked' : ''}">${next.icon}</div>
      <div class="app-popup-title">${next.title}</div>
      ${next.big !== undefined ? `<div class="app-popup-big${next.bigHighlight ? ' big-highlight' : ''}">${next.big}</div>` : ''}
      ${next.bigLabel ? `<div class="app-popup-big-label">${next.bigLabel}</div>` : ''}
      ${next.subtitle ? `<div class="app-popup-sub">${next.subtitle}</div>` : ''}
      ${next.badgeLine || ''}
      ${next.listHtml ? `<div class="popup-list">${next.listHtml}</div>` : ''}
      ${progressHtml}
      ${chips.length ? `<div class="app-popup-chips">${chips.join('')}</div>` : ''}
      <button class="app-popup-btn" id="appPopupCloseBtn">${next.btnLabel || 'Continuer'}</button>
    </div>
  `;
}

function drainPopupQueue() {
  const next = popupQueue.shift();
  if (!next) { popupOpen = false; currentPopupHtml = ''; return; }
  popupOpen = true;
  if (next.variant === 'title' || next.variant === 'trophy') fireConfetti('title');
  const el = document.createElement('div');
  el.id = 'appPopup';
  el.className = 'app-popup-overlay';
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.innerHTML = buildPopupInnerHtml(next);
  currentPopupHtml = el.innerHTML;
  document.body.appendChild(el);
  document.getElementById('appPopupCloseBtn').onclick = () => {
    el.remove();
    drainPopupQueue();
  };
  const closeX = document.getElementById('appPopupCloseX');
  if (closeX) {
    closeX.onclick = () => {
      el.remove();
      drainPopupQueue();
    };
  }
}

// Modale de confirmation stylée (Annuler/Confirmer), à la place des confirm() natifs
// du navigateur (moches, non personnalisables). Volontairement INDÉPENDANTE de la
// file enqueuePopup/drainPopupQueue (qui reste single-bouton, fire-and-forget, comme
// partout ailleurs dans l'appli) : ici on a besoin d'attendre une vraie décision de
// l'utilisateur avant de continuer, donc on retourne une Promise<boolean> — chose que
// la file générique ne permet pas. Réutilise le même habillage visuel
// (.app-popup-overlay/.app-popup-card) pour rester cohérent avec le reste de l'appli.
let currentConfirmModalHtml = ''; // dernier contenu affiché (introspection/tests, même principe que currentPopupHtml)
let currentConfirmModalEl = null; // dernier élément popup créé (introspection/tests, pour vérifier la portée de querySelector)
function confirmModal({ icon = '⚠️', title = '', subtitle = '', confirmLabel = t('common.confirm'), cancelLabel = t('common.cancel'), danger = false } = {}) {
  return new Promise((resolve) => {
    const el = document.createElement('div');
    el.className = 'app-popup-overlay';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    el.innerHTML = `
      <div class="app-popup-card">
        <div class="app-popup-icon">${icon}</div>
        ${title ? `<div class="app-popup-title">${title}</div>` : ''}
        ${subtitle ? `<div class="app-popup-sub">${subtitle}</div>` : ''}
        <div class="app-popup-actions">
          <button class="app-popup-btn-cancel" id="confirmModalCancelBtn">${cancelLabel}</button>
          <button class="app-popup-btn${danger ? ' danger' : ''}" id="confirmModalConfirmBtn">${confirmLabel}</button>
        </div>
      </div>
    `;
    currentConfirmModalHtml = el.innerHTML;
    currentConfirmModalEl = el;
    document.body.appendChild(el);
    const finish = (result) => { el.remove(); resolve(result); };
    // Recherche SCOPÉE à ce popup précis (el.querySelector), pas document.getElementById()
    // (global) : confirmModal() n'a, contrairement à drainPopupQueue(), AUCUN garde-fou
    // d'instance unique (pas de "popupOpen") — deux appels concurrents (ex: terminer 2
    // défis différents chacun avec 3 records d'affilée, à quelques secondes d'écart,
    // chacun programmant son propre setTimeout(1400ms)) créent deux <div id="confirmModal...">
    // avec les MÊMES id. document.getElementById() aurait alors pu se lier au premier
    // popup (déjà fermé ou caché derrière), laissant les boutons du second (celui
    // réellement visible/cliqué par l'utilisateur) totalement inertes.
    el.querySelector('#confirmModalCancelBtn').onclick = () => finish(false);
    el.querySelector('#confirmModalConfirmBtn').onclick = () => finish(true);
  });
}

// Une popup épique dédiée par trophée fraîchement débloqué (icône animée, effets
// lumineux dorés, pluie de confettis) — distincte de la popup de complétion du défi.
function enqueueTrophyPopups(freshBadges) {
  for (const b of freshBadges) {
    enqueuePopup({
      variant: 'trophy',

}

// Petit cadenas métallique/gris (pas un gros cadenas jaune uniforme) : SVG plutôt
// qu'un emoji, pour garder une couleur/taille sobres et cohérentes quel que soit
// l'appareil (les emoji cadenas se rendent en jaune/or sur la plupart des systèmes).
function lockIconSVG(size) {
  const s = size || 12;
  return `<svg class="lock-icon-svg" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
    <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>

// Petites icônes (vert néon via currentColor) remplaçant les mots "Chrono"/"Répétitions"
// sur les cartes d'exercice des listes (Défis/Aujourd'hui) : chrono épuré pour les
// défis en secondes, traits de comptage à la craie pour les défis en répétitions.
// Popover de détail au clic sur une carte de trophée : icône, condition de
// déblocage, barre de progression en temps réel et récompense d'XP — que le
// trophée soit déjà débloqué ou non.
function showTrophyDetailModal(badgeId) {
  const b = BADGE_DEFS.find(x => x.id === badgeId);
  if (!b) return;
  const unlocked = badges.unlocked.includes(b.id);
  const { current, target } = b.progress();
  const fmt = (n) => b.secondsBased ? formatSecToReadable(Math.round(n)) : Math.round(n).toLocaleString(LOCALE_TO_INTL[currentLocale]);
  enqueuePopup({
    icon: b.icon,
    locked: !unlocked,
    title: unlocked ? t('popups.trophy.detailUnlockedTitle') : t('popups.trophy.detailLockedTitle'),
    big: badgeLabel(b),
    subtitle: unlocked
      ? t('popups.trophy.detailUnlockedSubtitle')
      : t('popups.trophy.detailLockedSubtitle'),
    progressPct: Math.min(100, Math.round((current / target) * 100)),
    progressLabel: `${fmt(Math.min(current, target))} / ${fmt(target)}`,
    xp: b.xp,
  });
}

// Détecte un changement de niveau (et, le cas échéant, de titre) entre deux mesures
// d'XP et enfile la popup adaptée (level up simple, ou popup "titre" plus épique).
function enqueueLevelPopups(levelBefore, levelAfter) {
  if (levelAfter <= levelBefore) return;
  const titleBefore = athleteTitle(levelBefore);
  const titleAfter = athleteTitle(levelAfter);
  if (titleAfter !== titleBefore) {
    enqueuePopup({
      variant: 'title',
      epic: true,
      icon: '👑',
      title: t('popups.levelUp.newTitleUnlocked'),
      big: titleAfter,
      subtitle: t('popups.levelUp.newTitleSubtitle', { title: titleAfter, n: levelAfter }),
    });
  } else {
    enqueuePopup({
      variant: 'levelup',
      icon: '⭐',
      title: t('popups.levelUp.title'),
      big: t('profileTab.levelLabel', { n: levelAfter }),
      subtitle: athleteTitle(levelAfter),
    });
  }
}

// ==== XP, NIVEAUX & TITRES D'ATHLÈTE ====
let xpTotal = 0;
// XP de la semaine calendaire en cours (classement "Hebdomadaire", reset le lundi) —
// champ SÉPARÉ de xpTotal (jamais fusionné dedans) pour ne rien changer au modèle
// existant : `xpWeekStart` (lundi de la semaine du dernier ajout) suit exactement le
// même mécanisme que `lastShieldResetWeek` (mondayOfWeek() comparé à chaque écriture).
let xpWeekly = 0;
let xpWeekStart = null;
// Participation au classement communautaire (activée par défaut, désactivable dans
// Paramètres) : si désactivée, syncLeaderboardEntry() ne doit RIEN écrire, et le doc
// leaderboard/{uid} déjà existant doit être supprimé (pas juste ignoré en lecture,
// pour ne laisser aucune trace publique une fois l'utilisateur retiré).
let leaderboardOptOut = false;

async function loadXp() {
  try { const res = await dbGet('xpTotal'); xpTotal = parseInt(res.value, 10) || 0; }
  catch (e) { xpTotal = 0; }
}
async function saveXp() {
  await saveAppField('xpTotal', xpTotal);
}
async function loadXpWeekly() {
  try {
    const res = await dbGet('xpWeeklyData');
    const d = JSON.parse(res.value);
    xpWeekly = d.xpWeekly || 0;
    xpWeekStart = d.xpWeekStart || null;
  } catch (e) {
    xpWeekly = 0;
    xpWeekStart = null;
  }
}
async function saveXpWeekly() {
  await saveAppField('xpWeeklyData', { xpWeekly, xpWeekStart });
}
async function loadLeaderboardOptOut() {
  try { const res = await dbGet('leaderboardOptOut'); leaderboardOptOut = res.value === 'true'; }
  catch (e) { leaderboardOptOut = false; }
}
async function saveLeaderboardOptOut() {
  await saveAppField('leaderboardOptOut', leaderboardOptOut);
}

// Écrit (merge) la ligne publique et minimale de classement de l'utilisateur — jamais
// le document appData complet (profil/poids restent privés). No-op silencieux si
// l'utilisateur a désactivé sa participation.
//
// Peut être appelée 2 fois pour un seul événement (ex: awardXp() PUIS
// registerDailyStreak() lors de la 1ère complétion du jour) — écrit à chaque fois
// EXACTEMENT le même instantané des champs courants, donc la 2e écriture est une
// pure redite. À l'intérieur d'un lot appData (voir beginAppDataBatch()), l'écriture
// réelle est différée à la fin du lot : plusieurs appels se fondent en une seule
// écriture Firestore, avec les valeurs déjà à jour au moment du flush (100%
// invisible, même document final, juste moins d'allers-retours).
let pendingLeaderboardSync = false;

async function syncLeaderboardEntry() {
  if (leaderboardOptOut || !currentUser) return;
  if (appDataBatchDepth > 0) {
    pendingLeaderboardSync = true;
    return;
  }
  try {
    await db.collection('leaderboard').doc(currentUser.uid).set({
      displayName: formatDisplayName(currentUser.displayName),
      photoURL: currentUser.photoURL || '',
      streakCount,
      xpWeekly,
      xpWeekStart,
      xpTotal,
      lastActiveDate: todayKey,
    }, { merge: true });
    // Sans ça, un cache classement déjà valide (TTL 15 min, voir fetchLeaderboardTop()/
    // fetchMyRank()) afficherait NOTRE PROPRE rang/valeur obsolète après une action qui
    // vient de le changer (ex: on vient de gagner de l'XP mais l'onglet Communauté
    // montre encore l'ancien total) — règle explicitement demandée : le cache TTL ne
    // doit jamais retarder l'affichage de MON PROPRE score.
    invalidateLeaderboardCache();
  } catch (e) {
    reportSaveError('leaderboard sync failed', e);
  }
}

async function toggleLeaderboardOptOut() {
  leaderboardOptOut = !leaderboardOptOut;
  await saveLeaderboardOptOut();
  if (leaderboardOptOut) {
    try { await db.collection('leaderboard').doc(currentUser.uid).delete(); }
    catch (e) { reportSaveError('leaderboard opt-out delete failed', e); }
    invalidateLeaderboardCache();
  } else {
    await syncLeaderboardEntry();
  }
  render();
}

// ==== CLASSEMENT PRECALCULE COTE SERVEUR (Cloud Functions, voir CLAUDE.md) ====
// Ancienne approche 100% cliente (Top 50 par .limit() + 2 requêtes ciblées "voisins"
// pour approximer la position hors Top 50, sans jamais afficher de rang exact —
// .count() indisponible sur le SDK compat client) abandonnée au profit d'une
// agrégation planifiée côté serveur (`aggregateLeaderboard`, Scheduled Function,
// 15 min) : le client se contente désormais de lire UN SEUL document déjà calculé
// (`leaderboardCache/{view}`) au lieu de scanner/interroger `leaderboard` lui-même.
// Le rang exact redevient bon marché pour tout le monde : gratuit pour le Top 100
// (simple index dans le tableau déjà en cache), et via un Callable dédié
// (`getMyRank`, `.count()` côté Admin SDK — fonctionnel, contrairement au SDK compat
// client) pour tous les autres, appelé uniquement quand je regarde réellement mon
// propre rang (jamais un balayage proactif de toute la communauté).
//
// Cache CLIENT par vue (streaks/hebdo/all-time), TTL 15 minutes (même compromis
// qu'avant : les données des AUTRES membres peuvent avoir jusqu'à 15 min de retard,
// en échange de moins de lectures) — MAIS invalidé IMMÉDIATEMENT dès que MES propres
// données changent (voir l'appel dans syncLeaderboardEntry()), pour que je voie
// toujours mon propre score à jour tout de suite après une séance.
const LEADERBOARD_CACHE_TTL_MS = 15 * 60 * 1000;
let leaderboardTopCache = {}; // { [view]: { at, data: { entries, totalCount } } }
let leaderboardRankCache = {}; // { [view]: { at, data: { rank, value } } }

function invalidateLeaderboardCache() {
  leaderboardTopCache = {};
  leaderboardRankCache = {};
}

// Lit le document déjà agrégé par la Cloud Function aggregateLeaderboard() — 1 seule
// lecture, quelle que soit la taille de la communauté (remplace l'ancienne requête
// .limit(n) directe sur la collection leaderboard).
async function fetchLeaderboardTop(view) {
  const cached = leaderboardTopCache[view];
  if (cached && (Date.now() - cached.at) < LEADERBOARD_CACHE_TTL_MS) return cached.data;
  const doc = await db.collection('leaderboardCache').doc(view).get();
  const data = doc.exists ? doc.data() : { entries: [], totalCount: 0 };
  leaderboardTopCache[view] = { at: Date.now(), data };
  return data;
}

// Rang exact via la Cloud Function getMyRank (Callable) — n'est appelée QUE si je ne
// suis pas déjà visible dans le Top 100 mis en cache (voir loadCommunityLeaderboard()).
// weekStart calculé ICI en heure locale (comme xpWeekStart à l'écriture), transmis
// au serveur plutôt que recalculé côté fonction, pour rester coherent avec ma propre
// notion de "cette semaine" (voir le commentaire équivalent dans functions/index.js).
async function fetchMyRank(view) {
  const cached = leaderboardRankCache[view];
  if (cached && (Date.now() - cached.at) < LEADERBOARD_CACHE_TTL_MS) return cached.data;
  const weekStart = view === 'weekly' ? mondayOfWeek(new Date()) : null;
  const result = await functionsClient.httpsCallable('getMyRank')({ view, weekStart });
  const data = result.data;
  leaderboardRankCache[view] = { at: Date.now(), data };
  return data;
}

// Ne déclenche aucune popup elle-même : renvoie juste les niveaux avant/après pour
// laisser l'appelant décider de l'ordre d'affichage (ex: popup de complétion d'abord,
// puis éventuellement level up / nouveau titre).
async function awardXp(amount) {
  const levelBefore = computeLevel(xpTotal);
  xpTotal += amount;
  const wk = mondayOfWeek(new Date());
  if (xpWeekStart !== wk) { xpWeekly = 0; xpWeekStart = wk; }
  xpWeekly += amount;
  await saveXp();
  await saveXpWeekly();
  await syncLeaderboardEntry();
  const levelAfter = computeLevel(xpTotal);
  return { levelBefore, levelAfter };
}

// Seuils d'XP par niveau, en dur et arrondis (demande explicite : des paliers
// "propres" comme 150/350/700/1200, pas une formule qui retomberait sur des
// nombres quelconques). Calibrés sur le gain réel d'un défi Hardcore (~150 à
// 225 XP selon l'exercice, cf. xpForChallenge + HARDCORE_XP_BONUS) pour que 2
// défis Hardcore amènent au plus au niveau 2, ou tout début de niveau 3 —
// avant, l'ancienne courbe faisait grimper à un niveau 4 dès 2 défis.
// Au-delà de la table, la progression continue avec le même facteur de
// croissance que ses derniers paliers (cf. xpForLevel).
const XP_LEVEL_THRESHOLDS = [
  0, 150, 350, 700, 1200, 1750, 2400, 3100, 3900, 4800,
  5800, 6900, 8100, 9500, 11000, 12750, 14750, 17000, 19500, 22250,
  25250, 28750, 32500, 36750, 41500, 47000, 53000, 59750, 67250, 75750,
  85250, 96000, 108000, 121250, 136250, 153000, 171750, 192750, 216250, 242750,
  272250, 305250, 342250, 383750, 430250, 482250, 540500, 605750,
];
const XP_LEVEL_TABLE_GROWTH = 1.12; // croissance des paliers au-dela de la table ci-dessus
function xpForLevel(n) {
  if (n <= 1) return 0;
  if (n <= XP_LEVEL_THRESHOLDS.length) return XP_LEVEL_THRESHOLDS[n - 1];
  const lastIndex = XP_LEVEL_THRESHOLDS.length - 1;
  const lastIncrement = XP_LEVEL_THRESHOLDS[lastIndex] - XP_LEVEL_THRESHOLDS[lastIndex - 1];
  const extra = n - XP_LEVEL_THRESHOLDS.length;
  const growthSum = lastIncrement * XP_LEVEL_TABLE_GROWTH * (Math.pow(XP_LEVEL_TABLE_GROWTH, extra) - 1) / (XP_LEVEL_TABLE_GROWTH - 1);
  return Math.round(XP_LEVEL_THRESHOLDS[lastIndex] + growthSum);
}
/** Niveau atteint pour un total d'XP donné, en cherchant le plus haut seuil (`xpForLevel`) franchi. */
function computeLevel(xp) {
  let level = 1;
  while (xpForLevel(level + 1) <= xp) level++;
  return level;
}
function xpProgress(xp) {
  const level = computeLevel(xp);
  const currentThreshold = xpForLevel(level);
  const nextThreshold = xpForLevel(level + 1);
  return { level, xpIntoLevel: xp - currentThreshold, xpNeeded: nextThreshold - currentThreshold };
}

// Titres d'athlète, du niveau 1 au niveau max — source unique utilisée pour le
// titre courant (athleteTitle) ET pour la carte "Parcours de niveau" (roadmap).
// `id` (stable, langue-agnostique) remplace l'ancien `title` figé en français : le nom
// traduit se résout au RENDU via t('athleteTitles.' + id), voir athleteTitle() et
// renderLevelRoadmapSheet(). `icon` reste séparé (décoratif, jamais traduit).
const ATHLETE_TITLE_TIERS = [
  { id: 'recrue', icon: '🥉', maxLevel: 5 },
  { id: 'initie', icon: '🎖️', maxLevel: 10 },
  { id: 'motive', icon: '🥈', maxLevel: 15 },
  { id: 'regulier', icon: '📅', maxLevel: 20 },
  { id: 'athlete', icon: '🥇', maxLevel: 26 },
  { id: 'guerrier', icon: '⚔️', maxLevel: 32 },
  { id: 'expert', icon: '⚡', maxLevel: 38 },
  { id: 'titan', icon: '🏆', maxLevel: 43 },
  { id: 'demidieu', icon: '🌌', maxLevel: 47 },
  { id: 'legende', icon: '👑', maxLevel: Infinity },
];
function athleteTitle(level) {
  // Parametre renomme `tier` (pas `t`) : meme piege de shadowing deja rencontre 2 fois
  // (renderChallengeCard() batch 3, renderLevelRoadmapSheet() batch 6).
  const tier = ATHLETE_TITLE_TIERS.find(tier => level <= tier.maxLevel);
  return t('athleteTitles.' + tier.id) + ' ' + tier.icon;
}
// 50 XP de base + bonus selon le volume (reps/sec) et, pour les haltères, la charge.
function xpForChallenge(c, total) {
  let bonus = c.unit === 'sec' ? Math.round(total / 5) : Math.round(total / 2);
  if (c.cat === 'Haltères') {
    bonus += Math.round(weights[c.id] ?? 8);
  }
  return 50 + Math.max(0, bonus);
}
const HARDCORE_XP_BONUS = 75;

// ==== COACH VOCAL (Web Speech API) ====

// ==== NOTIFICATIONS PUSH (Firebase Cloud Messaging, Phase B) ====
// Le token FCM de CET appareil est mis en cache dans localStorage (jamais dans
// le document consolide appData, contrairement a voiceCoachEnabled ci-dessus) :
// contrairement aux autres reglages, l'activation du push est INTRINSEQUEMENT
// par appareil (chaque appareil a son propre token, voir users/{uid}/pushTokens/
// {token}) - synchroniser un simple booleen entre appareils donnerait une fausse
// impression qu'activer sur son telephone active aussi sur son ordinateur.
const FCM_TOKEN_STORAGE_KEY = 'fcmPushToken';

// null tant que pas encore determine (verifie une fois, en tache de fond, voir
// continueStartApp()) - le reglage reste discret/masque en attendant plutot que
// d'afficher un toggle qui pourrait ne rien faire. firebase.messaging.isSupported()
// est asynchrone depuis la SDK v9+ (contrairement aux versions precedentes) et
// couvre deja precisement le cas iOS Safari (false hors PWA installee, iOS <16.4) -
// aucune detection manuelle supplementaire necessaire.
let pushNotificationsSupported = null;
async function detectPushNotificationsSupport() {
  try {
    pushNotificationsSupported = 'serviceWorker' in navigator && typeof Notification !== 'undefined' && await firebase.messaging.isSupported();
  } catch (e) {
    pushNotificationsSupported = false;
  }
  render();
  maybePromptPushNotificationsOnStartup();
}

// Pure (aucun acces navigateur) : faut-il declencher automatiquement la
// demande de permission a CE demarrage ? Retour utilisateur explicite : la
// plupart des grandes apps redemandent a chaque ouverture tant que
// l'utilisateur n'a pas encore tranche, plutot que d'attendre un tap manuel
// dans les reglages. Uniquement si le support est confirme ET qu'aucune
// decision n'a encore ete prise ('default') - jamais si deja 'granted'
// (inutile) ni si deja 'denied' (le navigateur ignore silencieusement toute
// nouvelle demande une fois refusee : AUCUN moyen cote code de re-afficher le
// prompt natif, seul l'utilisateur peut le reactiver depuis ses reglages
// navigateur - autant ne pas tenter et laisser le texte explicatif du reglage
// Parametres faire le travail dans ce cas).
function shouldAutoPromptPushNotifications(supported, permission) {
  return supported === true && permission === 'default';
}

// Pure (aucun acces navigateur) : faut-il RAFRAICHIR silencieusement le token
// (sans re-demander la permission, deja accordee) a CE demarrage ? Bug reel
// signale par l'utilisateur : un token FCM peut devenir invalide sans que
// Notification.permission ne change (ex: "Forcer la mise a jour de l'appli"
// dans Depannage desinscrit le service worker, ce qui invalide le token
// associe cote Google) - la Cloud Function le detecte alors et supprime le
// doc pushTokens correspondant (voir sendPushToUser()), mais RIEN ne le
// regenerait automatiquement : le reglage Parametres continuait d'afficher
// "actif" (il ne regarde que localStorage/permission, jamais la presence
// reelle cote serveur), et plus aucun push n'arrivait, silencieusement.
function shouldRefreshPushToken(supported, permission) {
  return supported === true && permission === 'granted';
}

async function maybePromptPushNotificationsOnStartup() {
  let permission = null;
  try { permission = typeof Notification !== 'undefined' ? Notification.permission : null; } catch (e) { permission = null; }
  if (!shouldAutoPromptPushNotifications(pushNotificationsSupported, permission) && !shouldRefreshPushToken(pushNotificationsSupported, permission)) return;
  // Dans les 2 cas, enablePushNotifications() reste la bonne fonction : elle
  // gere deja correctement le cas "permission deja accordee" (Notification.requestPermission()
  // resout alors immediatement sans rien afficher) en (re)obtenant/(re)sauvegardant
  // le token cote serveur - exactement le comportement de reparation necessaire ici.
  await enablePushNotifications();
}

// Calcule a la demande (jamais mis en cache dans une variable globale) : reflete
// toujours l'etat REEL du navigateur (permission) + de cet appareil precis
// (token deja obtenu), jamais un etat suppose apres un rechargement de page.
function isPushNotificationsEnabledOnThisDevice() {
  try {
    return typeof Notification !== 'undefined' && Notification.permission === 'granted' && !!localStorage.getItem(FCM_TOKEN_STORAGE_KEY);
  } catch (e) {
    return false;
  }
}

// Appelee soit automatiquement au demarrage (maybePromptPushNotificationsOnStartup(),
// tant qu'aucune decision n'a encore ete prise), soit sur un tap explicite du
// reglage Parametres - dans les 2 cas, Notification.requestPermission() ne
// declenche reellement le prompt natif du navigateur que si la permission est
// encore 'default' (sinon elle resout immediatement sans rien afficher). Si
// l'utilisateur refuse, on ne force rien : le reglage reste simplement
// "desactive" (Notification.permission === 'denied'), avec un texte
// explicatif cote rendu plutot qu'une erreur.
async function enablePushNotifications() {
  if (!pushNotificationsSupported) return;
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') { render(); return; }
    const registration = await navigator.serviceWorker.ready;
    const messaging = firebase.messaging();
    // onMessage : premier plan (app deja ouverte) - deliberement un no-op. Le
    // listener Firestore existant (startNotificationsListener()) affiche deja la
    // popup in-app correspondante en temps reel ; sans ce handler explicite, la
    // SDK Firebase peut logguer un avertissement "no onMessage handler" en console.
    messaging.onMessage(() => {});
    const token = await messaging.getToken({ vapidKey: VAPID_PUBLIC_KEY, serviceWorkerRegistration: registration });
    if (!token) { render(); return; }
    await db.collection('users').doc(currentUser.uid).collection('pushTokens').doc(token).set({
      token, createdAt: Date.now(), userAgent: navigator.userAgent,
    });
    try { localStorage.setItem(FCM_TOKEN_STORAGE_KEY, token); } catch (e) { /* navigation privee : tant pis, le reglage semblera "off" au prochain chargement */ }
    if (navigator.vibrate) navigator.vibrate(10);
    render();
  } catch (e) {
    reportSaveError('enable push notifications failed', e);
    render();
  }
}

// Supprime le doc token de CET appareil (jamais celui des autres appareils du
// meme compte, chacun garde le sien) + revoque le token cote FCM.
async function disablePushNotifications() {
  let token = null;
  try { token = localStorage.getItem(FCM_TOKEN_STORAGE_KEY); } catch (e) { /* tant pis */ }
  try {
    if (token && currentUser) {
      await db.collection('users').doc(currentUser.uid).collection('pushTokens').doc(token).delete();
    }
    if (pushNotificationsSupported) {
      await firebase.messaging().deleteToken();
    }
  } catch (e) {
    reportSaveError('disable push notifications failed', e);
  } finally {
    try { localStorage.removeItem(FCM_TOKEN_STORAGE_KEY); } catch (e) { /* tant pis */ }
    render();
  }
}

function togglePushNotifications() {
  if (isPushNotificationsEnabledOnThisDevice()) disablePushNotifications();

}

// cancel() avant chaque prise de parole pour éviter les retards/empilements audio ;
// tolère l'absence de synthèse vocale (navigateur non compatible ou bloquée).
// `onEnd`, si fourni, se déclenche une fois la phrase RÉELLEMENT terminée (callback
// natif SpeechSynthesisUtterance.onend), pour enchaîner un son/décompte sans jamais
// couper l'annonce en cours (cf. le décompte du mode Hardcore). Un filet de sécurité
// (setTimeout) évite de rester bloqué si le navigateur ne déclenche jamais onend.
function speak(text, onEnd) {
  if (!voiceCoachEnabled) {
    if (onEnd) onEnd();
    return;
  }
  if (typeof window === 'undefined' || !window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') {
    if (onEnd) onEnd();
    return;
  }
  try {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = LOCALE_TO_INTL[currentLocale];
    if (onEnd) {
      let called = false;
      const finish = () => { if (!called) { called = true; onEnd(); } };
      utterance.onend = finish;
      utterance.onerror = finish;
      setTimeout(finish, 4000); // filet de securite (bug navigateur : onend jamais declenche)
    }
    window.speechSynthesis.speak(utterance);
  } catch (e) {
    console.error('Coach vocal indisponible :', e);
    if (onEnd) onEnd();
  }
}

function formatRelative(ms) {
  if (!ms) return null;
  const diff = Date.now() - ms;
  const min = diff / 60000;
  if (min < 1) return t('dates.relative.now');
  if (min < 60) return t('dates.relative.minutesAgo', { n: Math.round(min) });
  const hrs = diff / 3600000;
  if (hrs < 24) return t('dates.relative.hoursAgo', { n: Math.round(hrs) });
  const days = diff / 86400000;
  return t('dates.relative.daysAgo', { n: Math.round(days) });
}
