    </div>
    <input class="library-search-input" id="librarySearchInput" type="text"
           placeholder="🔍 Rechercher un défi..." aria-label="Rechercher un défi" value="${escapeHtml(librarySearchQuery)}"
           oninput="updateLibrarySearch(this.value)">
  `;
  // Recherche active : les catégories restent affichées mais 1) filtrées à leurs seuls
  // défis correspondants, 2) forcées ouvertes (peu importe libraryOpenCats), 3) masquées
  // entièrement si aucun défi ne correspond — réutilise l'accordéon existant tel quel,
  // pas de vue à plat séparée.
  const query = librarySearchQuery.trim().toLowerCase();
  const cats = [...new Set(CHALLENGES.map(c => c.cat))];
  let anyMatch = false;
  // Consomme le flag ici : seul CE rendu anime la catégorie qui vient d'être dépliée,
  // les rendus suivants (ex: toggle d'activation dans un accordéon déjà ouvert) non.
  const catToAnimate = libraryAnimatingCat;
  libraryAnimatingCat = null;
  for (const cat of cats) {
    let itemsInCat = CHALLENGES.filter(c => c.cat === cat);
    if (query) itemsInCat = itemsInCat.filter(c => c.name.toLowerCase().includes(query));
    if (query && itemsInCat.length === 0) continue;
    anyMatch = true;
    const activeCount = itemsInCat.filter(c => activeToday.has(c.id)).length;
    const isOpen = query ? true : libraryOpenCats.has(cat);
    // N'anime que la catégorie tout juste dépliée (jamais pendant une recherche, qui
    // ne doit pas non plus clignoter à chaque frappe).
    const shouldAnimate = !query && cat === catToAnimate;
    html += `
      <div class="accordion${isOpen ? ' open' : ''}">
        <button class="accordion-header" onclick="toggleLibraryCategory('${escapeJsAttr(cat)}')">
          <span class="accordion-chevron">›</span>
          <span class="accordion-title">${escapeHtml(cat)}</span>
          <span class="accordion-count${activeCount > 0 ? ' has-active' : ''}">${activeCount} actif${activeCount === 1 ? '' : 's'}</span>
        </button>
        ${isOpen ? `<div class="accordion-body">${itemsInCat.map((c, i) => renderChallengeCard(c, 'library', i, shouldAnimate)).join('')}</div>` : ''}
      </div>
    `;
  }
  if (query && !anyMatch) {
    html += `<div class="library-search-empty">Aucun défi ne correspond à « ${escapeHtml(librarySearchQuery.trim())} »</div>`;
  }
  return html;
}

function renderHeatmap() {
  const WEEKS = 26; // ~6 mois, plus lisible sur mobile qu'une année complète
  // Semaine calendaire (Lundi -> Dimanche) contenant aujourd'hui, puis on remonte de
  // 25 semaines pleines supplémentaires : garantit TOUJOURS exactement 26 colonnes de 7
  // jours (contrairement à l'ancien "aligner sur Lundi en remontant depuis aujourd'hui",
  // qui pouvait ajouter jusqu'à 6 jours de trop et décaler aujourd'hui hors de la 26e
  // colonne — la ligne d'en-tête des mois, elle-même limitée à 26 colonnes, ratait alors
  // silencieusement le mois en cours).
  const currentWeekMonday = getCalendarWeekDates(new Date())[0];
  const start = new Date(currentWeekMonday);
  start.setDate(start.getDate() - (WEEKS - 1) * 7);
  const days = [];
  for (let i = 0; i < WEEKS * 7; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    days.push(d);
  }

  // 3 niveaux seulement (au lieu de 4) : plus lisible/contraste qu'une gradation fine
  // difficile a distinguer d'un coup d'oeil sur une heatmap mobile.
  function levelFor(count) {
    if (!count) return 0;
    if (count === 1) return 1;
    return 2;
  }

  let cells = '';
  for (const d of days) {
    const k = dateKey(d);
    const count = dailyActivity[k] || 0;
    const lvl = levelFor(count);
    const isFuture = d > new Date();
    cells += `<div class="heat-cell lvl${lvl}${isFuture ? ' future' : ''}" title="${k} — ${count} défi(s)"></div>`;
  }

  // En-tête des mois : un libellé abrégé sur la colonne qui contient le 1er jour d'un
  // mois (comme le graphique de contributions GitHub), sur la même grille à 26 colonnes
  // que heatmap-grid (1 colonne = 1 semaine). Règle stricte : un mois n'est libellé que
  // s'il est ENTIÈREMENT visible, c'est-à-dire que son 1er jour fait partie de la
  // fenêtre — un mois entamé avant le début de la heatmap (coupé à gauche) n'a donc,
  // par construction, jamais son propre jour 1 dans `days` et ne reçoit jamais de
  // libellé. Détecter le jour 1 dans chaque colonne (plutôt que le mois du seul Lundi
  // de la colonne) est nécessaire pour ne pas rater le mois en cours quand celui-ci
  // démarre au milieu d'une semaine (ex: 1er tombant un samedi).
  const MONTH_ABBR = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
  let monthsHtml = '';
  for (let col = 0; col < WEEKS; col++) {
    const colDays = days.slice(col * 7, col * 7 + 7);
    const firstOfMonthDay = colDays.find(d => d.getDate() === 1);
    monthsHtml += `<div class="heat-month-label">${firstOfMonthDay ? MONTH_ABBR[firstOfMonthDay.getMonth()] : ''}</div>`;
  }

  return `
    <div class="section-label">Activité (6 derniers mois)</div>
    <div class="heatmap-months">${monthsHtml}</div>
    <div class="heatmap-grid">${cells}</div>
    <div class="heat-legend">
      <span class="heat-legend-item"><span class="heat-cell lvl0"></span>Aucun</span>
      <span class="heat-legend-item"><span class="heat-cell lvl1"></span>1 défi</span>
      <span class="heat-legend-item"><span class="heat-cell lvl2"></span>2+ défis</span>
    </div>
  `;
}

function renderHistoryScreen() {
  const today = new Date();
  // Calendrier du MOIS EN COURS (du 1er au dernier jour), pas une fenêtre glissante de
  // 28 jours (qui faisait disparaître les 1ers jours du mois sur un mois de 30/31 jours).
  // Le statut "fait" vient de dailyActivity (déjà chargé au complet, pas limité aux 28
  // derniers jours comme historyEntries), même source que la heatmap ci-dessous.
  const year = today.getFullYear();
  const month = today.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const days = [];
  for (let day = 1; day <= daysInMonth; day++) {
    days.push(new Date(year, month, day));
  }
  const firstDow = (days[0].getDay() + 6) % 7; // Monday=0
  let calHtml = `<div class="cal-grid">`;
  ['L','M','M','J','V','S','D'].forEach(l => calHtml += `<div class="cal-dow">${l}</div>`);
  for (let i = 0; i < firstDow; i++) calHtml += `<div class="cal-cell empty"></div>`;
  for (const d of days) {
    const k = dateKey(d);
    const isToday = k === todayKey;
    const done = (dailyActivity[k] || 0) > 0;
    calHtml += `<div class="cal-cell${done ? ' done' : ''}${isToday ? ' today' : ''}" onclick="showDayDetailModal('${k}')">${done ? '✓' : d.getDate()}</div>`;
  }
  calHtml += `</div>`;

  let listHtml = `<div class="history-list-label">Défis effectués</div>`;
  const withChallenge = historyEntries.filter(e => e.challengeName);
  if (historyLoading) {
    listHtml += `<div class="history-empty">Chargement…</div>`;
  } else if (withChallenge.length === 0) {
    listHtml += `<div class="history-empty">Pas encore d'historique</div>`;
  } else {
    for (const e of withChallenge) {
      const label = e.key === todayKey ? "Aujourd'hui" : formatDateLabel(e.date);
      listHtml += `
        <div class="history-entry">
          <div>
            <div class="hdate">${label}</div>
            <div class="hname">${e.challengeName}</div>
          </div>
          <div class="hprogress${e.done ? ' done' : ''}">${e.total}/${e.target} ${e.unit === 'sec' ? 'sec' : ''}${e.done ? ' ✓' : ''}</div>
        </div>
      `;
    }
  }

  return `
    <h1 class="title">Journal</h1>
    <div class="subtitle">Ta progression dans le temps</div>
    <button class="share-stats-btn" onclick="shareStatsImage()">
      <svg class="share-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      Partager mes stats
    </button>
    <div class="section-label">Calendrier du mois</div>
    ${calHtml}
    ${renderHeatmap()}
    ${listHtml}
  `;
}

function renderLevelRoadmapSheet() {
  const { level, xpIntoLevel, xpNeeded } = xpProgress(xpTotal);
  const pct = xpNeeded > 0 ? Math.min(100, Math.round((xpIntoLevel / xpNeeded) * 100)) : 100;
  let prevMax = 0;
  const rows = ATHLETE_TITLE_TIERS.map(t => {
    const minLevel = prevMax + 1;
    const rangeLabel = t.maxLevel === Infinity ? `Niveau ${minLevel}+` : `Niveaux ${minLevel}–${t.maxLevel}`;
    const unlocked = level >= minLevel;
    const current = level >= minLevel && level <= t.maxLevel;
    prevMax = t.maxLevel;
    return `
      <div class="roadmap-row${unlocked ? ' unlocked' : ''}${current ? ' current' : ''}">
        <div class="roadmap-row-icon">${current ? '▶' : unlocked ? '✓' : lockIconSVG(14)}</div>

          <div class="roadmap-row-title">${t.title}</div>
          <div class="roadmap-row-range">${rangeLabel}</div>

  }).join('');
  return `
    <div class="level-roadmap-sheet">
      <button class="level-roadmap-close" onclick="closeLevelRoadmap()">✕</button>
      <div class="level-roadmap-header">
        <div class="level-roadmap-level">Niveau ${level}</div>

      <div class="section-label">Parcours des titres d'athlète</div>

/**
 * Filet de secours pour un appareil resté bloqué sur une ancienne version malgré
 * skipWaiting()/clients.claim() (ex: PWA "ajoutée à l'écran d'accueil" qui ne
 * revérifie jamais le service worker). Désenregistre TOUS les service workers de
 * cette origine et vide tout le Cache Storage (jamais purgé par un simple "vider
 * le cache" du navigateur sur certaines plateformes), puis recharge.
 */
async function forceAppUpdate() {
  const accepted = await confirmModal({
    icon: '🔄',
    title: t('settings.troubleshooting.forceUpdateModal.title'),
    subtitle: t('settings.troubleshooting.forceUpdateModal.subtitle'),
    confirmLabel: t('settings.troubleshooting.forceUpdateModal.confirmLabel'),
  });
  if (!accepted) return;
  try {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) {
    console.error('forceAppUpdate failed', e);
  }
  location.reload();
}

function exportUserData() {
  const data = {

    profile: userProfile,
    customChallenges,
    manualTargetOverrides,
    weights,
    lastCompleted,
    stats,
    badges,
    dailyActivity,

    xpTotal,
    voiceCoachEnabled,
    activeToday: [...activeToday],
    todayKey,
    todayState: state,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `defi-du-jour-export-${dateKey(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// Réécrit chaque clé reconnue via les save*() existants (jamais un accès Firestore
// direct), pour rester cohérent avec le reste du code et bénéficier des mêmes
// garanties. Passe par confirmModal() avant d'écraser quoi que ce soit : c'est une
// action destructrice et irréversible pour les données actuelles.
async function importUserData(event) {
  const file = event.target.files[0];
  if (!file) return;
  let data;
  try {
    data = JSON.parse(await file.text());
  } catch (e) {
    event.target.value = '';
    showToast('❌ Fichier invalide');
    return;
  }

  const accepted = await confirmModal({
    icon: '📥',
    title: 'Importer ces données ?',
    subtitle: 'Cela va REMPLACER tes données actuelles (défis personnalisés, statistiques, série, XP...). Cette action est irréversible.',
    confirmLabel: 'Importer et remplacer',
    danger: true,
  });
  if (!accepted) {
    event.target.value = '';
    return;
  }

  if (data.profile) { userProfile = data.profile; await saveProfile(); }
  if (Array.isArray(data.customChallenges)) {
    customChallenges = data.customChallenges;
    await saveCustomChallenges();
    rebuildChallenges();
  }
  if (data.manualTargetOverrides) { manualTargetOverrides = data.manualTargetOverrides; await saveManualTargetOverrides(); }
  if (data.weights) { weights = data.weights; await saveWeights(); }
  if (data.lastCompleted) { lastCompleted = data.lastCompleted; await saveLastCompleted(); }
  if (data.stats) { stats = data.stats; await saveStats(); }
  if (data.badges) { badges = data.badges; await saveBadges(); }
  if (data.dailyActivity) { dailyActivity = data.dailyActivity; await saveDailyActivity(); }
  if (data.streakData) {
    streakCount = data.streakData.streakCount ?? 0;
    lastCompletedDate = data.streakData.lastCompletedDate ?? null;
    hasShield = data.streakData.hasShield ?? true;
    lastShieldResetWeek = data.streakData.lastShieldResetWeek ?? null;
    await saveStreakData();
  }
  if (typeof data.xpTotal === 'number') { xpTotal = data.xpTotal; await saveXp(); }
  if (typeof data.voiceCoachEnabled === 'boolean') { voiceCoachEnabled = data.voiceCoachEnabled; await saveVoiceCoachEnabled(); }
  if (Array.isArray(data.activeToday)) { activeToday = new Set(data.activeToday); await saveActiveToday(); }
  if (data.todayState && data.todayKey === todayKey) { state = data.todayState; await saveState(); }

  event.target.value = '';
  showToast('✅ Données importées');
  render(true);
}

// Une ligne de classement (top N ou barre de rang ancrée) : avatar/initiale, nom,
// valeur formatée selon la vue (jours de série vs XP). `highlight` marque la ligne
// de l'utilisateur courant dans la barre de rang.
function renderLeaderboardRow(entry, rank, view, highlight) {
  const value = entry[leaderboardFieldForView(view)] || 0;
  const valueLabel = view === 'streaks' ? `🔥 ${value} j` : `⚡ ${value} XP`;
  // formatDisplayName() est déjà appliqué à l'écriture (syncLeaderboardEntry()) : ré-
  // appliqué ici en filet de sécurité, idempotent, pour tout document déjà écrit avant
  // ce correctif (nom complet encore stocké, se corrigera de lui-même à la prochaine
  // synchronisation de son auteur).
  const name = formatDisplayName(entry.displayName);
  const avatar = entry.photoURL
    ? `<img src="${escapeHtml(entry.photoURL)}" class="leaderboard-avatar" referrerpolicy="no-referrer">`
    : `<div class="leaderboard-avatar-fallback">${escapeHtml(name.charAt(0).toUpperCase())}</div>`;
  // Jamais sur sa propre ligne. Contrairement aux kudos événementiels (fil d'activité/
  // Boss Battle), pas de retrait ici : 1 kudos par JOUR et par personne (voir
  // giveKudosToPerson()), plus simple, pas besoin de la symétrie d'un like sur un
  // événement ponctuel.
  const kudosHtml = highlight ? '' : `<button class="kudos-btn${myKudosGivenToday.has(entry.uid) ? ' given' : ''}" onclick="event.stopPropagation(); giveKudosToPerson('${escapeJsAttr(entry.uid)}')">👏 ${entry.kudosTotal || 0}</button>`;
  return `
    <div class="leaderboard-row${highlight ? ' me' : ''}">
      <span class="leaderboard-rank">#${rank}</span>
      ${avatar}
      <span class="leaderboard-name">${escapeHtml(name)}</span>
      <span class="leaderboard-value">${valueLabel}</span>
      ${kudosHtml}
    </div>
  `;
}

// Invite à partager le lien de l'app depuis l'écran Communauté (empty state du
// classement) : navigator.share si disponible (mobile), sinon copie presse-papiers +
// toast de confirmation — jamais d'échec silencieux si aucun des deux n'est supporté.
async function shareCommunityInvite() {
  const text = "Rejoins-moi sur Défi du Jour pour relever le défi communautaire ⚡";
  const url = location.href;
  if (navigator.share) {
    try {
      await navigator.share({ title: 'Défi du Jour', text, url });
      return;
    } catch (e) { return; } // annulé par l'utilisateur : pas d'erreur à afficher
  }
  try {
    await navigator.clipboard.writeText(`${text} ${url}`);
    showToast('Lien copié — partage-le à tes proches ! 🔗');
  } catch (e) {
    reportSaveError('share community invite failed', e);
  }
}

// ==== PULL TO REFRESH ====
let ptrStartY = null;
let ptrCurrentY = 0;
let ptrActive = false;
let ptrRefreshing = false;
const PTR_THRESHOLD = 70;

function initPullToRefresh() {
  const indicator = document.createElement('div');
  indicator.id = 'ptrIndicator';
  indicator.className = 'ptr-indicator';
  indicator.innerHTML = '<div class="ptr-spinner">↻</div>';
  document.body.appendChild(indicator);

  document.addEventListener('touchstart', (e) => {
    // showProfileOnboarding : l'écran d'onboarding ne scrolle pas au niveau de la page
    // (window.scrollY reste à 0), donc un simple défilement de roulette (âge/taille/poids)
    // pouvait être mal interprété comme un pull-to-refresh — déclenchant refreshApp() /
    // render(true) en pleine saisie, ce qui réinitialisait les roulettes à leurs valeurs
    // par défaut (voir onWheelPickerScroll). refreshApp() ne concerne de toute façon que
    // les données déjà chargées, pas l'onboarding : aucune raison de l'autoriser ici.
    if (ptrRefreshing || showProfileOnboarding) return;
    if (window.scrollY <= 0 && !timerRunning) {
      ptrStartY = e.touches[0].clientY;
      ptrCurrentY = e.touches[0].clientY; // reset : un tap sans touchmove ne doit jamais hériter d'une ancienne valeur
      ptrActive = true;
    }
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!ptrActive || ptrStartY === null || ptrRefreshing) return;
    ptrCurrentY = e.touches[0].clientY;
    const delta = ptrCurrentY - ptrStartY;
    if (delta > 0 && window.scrollY <= 0) {
      const pulled = Math.min(delta * 0.5, 100);
      indicator.style.transform = `translateX(-50%) translateY(${pulled}px)`;
      indicator.style.opacity = Math.min(pulled / PTR_THRESHOLD, 1);
      if (pulled >= PTR_THRESHOLD) {
        indicator.classList.add('ready');
      } else {
        indicator.classList.remove('ready');
      }
    }
  }, { passive: true });

  document.addEventListener('touchend', async () => {
    if (!ptrActive || ptrStartY === null) return;
    const delta = ptrCurrentY - ptrStartY;
    ptrActive = false;
    ptrStartY = null;

    if (delta * 0.5 >= PTR_THRESHOLD && !ptrRefreshing) {
      ptrRefreshing = true;
      indicator.classList.add('spinning', 'ready');
      indicator.style.transform = `translateX(-50%) translateY(56px)`;
      indicator.style.opacity = '1';
      if (navigator.vibrate) navigator.vibrate(15);
      await refreshApp();
      await new Promise(r => setTimeout(r, 350));
      indicator.classList.remove('spinning', 'ready');
      indicator.style.transform = `translateX(-50%) translateY(0px)`;
      indicator.style.opacity = '0';
      ptrRefreshing = false;
    } else {
      indicator.classList.remove('ready');
      indicator.style.transform = `translateX(-50%) translateY(0px)`;
      indicator.style.opacity = '0';
    }
  }, { passive: true });
}

async function refreshApp() {
  await loadAppData();
  if (activeTab === 'history') {
    await loadHistoryEntries();
  } else {
    await loadState(); // dépend de dailyActivity, chargé juste avant
    await loadActiveToday(); // vient après loadState() : dépend de todayKey
  }
  await evaluateStreakOnLoad();
  render(true);
}

/**
 * Suggestion du jour ("catégorie la plus délaissée") affichée sur l'onglet
 * Aujourd'hui. Retourne `null` tant que l'historique est trop court pour être
 * pertinent (voir seuil ci-dessous) plutôt que de risquer un faux signal.
 */
function getSuggestion() {
  // Pas assez d'historique pour être pertinent, on évite de harceler un nouvel utilisateur
  if (badges.totalCompletions < 3) return null;

  const cats = [...new Set(CHALLENGES.map(c => c.cat))];
  let worstCat = null;
  let worstDays = -1;

  for (const cat of cats) {
    const idsInCat = CHALLENGES.filter(c => c.cat === cat).map(c => c.id);
    const timestamps = idsInCat.map(id => lastCompleted[id]).filter(Boolean);
    if (timestamps.length === 0) continue; // jamais fait du tout, on ne harcèle pas dès le début
    const mostRecent = Math.max(...timestamps);
    const daysSince = (Date.now() - mostRecent) / 86400000;
    if (daysSince > worstDays) {
      worstDays = daysSince;
      worstCat = cat;
    }
  }

  if (!worstCat || worstDays < 3) return null;

  const days = Math.floor(worstDays);
  return `Tu n'as pas fait <strong>${worstCat}</strong> depuis ${days} jour${days > 1 ? 's' : ''}`;
}


/**
 * Raccourcis PWA (manifest.json "shortcuts", ex: "Défis"/"Journal" depuis un appui
 * long sur l'icône de l'appli) : lit `?tab=...` dans l'URL et positionne activeTab
 * en conséquence avant le tout premier rendu (affectation directe, PAS switchTab()
 * qui déclenche des effets de bord pensés pour un changement d'onglet interactif :
 * vibration, nettoyage du timer, etc. — ici on démarre simplement sur cet onglet).
 * Nettoie ensuite l'URL (history.replaceState) pour qu'un rechargement manuel
 * ultérieur ne re-déclenche pas la même redirection.
 */
function applyShortcutTabFromUrl() {
  const params = new URLSearchParams(location.search);
  const tab = params.get('tab');
  if (['today', 'history', 'library', 'community', 'account'].includes(tab)) {
    activeTab = tab;
  }
  if (params.has('tab')) {
    history.replaceState(null, '', location.pathname);
  }
}

async function startApp() {
  if (showProfileOnboarding) {
    // Un onboarding est déjà affiché et en cours de saisie : on ne le relance pas,
    // au cas où startApp() serait appelée une seconde fois (double événement d'auth par ex.)
    return;
  }
  await loadAppData();
  applyShortcutTabFromUrl();
  if (!userProfile) {
    profileStep = 0;
    profileDraft = { age: null, sex: null, heightCm: null, weightKg: null, level: null };
    showProfileOnboarding = true;
    render();
    return;
  }
  // Compte déjà onboardé mais créé avant l'introduction du pseudo obligatoire (ou
  // onboarding profil déjà terminé sans avoir pu finir le choix du pseudo) : verrou
  // plein écran infranchissable, même principe que le repli PWA (#pwaInstallGate).
  if (!username) {
    usernameSetupMode = 'gate';
    render();
    return;
  }
  await proceedAfterProfile();
}

async function proceedAfterProfile() {
  await continueStartApp();
}

async function continueStartApp() {
  // loadAppData() (appelé juste avant, dans startApp()) a déjà chargé
  // customChallenges/profile/stats/badges/etc. en une seule lecture — il ne reste
  // que les documents par jour, qui en dépendent (todayKey/dailyActivity).
  await loadState(); // vient après : dépend de dailyActivity pour les pastilles de la semaine
  await loadActiveToday(); // vient après loadState() : dépend de todayKey
  await evaluateStreakOnLoad(); // vient après loadState() : dépend de todayKey
  startCommunityDailyListener(); // vient après loadState() : dépend de todayKey
  await refreshWeeklyBossBattleTargetCache(); // AVANT startBossBattleListener() : la detection de victoire lit getWeeklyBossBattleTarget() de facon synchrone
  startBossBattleListener();
  startRecentContributionsListener();
  // Pas de await : sert uniquement au badge de notification sur le bouton "Amis" (écran
  // Communauté), pas bloquant pour le premier rendu — se termine par son propre render().
  refreshFriendsData();
  // Rattrapage natif inclus : les notifications non lues reçues hors ligne se
  // déclenchent exactement comme celles reçues en direct, dès ce premier instantané.
  startNotificationsListener();
  // loadState() se termine par un render() interne, mais avec l'ancien activeToday
  // (pas encore rechargé à ce moment-là) : sans ce second rendu, l'accueil reste
  // figé sur cet état obsolète (ex: liste vide ou d'une session précédente).
  render();
}

// Micro-interaction : légère vibration sur chaque tap d'élément interactif
document.addEventListener('click', (e) => {
  const target = e.target.closest('button, .picker-item, .manage-item, .qa-btn, .timer-ring-wrap');
  if (target && navigator.vibrate) {
    navigator.vibrate(8);
  }
}, true);

initPullToRefresh();

</script>
