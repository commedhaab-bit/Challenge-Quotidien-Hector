<script>
// ==== FILET DE SÉCURITÉ GLOBAL ====
// Si une exception non interceptée survient N'IMPORTE OÙ dans ce script (ex: le bug
// "defer" qui a provoqué un écran noir total en production), affiche un écran de
// secours minimal plutôt que de laisser la page vide/figée sans aucun signal. Posé
// tout en haut, AVANT l'initialisation Firebase, pour attraper les erreurs les plus
// précoces. Volontairement écrit en HTML/CSS inline très simple (aucune dépendance à
// une fonction de l'appli plus bas, qui pourrait elle-même être à l'origine du crash) —
// donc AUCUN appel à t()/tn() ici, ce filet doit fonctionner même si le moteur i18n
// lui-même est la cause du crash. Texte en ANGLAIS en dur (pas français) : cet écran
// est montré à n'importe quel utilisateur quelle que soit sa langue, et l'anglais est
// mieux compris qu'un français figé par le public FR/EN/ES de l'appli.
let fatalErrorShown = false;
function showFatalErrorScreen(detail) {
  if (fatalErrorShown) return; // n'afficher qu'une seule fois même si plusieurs erreurs surviennent
  fatalErrorShown = true;
  console.error('Erreur fatale interceptée :', detail);
  const el = document.createElement('div');
  el.setAttribute('style', 'position:fixed;inset:0;z-index:99999;background:#0a0d0b;color:#eef2ef;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;');
  el.innerHTML =
    '<div style="font-size:44px;">⚠️</div>' +
    '<div style="font-size:18px;font-weight:800;">Something went wrong</div>' +
    '<div style="font-size:14px;color:#8a958e;max-width:320px;line-height:1.5;">The app ran into an unexpected problem. Reload the page to try again.</div>' +
    '<button id="fatalReloadBtn" style="background:#39e97a;color:#0a0d0b;border:none;font-weight:800;font-size:15px;padding:14px 24px;border-radius:12px;cursor:pointer;">Reload</button>';
  document.body.appendChild(el);
  document.getElementById('fatalReloadBtn').onclick = () => window.location.reload();
}
window.addEventListener('error', (e) => showFatalErrorScreen(e.error || e.message));
window.addEventListener('unhandledrejection', (e) => showFatalErrorScreen(e.reason));

// ==== CONFIGURATION FIREBASE ====
// Remplace ces valeurs par celles de TON projet Firebase (voir guide fourni)
const firebaseConfig = {
  apiKey: "AIzaSyBE0DL8Q6y8Md4R2aM0D1imx_cTUlHP5c4",
  authDomain: "challenge-quotidien-hector.firebaseapp.com",
  projectId: "challenge-quotidien-hector",
  storageBucket: "challenge-quotidien-hector.firebasestorage.app",
  messagingSenderId: "613473786890",
  appId: "1:613473786890:web:c77ccf3c2d99857df9d3f3",
  measurementId: "G-CXQPEGDHW7"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
// Notifications push (Phase B) : cle VAPID PUBLIQUE (comme apiKey ci-dessus,
// rien a proteger - elle identifie juste ce projet aupres de FCM), generee une
// fois dans la Console Firebase (Parametres du projet > Cloud Messaging >
// Configuration web) et necessaire a messaging.getToken() plus bas.
const VAPID_PUBLIC_KEY = 'BFq_mtuvKDwu-hTbCbKnRkQyfqxpLFBytmD2hTVlqpDvGlMwvElN61-KV0l4tC1K8_jtVQBq5wEADhsxGoOfc3s';
// Region europe-west1 : DOIT correspondre exactement a setGlobalOptions({region:...})
// dans functions/index.js, sinon httpsCallable() cible une URL de fonction qui
// n'existe pas (region par defaut us-central1 sinon).
const functionsClient = firebase.app().functions('europe-west1');
// Persistance locale IndexedDB : les lectures Firestore sont mises en cache sur
// l'appareil, donc un changement d'onglet ou une réouverture de l'appli peut être
// servi depuis le cache local (quasi instantané) plutôt que d'attendre le réseau à
// chaque fois. synchronizeTabs permet d'avoir l'appli ouverte dans plusieurs onglets
// sans que la persistance échoue. Best-effort : si indisponible (navigation privée,
// très vieux navigateur), l'appli continue de fonctionner normalement, juste sans
// ce cache local entre les sessions.
// Diagnostic exposé dans Paramètres > Dépannage : si la persistance échoue (onglets
// multiples sans leader, navigation privée, quota IndexedDB, certaines PWA iOS...),
// chaque écriture Firestore doit atteindre le réseau AVANT de survivre à une
// fermeture de l'appli — une complétion de défi suivie d'une fermeture immédiate
// peut alors se perdre silencieusement (aucune queue locale durable). null = pas
// encore déterminé, true/false = résultat connu.
let firestorePersistenceEnabled = null;
db.enablePersistence({ synchronizeTabs: true }).then(() => {
  firestorePersistenceEnabled = true;
}).catch((err) => {
  firestorePersistenceEnabled = false;
  console.warn('Firestore persistence indisponible :', err.code);
});
let currentUser = null;

// ==== INTERNATIONALISATION (i18n) : FR / EN / ES ====
// LOCALE_FR/LOCALE_EN/LOCALE_ES vivent dans locale-fr.js/locale-en.js/locale-es.js,
// chargés en <script src> CLASSIQUE juste après exercise-data.js (voir <head>) — même
// pattern EXACT que CHALLENGE_LIBRARY : un simple global disponible de façon SYNCHRONE
// avant ce script principal, pas de fetch()/await au démarrage (risque déjà vécu une
// fois avec defer/type=module sur les SDK Firebase, voir le commentaire dans <head> —
// ne jamais réintroduire de chargement asynchrone sur le chemin de démarrage).
const SUPPORTED_LOCALES = ['fr', 'en', 'es'];
const LOCALES = { fr: LOCALE_FR, en: LOCALE_EN, es: LOCALE_ES };
const LOCALE_TO_INTL = { fr: 'fr-FR', en: 'en-US', es: 'es-ES' };
// Toujours affiché dans SA PROPRE langue (jamais traduit) : un locuteur anglophone doit
// pouvoir repérer "Français" même si l'app est actuellement en anglais, convention
// standard des sélecteurs de langue (cf. tout menu de langue d'iOS/Android/navigateurs).
const LOCALE_NATIVE_NAME = { fr: 'Français', en: 'English', es: 'Español' };
const PREFERRED_LANGUAGE_KEY = 'preferredLanguage'; // 2e exception documentée à "pas de
  // localStorage dans cette app" (la 1ère est PWA_INSTALL_GATE_BYPASS_KEY) : une
  // préférence propre À CET APPAREIL/CE NAVIGATEUR, pas une donnée de compte — n'a pas
  // sa place dans Firestore, même raisonnement exact que l'exception existante.

/**
 * Détection dans l'ordre exact demandé : préférence déjà enregistrée sur cet appareil
 * > langue du navigateur > repli anglais. `navigator.language` peut être long
 * ("fr-FR", "en-US") : on ne garde que les 2 premiers caractères.
 */
function detectPreferredLanguage() {
  try {
    const stored = localStorage.getItem(PREFERRED_LANGUAGE_KEY);
    if (SUPPORTED_LOCALES.includes(stored)) return stored;
  } catch (e) { /* navigation privée/quota : tant pis, on retombe sur la détection navigateur */ }
  const navLang = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return SUPPORTED_LOCALES.includes(navLang) ? navLang : 'en';
}

let currentLocale = detectPreferredLanguage();
document.documentElement.lang = currentLocale; // pas seulement au changement manuel (setPreferredLanguage) : aussi au tout premier chargement

/**
 * Résout `path` ("today.emptyTitle") dans `obj` en suivant chaque segment séparé par
 * un point. Renvoie `undefined` si un segment intermédiaire n'existe pas (jamais
 * d'exception sur une clé manquante — laisse l'appelant décider du repli).
 */
function getNestedValue(obj, path) {
  return path.split('.').reduce((acc, seg) => (acc == null ? undefined : acc[seg]), obj);
}

// Remplace chaque `{{nom}}` par `params.nom` (chaîne vide si absent) — volontairement
// une simple recherche/remplacement, pas de mini-langage : les besoins de ce projet
// (interpolation de noms/nombres déjà formatés) ne justifient rien de plus complexe.
function interpolate(str, params) {
  if (!params) return str;
  return str.replace(/\{\{(\w+)\}\}/g, (_, name) => (name in params ? params[name] : ''));
}

/**
 * Traduction d'une clé simple. Ordre de repli si la clé manque dans la langue active :
 * français (toujours complet, langue de référence) PUIS la clé brute elle-même (jamais
 * un écran vide/cassé, même pour une clé tout juste ajoutée et pas encore traduite
 * partout).
 */
function t(key, params) {
  const value = getNestedValue(LOCALES[currentLocale], key)
    ?? getNestedValue(LOCALES.fr, key)
    ?? key;
  return typeof value === 'string' ? interpolate(value, params) : value;
}

// Variante pluriel : la valeur au bout de la clé est { one, other } plutôt qu'une
// simple chaîne — sélectionne la bonne forme selon `count` avant d'interpoler.
// Remplace les ternaires `${n} jour${n>1?'s':''}` dupliqués sans helper partagé
// trouvés dans ce fichier avant l'i18n — une seule règle centrale, singulier/pluriel
// suffit pour FR/EN/ES (pas besoin d'une bibliothèque de règles CLDR ici).
function tn(key, count, params) {
  const entry = getNestedValue(LOCALES[currentLocale], key) ?? getNestedValue(LOCALES.fr, key);
  if (!entry || typeof entry !== 'object') return key;
  const form = count === 1 ? entry.one : entry.other;
  return interpolate(form ?? key, { ...params, n: count });
}

/**
 * Change la langue active : persiste sur CET appareil, met à jour l'attribut `lang`
 * du document (accessibilité/moteurs de recherche), puis relance un rendu complet —
 * tous les écrans déjà migrés vers t()/tn() reflètent la nouvelle langue instantanément.
 */
function setPreferredLanguage(code) {
  if (!SUPPORTED_LOCALES.includes(code)) return;
  currentLocale = code;
  try { localStorage.setItem(PREFERRED_LANGUAGE_KEY, code); } catch (e) { /* navigation privee : tant pis, retombera sur la detection navigateur au prochain chargement */ }
  document.documentElement.lang = code;
  // Synchronise vers Firestore (en plus de localStorage, source de verite pour
  // l'UI elle-meme, inchangee) : permet aux Cloud Functions de localiser le
  // texte des notifications push (voir sendPushToUser() dans functions/index.js) -
  // localStorage n'est jamais lisible cote serveur. currentUser peut etre absent
  // si jamais appelee avant connexion (aucun appelant actuel dans ce cas, mais
  // defensif).
  if (currentUser) saveAppField('preferredLanguage', code);
  render();
}

/**
 * Signale un échec d'écriture Firestore — mais SEULEMENT si on est en ligne : hors
 * ligne, Firestore met déjà en file d'attente localement (si la persistance a pu
 * s'activer, voir firestorePersistenceEnabled) et rejoue automatiquement au retour
 * du réseau (voir le bandeau hors ligne) — pas la peine d'alarmer l'utilisateur
 * pour ça. Un échec alors qu'on est EN LIGNE est en revanche une vraie erreur
 * (règles de sécurité, quota, document invalide...) qui serait sinon totalement
 * invisible (jusqu'ici un simple console.error, jamais vu par l'utilisateur).
 */
function reportSaveError(context, err) {
  console.error(context, err);
  if (navigator.onLine) {
    showToast(t('popups.saveError'));
  }
}

/**
 * Lit `users/{uid}/kv/{key}` dans Firestore. Rejette si le document n'existe pas
 * encore (premier lancement) — les appelants doivent catch/fournir une valeur
 * par défaut, jamais supposer que la clé existe déjà.
 */
async function dbGet(key) {
  const doc = await db.collection('users').doc(currentUser.uid).collection('kv').doc(key).get();
  if (!doc.exists) throw new Error('not found: ' + key);
  return { key, value: doc.data().value };
}

/** Écrit (crée ou remplace) `users/{uid}/kv/{key}` dans Firestore. */
async function dbSet(key, value) {
  pendingWriteCount++;
  updateOfflineBanner();
  try {
    await db.collection('users').doc(currentUser.uid).collection('kv').doc(key).set({ value });
    return { key, value };
  } finally {
    pendingWriteCount--;
    updateOfflineBanner();
  }
}

// ==== DOCUMENT CONSOLIDÉ (users/{uid}/kv/appData) ====
// Remplace 12 des anciennes clés "statiques" (profile, customChallenges, stats,
// badges, etc.) par UN SEUL document, pour passer de 12+ lectures Firestore à 1
// seule au démarrage. Les documents par jour (day:{date}, activeToday:{date}),
// eux, restent séparés (historique permanent, voir loadHistoryEntries) : les
// fusionner aurait forcé une double-lecture de format pour toujours, pour un
// gain marginal. Les anciennes clés séparées ne sont JAMAIS supprimées lors de
// la migration (orphelines inoffensives, déjà nettoyées par deleteMyAccount()
// qui vide toute la sous-collection kv sans liste de clés en dur).
function appDataDocRef() {
  return db.collection('users').doc(currentUser.uid).collection('kv').doc('appData');
}

// Regroupe plusieurs saveAppField() consécutifs (ex: une complétion de défi
// écrit stats/lastCompleted/dailyActivity/badges/xpTotal/xpWeeklyData/streakData
// — 7 champs, tous sur le MÊME document) en UN SEUL appel Firestore, au lieu d'un
// aller-retour réseau par champ. Compteur (pas juste un booléen) : autorise les
// appels imbriqués (ex: addSet() qui appelle registerDailyStreak(), qui appelle
// saveStreakData()) sans clôturer le lot prématurément au retour de l'appel
// imbriqué. 100% invisible : même document, même contenu final, même sémantique
// merge:true — seul le NOMBRE d'écritures change, jamais la donnée persistée.
let appDataBatchDepth = 0;
let pendingAppDataFields = null;

function beginAppDataBatch() {
  appDataBatchDepth++;
}

// opts.debounce : voir scheduleWorkoutWriteFlush() plus bas — au lieu d'écrire
// immédiatement, laisse le flush groupé (addSet()/undoLast()) s'en charger un peu
// plus tard, pour fusionner plusieurs actions rapprochées.
async function endAppDataBatch(opts) {
  appDataBatchDepth--;
  if (appDataBatchDepth > 0) return;
  if (opts && opts.debounce) {
    scheduleWorkoutWriteFlush();
    return;
  }
  await flushAppDataBatchNow();
}

async function flushAppDataBatchNow() {
  if (pendingAppDataFields) {
    const fields = pendingAppDataFields;
    pendingAppDataFields = null;
    pendingWriteCount++;
    updateOfflineBanner();
    try {
      await appDataDocRef().set(fields, { merge: true });
    } catch (e) {
      reportSaveError('save batched appData failed', e);
    } finally {
      pendingWriteCount--;
      updateOfflineBanner();
    }
  }
  // syncLeaderboardEntry() (voir plus bas) peut aussi avoir été différée pendant ce
  // lot (ex: appelée depuis awardXp() ET registerDailyStreak() pour un même événement)
  // : appDataBatchDepth est retombé à 0 avant l'appel à cette fonction, donc cet appel
  // prend le chemin d'écriture immédiate normal, une seule fois pour tout le lot.
  if (pendingLeaderboardSync) {
    pendingLeaderboardSync = false;
    await syncLeaderboardEntry();
  }
}

// Debounce partagé pour les actions haute fréquence de journalisation (addSet()/
// undoLast(), potentiellement plusieurs taps rapprochés en quelques secondes) :
// regroupe les 2 écritures réseau (document appData consolidé + day:{date}) de
// plusieurs actions rapprochées en UNE SEULE paire d'écritures, au lieu d'une paire
// par action. La mise à jour LOCALE (stats/state en mémoire, render()) reste
// TOUJOURS immédiate — seul l'aller-retour Firestore est différé de courte durée.
// AUCUNE perte de donnée possible : un flush FORCÉ et IMMÉDIAT se déclenche dès que
// l'utilisateur pourrait quitter — voir les écouteurs plus bas (visibilitychange
// vers "hidden", le signal le plus fiable cross-plateforme y compris PWA mobile,
// avant même qu'un beforeunload — non garanti sur mobile — ait une chance de se
// déclencher ; pagehide en secours). Le pire cas est un flush plus TÔT que prévu,
// jamais plus tard : zéro risque de perte.
const WORKOUT_WRITE_DEBOUNCE_MS = 1500;
let workoutWriteDebounceTimer = null;
let workoutFlushPending = false;

function scheduleWorkoutWriteFlush() {
  workoutFlushPending = true;
  if (workoutWriteDebounceTimer) clearTimeout(workoutWriteDebounceTimer);
  workoutWriteDebounceTimer = setTimeout(() => { flushWorkoutWrites(); }, WORKOUT_WRITE_DEBOUNCE_MS);
}

async function flushWorkoutWrites() {
  if (workoutWriteDebounceTimer) { clearTimeout(workoutWriteDebounceTimer); workoutWriteDebounceTimer = null; }
  if (!workoutFlushPending) return;
  workoutFlushPending = false;
  await flushAppDataBatchNow();
  await saveState();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushWorkoutWrites();
});
window.addEventListener('pagehide', () => { flushWorkoutWrites(); });

/**
 * Écrit UN SEUL champ du document consolidé, via un merge Firestore natif
 * (`{merge:true}`) qui ne touche jamais les autres champs du même document —
 * même si un autre écran écrit un champ différent au même moment (ex: terminer
 * un défi pendant que les Paramètres modifient les poids d'haltères ailleurs).
 * C'est ce qui rend la fusion sûre face aux écritures concurrentes.
 *
 * Si appelée à l'intérieur d'un lot (beginAppDataBatch()/endAppDataBatch()), la
 * valeur est simplement mise en attente — le vrai appel Firestore n'a lieu qu'à
 * la fermeture du lot, fusionnant tous les champs modifiés entre-temps.
 */
async function saveAppField(field, value) {
  if (appDataBatchDepth > 0) {
    if (!pendingAppDataFields) pendingAppDataFields = {};
    pendingAppDataFields[field] = value;
    return;
  }
  pendingWriteCount++;
  updateOfflineBanner();
  try {
    await appDataDocRef().set({ [field]: value }, { merge: true });
  } catch (e) {
    reportSaveError('save ' + field + ' failed', e);
  } finally {
    pendingWriteCount--;
    updateOfflineBanner();
  }
}

/**
 * Point d'entrée unique du chargement au démarrage (et au rechargement manuel) :
 * une seule lecture du document consolidé remplace les 12 lectures séparées
 * d'avant. Migration non destructive : si ce document n'existe pas encore (compte
 * pas migré), relit les 12 anciennes clés séparées — chacune via sa fonction
 * loadX() existante, qui garde sa propre logique de défaut/migration interne
 * (ex: loadChallenges() sait migrer depuis l'encore plus ancienne clé
 * userChallenges) — puis, SEULEMENT si un profil existant a été trouvé (vrai
 * compte pré-migration, pas un tout nouveau compte), écrit le document consolidé
 * une bonne fois pour toutes. Un compte tout neuf n'écrit rien ici : c'est le
 * premier saveProfile() de l'onboarding qui créera le document (via merge:true
 * sur un document inexistant, ce qui le crée simplement).
 */
async function loadAppData() {
  let doc;
  try {
    doc = await appDataDocRef().get();
  } catch (e) {
    doc = null;
  }
  if (doc && doc.exists) {
    const d = doc.data();
    userProfile = d.profile ?? null;
    username = d.username ?? null;
    customChallenges = (d.customChallenges ?? []).map(c => ({ ...c, isCustom: true }));
    manualTargetOverrides = d.manualTargetOverrides ?? {};
    const sd = d.streakData ?? {};
    streakCount = sd.streakCount || 0;
    lastCompletedDate = sd.lastCompletedDate || null;
    hasShield = sd.hasShield !== undefined ? sd.hasShield : true;
    lastShieldResetWeek = sd.lastShieldResetWeek || null;
    xpTotal = d.xpTotal ?? 0;
    const xwd = d.xpWeeklyData ?? {};
    xpWeekly = xwd.xpWeekly || 0;
    xpWeekStart = xwd.xpWeekStart || null;
    leaderboardOptOut = d.leaderboardOptOut ?? false;
    voiceCoachEnabled = d.voiceCoachEnabled ?? true;
    hasSeenTour = d.hasSeenTour ?? false;
    lastCompleted = d.lastCompleted ?? {};
    stats = d.stats ?? {};
    badges = d.badges ?? { totalCompletions: 0, unlocked: [], totalHardcore: 0 };
    if (badges.totalHardcore === undefined) badges.totalHardcore = 0; // migration (comptes créés avant son introduction)
    dailyActivity = d.dailyActivity ?? {};
    weights = d.weights ?? {};
    rebuildChallenges();
    backfillDefaultWeights();
    return;
  }
  // Pas encore de document consolidé : relit les anciennes clés séparées (chaque
  // loadX() garde sa propre gestion de défaut en cas d'échec individuel).
  await Promise.all([
    loadProfile(), loadChallenges(), loadWeights(), loadLastCompleted(), loadStats(),
    loadBadges(), loadDailyActivity(), loadManualTargetOverrides(), loadStreakData(),
    loadXp(), loadXpWeekly(), loadLeaderboardOptOut(), loadVoiceCoachEnabled(), loadHasSeenTour(),
  ]);
  if (userProfile) {
    await appDataDocRef().set({
      profile: userProfile,
      customChallenges,
      manualTargetOverrides,
      streakData: { streakCount, lastCompletedDate, hasShield, lastShieldResetWeek },
      xpTotal,
      xpWeeklyData: { xpWeekly, xpWeekStart },
      leaderboardOptOut,
      voiceCoachEnabled,
      hasSeenTour,
      lastCompleted,
      stats,
      badges,
      dailyActivity,
      weights,
    });
  }
}

async function deleteMyAccount() {
  if (!currentUser) return;

  const step1 = await confirmModal({
    icon: '⚠️',
    title: t('popups.deleteAccount.step1Title'),
    subtitle: t('popups.deleteAccount.step1Subtitle'),
    confirmLabel: t('popups.deleteAccount.step1ConfirmLabel'),
    danger: true,
  });
  if (!step1) return;

  const step2 = await confirmModal({
    icon: '⚠️',
    title: t('popups.deleteAccount.step2Title'),
    subtitle: t('popups.deleteAccount.step2Subtitle'),
    confirmLabel: t('popups.deleteAccount.step2ConfirmLabel'),
    danger: true,
  });
  if (!step2) return;

  try {
    const uid = currentUser.uid;

    // Supprime tous les documents de données de l'utilisateur (kv store)
    const snap = await db.collection('users').doc(uid).collection('kv').get();
    const batch = db.batch();
    snap.forEach(doc => batch.delete(doc.ref));
    // Sans ça, la ligne de classement publique (leaderboard/{uid}) reste orpheline
    // après suppression du compte — le compte recréé obtient un NOUVEL uid Firebase
    // (même s'il s'agit du même compte Google), laissant l'ancienne entrée trainer
    // indéfiniment dans le classement (déjà vécu : 2 lignes "Hector HAAB" visibles
    // après une suppression + recréation de compte).
    batch.delete(db.collection('leaderboard').doc(uid));
    await batch.commit();

    // Tente de supprimer le compte Google Auth lui-même
    try {
      await currentUser.delete();
    } catch (e) {
      if (e.code === 'auth/requires-recent-login') {
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await currentUser.reauthenticateWithPopup(provider);
          await currentUser.delete();
        } catch (e2) {
          console.error('Suppression du compte Auth impossible (données déjà effacées) :', e2);
        }
      } else {
        console.error('Suppression du compte Auth impossible (données déjà effacées) :', e);
      }
    }

    alert(t('popups.deleteAccount.done'));
    await auth.signOut();
  } catch (e) {
    alert(t('popups.deleteAccount.error', { message: e.message }));
  }
}

// Enregistrement du service worker (mode PWA hors-ligne pour l'interface) + détection
// d'une nouvelle version disponible : le SW existant fait déjà skipWaiting()/clients.claim()
// automatiquement, mais la PAGE déjà chargée (HTML/JS déjà parsés) ne récupère le
// nouveau code qu'après un rechargement — d'où ce bandeau pour le proposer explicitement
// plutôt que de laisser l'utilisateur sans aucun signal qu'une mise à jour existe.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').then((registration) => {
      registration.addEventListener('updatefound', () => {
        const newWorker = registration.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          // "installed" + un controller déjà actif = vraie mise à jour (pas la 1ère
          // installation, où il n'y a pas encore de controller).
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            const banner = document.getElementById('updateBanner');
            if (banner) banner.style.display = 'flex';
          }
        });
      });
      // Une PWA "ajoutée à l'écran d'accueil" reste parfois ouverte des jours entiers
      // sans jamais refaire de vraie navigation complète — le seul déclencheur naturel
      // de la vérification de mise à jour du navigateur. On force donc une vérification
      // à chaque fois que l'appli redevient visible (retour au premier plan) plutôt que
      // de dépendre uniquement de l'heuristique interne du navigateur, pour repérer une
      // nouvelle version plus vite sur un appareil resté ouvert longtemps.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') registration.update().catch(() => {});
      });
    }).catch(() => {});
  });
}

// Nombre d'écritures Firestore en cours (dbSet/saveAppField), incrémenté avant et
// décrémenté après chaque appel. Ne sert QUE hors ligne (voir updateOfflineBanner) :
// en ligne, ces écritures se résolvent trop vite (persistance locale Firestore) pour
// qu'un indicateur séparé apporte quoi que ce soit — il ne ferait que clignoter à
// chaque validation de défi (plusieurs écritures séquentielles par addSet()).
let pendingWriteCount = 0;

// Bandeau hors-ligne : aucun appel réseau supplémentaire, juste un retour visuel clair
// (jusqu'ici totalement silencieux) quand la connexion tombe, et sa disparition dès
// qu'elle revient. Précise désormais, hors ligne, si des modifications sont en
// attente de synchronisation (pendingWriteCount) — Firestore les rejoue déjà
// automatiquement au retour du réseau (enablePersistence), ceci ne fait qu'en
// informer l'utilisateur.
function updateOfflineBanner() {
  const banner = document.getElementById('offlineBanner');
  if (!banner) return;
  if (navigator.onLine) {
    banner.style.display = 'none';
    return;
  }
  banner.style.display = 'flex';
  banner.textContent = pendingWriteCount > 0
    ? tn('popups.offlineBanner.pending', pendingWriteCount)
    : t('popups.offlineBanner.idle');
}
window.addEventListener('online', updateOfflineBanner);
window.addEventListener('offline', updateOfflineBanner);
updateOfflineBanner();

// ==== PWA : VERROU D'INSTALLATION PLEIN ÉCRAN ("PWA First" strict) ====
// Stratégie voulue : l'installation sur l'écran d'accueil est un préalable
// OBLIGATOIRE, avant même l'écran de connexion — onboarding/création de compte/tour
// guidé n'ont lieu que dans la version installée (standalone). Tant que l'app tourne
// dans un navigateur classique, ce verrou plein écran (z-index au-dessus de tout,
// y compris #loginScreen/#app) bloque visuellement ET par interception des clics
// tout le reste — aucune tentative de "pauser" la logique d'auth en dessous (inutile :
// l'utilisateur ne peut de toute façon rien voir ni cliquer derrière ce recouvrement).
// S'applique à TOUT visiteur non-standalone, y compris un compte déjà existant qui
// rouvrirait le site depuis un onglet/favori classique (décision produit assumée).
//
// Remplace l'ancienne bannière douce (ancrée au-dessus de la tab-bar, fermable,
// affichée seulement après le tour guidé) : avec ce verrou strict AVANT même l'écran
// de connexion, un utilisateur non-standalone n'atteint plus jamais l'état où
// l'ancienne bannière aurait pu s'afficher (hasSeenTour ne peut être vrai qu'après
// être passé par la version installée) — code devenu mort, remplacé plutôt que
// dupliqué.
const PWA_INSTALL_GATE_BYPASS_KEY = 'pwaInstallGateBypassed';
let deferredInstallPrompt = null;

function isRunningStandalonePwa() {
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}

// iPadOS 13+ se déclare "Macintosh" dans le user-agent (mode bureau par défaut) :
// détecté via le support tactile multipoint, absent des vrais Mac.
function isIosDevice() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

// Desktop = ni iOS ni Android (pas un vrai téléphone/tablette mobile) : sert
// uniquement à proposer une échappatoire de DEBOGAGE très discrète (voir plus bas),
// jamais montrée sur un vrai appareil mobile.
function isDesktopDevice() {
  return !isIosDevice() && !/Android/i.test(navigator.userAgent);
}

// Échappatoire volontaire (validée explicitement, pas une demande initiale) pour les
// navigateurs qui ne pourront JAMAIS proposer d'installation PWA réelle (desktop,
// Firefox mobile, navigateur intégré d'une app tierce type Instagram/TikTok) : sans
// ça, ces visiteurs resteraient bloqués sans aucune issue. Mémorisée par appareil/
// navigateur (localStorage, comme la fermeture de l'ancienne bannière) — pas une
// donnée de compte à synchroniser via Firestore.
function isPwaInstallGateBypassed() {
  try { return localStorage.getItem(PWA_INSTALL_GATE_BYPASS_KEY) === 'true'; }
  catch (e) { return false; }
}
function bypassPwaInstallGate() {
  try { localStorage.setItem(PWA_INSTALL_GATE_BYPASS_KEY, 'true'); } catch (e) { /* navigation privee : tant pis, rebloquera au prochain chargement */ }
  hidePwaInstallGate();
}

function hidePwaInstallGate() {
  const gate = document.getElementById('pwaInstallGate');
  if (gate) gate.style.display = 'none';
}

// Déclenché par le bouton Android ("Installer en 1 clic") : relance le prompt natif
// déjà intercepté/différé par beforeinstallprompt ci-dessous. Contrairement à
// l'ancienne bannière, ne referme JAMAIS le verrou après coup — l'utilisateur est
// encore dans l'onglet navigateur, pas dans l'app installée : on affiche plutôt un
// message de succès invitant à l'ouvrir depuis l'écran d'accueil.
async function triggerPwaInstallFromGate() {
  if (!deferredInstallPrompt) return;
  const promptEvent = deferredInstallPrompt;
  deferredInstallPrompt = null;
  promptEvent.prompt();
  let outcome = null;
  try { outcome = (await promptEvent.userChoice).outcome; } catch (e) { /* ignore */ }
  if (outcome === 'accepted') {
    renderPwaInstallGate('installed');
  } else {
    // Refusé : relaisse une chance d'essayer à nouveau (pas de beforeinstallprompt
    // à rejouer nous-mêmes, mais deferredInstallPrompt reste null jusqu'à ce que le
    // navigateur en émette un nouveau — repli sur le générique en attendant).
    updatePwaInstallGate();
  }
}

function buildPwaInstallGateHtml(platform) {
  const header = `
    <img src="icon-192.png" class="gate-logo-img" alt="Défi du Jour">
    <h1 class="gate-title">${t('pwaGate.title')}</h1>
    <p class="gate-subtitle">${t('pwaGate.subtitle')}</p>
  `;
  if (platform === 'ios') {
    return header + `
      <div class="gate-steps">
        <div class="gate-step"><span class="gate-step-num">1</span><span class="gate-step-icon">📤</span><span class="gate-step-text">${t('pwaGate.iosStep1')}</span></div>
        <div class="gate-step"><span class="gate-step-num">2</span><span class="gate-step-icon">➕</span><span class="gate-step-text">${t('pwaGate.iosStep2')}</span></div>
        <div class="gate-step"><span class="gate-step-num">3</span><span class="gate-step-icon">🚀</span><span class="gate-step-text">${t('pwaGate.iosStep3')}</span></div>
      </div>
      <div class="gate-arrow">⌄</div>
    `;
  }
  if (platform === 'android') {
    return header + `<button class="gate-install-btn" onclick="triggerPwaInstallFromGate()">${t('pwaGate.androidInstallBtn')}</button>`;
  }
  if (platform === 'installed') {
    return header + `<div class="gate-success">${t('pwaGate.installedMessage')}</div>`;
  }
  if (platform === 'desktop') {
    // Echappatoire de DEBOGAGE très discrète (petit lien en coin, pas un vrai bouton) :
    // sert uniquement au développement/debug depuis un ordinateur, jamais montrée sur
    // un vrai appareil mobile (voir isDesktopDevice()).
    return header + `
      <p class="gate-fallback-text">${t('pwaGate.desktopFallbackText')}</p>
      <button class="gate-debug-bypass-btn" onclick="bypassPwaInstallGate()">${t('pwaGate.continueAnyway')}</button>
    `;
  }
  // Repli : navigateur mobile qui ne proposera jamais d'installation PWA réelle
  // (Firefox mobile, navigateur intégré d'une app tierce) — jamais de fausse
  // instruction, et une échappatoire pour ne pas bloquer sans issue.
  return header + `
    <p class="gate-fallback-text">${t('pwaGate.genericFallbackText')}</p>
    <button class="gate-bypass-btn" onclick="bypassPwaInstallGate()">${t('pwaGate.continueAnyway')}</button>
  `;
}

function renderPwaInstallGate(platform) {
  const gate = document.getElementById('pwaInstallGate');
  if (!gate) return;
  gate.innerHTML = buildPwaInstallGateHtml(platform);
  gate.style.display = 'flex';
}

// Point d'entrée : appelé une fois tout au démarrage du script, puis à chaque
// réception tardive de beforeinstallprompt/appinstalled (le navigateur peut les
// déclencher après coup, selon ses propres heuristiques d'engagement) — idempotent.
function updatePwaInstallGate() {
  if (isRunningStandalonePwa() || isPwaInstallGateBypassed()) {
    hidePwaInstallGate();
    return;
  }
  if (isIosDevice()) {
    renderPwaInstallGate('ios');
  } else if (isDesktopDevice()) {
    // Priorité au repli desktop (échappatoire de débogage) même si beforeinstallprompt
    // est disponible (Chrome desktop le supporte aussi) : ce message "installe sur
    // mobile" n'a de sens que sur ordinateur, jamais sur un vrai appareil mobile.
    renderPwaInstallGate('desktop');
  } else if (deferredInstallPrompt) {
    renderPwaInstallGate('android');
  } else {
    renderPwaInstallGate('fallback');
  }
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  updatePwaInstallGate();
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  renderPwaInstallGate('installed');
});
updatePwaInstallGate();

// CHALLENGE_LIBRARY vit désormais dans exercise-data.js (script classique chargé
// avant celui-ci, voir <head>) — reste un global, aucun changement d'usage ici.

// ==== MOTEUR DE PERSONNALISATION (coach virtuel) ====
// Objectif Final = Objectif Standard × Coef(Niveau) × Coef(Âge) × Coef(Sexe) × Coef(IMC)
// Poids Final    = Poids Standard    × Coef(Niveau) × Coef(Âge) × Coef(Sexe, haltères)
//
// Les "Objectifs Standards" ci-dessus (target/hardcoreTarget/standardWeightKg) sont calibrés
// pour un homme de 30 ans, niveau intermédiaire, IMC normal — volontairement exigeants.
// Sources de calibration (normes ACSM/CSEP pompes) : écart hommes/femmes ~2x en max sur
// un set, écart d'environ -10 à -15% par décennie après 40 ans.

const COEF_LEVEL = {
  debutant: 0.6,      // remise en forme
  intermediaire: 1.0, // 2 séances de sport / semaine (référence)
  avance: 1.2,         // 3+ séances de sport / semaine
};

function getAgeCoef(age) {
  if (age < 30) return 1.0;
  if (age < 40) return 1.0;   // tranche de référence (30 ans)
  if (age < 50) return 0.88;
  if (age < 60) return 0.75;
  if (age < 70) return 0.60;
  return 0.45;
}

function getBmi(heightCm, weightKg) {
  if (!heightCm || !weightKg) return 22; // valeur neutre par défaut
  const heightM = heightCm / 100;
  return weightKg / (heightM * heightM);
}

// Coefficient IMC "brut" (avant pondération par l'impact spécifique à l'exercice)
function getBmiCoefRaw(bmi) {
  if (bmi < 18.5) return 0.9;   // maigreur : masse musculaire souvent moindre
  if (bmi < 25)   return 1.0;   // corpulence normale (référence)
  if (bmi < 30)   return 0.90;  // surpoids : souvent en partie musculaire chez les pratiquants réguliers, malus modéré
  return 0.70;                  // obésité : impact plus marqué sur les mouvements au poids du corps
}

// Coefficient sexe appliqué aux répétitions/secondes, dépend de la catégorie du défi
function getSexRepsCoef(sex, cat) {
  if (sex !== 'femme') return 1.0;
  if (cat === 'Haut du corps') return 0.65; // écart le plus marqué, cohérent avec les normes ACSM pompes
  return 1.0; // Gainage/Core et Bas du corps : pas de malus (endurance/mobilité comparables)
}

// Coefficient sexe appliqué au poids d'haltère suggéré (mouvements du haut du corps)
function getSexWeightCoef(sex) {
  if (sex === 'femme') return 0.6;
  if (sex === 'autre') return 0.8; // valeur neutre intermédiaire
  return 1.0;
}

/**
 * Objectif standard personnalisé pour un défi, dérivé du profil coach (âge/sexe/
 * IMC/niveau). Sans profil, retombe sur `c.target` (valeur fixe de la bibliothèque).
 * Calibré pour qu'un profil de référence (homme 32 ans intermédiaire IMC~26)
 * redonne ~les anciens objectifs fixes — ne jamais coder un nouveau coefficient
 * en dur ailleurs que dans les fonctions `get*Coef`.
 */
function computeStandardTarget(c, profile) {
  if (!profile) return c.target;
  const levelCoef = COEF_LEVEL[profile.level] ?? 1;
  const ageCoef = getAgeCoef(profile.age);
  const bmi = getBmi(profile.heightCm, profile.weightKg);
  const bmiRaw = getBmiCoefRaw(bmi);
  const impact = c.bmiImpact ?? 0;
  const bmiEffective = 1 + (bmiRaw - 1) * impact; // pondère l'effet IMC selon l'exercice
  const sexCoef = getSexRepsCoef(profile.sex, c.cat);
  const raw = c.target * levelCoef * ageCoef * sexCoef * bmiEffective;
  const stepped = Math.round(raw / 5) * 5;
  return Math.max(c.unit === 'sec' ? 15 : 10, stepped);
}

/**
 * Poids d'haltère standard personnalisé (kg), uniquement pour les défis de
 * catégorie "Haltères" avec `standardWeightKg`. Retourne `null` pour tout défi
 * qui n'utilise pas d'haltère (rien à afficher côté formulaire/fiche).
 */
function computeStandardWeight(c, profile) {
  if (c.cat !== 'Haltères' || !c.standardWeightKg) return null;
  if (!profile) return Math.round(c.standardWeightKg);
  const levelCoef = COEF_LEVEL[profile.level] ?? 1;
  const ageCoef = getAgeCoef(profile.age);
  const sexCoef = getSexWeightCoef(profile.sex);
  const raw = c.standardWeightKg * levelCoef * ageCoef * sexCoef;
  return Math.max(1, Math.round(raw)); // toujours un nombre entier de kg
}

let libraryOpenCats = new Set(); // catégories actuellement dépliées dans l'accordéon Bibliothèque

// Catégorie qui vient d'être dépliée (une seule frame) : sert à limiter l'entrée en

  CHALLENGES = [...CHALLENGE_LIBRARY, ...customChallenges];

let userProfile = null; // { age, sex, heightCm, weightKg, level }

// ==== PSEUDO PUBLIC (obligatoire) ====
// Identifiant public choisi à la création du compte (jamais optionnel), qui permet à
// un ami de vous retrouver par recherche exacte SANS jamais exposer le vrai nom
// (contrairement à formatDisplayName() qui anonymise le nom réel, le pseudo, lui, est
// volontairement choisi pour être partagé). usernameSetupMode distingue 3 contextes
// d'affichage du même écran renderUsernameSetupScreen() : 'onboarding' (nouveau compte,

// (déclenché depuis Paramètres, dismissible via le bouton retour, contrairement aux 2
// premiers qui sont volontairement infranchissables).
let username = null;
let usernameSetupMode = null; // null | 'onboarding' | 'gate' | 'rename'
let usernameDraft = '';
let usernameAvailability = null; // null | 'checking' | 'available' | 'taken'
let usernameCheckSeq = 0;
let usernameCheckTimer = null;

// Écran de transition juste après l'onboarding profil : null (aucun),
// 'loading' (calcul en cours) ou 'confirm' (message + bouton de lancement).
let onboardingTransitionPhase = null;

// Mini-tour guidé (première connexion uniquement) : null = pas de tour actif,
// sinon index courant dans GUIDED_TOUR_STEPS. hasSeenTour est persisté côté
// Firestore (pas de localStorage/sessionStorage dans cette app, cf. CLAUDE.md).
let guidedTourStep = null;
let hasSeenTour = false;
// Étape 0 = carte de bienvenue neutre (fond assombri/flouté, cf. isIntro dans
// renderGuidedTourOverlay) ; étapes suivantes = présentation des onglets, sur un
// overlay léger/transparent pour laisser l'interface bien visible en arrière-plan.
// title/text vivent dans locale-*.js (t('tour.' + key + '.title'/'text')), resolus au
// RENDU (renderGuidedTourOverlay()) plutot que fige ici a l'evaluation de ce tableau —
// necessaire pour reagir a un changement de langue en cours de session. emoji reste ici
// (decoratif, langue-agnostique).
// Plus d'etape dediee au Journal (fusionne en sous-onglet de Profil, voir
// profileView) - la carte "account" mentionne desormais le Journal au passage.
const GUIDED_TOUR_STEPS = [
  { tab: 'today', key: 'welcome', emoji: '👋' },
  { tab: 'today', key: 'today', emoji: "🏋️‍♂️" },
  { tab: 'library', key: 'library', emoji: '🎯' },
  { tab: 'account', key: 'account', emoji: '👤' },
];

async function loadHasSeenTour() {
  try {
    const res = await dbGet('hasSeenTour');
    hasSeenTour = res.value === 'true';
  } catch (e) {
    hasSeenTour = false;
  }
}
async function markTourSeen() {
  hasSeenTour = true;
  await saveAppField('hasSeenTour', true);
}

function startGuidedTour() {
  guidedTourStep = 0;
  activeTab = GUIDED_TOUR_STEPS[0].tab;
  render(true);
}

function guidedTourNext() {
  if (guidedTourStep === null) return;
  const next = guidedTourStep + 1;
  if (next >= GUIDED_TOUR_STEPS.length) {
    endGuidedTour();
    return;
  }
  guidedTourStep = next;
  const nextTab = GUIDED_TOUR_STEPS[next].tab;
  if (nextTab === activeTab) {
    // même onglet que l'étape précédente (ex: bienvenue -> Aujourd'hui) : switchTab()
    // ne re-rendrait pas dans ce cas (son garde-fou `if (tab === activeTab) return;`)
    render(true);
  } else {
    switchTab(nextTab); // switchTab() se charge déjà de re-rendre
  }
}

async function endGuidedTour() {
  guidedTourStep = null;
  await markTourSeen();
  if (activeTab !== 'today') switchTab('today');
  else render(true);
}

function renderGuidedTourOverlay() {
  if (guidedTourStep === null) return '';
  const step = GUIDED_TOUR_STEPS[guidedTourStep];
  const isLast = guidedTourStep === GUIDED_TOUR_STEPS.length - 1;
  const isIntro = guidedTourStep === 0; // seule la 1ere carte assombrit/floute l'arriere-plan
  return `
    <div class="tour-overlay${isIntro ? ' intro' : ''}">
      <div class="tour-bubble">
        <div class="tour-bubble-title">${step.emoji} ${t('tour.' + step.key + '.title')}</div>
        <div class="tour-bubble-text">${t('tour.' + step.key + '.text')}</div>
        <div class="tour-bubble-footer">
          <div class="tour-dots">
            ${GUIDED_TOUR_STEPS.map((_, i) => `<span class="tour-dot${i === guidedTourStep ? ' active' : ''}"></span>`).join('')}
          </div>
          <button class="tour-next-btn" onclick="guidedTourNext()">${isLast ? t('tour.finishBtn') : t('tour.nextBtn')}</button>
        </div>
      </div>
    </div>
  `;
}

async function finishOnboardingTransition() {
  onboardingTransitionPhase = null;
  // hasSeenTour est déjà à jour en mémoire (chargé par loadAppData() au démarrage,
  // avant que cet écran ne soit atteignable) — plus besoin de le relire ici depuis
  // Firestore. Important depuis la fusion des documents (#28) : l'ancienne clé
  // séparée 'hasSeenTour' n'est plus jamais mise à jour après migration (markTourSeen()
  // écrit désormais dans le document consolidé), donc la relire ici la trouverait
  // périmée pour un compte déjà migré ayant déjà terminé le tour.
  if (!hasSeenTour) {
    startGuidedTour();
  } else {
    render(true);
  }
}

      <div class="profile-onboarding onboarding-screen">

  // "EXEMPLE D'OBJECTIF GÉNÉRÉ" + la note de bas d'écran rendent explicite que "Pompes"
  // n'est qu'un des défis calculés, pas le seul (sans ça l'utilisateur pouvait croire que

        <div class="preview-container">
          <div class="preview-header-tag">${t('onboarding.transition.exampleTag')}</div>
          <div class="preview-card">
            <div class="preview-title">
              <span>🎯</span>
              <div class="exercise-info">
                <span class="exercise-name">${escapeHtml(challengeDisplayName(previewChallenge))}</span>
                <span class="exercise-sub">${t('onboarding.transition.exerciseSub')}</span>
              </div>
            </div>
            <div class="preview-badge">${previewTarget} ${t('exercise.unitRepsLabel').toUpperCase()}</div>
          </div>

/**
 * Charge le profil coach (`userProfile`). Retourne `false` (profil absent) pour
 * distinguer un compte jamais onboardé — l'appelant doit alors déclencher
 * l'écran d'onboarding plutôt que d'utiliser un profil `null`.
 */
async function loadProfile() {
  try {
    const res = await dbGet('profile');
    userProfile = JSON.parse(res.value);
    return true;
  } catch (e) {
    userProfile = null;
    return false;
  }
}

async function saveProfile() {
  await saveAppField('profile', userProfile);
}

function getNextChallengeId() {
  return Math.max(0, ...CHALLENGE_LIBRARY.map(c => c.id), ...CHALLENGES.map(c => c.id)) + 1;
}

// ==== ONBOARDING PROFIL (coach virtuel) ====
const PROFILE_STEPS_COUNT = 4;

// ==== ROULEAUX DE SÉLECTION (wheel pickers) — âge/taille/poids ====
// Remplacent les <input type="number"> pour éviter d'ouvrir le clavier virtuel.
// Défilement natif (scroll-snap CSS) ; aucune logique de drag en JS. La valeur
// sélectionnée se déduit simplement du scrollTop courant (pas de suivi d'état
// séparé à synchroniser) : robuste, y compris pendant l'inertie du scroll.
const WHEEL_ITEM_HEIGHT = 44;

function renderWheelPicker(id, min, max, step, suffix) {
  let items = '';
  for (let v = min; v <= max; v += step) {
    items += `<div class="wheel-picker-item">${v}${suffix ? ' ' + suffix : ''}</div>`;
  }
  return `
    <div class="wheel-picker" id="${id}" data-min="${min}" data-max="${max}" data-step="${step}" data-item-height="${WHEEL_ITEM_HEIGHT}"
         onscroll="onWheelPickerScroll('${id}')">
      <div class="wheel-picker-highlight"></div>
      <div class="wheel-picker-track">${items}</div>
    </div>
  `;
}

// Index (borné) de l'item actuellement centré, déduit du seul scrollTop — logique
// pure, réutilisée par la lecture de valeur ET par la mise en valeur visuelle.
function computeWheelPickerActiveIndex(id) {
  const el = document.getElementById(id);
  if (!el) return -1;
  const itemHeight = parseInt(el.dataset.itemHeight, 10);
  const min = parseInt(el.dataset.min, 10);
  const max = parseInt(el.dataset.max, 10);
  const step = parseInt(el.dataset.step, 10);
  const maxIndex = Math.round((max - min) / step);
  const rawIndex = Math.round(el.scrollTop / itemHeight);
  return Math.max(0, Math.min(maxIndex, rawIndex)); // tolère un léger rebond élastique (overscroll iOS)
}

function getWheelPickerValue(id) {
  const el = document.getElementById(id);
  if (!el) return NaN;
  const min = parseInt(el.dataset.min, 10);
  const step = parseInt(el.dataset.step, 10);
  const index = computeWheelPickerActiveIndex(id);
  return min + index * step;
}

// Met en valeur (gras, plus grand, vert néon) le chiffre actuellement centré dans
// le cadre de sélection, en ne touchant QUE la classe de l'item concerné (jamais
// l'innerHTML du picker, ce qui réinitialiserait le scroll en cours).
function updateWheelPickerActiveItem(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const index = computeWheelPickerActiveIndex(id);
  const items = el.querySelectorAll('.wheel-picker-item');
  items.forEach((item, i) => item.classList.toggle('active', i === index));
}

// Retour haptique discret à chaque cran franchi pendant la rotation du rouleau.
// Ne lit QUE le scrollTop (aucune manipulation de l'innerHTML/re-render du picker)
// pour ne jamais interférer avec le scroll natif en cours.
const wheelPickerLastValue = {};
// Associe chaque id de roulette au champ profileDraft correspondant : voir plus bas,
// pourquoi il faut y écrire en direct pendant le défilement.
const WHEEL_PICKER_PROFILE_FIELD = { pfAge: 'age', pfHeight: 'heightCm', pfWeight: 'weightKg' };
function onWheelPickerScroll(id) {
  const value = getWheelPickerValue(id);
  if (wheelPickerLastValue[id] !== value) {
    wheelPickerLastValue[id] = value;
    if (navigator.vibrate) navigator.vibrate(10);
  }
  updateWheelPickerActiveItem(id);
  // Persiste la valeur en direct (pas seulement au clic sur "Suivant", cf. profileNext()) :
  // initWheelPickers() (appelée en afterRender à CHAQUE re-render de l'écran d'onboarding,
  // y compris un re-render déclenché par autre chose que ce picker) repositionne les
  // roulettes depuis profileDraft, avec un repli par défaut (175cm/75kg) tant que ce champ
  // est encore `null`. Sans cette écriture immédiate, un re-render survenant pendant que
  // l'utilisateur défile encore (ex: un pull-to-refresh déclenché par erreur, cf. initPullToRefresh)
  // écraserait silencieusement son choix en cours avec cette valeur par défaut.
  const field = WHEEL_PICKER_PROFILE_FIELD[id];
  if (field) profileDraft[field] = value;
}

function setWheelPickerValue(id, value) {
  const el = document.getElementById(id);
  if (!el) return;
  const itemHeight = parseInt(el.dataset.itemHeight, 10);
  const min = parseInt(el.dataset.min, 10);
  const step = parseInt(el.dataset.step, 10);
  const index = Math.round((value - min) / step);
  el.scrollTop = index * itemHeight;
  updateWheelPickerActiveItem(id);
}

// Positionne les rouleaux visibles sur l'étape courante à leur valeur actuelle
// (celle du brouillon de profil, ou une valeur par défaut raisonnable). Appelé
// en afterRender juste après le rendu de l'écran d'onboarding.
function initWheelPickers() {
  setWheelPickerValue('pfAge', profileDraft.age ?? 30);
  setWheelPickerValue('pfHeight', profileDraft.heightCm ?? 175);
  setWheelPickerValue('pfWeight', profileDraft.weightKg ?? 75);
}

function selectProfileSex(sex) {
  profileDraft.sex = sex;
  if (navigator.vibrate) navigator.vibrate(10);
  render();
  setTimeout(() => profileNext(), 250);
}

function selectProfileLevel(level) {
  profileDraft.level = level;
  if (navigator.vibrate) navigator.vibrate(10);
  render();
  setTimeout(() => profileNext(), 250);
}

function profileNext() {
  if (profileStep === 0) {
    // Écran de bienvenue : rien à valider, on passe simplement à la suite
  } else if (profileStep === 1) {
    const val = getWheelPickerValue('pfAge');
    if (isNaN(val) || val < 12 || val > 100) {
      alert(t('popups.onboardingValidation.age'));
      return;
    }
    profileDraft.age = val;
  } else if (profileStep === 2) {
    if (!profileDraft.sex) {
      alert(t('popups.onboardingValidation.sex'));
      return;
    }
  } else if (profileStep === 3) {
    const h = getWheelPickerValue('pfHeight');
    const w = getWheelPickerValue('pfWeight');
    if (isNaN(h) || h < 100 || h > 250) {
      alert(t('popups.onboardingValidation.height'));
      return;
    }
    if (isNaN(w) || w < 30 || w > 300) {
      alert(t('popups.onboardingValidation.weight'));
      return;
    }
    profileDraft.heightCm = h;
    profileDraft.weightKg = w;
  } else if (profileStep === 4) {
    if (!profileDraft.level) {
      alert(t('popups.onboardingValidation.level'));
      return;
    }
    finishProfileOnboarding();
    return;
  }
  profileStep++;
  render(true);
}

function profilePrev() {
  if (profileStep > 0) {
    profileStep--;
    render(true);
  }
}

async function finishProfileOnboarding() {
  userProfile = { ...profileDraft };
  await saveProfile();
  showProfileOnboarding = false;
  // Pseudo obligatoire : un nouveau compte doit le choisir avant de continuer
  // (renderUsernameSetupScreen() enchaînera lui-même sur beginOnboardingTransition()
  // une fois le pseudo validé, voir finishUsernameSetup()).
  if (!username) {
    usernameSetupMode = 'onboarding';
    render(true);
    return;
  }
  await beginOnboardingTransition();
}

/**
 * Suite commune de finishProfileOnboarding() une fois le profil ET le pseudo prêts —
 * factorisée pour être réutilisable depuis finishUsernameSetup() (mode 'onboarding'),
 * qui reprend exactement ici après le choix du pseudo.
 */
async function beginOnboardingTransition() {
  onboardingTransitionPhase = 'loading';
  render(true);
  // Délai minimum pour que l'écran de chargement ne clignote pas si les
  // données se chargent très vite ; en parallèle du vrai chargement.
  const minDelay = new Promise(r => setTimeout(r, 1600));
  await Promise.all([proceedAfterProfile(), minDelay]);
  onboardingTransitionPhase = 'confirm';
  render(true);
}

// ==== PSEUDO PUBLIC : recherche/réservation ====
function usernamesCollRef() {
  return db.collection('usernames');
}

// Autorise uniquement [a-z0-9_], 3-20 caractères : évite accents/emoji/homoglyphes
// (garde une recherche exacte triviale et sans ambiguïté visuelle), sanitize à la
// frappe plutôt que d'afficher une erreur de format (aucun caractère invalide ne peut
// même être tapé).
function sanitizeUsernameInput(raw) {
  return String(raw ?? '').toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 20);
}

/**
 * Appelée à chaque frappe (oninput) : sanitize + relance une vérification de
 * disponibilité debattue (400ms). `usernameCheckSeq` évite qu'une vérification
 * périmée (déclenchée par une frappe précédente, réseau plus lent) n'écrase le
 * résultat d'une vérification plus récente.
 */
function updateUsernameDraft(value) {
  usernameDraft = sanitizeUsernameInput(value);
  usernameAvailability = null;
  render();
  if (usernameCheckTimer) clearTimeout(usernameCheckTimer);
  const mySeq = ++usernameCheckSeq;
  if (usernameDraft.length < 3) return; // trop court, pas la peine d'interroger Firestore
  usernameCheckTimer = setTimeout(() => checkUsernameAvailability(usernameDraft, mySeq), 400);
}

async function checkUsernameAvailability(candidate, seq) {
  usernameAvailability = 'checking';
  render();
  try {
    const doc = await usernamesCollRef().doc(candidate).get();
    if (seq !== usernameCheckSeq) return; // une frappe plus recente a deja lance une autre verif
    usernameAvailability = doc.exists ? 'taken' : 'available';
  } catch (e) {
    if (seq !== usernameCheckSeq) return;
    usernameAvailability = null;
    reportSaveError('username availability check failed', e);
  }
  render();
}

// Ouvre l'écran de renommage depuis Paramètres — seul contexte dismissible (voir
// goBackOneLevel()).
function openUsernameRename() {
  usernameSetupMode = 'rename';
  usernameDraft = '';
  usernameAvailability = null;
  pushNavState();
  render(true);
}

/**
 * Valide le pseudo choisi (3 contextes possibles, voir usernameSetupMode) : réserve
 * le nouveau pseudo (`usernames/{lower}`), libère l'ancien s'il y en avait un
 * (renommage), persiste `username` sur le profil, puis enchaîne selon le contexte
 * d'origine :
 * - 'onboarding' (nouveau compte) -> reprend exactement la suite de
 *   finishProfileOnboarding() via beginOnboardingTransition().
 * - 'gate' (compte existant sans pseudo) -> reprend exactement la suite de
 *   startApp() via proceedAfterProfile().
 * - 'rename' (Paramètres) -> ferme simplement l'écran, retour à Paramètres.
 */
async function finishUsernameSetup() {
  if (usernameAvailability !== 'available') return;
  const newUsername = usernameDraft;
  const previousUsername = username;
  const mode = usernameSetupMode;
  try {
    await usernamesCollRef().doc(newUsername).set({ uid: currentUser.uid });
  } catch (e) {
    // Quelqu'un d'autre a pu prendre ce pseudo entre la vérification et la validation
    // (fenêtre de course assumée, comme ailleurs dans ce projet) : les règles Firestore
    // rejettent alors l'écriture, on retombe proprement sur l'état "déjà pris".
    reportSaveError('claim username failed', e);
    usernameAvailability = 'taken';
    render();
    return;
  }
  if (previousUsername && previousUsername !== newUsername) {
    try { await usernamesCollRef().doc(previousUsername).delete(); }
    catch (e) { reportSaveError('release old username failed', e); }
  }
  username = newUsername;
  await saveAppField('username', username);
  usernameSetupMode = null;
  usernameDraft = '';
  usernameAvailability = null;
  if (mode === 'onboarding') {
    await beginOnboardingTransition();
  } else if (mode === 'gate') {
    // Pas de render(true) intermédiaire ici : proceedAfterProfile() -> continueStartApp()
    // se termine déjà par son propre render() (immédiat) une fois les données chargées —
    // un render(true) ici programmerait un repaint DIFFÉRÉ (140ms, cf. applyContent())
    // qui écraserait ensuite ce render immédiat avec le contenu périmé du verrou.
    await proceedAfterProfile();
  } else {
    render(true); // 'rename' : retour à Paramètres, rien d'autre ne se produit après
  }
}

function renderUsernameSetupScreen() {
  const isRename = usernameSetupMode === 'rename';
  const title = isRename ? t('username.renameTitle') : t('username.chooseTitle');
  const subtitle = isRename ? t('username.renameSubtitle') : t('username.chooseSubtitle');
  const backBtn = isRename
    ? `<button class="nav-back-btn floating" onclick="history.back()" aria-label="${t('common.back')}">‹</button>`
    : '';
  let statusHtml = '';
  if (usernameDraft.length > 0 && usernameDraft.length < 3) {
    const remaining = 3 - usernameDraft.length;
    statusHtml = `<div class="username-availability">${tn('username.remainingChars', remaining)}</div>`;
  } else if (usernameAvailability === 'checking') {
    statusHtml = `<div class="username-availability">${t('username.checking')}</div>`;
  } else if (usernameAvailability === 'available') {
    statusHtml = `<div class="username-availability available">${t('username.available')}</div>`;
  } else if (usernameAvailability === 'taken') {
    statusHtml = `<div class="username-availability taken">${t('username.taken')}</div>`;
  }
  return `
    ${backBtn}
    <div class="profile-onboarding onboarding-screen">
      <div class="onboarding-content">
        <div class="pf-welcome-badge">🏷️</div>
        <h1 class="pf-welcome-title">${title}</h1>
        <p class="pf-welcome-desc pf-welcome-desc-short">${subtitle}</p>
        <div class="form-field">
          <div class="username-input-row">
            <span class="username-at">@</span>
            <input type="text" id="usernameSetupInput" value="${escapeHtml(usernameDraft)}"
                   oninput="updateUsernameDraft(this.value)" placeholder="${t('username.placeholder')}" autocomplete="off"
                   autocapitalize="off" spellcheck="false" maxlength="20">
          </div>
          ${statusHtml}
        </div>
      </div>
      <button class="onboarding-cta" onclick="finishUsernameSetup()">${isRename ? t('username.saveBtn') : t('username.continueBtn')}</button>
    </div>
  `;
}

/**
 * Charge `customChallenges` (défis personnalisés). Si la clé Firestore actuelle
 * est absente (compte pas encore migré), retombe sur l'ancienne clé
 * `userChallenges` et migre une seule fois vers le nouveau format — voir
 * `migratedLegacyActiveIds` pour la suite de cette migration côté sélection du jour.
 */
async function loadChallenges() {
  try {
    const res = await dbGet('customChallenges');
    customChallenges = JSON.parse(res.value).map(c => ({ ...c, isCustom: true }));
  } catch (e) {
    // Pas encore de 'customChallenges' : migration depuis l'ancien modèle où
    // 'userChallenges' contenait à la fois les copies de bibliothèque ajoutées
    // ET les défis personnalisés, en une seule liste permanente.
    try {
      const res = await dbGet('userChallenges');
      const saved = JSON.parse(res.value);
      if (Array.isArray(saved)) {
        const libraryIds = new Set(CHALLENGE_LIBRARY.map(x => x.id));
        customChallenges = saved.filter(x => !libraryIds.has(x.id)).map(x => ({ ...x, isCustom: true }));
        // Ancienne liste = active en permanence -> on la reprend une seule fois comme
        // sélection d'aujourd'hui, pour ne pas laisser l'utilisateur avec un accueil vide.
        migratedLegacyActiveIds = saved.map(x => x.id);
        await saveCustomChallenges();
      } else {
        customChallenges = [];

    } catch (e2) {
      customChallenges = [];

  }
  rebuildChallenges();
}

  }

// Bascule vers un autre onglet de la barre de navigation. Chaque onglet repart
// toujours de son écran racine (pas de pile d'historique entre onglets, pour
// une navigation simple et prévisible).
function switchTab(tab) {
  if (tab === activeTab) {
    // Cliquer sur l'onglet déjà actif doit réinitialiser sa pile de navigation
    // (fiche défi ouverte, formulaire de défi personnalisé, écran Paramètres) et
    // revenir à la racine — sinon un clic sur "Aujourd'hui" depuis la fiche détail
    // d'un défi ne faisait RIEN (l'onglet était déjà "today", donc le early-return
    // bloquait tout). Ferme la même chose que history.back()/goBackOneLevel()
    // (bouton retour physique), ET appelle aussi history.back() pour consommer
    // l'entrée d'historique poussée par pushNavState() à l'ouverture de cette
    // sous-vue — sans ça, un bouton retour physique ultérieur se retrouverait
    // désynchronisé (une entrée jamais consommée alors que l'app affiche déjà la racine).
    let hadNestedView = false;
    if (tab === 'today' && currentChallengeId) {
      clearTimerState();
      currentChallengeId = null;
      hadNestedView = true;
    } else if (tab === 'library' && editingChallengeId !== null) {
      editingChallengeId = null;
      hadNestedView = true;
    } else if (tab === 'account' && settingsScreenOpen) {
      settingsScreenOpen = false;
      hadNestedView = true;
    } else if (tab === 'groups' && (creatingGroupChallenge || openGroupId !== null)) {
      creatingGroupChallenge = false;
      closeGroupDetail();
      hadNestedView = true;
    }
    if (hadNestedView) {
      if (navigator.vibrate) navigator.vibrate(8);
      render(true);
      history.back();
    }
    return;
  }
  if (activeTab === 'today') {
    clearTimerState();
    currentChallengeId = null;
  } else if (activeTab === 'library') {
    editingChallengeId = null;
    libraryOpenCats = new Set(); // referme tous les accordéons en quittant l'onglet Défis
    librarySearchQuery = ''; // repart d'une recherche vide au prochain passage sur l'onglet
  } else if (activeTab === 'community') {
    // Ces 2 listeners ne servent qu'à l'affichage EN DIRECT de CET onglet (fil
    // d'activité, dernières contributions Boss Battle) — aucune notification/popup
    // n'en dépend (contrairement au listener de progression Boss Battle, qui détecte
    // la victoire et reste donc actif partout), rien ne se perd à les suspendre
    // pendant qu'on regarde un autre onglet. Sans ça, chaque écriture d'un AUTRE
    // utilisateur sur ces collections facturerait une lecture à cette session même
    // pendant qu'elle affiche "Aujourd'hui". Rattachés à la ré-entrée (voir plus bas).
    if (communityActivityFeedUnsub) { communityActivityFeedUnsub(); communityActivityFeedUnsub = null; }
    if (communityContributionsUnsub) { communityContributionsUnsub(); communityContributionsUnsub = null; }
  } else if (activeTab === 'groups') {
    creatingGroupChallenge = false;
    creatingGroupOpen = false;
    closeGroupDetail();
  } else if (activeTab === 'account') {
    // Repart toujours du sous-onglet racine (Profil) - meme principe que
    // librarySearchQuery/openGroupId ci-dessus, cf. le commentaire en tete de
    // cette fonction ("chaque onglet repart de son ecran racine").
    profileView = 'profile';
  }
  if (navigator.vibrate) navigator.vibrate(8);
  activeTab = tab;
  render(true);
  if (tab === 'community') {
    // Pas d'invalidation systématique à l'entrée : le cache (TTL 15 min, voir
    // fetchLeaderboardTop()/fetchMyRank()) est volontairement réutilisé d'une visite à
    // l'autre tant qu'il est frais — seul mon PROPRE score invalide immédiatement (voir
    // syncLeaderboardEntry()), décision explicite pour réduire les lectures (voir
    // CLAUDE.md).
    loadCommunityLeaderboard(communityLeaderboardView);
    // .catch() sur chacun : un souci isole sur l'un de ces 2 badges annexes (ex: index
    // Firestore manquant) ne doit jamais faire planter tout l'onglet Communaute via
    // l'ecran d'erreur fatale (rejet de promesse non intercepte) — juste ce badge qui
    // reste absent, comme pour le Top N/mon rang du classement (voir loadCommunityLeaderboard()).
    fetchTopContributorToday().then((c) => { communityTopContributorToday = c; render(); }).catch((e) => console.error('top contributor fetch failed', e));
    fetchBossBattleArchive().then((a) => { communityBossBattleArchive = a; render(); }).catch((e) => console.error('boss battle archive fetch failed', e));
    // Rattache les 2 listeners suspendus en quittant l'onglet (voir plus haut) —
    // myFriends est déjà en mémoire (chargé au démarrage), aucune relecture des amis
    // n'est nécessaire pour ça.
    startActivityFeedListener();
    startRecentContributionsListener();
  }
  if (tab === 'groups') {
    refreshMyGroupsAndActiveChallenges();
  }
}

// ==== STORE MINIMAL (pub/sub) ====
// Petit helper generique (get/set/subscribe), volontairement PAS une encapsulation
// complete de l'etat de l'appli : `state`/`activeToday` restent des variables
// globales mutables directement partout ailleurs dans le code (addSet/undoLast/etc.
// continuent de les muter en place et d'appeler render() elles-memes, inchange). Ne
// sert ici qu'a coordonner le CHARGEMENT initial de `state` et `activeToday` (voir
// dayStateStore plus bas), pour ne plus dependre d'un rappel manuel de render() au
// bon endroit une fois les deux charges — c'est exactement l'oubli qui avait cause
// un bug de desynchronisation deja vecu (activeToday pas encore recharge au moment
// du 1er rendu declenche par loadState()).
function createStore(initialValue) {
  let value = initialValue;
  const subscribers = new Set();
  return {
    get: () => value,
    set(next) {
      value = next;
      subscribers.forEach(fn => fn(value));
    },
    subscribe(fn) {
      subscribers.add(fn);
      return () => subscribers.delete(fn);
    },
  };
}

// Notifie automatiquement un render() une fois que `state` ET `activeToday` ont
// terminé de charger, quel que soit l'ordre — filet de sécurité en plus du rappel
// manuel déjà présent dans continueStartApp()/refreshApp(), pas un remplacement : si
// un futur appel à loadState()/loadActiveToday() oublie ce rappel manuel, ce store
// garantit quand même un rendu à jour.
const dayStateStore = createStore({ stateLoaded: false, activeTodayLoaded: false });
dayStateStore.subscribe((v) => {
  if (v.stateLoaded && v.activeTodayLoaded) render();
});

function mondayOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay(); // 0=dim..6=sam
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  return dateKey(date);
}

// Les 7 dates (objets Date) de la semaine calendaire (Lundi -> Dimanche) contenant `d`,
// partagées entre le calcul de weekData (loadState) et le rendu du calendrier hebdomadaire
// (accueil), pour éviter de dupliquer la logique de calcul du Lundi.
function getCalendarWeekDates(d) {
  const day = d.getDay(); // 0=dim..6=sam
  const diffToMonday = (day === 0 ? -6 : 1) - day;
  const monday = new Date(d);
  monday.setDate(monday.getDate() + diffToMonday);
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const dt = new Date(monday);
    dt.setDate(monday.getDate() + i);
    dates.push(dt);
  }
  return dates;
}

function daysBetween(keyA, keyB) {
  const [ya, ma, da] = keyA.split('-').map(Number);
  const [yb, mb, db] = keyB.split('-').map(Number);
  const a = Date.UTC(ya, ma - 1, da);
  const b = Date.UTC(yb, mb - 1, db);
  return Math.round((b - a) / 86400000);
}

// ==== COMMUNAUTÉ : GÉNÉRATION DÉTERMINISTE (zéro backend) ====
// Le défi du jour communautaire et la cible hebdomadaire du Boss Battle doivent être
// STRICTEMENT IDENTIQUES pour tous les utilisateurs sans aucun serveur : un PRNG seedé
// par la date (ou le lundi de la semaine) produit exactement le même résultat sur tous
// les clients qui l'évaluent le même jour, sans aucune écriture/lecture Firestore.
function hashStringToSeed(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  return h >>> 0;
}
// mulberry32 : PRNG minimal, déterministe, sans dépendance externe.
function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function pickDeterministic(list, seedStr) {
  if (list.length === 0) return null;
  const rng = mulberry32(hashStringToSeed(seedStr));
  return list[Math.floor(rng() * list.length)];
}

// Un défi toujours en "Gainage / Core" (pilier demandé), un autre dans toute autre
// catégorie — même tirage sur tous les clients le même jour (seed = date du jour).
function getDailyCommunityChallenges(dateStr = todayKey) {
  const coreList = CHALLENGE_LIBRARY.filter(c => c.cat === 'Gainage / Core');
  const otherList = CHALLENGE_LIBRARY.filter(c => c.cat !== 'Gainage / Core');
  return {
    challenge1: pickDeterministic(coreList, dateStr + ':core'),
    challenge2: pickDeterministic(otherList, dateStr + ':other'),
  };
}

// Exercice de la jauge collective ("Boss Battle") : tiré une fois par semaine
// calendaire (même semaine -> même exercice pour tout le monde). Reste PURE/
// synchrone (pas de Firestore) — seule la CIBLE CHIFFRÉE (ci-dessous) a besoin d'une
// lecture réseau, pas le choix de l'exercice lui-même.
function getWeeklyBossBattleChallenge(weekStartStr = mondayOfWeek(new Date())) {
  return pickDeterministic(CHALLENGE_LIBRARY, weekStartStr + ':boss');
}

function previousWeekStartKey(weekStartStr) {
  const [y, m, d] = weekStartStr.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  date.setDate(date.getDate() - 7);
  return dateKey(date);
}

// Cible adaptative : ajustée à l'activité RÉELLE de la semaine précédente, plutôt
// qu'une constante fixe irréaliste dès que la communauté est petite. Exprimée en
// "multiples de l'objectif journalier standard" (challenge.target), un ratio SANS
// UNITÉ (reps/reps ou sec/sec), avant d'être reconverti dans l'unité du défi de
// CETTE semaine — nécessaire car deux défis différents (ex: pompes vs squats) n'ont
// pas le même volume naturel, et reps/secondes ne sont de toute façon jamais
// comparables directement.
const BOSS_BATTLE_GROWTH_FACTOR = 1.15; // +15% par rapport au resultat reel de la semaine precedente
const BOSS_BATTLE_FLOOR_RATIO = 2; // plancher : au moins 2x l'objectif journalier standard, meme sans historique

// Lecture d'UN SEUL document à clé déterministe (jamais une requête de comptage) :
// tous les clients lisent le MÊME document immuable (semaine passée, terminée) et
// calculent donc, chacun indépendamment, exactement la même valeur — aucun cache à
// écrire ni course entre clients à gérer, contrairement à un comptage d'utilisateurs
// actifs qui aurait nécessité de mettre la cible en cache côté document partagé.
async function computeWeeklyBossBattleTarget(weekStartStr = mondayOfWeek(new Date())) {
  const challenge = getWeeklyBossBattleChallenge(weekStartStr);
  if (!challenge) return null;
  let ratio = 0;
  try {
    const prevWeekStart = previousWeekStartKey(weekStartStr);
    const prevChallenge = getWeeklyBossBattleChallenge(prevWeekStart);
    const prevDoc = await bossBattleDocRef(prevWeekStart).get();
    if (prevDoc.exists && prevChallenge && prevChallenge.target > 0) {
      ratio = (prevDoc.data().currentProgress || 0) / prevChallenge.target;
    }
  } catch (e) {
    ratio = 0; // repli sur le plancher si la lecture echoue (hors-ligne, etc.)
  }
  const effectiveRatio = Math.max(BOSS_BATTLE_FLOOR_RATIO, ratio * BOSS_BATTLE_GROWTH_FACTOR);
  return { targetChallengeId: challenge.id, targetAmount: Math.round(effectiveRatio * challenge.target) };
}

// La cible calculée nécessite désormais une lecture Firestore : mise en cache ici
// (rafraîchie une fois par semaine, comme communityBossBattleProgress) pour que les
// fonctions de rendu/contribution restent SYNCHRONES — reste néanmoins identique
// partout, puisque chaque client la recalcule à partir de la même donnée immuable.
let communityBossBattleTargetCache = null; // { weekStart, targetChallengeId, targetAmount }

async function refreshWeeklyBossBattleTargetCache(weekStartStr = mondayOfWeek(new Date())) {
  if (communityBossBattleTargetCache && communityBossBattleTargetCache.weekStart === weekStartStr) return;
  const target = await computeWeeklyBossBattleTarget(weekStartStr);
  if (target) communityBossBattleTargetCache = { weekStart: weekStartStr, ...target };
}

// Accès synchrone (cache déjà résolu) utilisé par le rendu/les contributions —
// renvoie null tant que refreshWeeklyBossBattleTargetCache() n'a pas encore résolu le
// cache pour cette semaine précise (ex: tout début du démarrage) ; tous les
// appelants gèrent déjà ce cas comme "rien à afficher/compter pour l'instant".
function getWeeklyBossBattleTarget(weekStartStr = mondayOfWeek(new Date())) {
  if (communityBossBattleTargetCache && communityBossBattleTargetCache.weekStart === weekStartStr) {
    return { targetChallengeId: communityBossBattleTargetCache.targetChallengeId, targetAmount: communityBossBattleTargetCache.targetAmount };
  }
  return null;
}

// Compteurs de validations du jour (communaute/dailyChallenge_{date}), tenus à jour en
// temps réel via onSnapshot — jamais relus manuellement ailleurs, render() se contente
// de lire cette valeur déjà en mémoire (même principe que dailyActivity/weekData).
let communityDailyCounts = { completions1: 0, completions2: 0, participants: 0 };
let communityDailyUnsub = null;

function communityDailyChallengeDocRef(dateStr = todayKey) {
  return db.collection('community').doc('dailyChallenge_' + dateStr);
}

// Appelé une seule fois au démarrage (continueStartApp()) : s'abonne au doc du jour,
// re-render à chaque changement (un autre utilisateur qui valide le défi du jour doit
// faire bouger le compteur affiché, sans recharger la page — effet "ça bouge en direct").
function startCommunityDailyListener() {
  if (communityDailyUnsub) communityDailyUnsub();
  communityDailyUnsub = communityDailyChallengeDocRef().onSnapshot((snap) => {
    const d = snap.exists ? snap.data() : null;
    communityDailyCounts = {
      completions1: (d && d.completions1) || 0,
      completions2: (d && d.completions2) || 0,
      participants: (d && d.participants) || 0,
    };
    render();
  });
}

// Active les 2 défis communautaires du jour EN UNE FOIS (bouton unique du Hero
// Banner) : cliquer une carte individuellement prêtait à confusion (n'activait QUE ce
// défi précis, alors que l'intention du bouton "Relever le défi communautaire du
// jour" est bien de rejoindre les 2 en même temps). Écrit directement dans
// activeToday (pas 2 appels à toggleActiveToday, pour ne persister/re-render qu'une
// seule fois) — même persistance que toggleActiveToday (saveActiveToday()).
async function acceptAllCommunityChallenges() {
  const { challenge1, challenge2 } = getDailyCommunityChallenges();
  if (challenge1) activeToday.add(challenge1.id);
  if (challenge2) activeToday.add(challenge2.id);
  await saveActiveToday();
  await registerCommunityParticipantIfNeeded();
  if (navigator.vibrate) navigator.vibrate(10);
  render();
}

// Compte "j'ai relevé le défi" une seule fois par utilisateur et par jour
// (state.communityJoined, remis à zéro chaque jour comme state.communityCounted) —
// distinct de completions1/completions2 (qui suivent l'ACHÈVEMENT de chaque exercice
// pris séparément) : ce chiffre-ci mesure uniquement combien de membres ont cliqué sur
// "Relever le défi communautaire du jour", qu'ils aient ensuite fini les 2 exercices
// ou non. Affiché une seule fois en haut de la carte (pas répété sous chaque exercice).
async function registerCommunityParticipantIfNeeded() {
  if (state.communityJoined) return;
  state.communityJoined = true;
  await saveState(); // persiste le flag dans le doc "day:" (sinon un simple rechargement de page permettrait de recompter)
  try {
    await communityDailyChallengeDocRef().set(
      { participants: firebase.firestore.FieldValue.increment(1) },
      { merge: true }
    );
  } catch (e) {
    reportSaveError('community participant increment failed', e);
  }
}

// Retourne 1/2 si ce défi est l'un des 2 défis communautaires du jour (pour le ruban +
// le compteur affichés sur sa carte), sinon null.
function getCommunityDailySlot(challengeId) {
  const { challenge1, challenge2 } = getDailyCommunityChallenges();
  if (challenge1 && challenge1.id === challengeId) return 1;
  if (challenge2 && challenge2.id === challengeId) return 2;
  return null;
}

// Incrémente le compteur "validé aujourd'hui" du défi communautaire concerné — une
// seule fois par utilisateur et par jour (state.communityCounted, remis à zéro chaque
// jour comme le reste de `state`), sinon un utilisateur qui rejoue plusieurs séries sur
// le même défi gonflerait artificiellement la preuve sociale.
async function registerCommunityCompletionIfNeeded(challengeId) {
  const slot = getCommunityDailySlot(challengeId);
  if (!slot) return;
  if (!state.communityCounted) state.communityCounted = [];
  if (state.communityCounted.includes(challengeId)) return;
  state.communityCounted.push(challengeId);
  try {
    await communityDailyChallengeDocRef().set(
      { ['completions' + slot]: firebase.firestore.FieldValue.increment(1) },
      { merge: true }
    );
  } catch (e) {
    reportSaveError('community completion increment failed', e);
  }
}

// Appelé une seule fois au démarrage (après loadAppData()) : le Hero Banner + timer
// d'expiration ont besoin d'une valeur "maintenant" pour l'estimation d'heures
// restantes avant minuit — pas besoin d'un setInterval dédié, un re-render suffisant
// se produit déjà à chaque interaction (le decompte n'a pas besoin d'être à la seconde).
function hoursRemainingToday() {
  const now = new Date();
  const midnight = new Date(now);
  midnight.setHours(24, 0, 0, 0);
  return Math.max(0, Math.ceil((midnight - now) / 3600000));
}
